<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Sawee Rxfill — เข้าสู่ระบบ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2310b981%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23047857%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M9%2020a3%203%200%200%201%203-3h22a3%203%200%200%201%203%203v3h7.2a3%203%200%200%201%202.4%201.2l6.8%209a3%203%200%200%201%20.6%201.8V43a3%203%200%200%201-3%203h-2.2a6%206%200%200%201-11.6%200H27.8a6%206%200%200%201-11.6%200H12a3%203%200%200%201-3-3Zm28%207v7h11.4l-5.2-7Z%22%2F%3E%3Ccircle%20cx%3D%2222%22%20cy%3D%2245%22%20r%3D%223.2%22%20fill%3D%22%23047857%22%2F%3E%3Ccircle%20cx%3D%2243%22%20cy%3D%2245%22%20r%3D%223.2%22%20fill%3D%22%23047857%22%2F%3E%3Cpath%20fill%3D%22%23047857%22%20d%3D%22M21%2025h4v4h4v4h-4v4h-4v-4h-4v-4h4Z%22%2F%3E%3C%2Fsvg%3E">
  <meta name="theme-color" content="#047857">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
    .bg-gradient-main { background: linear-gradient(135deg, #0d9488 0%, #059669 100%); }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0d9488; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    /* ===== Landing card 600×400 (ขนาดเท่ารูปพื้นหลัง) ===== */
    .landing-page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center; padding: 32px 16px 48px; box-sizing: border-box; transition: background .4s ease; }
    .landing-card { width: 720px; max-width: 100%; border-radius: 26px; overflow: hidden; box-shadow: 0 18px 50px rgba(15, 23, 42, .12); background: #fff; }
    .landing-tabs { display: flex; }
    .landing-tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 0; border: 0; cursor: pointer; font-family: inherit; font-size: 18px; font-weight: 800; transition: background .25s, color .25s; }
    .landing-tab:focus-visible, .landing-btn:focus-visible, .landing-input:focus-visible { outline: 3px solid rgba(14, 116, 144, .45); outline-offset: 2px; }
    .landing-body { width: 720px; max-width: 100%; height: 480px; background-size: cover; background-position: center; background-repeat: no-repeat; display: flex; }
    .landing-info { flex: 1; padding: 36px 24px 28px 36px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .landing-chip { align-self: flex-start; font-size: 12px; font-weight: 800; border: 1.5px solid; border-radius: 999px; padding: 3px 12px; background: rgba(255,255,255,.7); }
    .landing-title { font-size: 50px; line-height: 1.02; font-weight: 900; margin: 4px 0 0; letter-spacing: -.01em; }
    .landing-lines { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; font-weight: 600; }
    .landing-lines i { width: 18px; font-size: 11px; }
    .landing-note { margin-top: auto; font-size: 12px; line-height: 1.5; opacity: .75; }
    .landing-form { width: 320px; flex-shrink: 0; padding: 28px 28px 28px 0; display: flex; }
    .landing-login, .landing-refer { flex: 1; background: rgba(255,255,255,.88); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.9); border-radius: 20px; padding: 26px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 20px rgba(15,23,42,.06); }
    .landing-login { justify-content: center; }
    .landing-refer { justify-content: center; gap: 14px; }
    .landing-form-title { font-size: 20px; font-weight: 900; margin-bottom: 2px; }
    .landing-input { width: 100%; box-sizing: border-box; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 14px; font-size: 15px; color: #0f172a; font-family: inherit; }
    .landing-input:focus { outline: none; border-color: #0e7490; box-shadow: 0 0 0 3px rgba(14,116,144,.15); }
    .landing-remember { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #475569; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .landing-btn { box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 12px; padding: 13px; color: #fff; font-weight: 900; font-size: 16px; cursor: pointer; text-decoration: none; font-family: inherit; box-shadow: 0 4px 12px rgba(15,23,42,.15); transition: transform .15s; }
    .landing-btn:hover { transform: translateY(-1px); }
    .landing-links { display: flex; justify-content: space-between; margin-top: 6px; }
    .landing-links button { background: none; border: 0; padding: 0; font-size: 12.5px; font-weight: 700; color: #64748b; text-decoration: underline; cursor: pointer; font-family: inherit; }
.landing-support { font-size: 13px; opacity: .85; text-align: center; }
    .landing-support a { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
    .landing-support i { margin-right: 4px; }
    .landing-refer-foot { font-size: 11.5px; font-weight: 700; text-align: center; }
    @media (max-width: 760px) {
      .landing-body { height: auto; min-height: 440px; flex-direction: column; }
      .landing-info { padding: 22px 20px 8px; }
      .landing-title { font-size: 36px; }
      .landing-note { margin-top: 4px; }
      .landing-form { width: auto; padding: 8px 16px 18px; }
    }
    @media (prefers-reduced-motion: reduce) { .landing-page, .landing-tab, .landing-btn { transition: none; } }
  </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">
  <div id="root" class="flex-grow"></div>

  <!-- shared utilities: Firebase init, constants, helpers (NO JSX) -->
  <script src="shared.js?v=5.9.0"></script>
  <!-- กันไฟล์ shared.js เก่าค้าง cache: ถ้าเวอร์ชันไม่ตรง แสดงแถบเตือนแทนการพังเงียบ -->
  <script>
    (function () {
      var need = '5.9.0';
      var got = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '(ไม่พบ shared.js)';
      if (got === need) return;
      var show = function () {
        var d = document.createElement('div');
        d.setAttribute('role', 'alert');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;padding:12px 16px;font:600 14px Sarabun,sans-serif;text-align:center';
        d.textContent = 'ไฟล์ shared.js ไม่ตรงเวอร์ชัน (ต้องการ v' + need + ' แต่ได้ v' + got + ') — อัปโหลด shared.js ชุดใหม่ขึ้น GitHub ให้ครบ แล้วรอ 1-2 นาที กด Ctrl+F5';
        document.body.appendChild(d);
      };
      if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ===== Shared UI Components (duplicated – Babel standalone can't import JSX from .js) =====
    const Toast = ({ message, type, onClose }) => {
      useEffect(() => {
        const timer = setTimeout(onClose, 3000);
        return () => clearTimeout(timer);
      }, [onClose]);
      const bgColor = type === 'error' ? 'bg-red-500' : 'bg-emerald-500';
      return (
        <div className={`fixed top-6 right-6 ${bgColor} text-white px-6 py-4 rounded-xl shadow-2xl flex items-center z-[250] animate-fade-in font-medium`}>
          <i className={`fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} mr-3 text-xl`}></i>
          {message}
        </div>
      );
    };

    const Modal = ({ title, children, onClose, isOpen, maxWidth }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in py-10">
          <div className={`bg-white rounded-2xl shadow-2xl w-full ${maxWidth || 'max-w-2xl'} overflow-hidden flex flex-col max-h-full`}>
            <div className="p-5 border-b flex justify-between items-center bg-slate-50 shrink-0">
              <h3 className="text-xl font-bold text-slate-800">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-red-500 transition bg-white border border-slate-200 rounded-full w-8 h-8 flex items-center justify-center shadow-sm">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>
            <div className="p-6 overflow-y-auto">{children}</div>
          </div>
        </div>
      );
    };

    const FullScreenSpinner = () => (
      <div className="fixed inset-0 z-[300] bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center animate-fade-in">
        <div className="loader mb-4 border-t-emerald-400 border-4 border-white/20 w-16 h-16"></div>
        <p className="text-white font-bold text-lg tracking-wider animate-pulse">กำลังประมวลผล กรุณารอสักครู่...</p>
      </div>
    );

    // ===== Landing View =====
    // ===== Landing: การ์ดแนวนอน 600×400 เท่ากันทั้ง 2 แท็บ (Refill เขียว / Refer ส้ม) =====
    const LANDING_THEME = {
      refill: {
        img: 'https://raw.githubusercontent.com/sawee-hosp/sawee-vmi/main/refill.png',
        page: 'linear-gradient(160deg, #d1fae5 0%, #f0fdf4 50%, #ffffff 100%)',
        tab: 'linear-gradient(135deg, #065f46 0%, #047857 100%)', tabDim: '#a7d7c5',
        ink: '#064e3b', accent: '#047857', soft: '#ecfdf5', title: 'Refill', subtitle: 'ระบบเติมยาและเวชภัณฑ์ VMI',
        lines: ['เบิกยา รพ.สต. ตามยอดใช้จริง', 'เบิกยาหน่วยงานและห้องยาใน รพ.', 'เชื่อมใบเบิกเข้า INVS']
      },
      refer: {
        img: 'https://raw.githubusercontent.com/sawee-hosp/sawee-vmi/main/refer.png',
        page: 'linear-gradient(160deg, #ffedd5 0%, #fff7ed 50%, #ffffff 100%)',
        tab: 'linear-gradient(135deg, #9a3412 0%, #c2410c 100%)', tabDim: '#f3c7a8',
        ink: '#7c2d12', accent: '#c2410c', soft: '#fff7ed', title: 'Refer', subtitle: 'ระบบส่งต่อผู้ป่วย รพ.สวี – รพ.สต.',
        lines: ['ส่งต่อผู้ป่วยระหว่างหน่วยบริการ', 'ติดตามสถานะการส่งต่อ', 'ใช้บัญชีแยกจาก Sawee Refill']
      }
    };

    const LandingView = ({ ctx }) => {
      const [tab, setTab] = useState(() => { try { return localStorage.getItem('sawee_landing_tab') === 'refer' ? 'refer' : 'refill'; } catch (e) { return 'refill'; } });
      const t = LANDING_THEME[tab];
      const pick = (k) => { setTab(k); try { localStorage.setItem('sawee_landing_tab', k); } catch (e) { /* ignore */ } };

      return (
        <div className="landing-page" style={{ background: t.page }}>
          <div className="landing-card">
            <div className="landing-tabs" role="tablist" aria-label="เลือกระบบ">
              {['refill', 'refer'].map(k => {
                const th = LANDING_THEME[k]; const on = tab === k;
                return (
                  <button key={k} role="tab" aria-selected={on} onClick={() => pick(k)} className="landing-tab"
                    style={{ background: on ? th.tab : th.tabDim, color: on ? '#fff' : th.ink }}>
                    <i className={`fa-solid ${k === 'refill' ? 'fa-truck-medical' : 'fa-truck-arrow-right'}`}></i>
                    <span><span style={{ opacity: .7, fontWeight: 600 }}>Sawee </span>{th.title}</span>
                  </button>
                );
              })}
            </div>

            <div className="landing-body" style={{ backgroundImage: `url(${t.img})`, backgroundColor: t.soft }} role="tabpanel">
              <div className="landing-info">
                <div className="landing-chip" style={{ color: t.accent, borderColor: t.accent }}>{t.subtitle}</div>
                <h1 className="landing-title" style={{ color: t.ink }}>Sawee<br /><span style={{ color: t.accent }}>{t.title}</span></h1>
                <ul className="landing-lines" style={{ color: t.ink }}>
                  {t.lines.map(l => <li key={l}><i className="fa-solid fa-check" style={{ color: t.accent }}></i>{l}</li>)}
                </ul>
                <div className="landing-note" style={{ color: t.ink }}>
                  <i className="fa-solid fa-circle-info"></i> Refill และ Refer ใช้บัญชีคนละชุด · ลืมรหัสผ่าน reset ทาง email ได้
                </div>
              </div>

              <div className="landing-form">
                {tab === 'refill' ? (
                  <LoginView ctx={ctx} compact={true} theme={t} />
                ) : (
                  <div className="landing-refer">
                    <div className="landing-form-title" style={{ color: t.ink }}>เข้าสู่ระบบส่งต่อผู้ป่วย</div>
                    <p style={{ color: '#57534e', fontSize: 13, lineHeight: 1.6, margin: 0 }}>ระบบ Refer เปิดในหน้าแยก ใช้ username และ password ของระบบ Refer</p>
                    <a href="/refer.html" className="landing-btn" style={{ background: t.tab }}>
                      <i className="fa-solid fa-right-to-bracket"></i> เข้าสู่ Sawee Refer
                    </a>
                    <div className="landing-refer-foot" style={{ color: t.accent }}><i className="fa-solid fa-hospital"></i> รพ.สวี · เครือข่าย รพ.สต. 16 แห่ง</div>
                  </div>
                )}
              </div>
            </div>
          </div>
          <footer className="landing-support" style={{ color: t.ink }}>
            <i className="fa-solid fa-envelope"></i> พบปัญหาการใช้งาน แจ้งแอดมินทาง e-mail{' '}
            <a href="mailto:sawee.appsheet@gmail.com?subject=%E0%B9%81%E0%B8%88%E0%B9%89%E0%B8%87%E0%B8%9B%E0%B8%B1%E0%B8%8D%E0%B8%AB%E0%B8%B2%20Sawee%20Rxfill" style={{ color: t.accent }}>sawee.appsheet@gmail.com</a>
          </footer>
        </div>
      );
    };

    const LoginView = ({ ctx, compact, theme }) => {
      const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
      const [rememberMe, setRememberMe] = useState(true); const [showForgot, setShowForgot] = useState(false);
      const [forgotEmail, setForgotEmail] = useState('');

      const handleForgot = async () => {
        if(!forgotEmail) return ctx.showToast('กรุณากรอกอีเมล', 'error');
        try { await auth.sendPasswordResetEmail(forgotEmail); ctx.showToast('ส่งลิงก์ไปที่อีเมลแล้ว'); setShowForgot(false); } catch(e) { ctx.showToast(e.message, 'error'); }
      };

      // Compact mode: ฟอร์มในการ์ด landing (พื้นหลังสว่าง)
      if (compact) {
        const th = theme || { ink: '#064e3b', accent: '#047857', tab: 'linear-gradient(135deg, #065f46 0%, #047857 100%)' };
        return (
          <div className="landing-login">
            <div className="landing-form-title" style={{ color: th.ink }}>เข้าสู่ระบบ</div>
            <label className="sr-only" htmlFor="lg-email">อีเมล</label>
            <input id="lg-email" type="email" autoComplete="email" className="landing-input" placeholder="อีเมล" value={email} onChange={e => setEmail(e.target.value)} />
            <label className="sr-only" htmlFor="lg-pass">รหัสผ่าน</label>
            <input id="lg-pass" type="password" autoComplete="current-password" className="landing-input" placeholder="รหัสผ่าน" value={password} onChange={e => setPassword(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && ctx.handleLogin(email, password, rememberMe)} />
            <label className="landing-remember">
              <input type="checkbox" checked={rememberMe} onChange={e => setRememberMe(e.target.checked)} style={{ accentColor: th.accent }} /> จดจำการเข้าสู่ระบบ
            </label>
            <button onClick={() => ctx.handleLogin(email, password, rememberMe)} className="landing-btn" style={{ background: th.tab }}>เข้าสู่ระบบ</button>
            <div className="landing-links">
              <button onClick={() => ctx.setCurrentView('register')} style={{ color: th.accent }}>ลงทะเบียนผู้ใช้ใหม่</button>
              <button onClick={() => setShowForgot(true)}>ลืมรหัสผ่าน?</button>
            </div>
            {showForgot && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 px-4">
                <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                  <h3 className="text-xl font-bold text-slate-800 mb-2">รีเซ็ตรหัสผ่าน</h3>
                  <input type="email" className="w-full border p-3 mb-4 rounded-lg outline-none" placeholder="อีเมล" value={forgotEmail} onChange={e => setForgotEmail(e.target.value)} />
                  <div className="flex justify-end gap-3">
                    <button onClick={() => setShowForgot(false)} className="px-4 py-2 bg-slate-100 rounded-lg">ยกเลิก</button>
                    <button onClick={handleForgot} className="px-4 py-2 bg-emerald-600 text-white rounded-lg">ส่งลิงก์</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100 w-full">
          <div className="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md border border-slate-100">
            <div className="flex flex-col items-center mb-8">
              <div className="bg-gradient-main p-4 rounded-2xl text-white mb-4 shadow-lg"><i className="fa-solid fa-truck-medical text-3xl"></i></div>
              <h1 className="text-3xl font-extrabold text-slate-800">Sawee Rxfill</h1>
              <p className="text-slate-500 text-sm mt-1">ระบบเติมยาและเวชภัณฑ์ VMI</p>
            </div>
            <div className="space-y-5">
              <input type="email" autoComplete="email" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} />
              <input type="password" autoComplete="current-password" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && ctx.handleLogin(email, password, rememberMe)} />
              <label className="flex items-center text-sm text-slate-600 cursor-pointer"><input type="checkbox" className="mr-2 w-4 h-4 text-emerald-600 rounded" checked={rememberMe} onChange={e => setRememberMe(e.target.checked)} />จดจำการเข้าสู่ระบบ</label>
              <button onClick={() => ctx.handleLogin(email, password, rememberMe)} className="w-full bg-gradient-main text-white rounded-xl p-4 font-bold hover:opacity-90 shadow-lg">เข้าสู่ระบบ</button>
            </div>
            <div className="mt-6 flex justify-between text-sm">
              <button onClick={() => ctx.setCurrentView('register')} className="text-emerald-600 font-semibold hover:underline">ลงทะเบียนผู้ใช้ใหม่</button>
              <button onClick={() => setShowForgot(true)} className="text-slate-500 font-semibold hover:underline">ลืมรหัสผ่าน?</button>
            </div>
          </div>
          {showForgot && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 px-4">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                <h3 className="text-xl font-bold text-slate-800 mb-2">รีเซ็ตรหัสผ่าน</h3>
                <input type="email" className="w-full border p-3 mb-4 rounded-lg outline-none" placeholder="อีเมล" value={forgotEmail} onChange={e => setForgotEmail(e.target.value)} />
                <div className="flex justify-end gap-3">
                  <button onClick={() => setShowForgot(false)} className="px-4 py-2 bg-slate-100 rounded-lg">ยกเลิก</button>
                  <button onClick={handleForgot} className="px-4 py-2 bg-emerald-600 text-white rounded-lg">ส่งลิงก์</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ===== Register View =====
    const RegisterView = ({ ctx }) => {
      const [formData, setFormData] = useState({ email: '', password: '', name: '', position: '', hospitalId: '', deptId: '' });
      const [accountType, setAccountType] = useState('hospital');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [hospList, setHospList] = useState([]);
      const [deptList, setDeptList] = useState([]);
      const [isLoadingHosp, setIsLoadingHosp] = useState(true);

      useEffect(() => {
        const fetchHospitals = async () => {
          try {
            const [snap, deptSnap] = await Promise.all([
              db.collection('master_hospitals').get(),
              db.collection('master_depts').get().catch(() => null)
            ]);
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setHospList(list);
            if (deptSnap) setDeptList(deptSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(d => d.active !== false));
          } catch (err) {
            console.error("Fetch hospitals error:", err);
            ctx.showToast('ไม่สามารถดึงรายชื่อ รพ.สต. ได้ (โปรดเช็คสิทธิ์ Firebase Rules)', 'error');
          } finally {
            setIsLoadingHosp(false);
          }
        };
        fetchHospitals();
      }, []);

      const handleRegister = async () => {
        const email = safeText(formData.email).toLowerCase();
        const password = String(formData.password || '');
        const name = safeText(formData.name);
        const position = safeText(formData.position);
        const isInternal = accountType !== 'hospital';
        const hospitalId = isInternal ? '' : safeText(formData.hospitalId);
        const deptId = isInternal ? safeText(formData.deptId) : '';
        const role = accountType;

        if((!isInternal && !hospitalId) || (isInternal && !deptId) || !name || !position || !email || !password) return ctx.showToast('กรุณากรอกข้อมูลให้ครบ', 'error');
        if(password.length < 6) return ctx.showToast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
        if(!isInternal && !hospList.some(h => String(h.hospital_id) === hospitalId)) return ctx.showToast('รพ.สต. ที่เลือกไม่ถูกต้อง', 'error');
        if(isInternal && !deptList.some(d => String(d.dept_id) === deptId && (d.kind || 'dept') === accountType)) return ctx.showToast('หน่วยงานที่เลือกไม่ถูกต้อง', 'error');

        setIsSubmitting(true);
        let userCredential = null;
        if (ctx.registrationInProgressRef) ctx.registrationInProgressRef.current = true;
        try {
          userCredential = await auth.createUserWithEmailAndPassword(email, password);
          try {
            await db.collection('users').doc(userCredential.user.uid).set({
              email,
              name,
              position,
              hospital_id: hospitalId,
              ...(isInternal ? { dept_id: deptId } : {}),
              role,
              active: true,
              schema_version: APP_SCHEMA_VERSION,
              created_at: firebase.firestore.FieldValue.serverTimestamp(),
              updated_at: firebase.firestore.FieldValue.serverTimestamp()
            });
            await writeAuditLog({ uid: userCredential.user.uid, name, role, hospital_id: hospitalId }, 'USER_REGISTER', 'users', userCredential.user.uid, { email });
          } catch (profileError) {
            try { await userCredential.user.delete(); } catch (rollbackError) { console.warn('Auth rollback failed:', rollbackError); }
            throw new Error('สร้างบัญชีเข้าสู่ระบบได้ แต่บันทึกข้อมูลผู้ใช้ไม่สำเร็จ ระบบได้ยกเลิกบัญชีที่สร้างใหม่แล้ว: ' + profileError.message);
          }
          await auth.signOut();
          ctx.showToast('ลงทะเบียนสำเร็จ กรุณาล็อกอิน');
          ctx.setCurrentView('login');
        } catch (error) {
          let errorMsg = error.message;
          if (error.code === 'auth/email-already-in-use') errorMsg = 'อีเมลนี้มีในระบบแล้ว';
          else if (error.code === 'auth/weak-password') errorMsg = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
          else if (error.code === 'auth/invalid-email') errorMsg = 'รูปแบบอีเมลไม่ถูกต้อง';
          ctx.showToast('ลงทะเบียนไม่สำเร็จ: ' + errorMsg, 'error');
        } finally {
          if (ctx.registrationInProgressRef) ctx.registrationInProgressRef.current = false;
          setIsSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100 w-full">
          <div className="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md">
            <h2 className="text-2xl font-bold mb-6 text-center text-slate-800">ลงทะเบียนเข้าใช้งาน</h2>
            <div className="space-y-4">
              <input type="text" className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="คำนำหน้า ชื่อ-นามสกุล (เต็ม)" onChange={e => setFormData({...formData, name: e.target.value})} />
              <input type="text" className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="ตำแหน่ง (บังคับ)" onChange={e => setFormData({...formData, position: e.target.value})} />

              <div className="grid grid-cols-3 gap-2" role="radiogroup" aria-label="ประเภทผู้ใช้งาน">
                {[['hospital','fa-house-medical','รพ.สต.'],['dept','fa-building-user','หน่วยงานใน รพ.'],['pharmacy','fa-prescription-bottle-medical','ห้องยา']].map(([k, ic, label]) => (
                  <button key={k} type="button" role="radio" aria-checked={accountType === k} onClick={() => { setAccountType(k); setFormData(f => ({ ...f, hospitalId: '', deptId: '' })); }}
                    className={`p-3 rounded-xl border text-xs font-bold flex flex-col items-center gap-1 transition ${accountType === k ? 'border-emerald-500 bg-emerald-50 text-emerald-700 ring-2 ring-emerald-200' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                    <i className={`fa-solid ${ic} text-lg`}></i>{label}
                  </button>
                ))}
              </div>

              {accountType === 'hospital' ? (
                <select value={formData.hospitalId} className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" onChange={e => setFormData({...formData, hospitalId: e.target.value})} disabled={isLoadingHosp}>
                  <option value="">{isLoadingHosp ? 'กำลังโหลดรายชื่อ รพ.สต...' : '-- เลือก รพ.สต. ที่สังกัด --'}</option>
                  {hospList.map(h => <option key={h.hospital_id} value={h.hospital_id}>{h.hospital_name}</option>)}
                </select>
              ) : (
                <select value={formData.deptId} className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" onChange={e => setFormData({...formData, deptId: e.target.value})} disabled={isLoadingHosp}>
                  <option value="">{isLoadingHosp ? 'กำลังโหลด...' : (accountType === 'pharmacy' ? '-- เลือกห้องยา --' : '-- เลือกหน่วยงานที่สังกัด --')}</option>
                  {deptList.filter(d => (d.kind || 'dept') === accountType).map(d => <option key={d.dept_id} value={d.dept_id}>{d.dept_name}</option>)}
                </select>
              )}
              {accountType !== 'hospital' && !isLoadingHosp && deptList.filter(d => (d.kind || 'dept') === accountType).length === 0 && (
                <div className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2">ยังไม่มีรายชื่อ{accountType === 'pharmacy' ? 'ห้องยา' : 'หน่วยงาน'}ในระบบ — ให้แอดมินเพิ่มที่ จัดการฐานข้อมูล › หน่วยงาน/ห้องยา ก่อน</div>
              )}

              <input type="email" autoComplete="email" className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="อีเมล (ใช้ล็อกอิน)" onChange={e => setFormData({...formData, email: e.target.value})} />
              <input type="password" autoComplete="new-password" className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="รหัสผ่าน" onChange={e => setFormData({...formData, password: e.target.value})} />
              <button onClick={handleRegister} disabled={isSubmitting || isLoadingHosp} className="w-full bg-gradient-main text-white rounded-xl p-4 font-bold shadow-lg mt-4 disabled:opacity-50">{isSubmitting ? 'กำลังบันทึก...' : 'ยืนยันลงทะเบียน'}</button>
              <button onClick={() => ctx.setCurrentView('login')} className="w-full text-slate-500 mt-2 hover:underline">กลับหน้าล็อกอิน</button>
            </div>
          </div>
        </div>
      );
    };

    // ===== App Component =====
    const App = () => {
      const [currentView, setCurrentView] = useState('login');
      const [toast, setToast] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const registrationInProgressRef = useRef(false);

      const showToast = (message, type = 'success') => setToast({ message, type });

      const handleLogin = async (email, password, rememberMe) => {
        if(!email || !password) return showToast('กรุณากรอก Email และ Password', 'error');
        try {
          const persistence = rememberMe ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
          await auth.setPersistence(persistence);
          const cred = await auth.signInWithEmailAndPassword(email, password);
          // Check user profile exists and is active
          const userDoc = await db.collection('users').doc(cred.user.uid).get();
          if (!userDoc.exists) {
            await auth.signOut();
            return showToast('ไม่พบข้อมูลผู้ใช้ในระบบ กรุณาลงทะเบียนก่อน', 'error');
          }
          const userData = userDoc.data();
          if (userData.active === false) {
            await auth.signOut();
            return showToast('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ', 'error');
          }
          // Login success — redirect by role (รพ.สต./admin → app.html, หน่วยงาน/ห้องยา → internal.html)
          showToast('เข้าสู่ระบบสำเร็จ');
          setTimeout(() => { window.location.href = homePageForRole(userData.role); }, 300);
        } catch (error) {
          let errorMsg = error.message;
          if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') errorMsg = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
          else if (error.code === 'auth/too-many-requests') errorMsg = 'ล็อกอินผิดหลายครั้ง กรุณารอสักครู่';
          showToast(errorMsg, 'error');
        }
      };

      // Check if already logged in → redirect immediately
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async (user) => {
          if (user && !registrationInProgressRef.current) {
            // Already logged in → go to app
            try {
              const userDoc = await db.collection('users').doc(user.uid).get();
              if (userDoc.exists && userDoc.data().active !== false) {
                window.location.href = homePageForRole(userDoc.data().role);
                return;
              }
            } catch (e) {
              console.warn('Auth check error:', e);
            }
          }
          setIsLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (isLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-100">
            <div className="loader mb-4"></div>
            <p className="text-slate-500">กำลังตรวจสอบสถานะ...</p>
          </div>
        );
      }

      const ctx = { handleLogin, setCurrentView, showToast, registrationInProgressRef };

      return (
        <>
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
          {currentView === 'register' ? <RegisterView ctx={ctx} /> : <LandingView ctx={ctx} />}
          <div className="fixed bottom-3 right-4 text-xs text-slate-400 z-10">v{APP_VERSION}</div>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
