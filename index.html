                               {item.returnQty > 0 ? item.returnQty : '-'}
                             </td>
                             <td className="p-3 text-center">
                               <input type="text" value={item.lotNo || ''} onChange={e=>handleReturnMetaChange(item.drugId,'lotNo',e.target.value)} disabled={item.returnQty <= 0} placeholder="เช่น A123" className="w-28 border border-slate-200 rounded-lg px-2 py-1.5 text-center outline-none focus:border-red-400 disabled:bg-slate-50 disabled:text-slate-300" />
                             </td>
                             <td className="p-3 text-center">
                               <input type="date" value={item.expiryDate || ''} onChange={e=>handleReturnMetaChange(item.drugId,'expiryDate',e.target.value)} disabled={item.returnQty <= 0} className="border border-slate-200 rounded-lg px-2 py-1.5 outline-none focus:border-red-400 disabled:bg-slate-50 disabled:text-slate-300" />
                             </td>
                           </tr>
                         ))}
                         {filteredItems.length === 0 && <tr><td colSpan="9" className="p-8 text-center text-slate-400">ไม่มีข้อมูลยาในคลังให้คืน</td></tr>}
                       </tbody>
                     </table>
                   </div>
                </>
             ) : (
                <div className="overflow-x-auto border border-slate-200 rounded-xl w-full">
                  <table className="w-full text-left border-collapse whitespace-nowrap text-[13px]">
                     <thead className="bg-slate-100 text-slate-700">
                        <tr>
                           <th className="p-3 font-bold border-b">รหัสเอกสาร</th>
                           <th className="p-3 font-bold border-b">วันที่ส่งคืน</th>
                           <th className="p-3 font-bold border-b">ผู้ส่งมอบ</th>
                           <th className="p-3 text-center font-bold border-b">จำนวนยาที่คืน</th>
                           <th className="p-3 text-right font-bold border-b">มูลค่ารวม (บาท)</th>
                           <th className="p-3 text-center font-bold border-b">พิมพ์ย้อนหลัง</th>
                        </tr>
                     </thead>
                     <tbody>
                        {historyList.map(h => (
                           <tr key={h.id} className="border-b hover:bg-slate-50">
                              <td className="p-3 font-bold text-slate-700">{h.id}</td>
                              <td className="p-3 text-slate-600">{new Date(h.created_at?.seconds * 1000).toLocaleString('th-TH')}</td>
                              <td className="p-3 text-slate-600">{h.created_by}</td>
                              <td className="p-3 text-center text-red-600 font-bold">{h.items?.length || 0} รายการ</td>
                              <td className="p-3 text-right font-bold text-slate-800">{h.totalValue?.toLocaleString(undefined, {minimumFractionDigits:2})}</td>
                              <td className="p-3 text-center">
                                 <button onClick={() => setPrintData(h)} className="bg-blue-100 text-blue-700 px-4 py-1.5 rounded-lg font-bold hover:bg-blue-200 transition"><i className="fa-solid fa-print"></i> เปิดเพื่อพิมพ์</button>
                              </td>
                           </tr>
                        ))}
                        {historyList.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-slate-400">ไม่มีประวัติการส่งคืนยา</td></tr>}
                     </tbody>
                  </table>
                </div>
             )}
          </div>
      );
    };

    const MyStockView = ({ ctx }) => {
      const hospId = ctx.currentUser.hospital_id;
      const isAdmin = ctx.currentUser.role === 'admin';
      const [searchTerm, setSearchTerm] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [editItem, setEditItem] = useState(null);
      const [detailItem, setDetailItem] = useState(null);
      const [stockTab, setStockTab] = useState('current');
      const [stockDisplayMode, setStockDisplayMode] = useState('shelf');
      const [dragState, setDragState] = useState(null);
      const [isRefreshingInvsPrice, setIsRefreshingInvsPrice] = useState(false);
      const dragWasActiveRef = useRef(false);
      const typesSource = ctx.appDb.drugTypes || DEFAULT_DRUG_TYPES;
      const shelfStorageKey = `sawee_rxfill_shelf_layout_${String(hospId || 'unknown')}`;

      const drugList = useMemo(() => {
        if (!ctx.appDb) return [];
        const myPars = ctx.appDb.parLevels.filter(p => String(p.hospital_id) === String(hospId));
        return myPars.map(p => {
          const drug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(p.drug_id));
          const bal = ctx.appDb.balances.find(b => String(b.hospital_id) === String(hospId) && String(b.drug_id) === String(p.drug_id));
          const unitObj = drug ? ctx.appDb.units.find(u => String(u.unit_id) === String(drug.unit_id)) : null;
          const unitName = unitObj ? unitObj.unit_name : (drug?.unit_id || '');

          return { 
              drugId: p.drug_id, name: drug ? drug.drug_name : 'N/A', unit: unitName, 
              packSize: drug ? safePackSize(drug.pack_size) : 1, packPrevious: drug ? toNonNegativeNumber(drug.pack_size_previous) : 0,
              unitId: drug ? safeText(drug.unit_id) : '', unitIdPrevious: drug ? safeText(drug.unit_id_previous) : '',
              type: drug ? String(drug.type || '1') : '1',
              price: drug ? toNonNegativeNumber(drug.price) : 0,
              pricePrevious: drug ? toNonNegativeNumber(drug.price_previous) : 0,
              priceSource: drug ? safeText(drug.price_source) : '',
              priceInvsLastDatetime: drug ? safeText(drug.price_invs_last_datetime) : '',
              priceUpdatedAt: drug?.price_updated_at || null,
              packUpdatedAt: drug?.pack_size_updated_at || null,
              unitUpdatedAt: drug?.unit_updated_at || null,
              masterSyncSource: drug ? safeText(drug.master_sync_source) : '',
              masterSyncedAt: drug?.invs_master_synced_at || null,
              targetVMI: toNonNegativeNumber(p.par_qty), currentBal: bal ? toSafeNumber(bal.excess_balance) : 0 
          };
        }).sort(sortDrugs);
      }, [ctx.appDb, hospId]);

      const [shelfOrder, setShelfOrder] = useState(() => {
        try {
          const raw = window.localStorage.getItem(shelfStorageKey);
          const parsed = raw ? JSON.parse(raw) : {};
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch(e) { return {}; }
      });

      useEffect(() => {
        try {
          const raw = window.localStorage.getItem(shelfStorageKey);
          const parsed = raw ? JSON.parse(raw) : {};
          setShelfOrder(parsed && typeof parsed === 'object' ? parsed : {});
        } catch(e) { setShelfOrder({}); }
      }, [shelfStorageKey]);

      useEffect(() => {
        if (!drugList.length) return;
        setShelfOrder(prev => {
          const next = { ...(prev || {}) };
          const typeKeys = [...new Set(drugList.map(d => String(d.type || '1')))];
          typeKeys.forEach(typeKey => {
            const validIds = drugList.filter(d => String(d.type || '1') === typeKey).map(d => String(d.drugId));
            const validSet = new Set(validIds);
            const existing = Array.isArray(next[typeKey]) ? next[typeKey].map(String).filter(id => validSet.has(id)) : [];
            const existingSet = new Set(existing);
            const missing = validIds.filter(id => !existingSet.has(id));
            next[typeKey] = [...existing, ...missing];
          });
          Object.keys(next).forEach(k => {
            if (!typeKeys.includes(String(k))) delete next[k];
          });
          return next;
        });
      }, [drugList]);

      useEffect(() => {
        try { window.localStorage.setItem(shelfStorageKey, JSON.stringify(shelfOrder || {})); } catch(e) {}
      }, [shelfOrder, shelfStorageKey]);

      const filteredList = useMemo(() => {
        const q = searchTerm.trim().toLowerCase();
        if (!q) return drugList;
        return drugList.filter(d =>
          String(d.name || '').toLowerCase().includes(q) ||
          String(d.drugId || '').toLowerCase().includes(q) ||
          String(typesSource[d.type] || '').toLowerCase().includes(q)
        );
      }, [drugList, searchTerm, typesSource]);

      const shelfGroups = useMemo(() => {
        const groups = {};
        const visibleIds = new Set(filteredList.map(d => String(d.drugId)));
        const byId = new Map(drugList.map(d => [String(d.drugId), d]));
        const allTypeKeys = [...new Set(drugList.map(d => String(d.type || '1')))].sort((a,b) => {
          const na = String(typesSource[a] || a);
          const nb = String(typesSource[b] || b);
          if (a === '25' && b !== '25') return -1;
          if (b === '25' && a !== '25') return 1;
          return na.localeCompare(nb, 'th');
        });

        allTypeKeys.forEach(typeKey => {
          const fallback = drugList.filter(d => String(d.type || '1') === typeKey).map(d => String(d.drugId));
          const orderedIds = Array.isArray(shelfOrder[typeKey]) && shelfOrder[typeKey].length ? shelfOrder[typeKey] : fallback;
          groups[typeKey] = orderedIds
            .map(id => byId.get(String(id)))
            .filter(Boolean)
            .filter(item => visibleIds.has(String(item.drugId)));
        });
        return { groups, typeKeys: allTypeKeys.filter(k => (groups[k] || []).length > 0) };
      }, [drugList, filteredList, shelfOrder, typesSource]);

      const usageStatsByDrug = useMemo(() => {
        const map = {};
        const today = new Date();
        const currentMonth = today.getMonth() + 1;
        const currentYear = today.getFullYear();

        drugList.forEach(item => {
          const months = [];
          for (let i = 6; i >= 1; i--) {
            let m = currentMonth - i;
            let y = currentYear;
            while (m <= 0) { m += 12; y -= 1; }

            const oldReq = (ctx.appDb.requisitions || []).find(r =>
              String(r.hospitalId) === String(hospId) &&
              Number(r.month) === Number(m) &&
              Number(r.year) === Number(y) &&
              !String(r.id || '').startsWith('HIST-')
            );

            let usage = 0;
            if (oldReq && Array.isArray(oldReq.items)) {
              const oldItem = oldReq.items.find(it => String(it.drugId) === String(item.drugId));
              if (oldItem) usage = typeof getRb301UsageQty === 'function' ? getRb301UsageQty(oldItem) : toNonNegativeNumber(oldItem.usage);
            } else {
              const key = getYearMonthKey(m, y);
              const hist = (ctx.appDb.historicalUsages || []).find(h =>
                String(h.hospital_id) === String(hospId) &&
                String(h.drug_id) === String(item.drugId)
              );
              usage = (hist && hist.history && hist.history[key]) ? toNonNegativeNumber(hist.history[key]) : 0;
            }
            months.push({ m, y, usage: toNonNegativeNumber(usage) });
          }

          const active = months.filter(x => x.usage > 0).map(x => x.usage);
          const count = active.length || 1;
          const mean = active.reduce((a,b) => a+b, 0) / count;
          const variance = active.reduce((acc,val) => acc + Math.pow(val - mean, 2), 0) / (count === 1 ? 1 : count - 1);
          const sd = Math.sqrt(variance);
          map[String(item.drugId)] = {
            months,
            mean,
            adu: mean / 30,
            sd,
            sdz: sd * 1.645,
            maxUsage: Math.max(1, ...months.map(x => x.usage))
          };
        });
        return map;
      }, [drugList, ctx.appDb.requisitions, ctx.appDb.historicalUsages, hospId]);

      let totalValue = 0;
      let typeCounts = {};
      Object.keys(typesSource).forEach(k => typeCounts[k] = 0);

      drugList.forEach(d => {
         const val = (toSafeNumber(d.currentBal) / safePackSize(d.packSize)) * toNonNegativeNumber(d.price);
         totalValue += (val || 0);
         if(typeCounts[d.type] !== undefined) typeCounts[d.type]++;
      });

       const refreshInvsMasterPrice = async () => {
         if (isRefreshingInvsPrice) return;
         setIsRefreshingInvsPrice(true);
         try {
           const [drugSnap, unitSnap] = await Promise.all([
             db.collection('master_drugs').get(),
             db.collection('master_unit').get()
           ]);
           const freshDrugs = drugSnap.docs.map(d => ({ id:d.id, ...d.data() }));
           const freshUnits = unitSnap.docs.map(d => ({ id:d.id, ...d.data() }));
           const oldMap = new Map((ctx.appDb.drugs || []).map(d => [String(d.drug_id), {
             price:toNonNegativeNumber(d.price), pack:safePackSize(d.pack_size), unit:safeText(d.unit_id)
           }]));
           let priceChanged=0, packChanged=0, unitChanged=0, newDrugs=0;
           freshDrugs.forEach(d => {
             const old = oldMap.get(String(d.drug_id));
             if (!old) { newDrugs++; return; }
             if (Math.abs(toNonNegativeNumber(d.price)-old.price) >= 0.005) priceChanged++;
             if (Math.abs(safePackSize(d.pack_size)-old.pack) >= 0.0001) packChanged++;
             if (safeText(d.unit_id) !== old.unit) unitChanged++;
           });
           ctx.setAppDb(prev => ({ ...prev, drugs:freshDrugs, units:freshUnits }));
           setDetailItem(prev => {
             if (!prev) return prev;
             const d = freshDrugs.find(x => String(x.drug_id) === String(prev.drugId));
             if (!d) return prev;
             const u = freshUnits.find(x => String(x.unit_id) === String(d.unit_id));
             return { ...prev,
               price:toNonNegativeNumber(d.price), pricePrevious:toNonNegativeNumber(d.price_previous),
               packSize:safePackSize(d.pack_size), packPrevious:toNonNegativeNumber(d.pack_size_previous),
               unitId:safeText(d.unit_id), unitIdPrevious:safeText(d.unit_id_previous), unit:u?.unit_name || d.unit_id || '-',
               priceSource:safeText(d.price_source), priceInvsLastDatetime:safeText(d.price_invs_last_datetime),
               priceUpdatedAt:d.price_updated_at || null, packUpdatedAt:d.pack_size_updated_at || null,
               unitUpdatedAt:d.unit_updated_at || null, masterSyncSource:safeText(d.master_sync_source), masterSyncedAt:d.invs_master_synced_at || null
             };
           });
           const pieces=[];
           if(priceChanged) pieces.push(`ราคา ${priceChanged}`);
           if(packChanged) pieces.push(`Pack ${packChanged}`);
           if(unitChanged) pieces.push(`หน่วย ${unitChanged}`);
           if(newDrugs) pieces.push(`ยาใหม่ ${newDrugs}`);
           ctx.showToast(pieces.length ? `รีเฟรชข้อมูล INVS แล้ว: ${pieces.join(' • ')}` : 'ข้อมูล INVS เป็นข้อมูลล่าสุดแล้ว');
         } catch(err) {
           ctx.showToast('รีเฟรชข้อมูล INVS ไม่สำเร็จ: ' + (err?.message || err), 'error');
         } finally {
           setIsRefreshingInvsPrice(false);
         }
       };

      const resetShelfLayout = () => {
        const next = {};
        [...new Set(drugList.map(d => String(d.type || '1')))].forEach(typeKey => {
          next[typeKey] = drugList.filter(d => String(d.type || '1') === typeKey).sort(sortDrugs).map(d => String(d.drugId));
        });
        setShelfOrder(next);
        ctx.showToast('จัดชั้นยาอัตโนมัติตามหมวดและชื่อยาแล้ว');
      };

      const handleCardDrop = (e, targetItem, typeKey) => {
        e.preventDefault();
        e.stopPropagation();
        if (!dragState) return;
        if (String(dragState.typeKey) !== String(typeKey)) {
          ctx.showToast('ชั้นยาแบ่งตามหมวด จึงย้ายข้ามหมวดไม่ได้', 'error');
          return;
        }
        setShelfOrder(prev => {
          const current = Array.isArray(prev?.[typeKey]) ? [...prev[typeKey].map(String)] :
            drugList.filter(d => String(d.type || '1') === String(typeKey)).map(d => String(d.drugId));
          const from = current.indexOf(String(dragState.drugId));
          const to = current.indexOf(String(targetItem.drugId));
          if (from < 0 || to < 0 || from === to) return prev;
          current.splice(from, 1);
          current.splice(to, 0, String(dragState.drugId));
          return { ...(prev || {}), [typeKey]: current };
        });
      };

      const handleShelfEndDrop = (e, typeKey) => {
        e.preventDefault();
        if (!dragState || String(dragState.typeKey) !== String(typeKey)) return;
        setShelfOrder(prev => {
          const current = Array.isArray(prev?.[typeKey]) ? [...prev[typeKey].map(String)] :
            drugList.filter(d => String(d.type || '1') === String(typeKey)).map(d => String(d.drugId));
          const from = current.indexOf(String(dragState.drugId));
          if (from < 0 || from === current.length - 1) return prev;
          current.splice(from, 1);
          current.push(String(dragState.drugId));
          return { ...(prev || {}), [typeKey]: current };
        });
      };

      const handleSaveAdjust = async (e) => {
         e.preventDefault();
         const fd = new FormData(e.target);
         const data = Object.fromEntries(fd);
         const reason = safeText(data.reason);
         const newBalance = Number(data.new_balance);
         if(!reason) return ctx.showToast('ระบุเหตุผลด้วย', 'error');
         if(!Number.isFinite(newBalance) || newBalance < 0) return ctx.showToast('ยอดเครดิตใหม่ต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป', 'error');

         try {
            const adjRef = db.collection('stock_adjustments').doc();
            const currentRef = db.collection('current_excess').doc(`${hospId}_${editItem.drugId}`);
            const payload = {
              hospital_id: hospId,
              drug_id: editItem.drugId,
              old_balance: toNonNegativeNumber(editItem.currentBal),
              new_balance: newBalance,
              reason,
              user_name: ctx.currentUser.name,
              user_uid: ctx.currentUser.uid,
              status: isAdmin ? 'Approved' : 'Pending',
              date: firebase.firestore.FieldValue.serverTimestamp(),
              schema_version: APP_SCHEMA_VERSION
            };

            if (isAdmin) {
              const auditRef = db.collection('audit_logs').doc();
              await db.runTransaction(async (tx) => {
                const currentSnap = await tx.get(currentRef);
                const latest = currentSnap.exists ? toNonNegativeNumber(currentSnap.data().excess_balance) : 0;
                if (Math.abs(latest - toNonNegativeNumber(editItem.currentBal)) > 0.000001) {
                  throw new Error(`ยอดสต๊อกถูกเปลี่ยนแล้ว (ล่าสุด ${latest}) กรุณารีเฟรชก่อนปรับใหม่`);
                }
                tx.set(adjRef, { ...payload, approved_at: firebase.firestore.FieldValue.serverTimestamp(), approved_by_uid: ctx.currentUser.uid, approved_by_name: ctx.currentUser.name });
                tx.set(currentRef, { hospital_id: hospId, drug_id: editItem.drugId, excess_balance: newBalance, last_updated: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'STOCK_ADJUST_ADMIN', 'stock_adjustments', adjRef.id, { drug_id: editItem.drugId, old_balance: latest, new_balance: newBalance, reason }));
              });
            } else {
              const batch = db.batch();
              batch.set(adjRef, payload);
              addAuditToBatch(batch, ctx.currentUser, 'STOCK_ADJUST_REQUEST', 'stock_adjustments', adjRef.id, { drug_id: editItem.drugId, old_balance: payload.old_balance, new_balance: newBalance, reason });
              await batch.commit();
            }

            ctx.showToast(isAdmin ? 'ปรับสต๊อกเรียบร้อยแล้ว' : 'ส่งคำขอปรับสต๊อกแล้ว รออนุมัติ');
            setShowModal(false);
            setDetailItem(null);
            await ctx.refreshData();
         } catch(err) { ctx.showToast(err.message, 'error'); }
      };

      const handleDelete = async (drugId) => {
         const stockItem = drugList.find(i => String(i.drugId) === String(drugId));
         if (stockItem && Math.abs(toSafeNumber(stockItem.currentBal)) > 0.000001) {
           return ctx.showToast('ไม่สามารถนำยาออกจากคลังได้ขณะที่เครดิตคงเหลือไม่เป็น 0 กรุณาปรับ/คืนยาให้เหลือ 0 ก่อน', 'error');
         }
         try {
            const batch = db.batch();
            batch.delete(db.collection('config_par').doc(`${hospId}_${drugId}`));
            batch.delete(db.collection('current_excess').doc(`${hospId}_${drugId}`));
            addAuditToBatch(batch, ctx.currentUser, 'STOCK_ITEM_REMOVE', 'config_par', `${hospId}_${drugId}`, { hospital_id: hospId, drug_id: drugId });
            await batch.commit();
            setDetailItem(null);
            ctx.showToast('นำออกจากคลังเรียบร้อย');
            await ctx.refreshData();
         } catch(err) { ctx.showToast(err.message, 'error'); }
      };

      const myHistory = ctx.appDb.stockAdjustments.filter(a => a.hospital_id === hospId).sort((a,b) => (b.date?.seconds || 0) - (a.date?.seconds || 0));

      const renderShelfCard = (item, typeKey) => {
        const stockValue = (toSafeNumber(item.currentBal) / safePackSize(item.packSize)) * toNonNegativeNumber(item.price);
        return (
          <div
            key={item.drugId}
            draggable
            onDragStart={(e) => {
              dragWasActiveRef.current = true;
              setDragState({ drugId: String(item.drugId), typeKey: String(typeKey) });
              try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(item.drugId)); } catch(err) {}
            }}
            onDragEnd={() => {
              setDragState(null);
              setTimeout(() => { dragWasActiveRef.current = false; }, 80);
            }}
            onDragOver={(e) => { e.preventDefault(); try { e.dataTransfer.dropEffect = 'move'; } catch(err) {} }}
            onDrop={(e) => handleCardDrop(e, item, typeKey)}
            onClick={() => {
              if (dragWasActiveRef.current) return;
              setDetailItem(item);
            }}
            className={`relative group cursor-grab active:cursor-grabbing rounded-xl border bg-white shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition select-none min-h-[155px] overflow-hidden ${dragState?.drugId === String(item.drugId) ? 'opacity-40 border-dashed border-emerald-400' : 'border-slate-200'}`}
            title="ลากเพื่อจัดตำแหน่งบนชั้น • คลิกเพื่อดูรายละเอียด"
          >
            <div className="h-2 bg-gradient-to-r from-slate-700 to-slate-500"></div>
            <div className="p-3">
              <div className="flex items-start justify-between gap-2 mb-1">
                <div className="flex items-center gap-1"><span className="font-mono text-[10px] font-bold text-slate-400">{item.drugId}</span>{item.priceSource === 'INVS_LATEST_PRICE' && <span className="text-[8px] font-black text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-1">INVS</span>}</div>
                <span className="text-[10px] text-slate-400"><i className="fa-solid fa-grip-vertical"></i></span>
              </div>
              <div className="font-extrabold text-slate-800 text-[13px] leading-snug line-clamp-2 min-h-[36px]">{item.name}</div>
              <div className="mt-2 grid grid-cols-2 gap-x-2 gap-y-1 text-[10px]">
                <div><span className="text-slate-400">หน่วย</span><div className="font-bold text-slate-700 truncate">{item.unit || '-'}</div></div>
                <div><span className="text-slate-400">ราคา/หน่วย</span><div className="font-bold text-emerald-700">฿{formatUnitPrice(item.price)}</div></div>
                <div><span className="text-slate-400">Target</span><div className="font-bold text-blue-700">{toNonNegativeNumber(item.targetVMI).toLocaleString('th-TH')}</div></div>
                <div><span className="text-slate-400">คงเหลือ</span><div className={`font-black ${toSafeNumber(item.currentBal) <= 0 ? 'text-red-600' : 'text-amber-700'}`}>{toSafeNumber(item.currentBal).toLocaleString('th-TH')}</div></div>
              </div>
              <div className="mt-2 pt-2 border-t border-dashed border-slate-200 flex justify-between text-[9px] text-slate-400">
                <span>1 หน่วย = {safePackSize(item.packSize).toLocaleString('th-TH')} {item.unit || ''}</span>
                <span>≈ ฿{stockValue.toLocaleString('th-TH',{maximumFractionDigits:0})}</span>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="bg-white rounded-2xl shadow-sm p-4 lg:p-8 animate-fade-in relative min-h-[80vh]">
          <div className="flex flex-col lg:flex-row justify-between lg:items-center gap-4 mb-6 pb-4 border-b border-slate-100">
            <div>
               <h2 className="text-2xl font-bold text-slate-800"><i className="fa-solid fa-layer-group text-emerald-500 mr-2"></i> คลังยาของฉัน — Virtual Shelf</h2>
               <p className="text-slate-500 mt-1">จัดชั้นยาเสมือนให้ตรงกับชั้นจริง • ลากการ์ดเพื่อสลับตำแหน่ง • คลิกยาเพื่อดูยอดใช้และ VMI Parameter</p>
            </div>
            <button onClick={() => ctx.setCurrentView('dashboard')} className="text-slate-500 hover:text-slate-700 bg-slate-100 px-4 py-2 rounded-xl font-medium shrink-0">กลับหน้าหลัก</button>
          </div>

          <div className="flex flex-wrap gap-2 mb-6">
             <button onClick={()=>setStockTab('current')} className={`px-5 py-2 rounded-xl font-bold transition ${stockTab==='current'?'bg-emerald-600 text-white shadow-lg':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}><i className="fa-solid fa-layer-group mr-2"></i>ชั้นยาเสมือน</button>
             <button onClick={()=>setStockTab('history')} className={`px-5 py-2 rounded-xl font-bold transition ${stockTab==='history'?'bg-emerald-600 text-white shadow-lg':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}><i className="fa-solid fa-clock-rotate-left mr-2"></i>ประวัติการปรับยอด</button>
             <div className="flex-1"></div>
             <button onClick={() => ctx.setCurrentView('return_drug')} className="bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 px-5 py-2 rounded-xl font-bold transition shadow-sm"><i className="fa-solid fa-right-left mr-2"></i> เช็คสต็อกและคืนยา</button>
          </div>

          {stockTab === 'current' ? (
             <>
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
                   <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                      <div className="text-[11px] font-bold text-indigo-500 uppercase">รวมรายการทั้งหมด</div>
                      <div className="text-2xl font-black text-indigo-700">{drugList.length} รายการ</div>

                      <div><label className="text-sm font-bold text-slate-600 mb-1 block">รายการยา</label><div className="bg-slate-100 p-3 rounded-xl font-bold">{editItem.name} <span className="font-normal text-xs ml-1">[{editItem.drugId}]</span></div></div>
                      <div className="flex gap-4">
