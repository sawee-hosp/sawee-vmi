    const DrugHistoryView = ({ ctx }) => {
        const isAdmin = ctx.currentUser?.role === 'admin';
        const [selHosp, setSelHosp] = useState(ctx.currentUser?.hospital_id || ctx.appDb.hospitals[0]?.hospital_id || '');
        
        const today = new Date();
        const currentMonth = today.getMonth() + 1;
        const currentYear = today.getFullYear();

        const historyData = useMemo(() => {
            if (!selHosp || !ctx.appDb) return [];
            const result = [];

            ctx.appDb.drugs.forEach(d => {
                let m_usages = [];
                let totalUsages = 0;
                for(let i=1; i<=6; i++) {
                    let m = currentMonth - i; let y = currentYear;
                    if(m <= 0) { m += 12; y -= 1; }
                    const oldReq = ctx.appDb.requisitions.find(r => r.hospitalId === selHosp && r.month === m && r.year === y && !r.id.startsWith('HIST-'));
                    let usage = 0;
                    if(oldReq && oldReq.items) {
                        const oldItem = oldReq.items.find(it => it.drugId === d.drug_id);
                        if(oldItem) usage = Number(oldItem.usage);
                    } else {
                        const key = getYearMonthKey(m, y);
                        const hist = ctx.appDb.historicalUsages?.find(h => String(h.hospital_id) === String(selHosp) && String(h.drug_id) === String(d.drug_id));
                        usage = (hist && hist.history && hist.history[key]) ? Number(hist.history[key]) : 0;
                    }
                    m_usages.push({ m, y, usage });
                    totalUsages += usage;
                }

                if (totalUsages > 0) {
                    const activeUsages = m_usages.filter(u => u.usage > 0).map(u => u.usage);
                    const count = activeUsages.length || 1;
                    const mean = activeUsages.reduce((a,b)=>a+b, 0) / count;
                    const variance = activeUsages.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / (count === 1 ? 1 : count - 1);
                    const sd = Math.sqrt(variance);
                    const sdz = sd * 1.645;
                    const adu = mean / 30;

                    const unitObj = ctx.appDb.units.find(u => String(u.unit_id) === String(d.unit_id));
                    const unitName = unitObj ? unitObj.unit_name : (d.unit_id || '');

                    result.push({
                        drug_id: d.drug_id, drug_name: d.drug_name, type: d.type, unit: unitName,
                        m_usages: m_usages.reverse(), 
                        mean, sd, sdz, adu
                    });
                }
            });
            return result.sort((a,b) => b.mean - a.mean);
        }, [ctx.appDb, selHosp, currentMonth, currentYear]);

        const typesSource = ctx.appDb.drugTypes || DEFAULT_DRUG_TYPES;

        return (
            <div className="bg-white rounded-2xl shadow-sm p-4 lg:p-8 animate-fade-in border border-slate-100">

                        <p className="text-slate-500 mt-1">สถิติยอดใช้ 6 เดือนล่าสุด และค่า Parameter ประจำหน่วยงาน</p>
                    </div>
                    {isAdmin && (
                        <select className="border-2 border-emerald-300 text-emerald-800 rounded-lg p-2 font-bold w-full md:w-64 outline-none" value={selHosp} onChange={e=>setSelHosp(e.target.value)}>
                            {ctx.appDb.hospitals.map(h=><option key={h.id} value={h.hospital_id}>{h.hospital_name}</option>)}
                        </select>
                    )}
                </div>

                <div className="mb-4 p-4 bg-indigo-50 border border-indigo-200 rounded-xl">
                    <ul className="flex flex-wrap gap-x-8 gap-y-2 text-sm text-indigo-800">
                        <li><b>ADU:</b> ยอดใช้รายวัน (Average Daily Use)</li>
                        <li><b>AMU:</b> ยอดใช้รายเดือน (Average Monthly Use)</li>
                        <li><b>SD*1.645:</b> ยอดเผื่อความผันผวน (Safety Stock)</li>
                        <li className="text-amber-600"><b>หมายเหตุ:</b> คิดจากประวัติการเบิกรอบ 6 เดือนล่าสุด หารเฉลี่ยเฉพาะเดือนที่ใช้จริง</li>
                    </ul>
                </div>

                <div className="overflow-x-auto w-full border border-slate-200 rounded-xl">
                    <table className="w-full text-left text-[13px] whitespace-nowrap border-collapse">
                        <thead className="bg-slate-100 sticky top-0 z-10 shadow-sm border-b">
                            <tr>
                                <th className="p-3" rowSpan="2">รหัส</th>
                                <th className="p-3" rowSpan="2">ชื่อยา/เวชภัณฑ์</th>
                                <th className="p-3" rowSpan="2">หมวด</th>
                                <th className="p-3 text-center border-x border-slate-300" colSpan="6">ประวัติยอดใช้ (ย้อนหลัง 6 เดือน)</th>
                                <th className="p-3 text-center text-blue-800 bg-blue-100/80 font-bold border-r border-blue-200" colSpan="4">VMI Parameters</th>
                            </tr>
                            <tr className="bg-slate-50 text-[11px] text-slate-500 text-center border-b">
                                {historyData.length > 0 && historyData[0].m_usages.map((m, i) => (
                                    <th key={i} className={`p-2 ${i<5 ? 'border-r border-slate-200' : ''}`}>{THAI_MONTHS[m.m-1]} {(m.y+543).toString().substring(2)}</th>
                                ))}
                                {historyData.length === 0 && <th colSpan="6" className="p-2">ไม่พบประวัติ</th>}
                                
                                <th className="p-2 bg-blue-50/50 border-r border-blue-100">ADU<br/><span className="text-[9px] font-normal">(รายวัน)</span></th>
                                <th className="p-2 bg-blue-50/50 border-r border-blue-100">AMU<br/><span className="text-[9px] font-normal">(รายเดือน)</span></th>
                                <th className="p-2 bg-blue-50/50 border-r border-blue-100">SD<br/><span className="text-[9px] font-normal">(ส่วนเบี่ยงเบน)</span></th>
                                <th className="p-2 bg-blue-50/50 text-amber-700">SD*1.645<br/><span className="text-[9px] font-normal">(เผื่อผันผวน)</span></th>
                            </tr>
                        </thead>
                        <tbody>
                            {historyData.map((row, idx) => (
                                <tr key={idx} className="border-b border-slate-200 hover:bg-slate-50">
                                    <td className="p-3 font-mono text-slate-500">{row.drug_id}</td>
                                    <td className="p-3 font-bold text-slate-800">{row.drug_name} <span className="text-[10px] font-normal text-slate-400">({row.unit})</span></td>
                                    <td className="p-3 text-slate-600">{typesSource[row.type]}</td>
                                    {row.m_usages.map((m, i) => (
                                        <td key={i} className={`p-2 text-center ${m.usage > 0 ? 'font-bold text-slate-700' : 'text-slate-300'}`}>{m.usage}</td>
                                    ))}
                                    <td className="p-2 text-center font-bold text-blue-700 bg-blue-50/30 border-l border-blue-100">{row.adu.toFixed(2)}</td>
                                    <td className="p-2 text-center font-bold text-blue-700 bg-blue-50/30 border-l border-blue-100">{row.mean.toFixed(2)}</td>
                                    <td className="p-2 text-center font-bold text-slate-600 border-l border-blue-100">{row.sd.toFixed(2)}</td>
                                    <td className="p-2 text-center font-bold text-amber-600 border-l border-blue-100">{row.sdz.toFixed(2)}</td>
                                </tr>
                            ))}
                            {historyData.length === 0 && <tr><td colSpan="13" className="p-8 text-center text-slate-400">ยังไม่มีประวัติการใช้ยาสำหรับหน่วยงานนี้</td></tr>}
                        </tbody>
                    </table>
                </div>
            </div>
        );
    };

const MapDashboardView = ({ ctx }) => {
      const now = new Date();
      const [filterMonth, setFilterMonth] = useState(now.getMonth() + 1);
      const [filterYear, setFilterYear] = useState(now.getFullYear());
      const [statusFilter, setStatusFilter] = useState('all');
      const [affiliationFilter, setAffiliationFilter] = useState('all');
      const [metricMode, setMetricMode] = useState('status');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedHospitalId, setSelectedHospitalId] = useState(null);
      const [showCoordinateManager, setShowCoordinateManager] = useState(false);
      const [coordTarget, setCoordTarget] = useState(null);
      const [isSavingCoordinate, setIsSavingCoordinate] = useState(false);
      const [isMapFullscreen, setIsMapFullscreen] = useState(false);
      const mapElementRef = useRef(null);
      const mapRef = useRef(null);
      const layerRef = useRef(null);
      const markerRefs = useRef({});

      const escapeMapHtml = (value) => String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

      const timestampSeconds = (value) => {
        if (!value) return 0;
        if (typeof value.seconds === 'number') return value.seconds;
        const parsed = new Date(value).getTime();
        return Number.isFinite(parsed) ? Math.floor(parsed / 1000) : 0;
      };

      const dashboardData = useMemo(() => {
        const drugsById = new Map((ctx.appDb.drugs || []).map(d => [String(d.drug_id), d]));
        const balancesByHosp = new Map();
        (ctx.appDb.balances || []).forEach(b => {
          const key = String(b.hospital_id || '');
          if (!balancesByHosp.has(key)) balancesByHosp.set(key, []);
          balancesByHosp.get(key).push(b);
        });

        return (ctx.appDb.hospitals || []).map(h => {
          const hospitalId = String(h.hospital_id || '');
          const matchingReqs = (ctx.appDb.requisitions || []).filter(r =>
            String(r.hospitalId || '') === hospitalId &&
            Number(r.month) === Number(filterMonth) &&
            Number(r.year) === Number(filterYear) &&
            !String(r.id || '').startsWith('HIST-')
          ).sort((a,b) => (timestampSeconds(b.updated_at) || timestampSeconds(b.created_at)) - (timestampSeconds(a.updated_at) || timestampSeconds(a.created_at)));
          const req = matchingReqs[0] || null;

          let status = 'none';
          let statusText = 'ยังไม่ส่ง';
          if (req?.status === 'Completed') { status = 'completed'; statusText = 'จัดยาแล้ว'; }
          else if (req?.status === 'Draft') { status = 'pending'; statusText = 'รอจัดยา'; } // legacy Draft จากรุ่นทดสอบ แสดงเหมือน Pending
          else if (req?.status === 'Pending') { status = 'pending'; statusText = 'รอจัดยา'; }
          else if (req?.status === 'Approving') { status = 'processing'; statusText = 'กำลังอนุมัติ'; }
          else if (req?.status === 'Rejected') { status = 'rejected'; statusText = 'ส่งกลับแก้ไข'; }
          else if (req?.status === 'ApprovalFailed') { status = 'rejected'; statusText = 'อนุมัติไม่สำเร็จ'; }
          else if (req) { status = 'pending'; statusText = req.status || 'กำลังดำเนินการ'; }

          const reqItems = Array.isArray(req?.items) ? req.items : [];
          const requestValue = reqItems.reduce((sum, it) => sum + getRequisitionItemValue(it), 0);
          const usageValue = reqItems.reduce((sum, it) => sum + getUsageItemValue(it), 0);
          const extraValue = reqItems.reduce((sum, it) => sum + getActualStockExtraValue(it), 0);
          const extraItemCount = reqItems.filter(it => getActualStockExtraQty(it) > 0).length;
          const manualOnlyItemCount = reqItems.filter(it => getExtraDispenseQty(it) > 0 && (getAnalyticsSource(it) === 'manual_add' || toNonNegativeNumber(it.usage) <= 0)).length;
          const dispenseItemCount = reqItems.filter(it => toNonNegativeNumber(it.dispenseQty) > 0).length;
          const dispenseQtyTotal = reqItems.reduce((sum, it) => sum + toNonNegativeNumber(it.dispenseQty), 0);

          const stockRows = balancesByHosp.get(hospitalId) || [];
          let stockValue = 0;
          let stockItemCount = 0;
          let positiveBalanceItems = 0;
          stockRows.forEach(b => {
            const qty = toSafeNumber(b.excess_balance);
            const drug = drugsById.get(String(b.drug_id || ''));
            if (!drug) return;
            if (qty > 0) positiveBalanceItems++;
            if (qty !== 0) stockItemCount++;
            if (qty > 0) stockValue += (qty / safePackSize(drug.pack_size)) * toNonNegativeNumber(drug.price);
          });

          const submittedAtSec = timestampSeconds(req?.created_at);
          const waitingDays = req && submittedAtSec ? Math.max(0, Math.floor((Date.now()/1000 - submittedAtSec) / 86400)) : 0;
          const hasCoords = h.lat !== null && h.lat !== undefined && h.lat !== '' && h.lng !== null && h.lng !== undefined && h.lng !== '' && Number.isFinite(Number(h.lat)) && Number.isFinite(Number(h.lng)) && Math.abs(Number(h.lat)) <= 90 && Math.abs(Number(h.lng)) <= 180;

          return {
            ...h,
            hospitalId,
            req,
            status,
            statusText,
            requestValue,
            usageValue,
            extraValue,
            extraItemCount,
            manualOnlyItemCount,
            extraToUsagePct: usageValue > 0 ? (extraValue / usageValue) * 100 : (extraValue > 0 ? 100 : 0),
            dispenseItemCount,
            dispenseQtyTotal,
            stockValue,
            stockItemCount,
            positiveBalanceItems,
            waitingDays,
            hasCoords,
            lat: hasCoords ? Number(h.lat) : null,
            lng: hasCoords ? Number(h.lng) : null,
            duplicateReqCount: Math.max(0, matchingReqs.length - 1)
          };
        });
      }, [ctx.appDb.hospitals, ctx.appDb.requisitions, ctx.appDb.balances, ctx.appDb.drugs, filterMonth, filterYear]);

      const filteredData = useMemo(() => dashboardData.filter(h => {
        const matchesSearch = !searchTerm.trim() || String(h.hospital_name || '').toLowerCase().includes(searchTerm.trim().toLowerCase()) || String(h.hospital_id || '').toLowerCase().includes(searchTerm.trim().toLowerCase());
        const matchesStatus = statusFilter === 'all' || h.status === statusFilter;
        const matchesAff = affiliationFilter === 'all' || h.affiliation === affiliationFilter;
        return matchesSearch && matchesStatus && matchesAff;
      }), [dashboardData, searchTerm, statusFilter, affiliationFilter]);

      const mappableData = useMemo(() => filteredData.filter(h => h.hasCoords), [filteredData]);
      const selectedHospital = useMemo(() => dashboardData.find(h => h.hospitalId === selectedHospitalId) || null, [dashboardData, selectedHospitalId]);

      const totals = useMemo(() => ({
        total: dashboardData.length,
        completed: dashboardData.filter(h => h.status === 'completed').length,
        pending: dashboardData.filter(h => h.status === 'pending' || h.status === 'processing').length,
        rejected: dashboardData.filter(h => h.status === 'rejected').length,
        none: dashboardData.filter(h => h.status === 'none').length,
        submitted: dashboardData.filter(h => h.req).length,
        mapped: dashboardData.filter(h => h.hasCoords).length,
        requestValue: dashboardData.reduce((s,h) => s + h.requestValue, 0),
        usageValue: dashboardData.reduce((s,h) => s + h.usageValue, 0),
        extraValue: dashboardData.reduce((s,h) => s + h.extraValue, 0),
        extraItemCount: dashboardData.reduce((s,h) => s + h.extraItemCount, 0),
        manualOnlyItemCount: dashboardData.reduce((s,h) => s + h.manualOnlyItemCount, 0),
        stockValue: dashboardData.reduce((s,h) => s + h.stockValue, 0),
        itemCount: dashboardData.reduce((s,h) => s + h.dispenseItemCount, 0)
      }), [dashboardData]);

      const affiliationStats = useMemo(() => {
        const build = (code) => {
          const rows = dashboardData.filter(h => h.affiliation === code);
          return {
            total: rows.length,
            completed: rows.filter(h=>h.status==='completed').length,
            pending: rows.filter(h=>h.status==='pending'||h.status==='processing').length,
            none: rows.filter(h=>h.status==='none').length,
            requestValue: rows.reduce((s,h)=>s+h.requestValue,0),
            usageValue: rows.reduce((s,h)=>s+h.usageValue,0),
            extraValue: rows.reduce((s,h)=>s+h.extraValue,0),
            stockValue: rows.reduce((s,h)=>s+h.stockValue,0),
            extraItemCount: rows.reduce((s,h)=>s+h.extraItemCount,0)
          };
        };
        return { SSO: build('SSO'), OPT: build('OPT') };
      }, [dashboardData]);
      const affiliationTextClass = (h) => h?.affiliation === 'OPT' ? 'text-fuchsia-700' : 'text-blue-700';
      const affiliationLabel = (h) => h?.affiliation === 'OPT' ? 'อปท.' : 'สสอ.';
      const completionRate = totals.total > 0 ? (totals.completed / totals.total) * 100 : 0;
      const topRequestValue = useMemo(() => [...dashboardData].filter(h => h.req).sort((a,b) => b.requestValue - a.requestValue).slice(0,5), [dashboardData]);
      const topStockValue = useMemo(() => [...dashboardData].sort((a,b) => b.stockValue - a.stockValue).slice(0,5), [dashboardData]);
      const topExtraValue = useMemo(() => [...dashboardData].filter(h => h.extraValue > 0).sort((a,b) => b.extraValue - a.extraValue).slice(0,5), [dashboardData]);
      const comparisonData = useMemo(() => [...filteredData].sort((a,b) => {
        const ar = a.affiliation === 'SSO' ? 0 : a.affiliation === 'OPT' ? 1 : 2;
        const br = b.affiliation === 'SSO' ? 0 : b.affiliation === 'OPT' ? 1 : 2;
        return ar - br || String(a.hospital_name || '').localeCompare(String(b.hospital_name || ''), 'th');
      }), [filteredData]);
      const comparisonMaxValue = useMemo(() => Math.max(1, ...comparisonData.map(h => h.usageValue + h.extraValue)), [comparisonData]);
      const pendingLongest = useMemo(() => [...dashboardData].filter(h => h.status === 'pending' || h.status === 'processing').sort((a,b) => b.waitingDays - a.waitingDays).slice(0,5), [dashboardData]);
      const missingCoords = useMemo(() => dashboardData.filter(h => !h.hasCoords), [dashboardData]);
      const duplicateReqHospitals = useMemo(() => dashboardData.filter(h => h.duplicateReqCount > 0), [dashboardData]);

      const metricText = (h) => {
        if (metricMode === 'request_value') return h.req ? `฿${Math.round(h.requestValue).toLocaleString('th-TH')}` : '-';
        if (metricMode === 'stock_value') return `฿${Math.round(h.stockValue).toLocaleString('th-TH')}`;
        if (metricMode === 'extra_value') return `+฿${Math.round(h.extraValue).toLocaleString('th-TH')}`;
        if (metricMode === 'item_count') return `${h.dispenseItemCount.toLocaleString('th-TH')} รายการ`;
        return h.statusText;
      };

      const metricNumber = (h) => {
        if (metricMode === 'request_value') return toNonNegativeNumber(h.requestValue);
        if (metricMode === 'stock_value') return toNonNegativeNumber(h.stockValue);
        if (metricMode === 'extra_value') return toNonNegativeNumber(h.extraValue);
        if (metricMode === 'item_count') return toNonNegativeNumber(h.dispenseItemCount);
        return 0;
      };

      const mapMetricRange = useMemo(() => {
        if (metricMode === 'status') return { min:0, max:0 };
        const values = mappableData.map(metricNumber).filter(v => Number.isFinite(v) && v > 0);
        if (!values.length) return { min:0, max:0 };
        return { min: Math.min(...values), max: Math.max(...values) };
      }, [mappableData, metricMode]);

      const markerCardSize = (h) => {
        if (metricMode === 'status' || mapMetricRange.max <= 0) return { width:138, height:64, pad:6 };
        const value = metricNumber(h);
        const min = mapMetricRange.min;
        const max = mapMetricRange.max;
        if (value <= 0) return { width:108, height:54, pad:4.5 };
        // เพิ่มช่วงขนาดจากเดิมเล็กน้อย: ค่าสูงเด่นชัดขึ้น แต่ค่าต่ำยังอ่านชื่อได้
        const norm = max > min ? Math.sqrt(Math.max(0, (value - min) / (max - min))) : 0.55;
        return {
          width: Math.round(108 + norm * 66),
          height: Math.round(54 + norm * 20),
          pad: (4.5 + norm * 4).toFixed(1)
        };
      };

      useEffect(() => {
        if (!mapElementRef.current || !window.L || mapRef.current) return;
        const map = L.map(mapElementRef.current, { zoomControl: true, preferCanvas: true });
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        layerRef.current = L.layerGroup().addTo(map);
        map.setView([10.24, 99.10], 11);
        mapRef.current = map;
        setTimeout(() => map.invalidateSize(), 80);
        return () => {
          try { map.remove(); } catch(e) {}
          mapRef.current = null;
          layerRef.current = null;
          markerRefs.current = {};
        };
      }, []);

      useEffect(() => {
        setTimeout(() => { try { mapRef.current?.invalidateSize(); } catch(e) {} }, 120);
      }, [isMapFullscreen]);

      useEffect(() => {
        const map = mapRef.current;
        const layer = layerRef.current;
        if (!map || !layer || !window.L) return;
        layer.clearLayers();
        markerRefs.current = {};
        const bounds = [];

        mappableData.forEach(h => {
          bounds.push([h.lat, h.lng]);
          const labelClass = ['completed','pending','rejected','processing'].includes(h.status) ? h.status : 'none';
          const name = escapeMapHtml(h.hospital_name || h.hospital_id);
          const metric = escapeMapHtml(metricText(h));
          const affiliationColor = h.affiliation === 'OPT' ? '#a21caf' : '#1d4ed8';
          const affiliationShort = h.affiliation === 'OPT' ? 'อปท.' : 'สสอ.';
          const cardSize = markerCardSize(h);
          const icon = L.divIcon({
            className: '',
            html: `<div class="vmi-map-marker" style="width:${cardSize.width}px"><div class="vmi-map-label ${labelClass}" style="width:${cardSize.width}px;padding:${cardSize.pad}px 9px"><div style="font-size:10px;font-weight:900;color:${affiliationColor};max-width:${cardSize.width-18}px;overflow:hidden;text-overflow:ellipsis"><span style="font-size:8px;margin-right:3px">${affiliationShort}</span>${name}</div><div style="font-size:12px;font-weight:900;margin-top:3px;color:#0f172a">${metric}</div></div><div class="vmi-map-dot ${labelClass}"></div></div>`,
            iconSize: [cardSize.width, cardSize.height], iconAnchor: [cardSize.width/2, cardSize.height]
          });
          const marker = L.marker([h.lat, h.lng], { icon, title: h.hospital_name || h.hospital_id });
          const popup = document.createElement('div');
          popup.style.minWidth = '230px';
          const addLine = (label, value, bold=false) => {
            const row = document.createElement('div'); row.style.marginTop='5px'; row.style.fontSize='12px';
            const b = document.createElement('span'); b.style.fontWeight='700'; b.textContent = label + ': ';
            const v = document.createElement('span'); if (bold) v.style.fontWeight='800'; v.textContent = value;
            row.appendChild(b); row.appendChild(v); popup.appendChild(row);
          };
          const title = document.createElement('div'); title.style.fontWeight='900'; title.style.fontSize='15px'; title.style.color='#0f172a'; title.textContent = h.hospital_name || h.hospital_id; popup.appendChild(title);
          addLine('สถานะ', h.statusText, true);
          addLine('มูลค่าตาม รบ.301', `${h.usageValue.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})} บาท`);
          addLine('มูลค่าเบิกเพิ่ม', `${h.extraValue.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})} บาท`, h.extraValue > 0);
          addLine('รายการเบิกเพิ่ม', `${h.extraItemCount.toLocaleString('th-TH')} รายการ`);
          addLine('มูลค่าเบิกรวม', `${h.requestValue.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})} บาท`);
          addLine('มูลค่าสต๊อก/เครดิต', `${h.stockValue.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})} บาท`);
          addLine('รายการจ่าย', `${h.dispenseItemCount.toLocaleString('th-TH')} รายการ`);
          addLine('พิกัด', `${h.lat.toFixed(5)}, ${h.lng.toFixed(5)}`);
          marker.bindPopup(popup, { maxWidth: 320 });
          marker.on('click', () => setSelectedHospitalId(h.hospitalId));
          marker.addTo(layer);
          markerRefs.current[h.hospitalId] = marker;
        });

        if (bounds.length === 1) map.setView(bounds[0], 13);
        else if (bounds.length > 1) map.fitBounds(bounds, { padding:[35,35], maxZoom:13 });
        else map.setView([10.24, 99.10], 11);
        setTimeout(() => map.invalidateSize(), 80);
      }, [mappableData, metricMode]);

      const focusHospital = (hospitalId) => {
        setSelectedHospitalId(hospitalId);
        const h = dashboardData.find(x => x.hospitalId === hospitalId);
        if (h?.hasCoords && mapRef.current) {
          mapRef.current.setView([h.lat, h.lng], Math.max(mapRef.current.getZoom(), 14), { animate:true });
          const marker = markerRefs.current[hospitalId];
          if (marker) marker.openPopup();
        }
      };

      const openHospitalConfig = () => {
        setShowCoordinateManager(true);
      };

      const openCoordinateEditor = (hospital) => {
        setShowCoordinateManager(false);
        setCoordTarget({
          hospitalId: String(hospital?.hospital_id || hospital?.hospitalId || ''),
          hospitalName: hospital?.hospital_name || hospital?.hospitalId || '',
          lat: hospital?.lat ?? '',
          lng: hospital?.lng ?? ''
        });
      };

      const saveCoordinate = async () => {
        if (!coordTarget?.hospitalId) return;
        const latText = safeText(coordTarget.lat);
        const lngText = safeText(coordTarget.lng);
        if ((latText === '') !== (lngText === '')) {
          ctx.showToast('กรุณากรอก Latitude และ Longitude ให้ครบทั้งสองช่อง หรือเว้นว่างทั้งคู่', 'error');
          return;
        }
        const lat = latText === '' ? null : Number(latText);
        const lng = lngText === '' ? null : Number(lngText);
        if (lat !== null && (!Number.isFinite(lat) || lat < -90 || lat > 90)) {
          ctx.showToast('Latitude ต้องอยู่ระหว่าง -90 ถึง 90', 'error');
          return;
        }
        if (lng !== null && (!Number.isFinite(lng) || lng < -180 || lng > 180)) {
          ctx.showToast('Longitude ต้องอยู่ระหว่าง -180 ถึง 180', 'error');
          return;
        }
        setIsSavingCoordinate(true);
        try {
          await db.collection('master_hospitals').doc(coordTarget.hospitalId).set({
