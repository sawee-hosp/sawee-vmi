<body class="text-slate-800 flex flex-col min-h-screen">
  <div id="root" class="flex-grow"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAnzXAEkH8Zz0Ur4lCQ00qa4UqYATTikAs",
      authDomain: "sawee-rxfill.firebaseapp.com",
      projectId: "sawee-rxfill",
      storageBucket: "sawee-rxfill.firebasestorage.app",
      messagingSenderId: "186506077335",
      appId: "1:186506077335:web:71c5f6f90bb26e767df5d2",
      measurementId: "G-XFL0L1L213"
    };

    const GAS_DRIVE_URL = "https://script.google.com/macros/s/AKfycbyEXNTj0se5egi1TrX_4Ew47HgfUNGc2fvjf00FpGtQYpi6toSZH-1QMnWLeQopJx-IPA/exec"; 

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const THAI_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
    const DEFAULT_DRUG_TYPES = { '1': 'ยา', '3': 'สมุนไพร', '6': 'วัคซีน', '25': 'ยาสำหรับโรคเรื้อรัง (NCDs)', '32': 'เวชภัณฑ์ทางการแพทย์' };

    const getFiscalInfo = (month, year) => {
      let fiscalYear = month >= 10 ? year + 1 + 543 : year + 543;
      let term = month >= 10 ? month - 9 : month + 3;
      return { fiscalYear, term };
    };

    const getYearMonthKey = (month, year) => {
       return `${year}-${String(month).padStart(2, '0')}`;
    };

    // รอบเบิกที่ทำช่วงวันที่ 20-31 เป็นการเติมยาเพื่อใช้ในเดือนถัดไป
    // เช่น 20 ก.ย. 2569 => รอบเดือน ต.ค. 2569 => ปีงบ 2570
    const getNextCalendarPeriod = (month, year) => {
      let m = Number(month) + 1;
      let y = Number(year);
      if (m > 12) { m = 1; y += 1; }
      return { month:m, year:y };
    };

    const getPreviousCalendarPeriod = (month, year) => {
      let m = Number(month) - 1;
      let y = Number(year);
      if (m < 1) { m = 12; y -= 1; }
      return { month:m, year:y };
    };

    const sortDrugs = (a, b) => {
      const idA = String(a.drugId || a.drug_id || "");
      const idB = String(b.drugId || b.drug_id || "");
      const isDrugA = idA.length >= 5;
      const isDrugB = idB.length >= 5;
      if (isDrugA && !isDrugB) return -1;
      if (!isDrugA && isDrugB) return 1;
      return idA.localeCompare(idB);
    };

    const formatQty = (qty, packSize) => {
       const safeQty = Number(qty);
       const safePack = Math.max(1, Number(packSize) || 1);
       if (!Number.isFinite(safeQty) || safeQty <= 0) return '0';
       const p = Math.floor(safeQty / safePack);
       const r = safeQty % safePack;
       if (r === 0) return p.toString();
       if (p === 0) return `(${r})`;
       return `${p}(${r})`;
    };

    const APP_SCHEMA_VERSION = 16;
    const APP_VERSION = '4.16.4-production';
    // Local INVS Bridge: รันผ่าน XAMPP บนเครื่อง Admin ที่เชื่อมฐาน INVS ได้
    const INVS_BRIDGE_URL = 'http://127.0.0.1/SaweeRxfillINVS/invs_api.php';

    const callInvsBridge = async (action, requisitionId) => {
      if (!auth.currentUser) throw new Error('กรุณา Login ใหม่ก่อนเชื่อม INVS');
      const idToken = await auth.currentUser.getIdToken(true);
      let response;
      try {
        response = await fetch(INVS_BRIDGE_URL, {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${idToken}` },
          // ส่ง token ซ้ำใน JSON เป็น fallback สำหรับ Apache/XAMPP บางเครื่องที่ตัด Authorization header ก่อนถึง PHP
          body: JSON.stringify({ action, requisition_id: requisitionId, firebase_id_token: idToken })
        });
      } catch (networkErr) {
        const e = new Error('ติดต่อ INVS Bridge ไม่ได้ กรุณาเปิด XAMPP Apache และตรวจ http://127.0.0.1/SaweeRxfillINVS/invs_api.php?action=health');
        e.cause = networkErr;
        throw e;
      }
      let data = null;
      try { data = await response.json(); } catch(e) {}
      if (!response.ok || !data?.ok) {
        let message = data?.message || `INVS Bridge HTTP ${response.status}`;
        if (data?.auth_debug && !String(message).includes('role=')) {
          const d = data.auth_debug;
          message += ` [Bridge role=${d.role_normalized || '-'}, active=${d.active_effective}, project=${d.project_id || '-'}]`;
        }
        const err = new Error(message);
        err.payload = data;
        err.httpStatus = response.status;
        throw err;
      }
      return data;
    };
    const MAX_BATCH_WRITES = 400;
    let fuzzyAutoCleanDone = false;
    
    const toSafeNumber = (value, fallback = 0) => {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    };

    const toNonNegativeNumber = (value, fallback = 0) => Math.max(0, toSafeNumber(value, fallback));
    const toNonNegativeInt = (value, fallback = 0) => Math.max(0, Math.round(toSafeNumber(value, fallback)));
    const safePackSize = (value) => Math.max(1, Math.round(toSafeNumber(value, 1)));
    const safeText = (value, fallback = '') => String(value ?? fallback).trim();

    // FY2569 เป็นปีเปลี่ยนผ่านของระบบ: default เลขครั้งตามลำดับเดือนงบ (ต.ค.=1 ... ก.ย.=12)
    // ตั้งแต่ FY2570 เป็นต้นไป เลขครั้ง run ตามใบเบิกที่เกิดขึ้นจริงของแต่ละ รพ.สต. และ reset เมื่อขึ้นปีงบใหม่
    const RXFILL_TRANSITION_FISCAL_YEAR = 2569;

    const getStoredFiscalTerm = (req) => {
      const raw = req?.fiscal_term ?? req?.requisition_term ?? req?.term;
      const n = Math.round(Number(raw));
      return Number.isFinite(n) && n > 0 ? n : 0;
    };

    const getReqFiscalYear = (req) => {
      const stored = Math.round(Number(req?.fiscal_year));
      if (Number.isFinite(stored) && stored > 0) return stored;
      if (!req) return 0;
      return getFiscalInfo(Number(req.month), Number(req.year)).fiscalYear;
    };

    const getEffectiveFiscalTerm = (req, requisitions = []) => {
      if (!req) return 1;
      const stored = getStoredFiscalTerm(req);
      if (stored > 0) return stored;
      const info = getFiscalInfo(Number(req.month), Number(req.year));
      if (info.fiscalYear <= RXFILL_TRANSITION_FISCAL_YEAR) return info.term;
      const sameFY = (requisitions || []).filter(r =>
        r && !String(r.id || '').startsWith('HIST-') &&
        String(r.hospitalId) === String(req.hospitalId) &&
        getReqFiscalYear(r) === info.fiscalYear
      ).sort((a,b) => (Number(a.year)*100+Number(a.month)) - (Number(b.year)*100+Number(b.month)));
      const idx = sameFY.findIndex(r => String(r.id) === String(req.id));
      return idx >= 0 ? idx + 1 : info.term;
    };

    const getNextFiscalTerm = (hospitalId, month, year, requisitions = []) => {
      const info = getFiscalInfo(Number(month), Number(year));
      if (info.fiscalYear <= RXFILL_TRANSITION_FISCAL_YEAR) return info.term;
      const sameFY = (requisitions || []).filter(r =>
        r && !String(r.id || '').startsWith('HIST-') &&
        String(r.hospitalId) === String(hospitalId) &&
        getReqFiscalYear(r) === info.fiscalYear
      );
      const storedTerms = sameFY.map(getStoredFiscalTerm).filter(n => n > 0);
      if (storedTerms.length) return Math.max(...storedTerms) + 1;
      return sameFY.length + 1;
    };

    const formatRequisitionNo = (term, fiscalYear) => `${Math.max(1, toNonNegativeInt(term,1))}/${fiscalYear}`;

    // สถานะยาหลักใช้ร่วมกันทุก รพ.สต. จาก master_drugs เท่านั้น
    // Active = ใช้งานปกติ, ยกเลิกใช้ = แสดงย้อนหลัง/ยอดใช้ได้ แต่จำนวนจ่ายเป็น 0 และเพิ่มเองไม่ได้
    // field is_disabled ใน config_par รุ่นเก่าจะถูกเพิกเฉยและไม่ใช้ตัดสินการจ่ายอีกต่อไป
    const getDrugStatusText = (drug) => safeText(
      drug?.status ?? drug?.Status ?? drug?.drug_status ?? drug?.drugStatus ?? drug?.use_status ?? drug?.active_status ?? drug?.['สถานะ'] ?? ''
    );

    const isDrugDiscontinued = (drug) => {
      if (!drug) return false;
      const raw = getDrugStatusText(drug).normalize('NFKC').trim().toLowerCase();
      const compact = raw.replace(/\s+/g, '');
      if (compact.includes('ยกเลิกการใช้') || compact.includes('ยกเลิกใช้') || compact === 'discontinued' || compact === 'inactive' || compact === 'cancelled' || compact === 'canceled') return true;
      const activeValue = drug?.is_active ?? drug?.active;
      if (activeValue === false || String(activeValue).trim().toLowerCase() === 'false' || String(activeValue).trim() === '0') return true;
      return false;
    };

    const normalizeDrugMasterStatus = (value) => {
      const raw = safeText(value).normalize('NFKC').trim().toLowerCase().replace(/\s+/g, '');
      if (raw.includes('ยกเลิกการใช้') || raw.includes('ยกเลิกใช้') || raw === 'discontinued' || raw === 'inactive' || raw === 'cancelled' || raw === 'canceled' || raw === 'false' || raw === '0') return 'ยกเลิกใช้';
      return 'Active';
    };


    // Normalize role only in memory so legacy Admin values remain compatible.
    // This does NOT write role back to Firestore and does not change the original UI.
    const normalizeUserRole = (value) => {
      const role = String(value ?? '').normalize('NFKC').trim().toLowerCase();
      if (role === 'admin' || role === 'administrator') return 'admin';
      if (role === 'hospital' || role === 'รพ.สต.' || role === 'รพสต') return 'hospital';
      return role;
    };

    // Normalization กลางสำหรับ fuzzy/matching: ไม่สนตัวพิมพ์เล็ก-ใหญ่, ช่องว่าง และเครื่องหมายคั่นทั่วไป
    // แต่ยังคงตัวอักษร/ตัวเลขไว้ จึงไม่รวมความแรงยา 20 mg กับ 250 mg เข้าด้วยกัน
    const normalizeForMatch = (value) => String(value ?? '')
      .normalize('NFKC')
      .toLocaleLowerCase('th-TH')
      .replace(/\s+/g, '')
      .replace(/[\-_.()\/\\]+/g, '');

    // ล้าง fuzzy ซ้ำโดยคงคำแรกไว้ และตัด alias ที่ซ้ำกับชื่อยาหลักเพราะค้นจาก drug_name ได้อยู่แล้ว
    const cleanFuzzyAliases = (aliases, canonicalName = '') => {
      const out = [];
      const seen = new Set();
      const canonicalKey = normalizeForMatch(canonicalName);
      (Array.isArray(aliases) ? aliases : String(aliases || '').split(',')).forEach(raw => {
        const text = safeText(raw);
        if (!text) return;
        const key = normalizeForMatch(text);
        if (!key || key === canonicalKey || seen.has(key)) return;
        seen.add(key);
        out.push(text);
      });
      return out;
    };

    // รอบจ่ายสะดวก (หน่วยยา)
    // กฎสำคัญ: ถ้า "ห้ามแตกย่อย" รอบจ่ายต้องเป็นจำนวนเท่าของ pack เสมอ แม้ตั้ง dispense_step ผิดไว้ในฐานเก่า
    const getDispenseStep = (item) => {
      const pack = safePackSize(item?.packSize ?? item?.pack_size);
      const isUnpacked = !!(item?.isUnpacked ?? item?.unpacked);
      const explicit = toNonNegativeNumber(item?.dispenseStep ?? item?.dispense_step, 0);
      if (isUnpacked) return explicit > 0 ? explicit : 1;
      if (explicit > 0) return Math.max(pack, Math.ceil(explicit / pack) * pack);
      return pack;
    };

    // ตัวคูณยอดใช้จากไฟล์ต้นทาง (เช่น รบ.301/JHCIS) -> หน่วยยาภายในระบบ
    // ตัวอย่าง Obimin: ในรายงาน 1 = 1 กระปุก แต่จริงมี 30 เม็ด -> usage_multiplier = 30
    // ถ้าไฟล์ต้นทางรายงานเป็นหน่วยยาอยู่แล้ว ให้ใช้ 1
    const getUsageMultiplier = (drugOrItem) => {
      const explicit = toNonNegativeNumber(drugOrItem?.usageMultiplier ?? drugOrItem?.usage_multiplier, 1);
      return explicit > 0 ? explicit : 1;
    };

    const convertImportedUsage = (rawUsage, drugOrItem) => {
      return toNonNegativeNumber(rawUsage) * getUsageMultiplier(drugOrItem);
    };

    // Maximum = ยอดเบิกสูงสุดต่อรอบในหน่วยยาของ Master; 0/ว่าง = ไม่จำกัด
    const getMaximumQty = (item) => {
      const raw = item?.maximumQty ?? item?.maximum_qty ?? item?.maximum ?? item?.max_qty;
      return toNonNegativeNumber(raw, 0);
    };

    // Maximum ต้องสอดคล้องกับรอบจ่าย เพื่อไม่ให้ cap แล้วเกิดจำนวนที่ผิดกฎ Pack/Dispense Step
    const normalizeMaximumQty = (value, item) => {
      const raw = toNonNegativeNumber(value, 0);
      if (raw <= 0) return 0;
      const step = Math.max(1, getDispenseStep(item));
      const floored = Math.floor(raw / step) * step;
      return floored > 0 ? floored : step;
    };

    const applyMaximumQty = (qty, item) => {
      const safeQty = toNonNegativeNumber(qty);
      const maximum = getMaximumQty(item);
      return maximum > 0 ? Math.min(safeQty, maximum) : safeQty;
    };

    const roundDispenseQtyUncapped = (need, item) => {
      const safeNeed = toNonNegativeNumber(need);
      if (safeNeed <= 0) return 0;
      const step = Math.max(1, getDispenseStep(item));
      return Math.ceil(safeNeed / step) * step;
    };

    const roundDispenseQty = (need, item) => applyMaximumQty(roundDispenseQtyUncapped(need, item), item);

    // Lock ชั้นสุดท้ายสำหรับจำนวนจ่าย: ยาห้ามแตกย่อยจะไม่มีทางเหลือเศษ pack
    const normalizeDispenseQty = (qty, item) => {
      if (isNonBillableInRequisition(item)) return 0;
      const safeQty = toNonNegativeNumber(qty);
      if (safeQty <= 0) return 0;
      return roundDispenseQty(safeQty, item);
    };

    const isDispenseQtyLockedValid = (qty, item) => {
      const safeQty = toNonNegativeNumber(qty);
      if (safeQty === 0 || item?.isUnpacked) return true;
      const pack = safePackSize(item?.packSize ?? item?.pack_size);
      return Math.abs((safeQty / pack) - Math.round(safeQty / pack)) < 1e-9;
    };

    const isNonBillableInRequisition = (item) => item?.type === '6' || !!item?.isDiscontinued;

    // ใช้ทุกครั้งก่อนบันทึก/แสดงใบเบิก เพื่อไม่ให้ข้อมูลจาก UI หรือข้อมูลเก่าหลุดกฎการแตกย่อย
    const lockRequisitionItem = (rawItem) => {
      const item = { ...rawItem };
      // v4.3: ยกเลิกกฎเปิด/ปิดยาราย รพ.สต. — legacy flag ถูกล้างในเอกสารที่มีการบันทึกใหม่
      item.isDisabledForHospital = false;
      item.packSize = safePackSize(item.packSize ?? item.pack_size);
      item.isUnpacked = !!(item.isUnpacked ?? item.unpacked);
      item.dispenseStep = toNonNegativeNumber(item.dispenseStep ?? item.dispense_step, 0);
      item.maximumQty = getMaximumQty(item);
      item.prevExcess = toSafeNumber(item.prevExcess);
      item.usage = toNonNegativeNumber(item.usage);
      item.netNeed = toNonNegativeNumber(item.netNeed);
      item.targetVMI = toNonNegativeNumber(item.targetVMI);

      if (isNonBillableInRequisition(item)) {
        item.netNeed = 0;
        item.dispenseQty = 0;
        item.dispensePack = 0;
      } else {
        const beforeMaximum = toNonNegativeNumber(item.dispenseQty);
        item.dispenseQty = normalizeDispenseQty(beforeMaximum, item);
        if (item.maximumQty > 0 && beforeMaximum > item.dispenseQty + 0.000001) {
          item.maximumApplied = true;
          item.maximumBeforeQty = Math.max(toNonNegativeNumber(item.maximumBeforeQty), beforeMaximum);
        } else {
          item.maximumApplied = !!item.maximumApplied;
          item.maximumBeforeQty = toNonNegativeNumber(item.maximumBeforeQty);
        }
        item.dispensePack = item.dispenseQty > 0 ? Math.ceil(item.dispenseQty / item.packSize) : 0;
      }
      const reconciliationBase = item.actualStockTouched && item.actualStock !== null && item.actualStock !== undefined
        ? toNonNegativeNumber(item.actualStock)
        : (item.prevExcess - item.usage);
      item.systemStock = item.prevExcess - item.usage;
      item.newExcess = reconciliationBase + item.dispenseQty;
      return item;
    };

    const getRequisitionItemValue = (item) => {
      if (isNonBillableInRequisition(item)) return 0;
      // ใช้ค่าที่บันทึกจริงสำหรับรายงานย้อนหลัง; การ lock ทำก่อน save/approve ไม่แก้ประวัติย้อนหลังเงียบ ๆ
      return (toNonNegativeNumber(item?.dispenseQty) / safePackSize(item?.packSize)) * toNonNegativeNumber(item?.price);
    };


    // ===== VMI Analytics: มูลค่าตาม รบ.301 ก่อนปรับ vs เบิกเพิ่มจากยอดจริง =====
    const getRb301UsageQty = (item) => {
      // importedUsageQty คือยอดจาก รบ.301 หลังแปลง usage_multiplier แล้ว และต้องคงเป็น snapshot ก่อนการแก้ไขภายหลัง
      const stored = item?.importedUsageQty ?? item?.rb301UsageQty ?? item?.rb301_usage_qty;
      if (stored !== null && stored !== undefined && stored !== '' && Number.isFinite(Number(stored))) {
        const storedQty = toNonNegativeNumber(stored);
        // รุ่นเก่าบางใบมี field importedUsageQty=0 ทั้งที่ usage มีค่า จึง fallback เฉพาะกรณีนั้น
        if (storedQty > 0 || toNonNegativeNumber(item?.usage) <= 0) return storedQty;
      }
      // ใบเบิกรุ่นเก่าที่ยังไม่มี snapshot ใช้ usage เป็น fallback
      return toNonNegativeNumber(item?.usage);
    };

    const getUsageItemValue = (item) => {
      if (isNonBillableInRequisition(item)) return 0;
      const baseValue = (getRb301UsageQty(item) / safePackSize(item?.packSize ?? item?.pack_size)) * toNonNegativeNumber(item?.price);
      // Completed อาจมีการแก้ mapping ย้อนหลังเพื่อแก้เฉพาะสถิติ รบ.301 โดยไม่แตะใบจัดยา/stock
      const corrections = Array.isArray(item?.analyticsCorrections) ? item.analyticsCorrections : [];
      const delta = corrections.reduce((sum, c) => sum + toSafeNumber(c?.deltaValue), 0);
      return Math.max(0, baseValue + delta);
    };

    const getSystemSuggestedQty = (item) => {
      if (isNonBillableInRequisition(item)) return 0;
      const stored = item?.systemSuggestedQty ?? item?.system_suggested_qty;
      if (stored !== null && stored !== undefined && stored !== '' && Number.isFinite(Number(stored))) {
        return toNonNegativeNumber(stored);
      }
      // fallback สำหรับใบเบิกเก่า: จำนวนที่ระบบควรจ่ายจาก netNeed ก่อนมีการขอเพิ่ม/แก้โดย Admin
      return roundDispenseQty(toNonNegativeNumber(item?.netNeed), item);
    };

    const getExtraDispenseQty = (item) => {
      if (isNonBillableInRequisition(item)) return 0;
      // เบิกเพิ่ม = เฉพาะส่วนที่จ่ายจริงเกิน baseline ที่ระบบแนะนำก่อนปรับคงเหลือจริง/แก้จำนวน
      // ไม่เอามูลค่าเครดิตมาบวกเป็นเบิกเพิ่ม
      const stored = item?.approvedExtraQty ?? item?.approved_extra_qty;
      if (stored !== null && stored !== undefined && stored !== '' && Number.isFinite(Number(stored))) {
        return toNonNegativeNumber(stored);
      }
      const finalQty = toNonNegativeNumber(item?.dispenseQty ?? item?.finalRequestedQty);
      return Math.max(0, finalQty - getSystemSuggestedQty(item));
    };

    const getExtraDispenseValue = (item) => {
      if (isNonBillableInRequisition(item)) return 0;
      return (getExtraDispenseQty(item) / safePackSize(item?.packSize ?? item?.pack_size)) * toNonNegativeNumber(item?.price);
    };

    // สำหรับ Dashboard: “เบิกเพิ่มจากของจริง” = ส่วนที่เกิดจากการกรอกคงเหลือจริงเท่านั้น
    // ไม่รวมเครดิตเป็นมูลค่า และไม่รวมการเพิ่มเองที่ไม่ได้เกิดจาก actual stock reconciliation
    const getActualStockExtraQty = (item) => {
      if (isNonBillableInRequisition(item) || !item?.actualStockTouched) return 0;
      const baseline = getSystemSuggestedQty(item);
      const actualSuggested = toNonNegativeNumber(item?.currentSuggestedQty ?? item?.finalRequestedQty ?? item?.dispenseQty);
      const finalQty = toNonNegativeNumber(item?.dispenseQty ?? item?.finalRequestedQty);
      const attributableFinal = Math.min(finalQty, actualSuggested);
      return Math.max(0, attributableFinal - baseline);
    };

    const getActualStockExtraValue = (item) => {
      if (isNonBillableInRequisition(item)) return 0;
      return (getActualStockExtraQty(item) / safePackSize(item?.packSize ?? item?.pack_size)) * toNonNegativeNumber(item?.price);
    };

    const getAnalyticsSource = (item) => {
      if (item?.manualAdded) return 'manual_add';
      return safeText(item?.usageSource || item?.usage_source || (toNonNegativeNumber(item?.usage) > 0 ? 'legacy' : 'none'));
    };

    const formatUnitPrice = (value) => toNonNegativeNumber(value).toLocaleString(undefined, {
      minimumFractionDigits: 0,
      maximumFractionDigits: 4
    });


    const formatAppDateTime = (value) => {
      if (!value) return '-';
      try {
        const d = typeof value?.toDate === 'function'
          ? value.toDate()
          : value?.seconds
            ? new Date(Number(value.seconds) * 1000)
            : new Date(value);
        if (!Number.isFinite(d.getTime())) return safeText(value, '-');
        return d.toLocaleString('th-TH', { dateStyle:'short', timeStyle:'short' });
      } catch(e) { return safeText(value, '-'); }
    };

    const buildRequisitionId = (hospitalId, month, year) => {
      const hosp = String(hospitalId || 'UNKNOWN').replace(/[^A-Za-z0-9_-]/g, '_');
      return `REQ-${year}-${String(month).padStart(2, '0')}-${hosp}`;
    };

    const buildTrackingId = (prefix, refId) => {
      const d = new Date();
      const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
      return `${prefix}-${ymd}-${String(refId || '').slice(0,8).toUpperCase()}`;
    };

    const makeActionToken = () => {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
      return `${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
    };

    const buildAuditPayload = (actor, action, targetType, targetId, details = {}) => ({
      action,
      target_type: targetType,
      target_id: String(targetId || ''),
      actor_uid: actor?.uid || auth.currentUser?.uid || '',
      actor_name: actor?.name || auth.currentUser?.email || 'Unknown',
      actor_role: actor?.role || '',
      actor_hospital_id: actor?.hospital_id || '',
      details: JSON.parse(JSON.stringify(details || {})),
      schema_version: APP_SCHEMA_VERSION,
      created_at: firebase.firestore.FieldValue.serverTimestamp()
    });

    const addAuditToBatch = (batch, actor, action, targetType, targetId, details = {}) => {
      const ref = db.collection('audit_logs').doc();
      batch.set(ref, buildAuditPayload(actor, action, targetType, targetId, details));
      return ref;
    };

    const writeAuditLog = async (actor, action, targetType, targetId, details = {}) => {
      try {
        await db.collection('audit_logs').add(buildAuditPayload(actor, action, targetType, targetId, details));
      } catch (err) {
        console.warn('Audit log failed:', err);
      }
    };

    const executeBatchChunks = async (operations) => {
      for (let i = 0; i < operations.length; i += MAX_BATCH_WRITES) {
        const batch = db.batch();
        operations.slice(i, i + MAX_BATCH_WRITES).forEach(op => {
          if (op.type === 'set') batch.set(op.ref, op.data, op.options || { merge: true });
          else if (op.type === 'update') batch.update(op.ref, op.data);
          else if (op.type === 'delete') batch.delete(op.ref);
          else throw new Error(`Unknown batch operation: ${op.type}`);
        });
        await batch.commit();
      }
    };

    const fileToBase64 = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('ไม่สามารถอ่านไฟล์ที่แนบได้'));
      reader.onload = () => {
        const result = String(reader.result || '');
        const comma = result.indexOf(',');
        resolve(comma >= 0 ? result.slice(comma + 1) : result);
      };
      reader.readAsDataURL(file);
    });

    const fetchWithTimeout = async (url, options = {}, timeoutMs = 30000) => {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    };

    const Toast = ({ message, type, onClose }) => {
      useEffect(() => {
        const timer = setTimeout(onClose, 3000);
        return () => clearTimeout(timer);
      }, [onClose]);
      const bgColor = type === 'error' ? 'bg-red-500' : 'bg-emerald-500';
      return (
        <div className={`fixed top-6 right-6 ${bgColor} text-white px-6 py-4 rounded-xl shadow-2xl flex items-center z-[250] animate-fade-in font-medium`}>
          <i className={`fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} mr-3 text-xl`}></i>
          {message}
        </div>
      );
    };

    const Modal = ({ title, children, onClose, isOpen, maxWidth }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in py-10">
          <div className={`bg-white rounded-2xl shadow-2xl w-full ${maxWidth || 'max-w-2xl'} overflow-hidden flex flex-col max-h-full`}>
            <div className="p-5 border-b flex justify-between items-center bg-slate-50 shrink-0">
              <h3 className="text-xl font-bold text-slate-800">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-red-500 transition bg-white border border-slate-200 rounded-full w-8 h-8 flex items-center justify-center shadow-sm">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>
            <div className="p-6 overflow-y-auto">{children}</div>
          </div>
        </div>
      );
    };


    const getUploadPeriodLabel = (month, year) => {
      const endMonth = Number(month);
      const endYear = Number(year);
      let startMonth = endMonth - 1;
      let startYear = endYear;
      if (startMonth <= 0) { startMonth = 12; startYear -= 1; }
      return `21 ${THAI_MONTHS[startMonth-1]} ${startYear+543} - 20 ${THAI_MONTHS[endMonth-1]} ${endYear+543}`;
    };

    const formatExpiryDateThai = (value) => {
      const raw = safeText(value);
      if (!raw) return '-';
      const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return raw;
      return `${m[3]}/${m[2]}/${Number(m[1])+543}`;
    };

    const TargetStockHelpModal = ({ data, onClose }) => {
      if (!data) return null;
      const item = data.item || {};
      const drug = data.drug || {};
      const pack = safePackSize(item.packSize ?? drug.pack_size);
      // ชื่อหน่วยจริงอ้างจาก Master Unit เช่น เม็ด, แคปซูล, ขวด
      const drugUnit = safeText(data.unitName || item.unit || drug.unit_id || 'หน่วย') || 'หน่วย';
      const usage = toNonNegativeNumber(item.usage);
      const target = toNonNegativeNumber(item.targetVMI);
      const credit = Math.max(0, toSafeNumber(item.systemStock ?? (toSafeNumber(item.prevExcess) - usage)));
      const suggested = toNonNegativeNumber(item.currentSuggestedQty ?? item.systemSuggestedQty ?? item.dispenseQty);
      const fullUnits = Math.floor(suggested / pack);
      const remainder = suggested % pack;
      const canSplit = !!(item.isUnpacked ?? drug.unpacked);
      const suggestionText = suggested <= 0
        ? `0 หน่วย`
        : (canSplit && remainder > 0
            ? `${fullUnits.toLocaleString()} หน่วย กับอีก ${remainder.toLocaleString()} ${drugUnit}`
            : `${Math.ceil(suggested / pack).toLocaleString()} หน่วย`);

      return (
        <Modal title="อธิบาย Target Stock" isOpen={true} onClose={onClose} maxWidth="max-w-md">
          <div className="space-y-3 text-sm leading-relaxed">
            <div className="font-black text-slate-800 text-base">{item.name || drug.drug_name || '-'}</div>
            <div className="bg-slate-50 rounded-xl border border-slate-200 divide-y divide-slate-200">
              <div className="px-4 py-3">ขนาดบรรจุ <b>{pack.toLocaleString()} {drugUnit} / หน่วย</b></div>
              <div className="px-4 py-3">ยอดใช้เดือนนี้ <b>{usage.toLocaleString()} {drugUnit}</b></div>
              <div className="px-4 py-3 bg-emerald-50"><b>Target Stock ที่ควรมี {target.toLocaleString()} {drugUnit}</b></div>
              <div className="px-4 py-3">ยอดเครดิต/ยาเหลือ <b>{credit.toLocaleString()} {drugUnit}</b></div>
              <div className="px-4 py-3">ปริมาณที่แนะนำให้เบิกคือ <b className="text-indigo-700">{suggestionText}</b>{canSplit ? <span className="text-xs text-slate-400 ml-1">(แตกหน่วยได้)</span> : null}</div>
            </div>
          </div>
        </Modal>
      );
    };

    const UniversalConfirmModal = ({ confirmDialog, setConfirmDialog }) => {
      if (!confirmDialog) return null;
      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[200] px-4 animate-fade-in">
          <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <div className="flex items-center text-slate-800 mb-4">
              <i className={`fa-solid ${confirmDialog.icon || 'fa-circle-question'} text-3xl mr-3 ${confirmDialog.iconColor || 'text-indigo-500'}`}></i>
              <h3 className="text-xl font-bold">{confirmDialog.title}</h3>
            </div>
            <p className="text-slate-500 mb-6">{confirmDialog.message}</p>
            <div className="flex justify-end gap-3">
              <button onClick={() => { if (typeof confirmDialog.onCancel === 'function') confirmDialog.onCancel(); setConfirmDialog(null); }} className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200">{confirmDialog.cancelText || 'ยกเลิก'}</button>
              <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className={`px-4 py-2 text-white rounded-xl font-bold shadow-lg ${confirmDialog.confirmBtnClass || 'bg-indigo-600 hover:bg-indigo-700'}`}>
                {confirmDialog.confirmText || 'ยืนยัน'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    const FullScreenSpinner = () => (
      <div className="fixed inset-0 z-[300] bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center animate-fade-in">
        <div className="loader mb-4 border-t-emerald-400 border-4 border-white/20 w-16 h-16"></div>
        <p className="text-white font-bold text-lg tracking-wider animate-pulse">กำลังประมวลผล กรุณารอสักครู่...</p>
      </div>
    );

    const LoginView = ({ ctx }) => {
      const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
      const [rememberMe, setRememberMe] = useState(true); const [showForgot, setShowForgot] = useState(false);
      const [forgotEmail, setForgotEmail] = useState('');

      const handleForgot = async () => {
        if(!forgotEmail) return ctx.showToast('กรุณากรอกอีเมล', 'error');
        try { await auth.sendPasswordResetEmail(forgotEmail); ctx.showToast('ส่งลิงก์ไปที่อีเมลแล้ว'); setShowForgot(false); } catch(e) { ctx.showToast(e.message, 'error'); }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100 w-full">
          <div className="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md border border-slate-100">
            <div className="flex flex-col items-center mb-8">
              <div className="bg-gradient-main p-4 rounded-2xl text-white mb-4 shadow-lg"><i className="fa-solid fa-truck-medical text-3xl"></i></div>
              <h1 className="text-3xl font-extrabold text-slate-800">Sawee Rxfill</h1>
              <p className="text-slate-500 text-sm mt-1">ระบบเติมยาและเวชภัณฑ์ VMI</p>
            </div>
            <div className="space-y-5">
              <input type="email" autoComplete="email" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} />
              <input type="password" autoComplete="current-password" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && ctx.handleLogin(email, password, rememberMe)} />
              <label className="flex items-center text-sm text-slate-600 cursor-pointer"><input type="checkbox" className="mr-2 w-4 h-4 text-emerald-600 rounded" checked={rememberMe} onChange={e => setRememberMe(e.target.checked)} />จดจำการเข้าสู่ระบบ</label>
              <button onClick={() => ctx.handleLogin(email, password, rememberMe)} className="w-full bg-gradient-main text-white rounded-xl p-4 font-bold hover:opacity-90 shadow-lg">เข้าสู่ระบบ</button>
            </div>
            <div className="mt-6 flex justify-between text-sm">
              <button onClick={() => ctx.setCurrentView('register')} className="text-emerald-600 font-semibold hover:underline">ลงทะเบียนผู้ใช้ใหม่</button>
              <button onClick={() => setShowForgot(true)} className="text-slate-500 font-semibold hover:underline">ลืมรหัสผ่าน?</button>
            </div>
          </div>
          {showForgot && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 px-4">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                <h3 className="text-xl font-bold text-slate-800 mb-2">รีเซ็ตรหัสผ่าน</h3>
                <input type="email" className="w-full border p-3 mb-4 rounded-lg outline-none" placeholder="อีเมล" value={forgotEmail} onChange={e => setForgotEmail(e.target.value)} />
                <div className="flex justify-end gap-3">
                  <button onClick={() => setShowForgot(false)} className="px-4 py-2 bg-slate-100 rounded-lg">ยกเลิก</button>
                  <button onClick={handleForgot} className="px-4 py-2 bg-emerald-600 text-white rounded-lg">ส่งลิงก์</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

const RegisterView = ({ ctx }) => {
      const [formData, setFormData] = useState({ email: '', password: '', name: '', position: '', hospitalId: '' });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [hospList, setHospList] = useState([]);
      const [isLoadingHosp, setIsLoadingHosp] = useState(true);

      // ⭐️ [NOTE สำหรับแก้ปัญหารายชื่อ รพ.สต. ถาวร]
      // 1. ระบบจะดึงข้อมูลทันทีที่โหลดหน้าลงทะเบียน (แม้ยังไม่ Login)
      // 2. หากรายชื่อยังไม่ขึ้น แปลว่าฐานข้อมูล Firestore บล็อกการดึงข้อมูลก่อน Login 
      // 3. วิธีแก้ที่ Firebase: ไปที่เมนู Firestore Database -> Rules -> เพิ่มบรรทัดนี้:
      //    match /master_hospitals/{document} { allow read: if true; }
      useEffect(() => {
        const fetchHospitals = async () => {
          try {
             const snap = await db.collection('master_hospitals').get();
             const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
             setHospList(list);
          } catch (err) {
             console.error("Fetch hospitals error:", err);
             ctx.showToast('ไม่สามารถดึงรายชื่อ รพ.สต. ได้ (โปรดเช็คสิทธิ์ Firebase Rules)', 'error');
          } finally {
             setIsLoadingHosp(false);
          }
        };
        fetchHospitals();
      }, []);

      const handleRegister = async () => {
        const email = safeText(formData.email).toLowerCase();
        const password = String(formData.password || '');
        const name = safeText(formData.name);
        const position = safeText(formData.position);
        const hospitalId = safeText(formData.hospitalId);

        if(!hospitalId || !name || !position || !email || !password) return ctx.showToast('กรุณากรอกข้อมูลให้ครบ', 'error');
        if(password.length < 6) return ctx.showToast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
        if(!hospList.some(h => String(h.hospital_id) === hospitalId)) return ctx.showToast('รพ.สต. ที่เลือกไม่ถูกต้อง', 'error');

        setIsSubmitting(true);
        let userCredential = null;
        if (ctx.registrationInProgressRef) ctx.registrationInProgressRef.current = true;
        try {
          userCredential = await auth.createUserWithEmailAndPassword(email, password);
          try {
            await db.collection('users').doc(userCredential.user.uid).set({
              email,
              name,
              position,
              hospital_id: hospitalId,
              role: 'hospital',
              active: true,
              schema_version: APP_SCHEMA_VERSION,
              created_at: firebase.firestore.FieldValue.serverTimestamp(),
              updated_at: firebase.firestore.FieldValue.serverTimestamp()
            });
            await writeAuditLog({ uid: userCredential.user.uid, name, role: 'hospital', hospital_id: hospitalId }, 'USER_REGISTER', 'users', userCredential.user.uid, { email });
          } catch (profileError) {
            // createUserWithEmailAndPassword จะล็อกอิน user ใหม่ทันที จึง rollback Auth หากสร้าง profile ไม่สำเร็จ
            try { await userCredential.user.delete(); } catch (rollbackError) { console.warn('Auth rollback failed:', rollbackError); }
            throw new Error('สร้างบัญชีเข้าสู่ระบบได้ แต่บันทึกข้อมูลผู้ใช้ไม่สำเร็จ ระบบได้ยกเลิกบัญชีที่สร้างใหม่แล้ว: ' + profileError.message);
          }
          await auth.signOut();
          ctx.showToast('ลงทะเบียนสำเร็จ กรุณาล็อกอิน');
          ctx.setCurrentView('login');
        } catch (error) {
          let errorMsg = error.message;
          if (error.code === 'auth/email-already-in-use') errorMsg = 'อีเมลนี้มีในระบบแล้ว';
          else if (error.code === 'auth/weak-password') errorMsg = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
          else if (error.code === 'auth/invalid-email') errorMsg = 'รูปแบบอีเมลไม่ถูกต้อง';
          ctx.showToast('ลงทะเบียนไม่สำเร็จ: ' + errorMsg, 'error');
        } finally {
          if (ctx.registrationInProgressRef) ctx.registrationInProgressRef.current = false;
          setIsSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100 w-full">
          <div className="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md">
            <h2 className="text-2xl font-bold mb-6 text-center text-slate-800">ลงทะเบียนเข้าใช้งาน</h2>
            <div className="space-y-4">
              <input type="text" className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="คำนำหน้า ชื่อ-นามสกุล (เต็ม)" onChange={e => setFormData({...formData, name: e.target.value})} />
              <input type="text" className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="ตำแหน่ง (บังคับ)" onChange={e => setFormData({...formData, position: e.target.value})} />
              
              <select className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" onChange={e => setFormData({...formData, hospitalId: e.target.value})} disabled={isLoadingHosp}>
                <option value="">{isLoadingHosp ? 'กำลังโหลดรายชื่อ รพ.สต...' : '-- เลือก รพ.สต. ที่สังกัด --'}</option>
                {hospList.map(h => <option key={h.hospital_id} value={h.hospital_id}>{h.hospital_name}</option>)}
              </select>

              <input type="email" autoComplete="email" className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="อีเมล (ใช้ล็อกอิน)" onChange={e => setFormData({...formData, email: e.target.value})} />
              <input type="password" autoComplete="new-password" className="w-full bg-slate-50 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="รหัสผ่าน" onChange={e => setFormData({...formData, password: e.target.value})} />
              <button onClick={handleRegister} disabled={isSubmitting || isLoadingHosp} className="w-full bg-gradient-main text-white rounded-xl p-4 font-bold shadow-lg mt-4 disabled:opacity-50">{isSubmitting ? 'กำลังบันทึก...' : 'ยืนยันลงทะเบียน'}</button>
              <button onClick={() => ctx.setCurrentView('login')} className="w-full text-slate-500 mt-2 hover:underline">กลับหน้าล็อกอิน</button>
            </div>
          </div>
        </div>
      );
    };
    const ProfileEditView = ({ ctx }) => {
      const [formData, setFormData] = useState({ name: ctx.currentUser?.name || '', position: ctx.currentUser?.position || '' });
      const [isSaving, setIsSaving] = useState(false);
      const handleSave = async () => {
        if(!formData.name || !formData.position) return ctx.showToast('กรุณากรอกข้อมูลให้ครบ', 'error');
        setIsSaving(true);
        try {
          const payload = { name: safeText(formData.name), position: safeText(formData.position), updated_at: firebase.firestore.FieldValue.serverTimestamp() };
          await db.collection('users').doc(ctx.currentUser.uid).update(payload);
          await writeAuditLog(ctx.currentUser, 'USER_PROFILE_UPDATE', 'users', ctx.currentUser.uid, { name: payload.name, position: payload.position });
          await ctx.refreshData(); 
          ctx.showToast('อัปเดตข้อมูลส่วนตัวแล้ว'); ctx.setCurrentView('dashboard');
        } catch(e) { ctx.showToast(e.message, 'error'); } finally { setIsSaving(false); }
      };
      return (
        <div className="bg-white rounded-2xl shadow-sm p-8 border max-w-lg mx-auto mt-10">
          <h2 className="text-2xl font-bold mb-6">แก้ไขข้อมูลส่วนตัว</h2>
          <div className="space-y-4">
              <div><label className="text-sm font-bold text-slate-600">ชื่อ-นามสกุล</label><input type="text" className="w-full border p-3 rounded-lg outline-none mt-1" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} /></div>
              <div><label className="text-sm font-bold text-slate-600">ตำแหน่ง</label><input type="text" className="w-full border p-3 rounded-lg outline-none mt-1" value={formData.position} onChange={e=>setFormData({...formData, position: e.target.value})} /></div>
              <div><label className="text-sm font-bold text-slate-600">รพ.สต. (แก้ไขผ่าน Admin)</label><input type="text" disabled className="w-full border p-3 rounded-lg bg-slate-100 text-slate-50 mt-1" value={ctx.appDb.hospitals.find(h=>h.hospital_id===ctx.currentUser?.hospital_id)?.hospital_name || ctx.currentUser?.hospital_id} /></div>
          </div>
          <div className="flex justify-end gap-3 mt-8">
             <button onClick={()=>ctx.setCurrentView('dashboard')} className="px-6 py-2 bg-slate-100 rounded-xl font-bold text-slate-600">ยกเลิก</button>
             <button onClick={handleSave} disabled={isSaving} className="px-8 py-2 bg-emerald-600 text-white rounded-xl font-bold">{isSaving ? 'กำลังบันทึก...' : 'บันทึก'}</button>
          </div>
        </div>
      )
    };

    const DashboardView = ({ ctx }) => {
      const isHospital = ctx.currentUser?.role === 'hospital';
      const isAdmin = ctx.currentUser?.role === 'admin';
      
      const [adminSelectedCard, setAdminSelectedCard] = useState('pending');

      const myReqs = isHospital ? ctx.appDb.requisitions.filter(r => r.hospitalId === ctx.currentUser?.hospital_id) : ctx.appDb.requisitions;
      const validReqs = myReqs.filter(r => !r.id.startsWith('HIST-'));

      const today = new Date();
      const currentDay = today.getDate();
      const sourceMonth = today.getMonth() + 1;
      const sourceYear = today.getFullYear();
      const roundPeriod = getNextCalendarPeriod(sourceMonth, sourceYear);
      const currentMonth = roundPeriod.month;
      const currentYear = roundPeriod.year;
      const isRequisitionPeriod = currentDay >= 20 && currentDay <= 31;

      const currentMonthReq = isHospital ? validReqs.find(r => Number(r.month) === currentMonth && Number(r.year) === currentYear) : null;
      
      const [adminFilterMonth, setAdminFilterMonth] = useState(currentMonth);
      const [adminFilterYear, setAdminFilterYear] = useState(currentYear);

      const openReqFromDashboard = (req) => {
        if (!req) return;
        // ฝั่ง รพ.สต. ใช้ editor กระดาษหน้าเดียวเสมอจนกว่าจะพิมพ์/ถูกล็อก
        if (!isAdmin && !req.is_printed && ['Draft','Pending','Rejected'].includes(req.status)) {
          ctx.setEditReqId(req.id);
          ctx.setCurrentView('create_req');
          return;
        }
        ctx.setCurrentReqId(req.id);
        ctx.setCurrentView('view_req');
      };

      const handleReqAction = () => {
        if (!currentMonthReq) { ctx.setEditReqId(null); ctx.setCurrentView('create_req'); return; }
        // พิมพ์แล้ว = เอกสารถูก freeze ห้ามกลับเข้า editor แต่ยังเปิดดู/พิมพ์ซ้ำได้
        if (currentMonthReq.is_printed) {
          ctx.setCurrentReqId(currentMonthReq.id);
          ctx.setEditReqId(null);
          ctx.setCurrentView('view_req');
          return;
        }
        // รองรับ Draft เก่าที่อาจเคยสร้างจากรุ่นทดสอบ แต่ v4.3 จะไม่สร้าง Draft ใหม่อีก
        if (['Draft','Pending','Rejected'].includes(currentMonthReq.status)) { ctx.setEditReqId(currentMonthReq.id); ctx.setCurrentView('create_req'); }
      };

      const handleAdminUploadForHosp = (hospId) => {
        ctx.setTargetUploadHosp(hospId);
        ctx.setCurrentView('create_req');
      };

      return (
        <div className="space-y-8 animate-fade-in w-full">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-end bg-white p-6 rounded-2xl shadow-sm border border-slate-100 gap-4 w-full">
            <div>
              <h2 className="text-3xl font-extrabold text-slate-800">ภาพรวมระบบเติมยา VMI</h2>
              <p className="text-slate-500 mt-1 text-lg">สวัสดี, <span className="font-semibold text-emerald-600">{ctx.currentUser?.name || 'ผู้ใช้งาน'}</span></p>
              {isHospital && <p className="text-sm text-slate-400 mt-1"><i className="fa-solid fa-location-dot"></i> {ctx.appDb.hospitals.find(h=>h.hospital_id === ctx.currentUser?.hospital_id)?.hospital_name || ctx.currentUser?.hospital_id}</p>}
            </div>
            <div className="space-x-3 flex flex-wrap gap-y-2">
              {isAdmin && <button onClick={() => ctx.setCurrentView('item_usage_report')} className="bg-sky-100 text-sky-700 border border-sky-200 px-6 py-3 rounded-xl font-bold shadow-sm hover:bg-sky-200 transition"><i className="fa-solid fa-ranking-star mr-2"></i> รายงานการใช้ยารายตัว</button>}
              {isAdmin && <button onClick={() => ctx.setCurrentView('summary_report')} className="bg-indigo-100 text-indigo-700 border border-indigo-200 px-6 py-3 rounded-xl font-bold shadow-sm hover:bg-indigo-200 transition"><i className="fa-solid fa-chart-bar mr-2"></i> รายงานสรุปยอด</button>}
              {isHospital && <button onClick={() => ctx.setCurrentView('my_stock')} className="bg-white border-2 border-emerald-500 text-emerald-600 px-6 py-3 rounded-xl font-bold hover:bg-emerald-50 transition"><i className="fa-solid fa-boxes-stacked mr-2"></i> คลังยาของฉัน (My Stock)</button>}
              {isHospital && (
                <button 
                  onClick={handleReqAction} 
                  disabled={currentMonthReq && ['Completed','Approving','ApprovalFailed'].includes(currentMonthReq.status)}
                  className={`px-6 py-3 rounded-xl font-bold shadow-lg transition flex items-center ${currentMonthReq && ['Completed','Approving','ApprovalFailed'].includes(currentMonthReq.status) ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : currentMonthReq?.is_printed ? 'bg-slate-700 text-white hover:bg-slate-800' : currentMonthReq && ['Draft','Pending'].includes(currentMonthReq.status) ? 'bg-amber-500 text-white hover:bg-amber-600 shadow-amber-200' : currentMonthReq && currentMonthReq.status === 'Rejected' ? 'bg-red-500 text-white hover:bg-red-600 shadow-red-200' : 'bg-gradient-main text-white hover:scale-105 shadow-emerald-200'}`}
                >
                  {currentMonthReq?.status === 'Completed' ? <><i className="fa-solid fa-lock mr-2"></i> เบิกแล้ว (รอรอบหน้า)</> :
                   currentMonthReq?.status === 'Approving' ? <><i className="fa-solid fa-spinner fa-spin mr-2"></i> ห้องยากำลังอนุมัติ</> :
                   currentMonthReq?.status === 'ApprovalFailed' ? <><i className="fa-solid fa-triangle-exclamation mr-2"></i> รอห้องยาแก้การอนุมัติ</> :
                   currentMonthReq?.is_printed ? <><i className="fa-solid fa-print mr-2"></i> พิมพ์แล้ว (ล็อกแก้ไข)</> :
                   currentMonthReq?.status === 'Rejected' ? <><i className="fa-solid fa-rotate-right mr-2"></i> แก้ไขและส่งใหม่</> :
                   ['Draft','Pending'].includes(currentMonthReq?.status) ? <><i className="fa-solid fa-pen mr-2"></i> แก้ไข/ตรวจสอบรอบนี้</> :
                   <><i className="fa-solid fa-boxes-packing mr-2"></i> ทำเรื่องเติมยา</>}
                </button>
              )}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-6 w-full">
            {isHospital && (
               <div onClick={handleReqAction} className={`rounded-2xl shadow-sm p-6 border flex items-center cursor-pointer transition bg-white hover:bg-slate-50 ${isRequisitionPeriod ? 'border-emerald-500 ring-2 ring-emerald-200' : 'border-slate-200'}`}>
                 <div className={`p-4 rounded-xl mr-4 ${isRequisitionPeriod ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'}`}><i className="fa-regular fa-calendar-check text-2xl"></i></div>
                 <div>
                    <div className="text-slate-500 font-medium">ปฏิทินเบิกยา (วันที่ 20-31)</div>
                    {isRequisitionPeriod ? <div className="text-xl font-extrabold text-emerald-600">เปิดการเบิก</div> : <div className="text-xl font-bold text-slate-400">ยังไม่ถึงช่วงเบิก</div>}
                 </div>
               </div>
            )}
            {!isHospital && (
               <div onClick={() => setAdminSelectedCard('month')} className={`rounded-2xl shadow-sm p-6 border flex items-center cursor-pointer transition bg-white hover:bg-slate-50 ${adminSelectedCard === 'month' ? 'ring-2 ring-indigo-500 border-indigo-500' : 'border-slate-200'}`}>
                 <div className="bg-indigo-100 p-4 rounded-xl text-indigo-600 mr-4"><i className="fa-regular fa-calendar-check text-2xl"></i></div>
                 <div><div className="text-slate-500 font-medium">สถานะรอบ {THAI_MONTHS[currentMonth-1]}</div><div className="text-xl font-extrabold text-indigo-600">ตรวจสอบการส่ง</div></div>
               </div>
            )}

            <div onClick={() => setAdminSelectedCard('all')} className={`bg-white rounded-2xl shadow-sm p-6 border flex items-center cursor-pointer transition ${adminSelectedCard==='all' ? 'ring-2 ring-blue-500 border-blue-500' : 'border-slate-100 hover:bg-slate-50'}`}>
              <div className="bg-blue-100 p-4 rounded-xl text-blue-600 mr-4"><i className="fa-solid fa-file-invoice text-2xl"></i></div>
              <div><div className="text-slate-500 font-medium">ประวัติทั้งหมด</div><div className="text-3xl font-extrabold">{validReqs.length}</div></div>
            </div>
            
            <div onClick={() => setAdminSelectedCard('pending')} className={`bg-white rounded-2xl shadow-sm p-6 border flex items-center cursor-pointer transition ${adminSelectedCard==='pending' ? 'ring-2 ring-amber-500 border-amber-500' : 'border-slate-100 hover:bg-slate-50'}`}>
              <div className="bg-amber-100 p-4 rounded-xl text-amber-600 mr-4"><i className="fa-solid fa-clock text-2xl"></i></div>
              <div><div className="text-slate-500 font-medium">รอห้องยาจัดยา</div><div className="text-3xl font-extrabold">{validReqs.filter(r => r.status === 'Pending').length}</div></div>
            </div>
            
            <div onClick={() => setAdminSelectedCard('completed')} className={`bg-white rounded-2xl shadow-sm p-6 border flex items-center cursor-pointer transition ${adminSelectedCard==='completed' ? 'ring-2 ring-emerald-500 border-emerald-500' : 'border-slate-100 hover:bg-slate-50'}`}>
              <div className="bg-emerald-100 p-4 rounded-xl text-emerald-600 mr-4"><i className="fa-solid fa-check-double text-2xl"></i></div>
              <div><div className="text-slate-500 font-medium">จัดยาแล้ว (Completed)</div><div className="text-3xl font-extrabold">{validReqs.filter(r => r.status === 'Completed').length}</div></div>
            </div>
          </div>

          {isAdmin && adminSelectedCard === 'month' && (
             <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden animate-fade-in w-full">
                <div className="p-5 border-b font-bold text-slate-800 bg-slate-50 flex flex-wrap justify-between items-center gap-4">
                  <div className="flex items-center"><i className="fa-solid fa-clipboard-list text-indigo-500 mr-2"></i> สถานะการเบิกประจำเดือน</div>
                  <div className="flex gap-2">
                    <select className="border border-slate-300 rounded p-1 outline-none" value={adminFilterMonth} onChange={e=>setAdminFilterMonth(Number(e.target.value))}>
                      {THAI_MONTHS.map((m, i) => <option key={i} value={i+1}>{m}</option>)}
                    </select>
                    <select className="border border-slate-300 rounded p-1 outline-none" value={adminFilterYear} onChange={e=>setAdminFilterYear(Number(e.target.value))}>
                      {[2024,2025,2026,2027].map(y => <option key={y} value={y}>{y+543}</option>)}
                    </select>
                  </div>
                </div>
                <div className="overflow-x-auto w-full">
                   <table className="w-full text-left text-sm whitespace-nowrap">
                      <thead className="bg-slate-100 border-b">
                         <tr><th className="p-3">รพ.สต.</th><th className="p-3">วันที่ส่ง</th><th className="p-3 text-center">สถานะการเบิก</th><th className="p-3 text-center">พิมพ์ใบเบิก?</th><th className="p-3 text-center">จัดการ (อัปโหลดแทน)</th></tr>
                      </thead>
                      <tbody>
                         {ctx.appDb.hospitals.map(h => {
                            const req = validReqs.find(r => r.hospitalId === h.hospital_id && r.month === adminFilterMonth && r.year === adminFilterYear);
                            const submitDate = req?.created_at ? new Date(req.created_at.seconds * 1000).toLocaleString('th-TH') : '-';
                            return (
                               <tr key={h.id} className="border-b hover:bg-slate-50">
                                  <td className="p-3 font-bold text-slate-700">{h.hospital_name}</td>
                                  <td className="p-3 text-slate-500">{submitDate}</td>
                                  <td className="p-3 text-center">
                                     {req ? (
                                        req.status === 'Completed' ? <span className="text-emerald-600 font-bold"><i className="fa-solid fa-check-circle"></i> จัดยาแล้ว</span> :
                                        req.status === 'Rejected' ? <span className="text-red-600 font-bold"><i className="fa-solid fa-circle-xmark"></i> ไม่อนุมัติ / รอแก้ไข</span> :
                                        req.status === 'ApprovalFailed' ? <span className="text-red-600 font-bold"><i className="fa-solid fa-triangle-exclamation"></i> อนุมัติไม่สำเร็จ</span> :
                                        req.status === 'Approving' ? <span className="text-blue-600 font-bold"><i className="fa-solid fa-spinner fa-spin"></i> กำลังอนุมัติ</span> :
                                        <span className="text-amber-500 font-bold"><i className="fa-solid fa-clock"></i> ส่งบิลแล้ว (รอจัด)</span>
                                     ) : <span className="text-slate-400">- ยังไม่ส่ง -</span>}
                                  </td>
                                  <td className="p-3 text-center">
                                     {req?.is_printed ? <span className="text-blue-600 font-bold"><i className="fa-solid fa-print"></i> พิมพ์แล้ว</span> : <span className="text-slate-300">-</span>}
                                  </td>
                                  <td className="p-3 text-center">
                                     {req ? (
                                        <button onClick={() => openReqFromDashboard(req)} className="bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-lg font-bold hover:bg-emerald-200 transition"><i className="fa-solid fa-folder-open mr-1"></i> เปิดดู</button>
                                     ) : (
                                        <button onClick={() => handleAdminUploadForHosp(h.hospital_id)} className="bg-indigo-600 text-white px-4 py-1.5 rounded-lg font-bold hover:bg-indigo-700 transition shadow"><i className="fa-solid fa-upload mr-1"></i> อัปโหลดแทน</button>
                                     )}
                                  </td>
                               </tr>
                            )
                         })}
                      </tbody>
                   </table>
                </div>
             </div>
          )}

          {(!isAdmin || (isAdmin && ['all','pending','completed'].includes(adminSelectedCard))) && (
             <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden animate-fade-in w-full">
               <div className="p-5 border-b border-slate-100 font-bold text-slate-800 bg-slate-50 flex justify-between items-center">
                 <span><i className="fa-solid fa-list-ul text-emerald-500 mr-2"></i> ประวัติการเติมยา {adminSelectedCard === 'pending' && <span className="text-red-500 ml-2">(แสดงเฉพาะที่รอจัด)</span>}</span>
               </div>
               <div className="overflow-x-auto w-full">
                 <table className="w-full text-left border-collapse whitespace-nowrap">
                   <thead>
                     <tr className="border-b text-sm text-slate-500 bg-white">
                       <th className="p-4 font-medium">รหัสเอกสาร</th>
                       <th className="p-4 font-medium">ผู้ทำรายการ</th>
                       <th className="p-4 font-medium">รอบบิล</th>
                       <th className="p-4 font-medium">สถานะ</th>
                       <th className="p-4 font-medium text-right">เอกสาร</th>
                     </tr>
                   </thead>
                   <tbody>
                     {validReqs.filter(r => {
                        if (!isAdmin) return true;
                        if (adminSelectedCard === 'all') return true;
                        if (adminSelectedCard === 'pending') return ['Draft','Pending'].includes(r.status);
                        if (adminSelectedCard === 'completed') return r.status === 'Completed';
                        return true;
                     }).slice(0,20).map(req => {
                       const isPendingHighlight = isAdmin && adminSelectedCard === 'pending';
                       return (
                          <tr key={req.id} className={`border-b transition cursor-pointer ${isPendingHighlight ? 'bg-amber-50 hover:bg-amber-100' : 'hover:bg-slate-50'}`} onClick={() => { ctx.setCurrentReqId(req.id); ctx.setCurrentView('view_req'); }}>
                            <td className="p-4 font-semibold text-slate-700">{req.id}</td>
                            <td className="p-4 text-slate-600">{req.created_by_name || '-'} {isAdmin && <span className="text-xs text-indigo-500 block">{ctx.appDb.hospitals.find(h=>h.hospital_id===req.hospitalId)?.hospital_name}</span>}</td>
                            <td className="p-4 text-slate-600">{req.month}/{req.year}</td>
                            <td className="p-4">
                              <span className={`px-3 py-1 rounded-lg text-xs font-bold ${req.status === 'Completed' ? 'bg-emerald-100 text-emerald-700' : req.status === 'Rejected' || req.status === 'ApprovalFailed' ? 'bg-red-100 text-red-700' : req.status === 'Approving' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}`}>
                                 {req.status === 'Completed' ? 'สำเร็จ' : req.status === 'Rejected' ? 'ไม่อนุมัติ' : req.status === 'ApprovalFailed' ? 'อนุมัติล้มเหลว' : req.status === 'Approving' ? 'กำลังอนุมัติ' : 'รอจัดยา'}
                               </span>
                            </td>
                            <td className="p-4 text-right flex justify-end gap-2">
                               {req.excel_url && (
                                  <a href={req.excel_url} target="_blank" rel="noopener noreferrer" className="text-emerald-600 bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 px-3 py-1.5 rounded-lg text-sm font-semibold transition flex items-center" onClick={(e) => e.stopPropagation()}>
                                    <i className="fa-solid fa-file-excel mr-1"></i> ดูไฟล์ รบ.301
                                  </a>
                               )}
                               {isAdmin && (req.status === 'Pending') ? (
                                  <button className="text-white bg-amber-500 hover:bg-amber-600 px-4 py-1.5 rounded-lg text-sm font-semibold transition shadow" onClick={(e) => { e.stopPropagation(); ctx.setCurrentReqId(req.id); ctx.setCurrentView('view_req'); }}>
                                    เปิดดู / จัดการ
                                  </button>
                               ) : (
                                  <button className="text-emerald-600 hover:text-emerald-800 bg-emerald-50 px-3 py-1.5 rounded-lg text-sm font-semibold transition" onClick={(e) => { e.stopPropagation(); openReqFromDashboard(req); }}>
                                    {!isAdmin && !req.is_printed && ['Draft','Pending','Rejected'].includes(req.status) ? 'แก้ไขใบเบิก' : 'เปิดดู'}
                                  </button>
                               )}
                            </td>
                          </tr>
                       )
                     })}
                     {validReqs.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-400">ไม่มีข้อมูลการเบิกยา</td></tr>}
                   </tbody>
                 </table>
               </div>
             </div>
          )}
        </div>
      );
    };

    // Component ใหม่: สำหรับหน้าจอคืนยา
const ReturnDrugView = ({ ctx }) => {
      const hospId = ctx.currentUser.hospital_id;
      const isAdmin = ctx.currentUser.role === 'admin';

      const [items, setItems] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [printData, setPrintData] = useState(null);
      
      const [returnTab, setReturnTab] = useState('new'); // ⭐️ แท็บ สลับหน้าคืนยา กับ หน้าประวัติ
      const [historyList, setHistoryList] = useState([]);

      useEffect(() => {
          const myBal = ctx.appDb.balances.filter(b => b.hospital_id === hospId);
          const list = myBal.map(b => {
              const drug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(b.drug_id));
              const unitObj = drug ? ctx.appDb.units.find(u => String(u.unit_id) === String(drug.unit_id)) : null;
              const unitName = unitObj ? unitObj.unit_name : (drug?.unit_id || '');
              return {
                  drugId: b.drug_id, name: drug ? drug.drug_name : 'N/A', unit: unitName,
                  packSize: drug ? Number(drug.pack_size) : 1, price: drug ? drug.price : 0,
                  currentBal: Number(b.excess_balance), actualBal: '', returnQty: 0, selected: false,
                  lotNo: '', expiryDate: ''
              };
          }).filter(i => i.currentBal > 0).sort((a,b) => a.drugId.localeCompare(b.drugId));
          setItems(list);
      }, [ctx.appDb.balances, hospId]);

      // ⭐️ โหลดประวัติเมื่อเปลี่ยนแท็บ
      useEffect(() => {
          if (returnTab === 'history') {
             db.collection('stock_returns').where('hospital_id', '==', hospId).get().then(snap => {
                 const data = snap.docs.map(d => d.data());
                 setHistoryList(data.sort((a,b) => (b.created_at?.seconds || 0) - (a.created_at?.seconds || 0)));
             });
          }
      }, [returnTab, hospId]);

      const handleActualChange = (drugId, val) => {
          const actual = val === '' ? '' : Number(val);
          setItems(prev => prev.map(item => {
              if (item.drugId === drugId) {
                  // ⭐️ ลบการจำกัดค่าสูงสุดออก กรอกเกินเครดิตได้
                  const returnQty = actual === '' ? 0 : Math.max(0, item.currentBal - actual);
                  return { ...item, actualBal: actual, returnQty, selected: returnQty > 0 };
              }
              return item;
          }));
      };

      const handleToggle = (drugId) => {
          setItems(prev => prev.map(item => item.drugId === drugId ? { ...item, selected: !item.selected } : item));
      };

      const handleReturnMetaChange = (drugId, field, value) => {
          setItems(prev => prev.map(item => item.drugId === drugId ? { ...item, [field]: value } : item));
      };

      const handleSubmit = async () => {
          const toReturn = items.filter(i => i.selected && toNonNegativeNumber(i.returnQty) > 0);
          if (toReturn.length === 0) return ctx.showToast('กรุณาเลือกรายการที่ต้องการคืนและระบุยอด', 'error');
          if (toReturn.some(i => !Number.isFinite(Number(i.actualBal)) || Number(i.actualBal) < 0)) return ctx.showToast('ยอดมีจริงต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป', 'error');

          setIsSubmitting(true);
          try {
              const returnRef = db.collection('stock_returns').doc();
              const returnId = buildTrackingId('RET', returnRef.id);
              const auditRef = db.collection('audit_logs').doc();

              const returnDoc = {
                  id: returnId,
                  hospital_id: hospId,
                  hospital_name: ctx.appDb.hospitals.find(h=>h.hospital_id === hospId)?.hospital_name || hospId,
                  created_by: ctx.currentUser.name,
                  created_by_uid: ctx.currentUser.uid,
                  created_at: firebase.firestore.FieldValue.serverTimestamp(),
                  items: toReturn.map(i => ({
                      drugId: i.drugId, name: i.name, unit: i.unit, packSize: safePackSize(i.packSize), price: toNonNegativeNumber(i.price),
                      currentBal: toNonNegativeNumber(i.currentBal), actualBal: toNonNegativeNumber(i.actualBal), returnQty: toNonNegativeNumber(i.returnQty),
                      lotNo: safeText(i.lotNo), expiryDate: safeText(i.expiryDate),
                      returnValue: (toNonNegativeNumber(i.returnQty) / safePackSize(i.packSize)) * toNonNegativeNumber(i.price)
                  })),
                  totalValue: toReturn.reduce((sum, i) => sum + ((toNonNegativeNumber(i.returnQty) / safePackSize(i.packSize)) * toNonNegativeNumber(i.price)), 0),
                  status: 'Completed',
                  schema_version: APP_SCHEMA_VERSION
              };

              await db.runTransaction(async (tx) => {
                  const balanceRefs = toReturn.map(i => db.collection('current_excess').doc(`${hospId}_${i.drugId}`));
                  const balanceSnaps = await Promise.all(balanceRefs.map(ref => tx.get(ref)));

                  balanceSnaps.forEach((snap, idx) => {
                      const item = toReturn[idx];
                      const latest = snap.exists ? toNonNegativeNumber(snap.data().excess_balance) : 0;
                      const screenBalance = toNonNegativeNumber(item.currentBal);
                      const qty = toNonNegativeNumber(item.returnQty);
                      if (Math.abs(latest - screenBalance) > 0.000001) {
                          throw new Error(`ยอด ${item.name} ถูกเปลี่ยนโดยผู้ใช้อื่นแล้ว (ล่าสุด ${latest}) กรุณารีเฟรชและทำรายการใหม่`);
                      }
                      if (qty > latest) throw new Error(`จำนวนคืน ${item.name} มากกว่ายอดล่าสุดในระบบ`);
                  });

                  tx.set(returnRef, returnDoc);
                  toReturn.forEach((item, idx) => {
                      const latest = toNonNegativeNumber(item.currentBal);
                      const qty = toNonNegativeNumber(item.returnQty);
                      tx.set(balanceRefs[idx], {
                          hospital_id: hospId,
                          drug_id: item.drugId,
                          excess_balance: Math.max(0, latest - qty),
                          last_updated: firebase.firestore.FieldValue.serverTimestamp()
                      }, { merge: true });
                  });
                  tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'STOCK_RETURN', 'stock_returns', returnId, {
                      hospital_id: hospId,
                      item_count: toReturn.length,
                      total_value: returnDoc.totalValue
                  }));
              });

              ctx.showToast('บันทึกการคืนยาสำเร็จ ระบบตัดสต๊อกเรียบร้อยแล้ว');
              await ctx.refreshData();
              setPrintData({...returnDoc, created_at_date: new Date()});
          } catch(e) { ctx.showToast(e.message, 'error'); } finally { setIsSubmitting(false); }
      };

      if (printData) {
          return (
              <div className="bg-white p-8 print:p-0 rounded-2xl print-safe-wrapper border shadow-sm relative">
                  <div className="no-print flex justify-between items-center mb-6 pb-4 border-b">
                      <h2 className="text-2xl font-bold text-slate-800">เอกสารการส่งคืนเวชภัณฑ์</h2>
                      <div className="flex gap-2">
                        <button onClick={() => setPrintData(null)} className="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold hover:bg-slate-300 transition">ปิดเอกสาร</button>
                        <button onClick={() => window.print()} className="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition"><i className="fa-solid fa-print mr-2"></i> พิมพ์ใบรับคืน</button>
                      </div>
                  </div>
                  <div className="print-area font-sarabun w-full">
                      <div className="text-center mb-6">
                          <h2 className="text-xl font-bold mb-1">ใบสรุปการส่งคืนยาและเวชภัณฑ์ระบบ VMI</h2>
                          <p>หน่วยงาน: {printData.hospital_name} | รหัสอ้างอิง: {printData.id}</p>
                          <p>ผู้ทำรายการ: {printData.created_by} | วันที่: {printData.created_at_date ? printData.created_at_date.toLocaleString('th-TH') : new Date(printData.created_at.seconds * 1000).toLocaleString('th-TH')}</p>
                      </div>
                      <table className="official-table w-full text-[12px] border-collapse border border-black mb-4">
                          <thead className="bg-slate-200">
                              <tr>
                                  <th className="p-2 border border-black w-12 text-center">ลำดับ</th>
                                  <th className="p-2 border border-black w-20 text-center">รหัสยา</th>
                                  <th className="p-2 border border-black text-left">รายการยา</th>
                                  <th className="p-2 border border-black text-center">หน่วย</th>
                                  <th className="p-2 border border-black text-right w-24">เครดิตเดิม (ย่อย)</th>
                                  <th className="p-2 border border-black text-right w-24">ยอดมีจริง (ย่อย)</th>
                                  <th className="p-2 border border-black text-right w-24">จำนวนส่งคืน (ย่อย)</th>
                                  <th className="p-2 border border-black text-center w-24">Lot</th>
                                  <th className="p-2 border border-black text-center w-24">วันหมดอายุ</th>
                                  <th className="p-2 border border-black text-right w-24">มูลค่า (บาท)</th>
                              </tr>
                          </thead>
                          <tbody>
                              {printData.items.map((it, idx) => (
                                  <tr key={idx}>
                                      <td className="p-2 border border-black text-center">{idx + 1}</td>
                                      <td className="p-2 border border-black text-center">{it.drugId}</td>
                                      <td className="p-2 border border-black text-left">{it.name}</td>
                                      <td className="p-2 border border-black text-center">{it.unit}</td>
                                      <td className="p-2 border border-black text-right">{it.currentBal}</td>
                                      <td className="p-2 border border-black text-right">{it.actualBal}</td>
                                      <td className="p-2 border border-black text-right font-bold text-red-600">{it.returnQty}</td>
                                      <td className="p-2 border border-black text-center">{it.lotNo || it.lot_no || '-'}</td>
                                      <td className="p-2 border border-black text-center">{formatExpiryDateThai(it.expiryDate || it.expiry_date)}</td>
                                      <td className="p-2 border border-black text-right">{(it.returnValue).toLocaleString(undefined, {minimumFractionDigits:2})}</td>
                                  </tr>
                              ))}
                          </tbody>
                          <tfoot>
                              <tr>
                                  <th colSpan="9" className="p-2 border border-black text-right">รวมมูลค่าส่งคืนทั้งสิ้น</th>
                                  <th className="p-2 border border-black text-right font-bold text-lg bg-gray-100">{printData.totalValue.toLocaleString(undefined, {minimumFractionDigits:2})}</th>
                              </tr>
                          </tfoot>
                      </table>
                      <div className="flex justify-between mt-10 text-center px-10">
                         <div>
                            <p>....................................................</p>
                            <p className="mt-1">( {printData.created_by} )</p>
                            <p className="mt-1">ผู้ส่งมอบ / รพ.สต.</p>
                         </div>
                         <div>
                            <p>....................................................</p>
                            <p className="mt-1">( .................................................... )</p>
                            <p className="mt-1">ผู้รับคืน / คลังยา</p>
                         </div>
                      </div>
                  </div>
              </div>
          );
      }

      const filteredItems = items.filter(d => d.name.toLowerCase().includes(searchTerm.toLowerCase()) || String(d.drugId).includes(searchTerm.toLowerCase()));

      return (
          <div className="bg-white rounded-2xl shadow-sm p-4 lg:p-8 animate-fade-in relative min-h-[80vh]">
             <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
               <div>
                 <h2 className="text-2xl font-bold text-slate-800"><i className="fa-solid fa-right-left text-red-500 mr-2"></i> ระบบเช็คสต็อกและคืนยา</h2>
                 <p className="text-slate-500 mt-1">ใส่ยอดมีจริงในคลัง ระบบจะคำนวณยอดคืนและตัดสต็อกให้ทันที</p>
               </div>
               <button onClick={() => ctx.setCurrentView('my_stock')} className="text-slate-400 hover:text-slate-600 bg-slate-100 px-4 py-2 rounded-xl font-medium">กลับหน้าคลังยา</button>
             </div>

             <div className="flex gap-2 mb-6">
                <button onClick={()=>setReturnTab('new')} className={`px-6 py-2 rounded-xl font-bold transition ${returnTab==='new'?'bg-red-600 text-white shadow-lg':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>ทำรายการคืนยา</button>
                <button onClick={()=>setReturnTab('history')} className={`px-6 py-2 rounded-xl font-bold transition ${returnTab==='history'?'bg-red-600 text-white shadow-lg':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>ประวัติส่งคืนย้อนหลัง</button>
             </div>

             {returnTab === 'new' ? (
                <>
                   <div className="flex justify-between items-center mb-4 gap-4">
                      <div className="relative w-full max-w-md">
                        <i className="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                        <input type="text" placeholder="ค้นหาชื่อยาเพื่อคืน..." className="w-full pl-10 pr-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-red-500" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} />
                      </div>
                      <button onClick={handleSubmit} disabled={isSubmitting} className="bg-red-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-red-200 hover:scale-105 transition shrink-0 disabled:opacity-50">
                        {isSubmitting ? 'กำลังบันทึก...' : <><i className="fa-solid fa-check mr-2"></i> บันทึกการคืนยาและออกใบเสร็จ</>}
                      </button>
                   </div>

                   <div className="overflow-x-auto border border-slate-200 rounded-xl w-full">
                     <table className="w-full text-left border-collapse whitespace-nowrap text-[13px]">
                       <thead className="bg-slate-100 text-slate-700 sticky top-0">
                         <tr>
                           <th className="p-3 font-bold border-b w-12 text-center">เลือก</th>
                           <th className="p-3 font-bold border-b">รหัส</th>
                           <th className="p-3 font-bold border-b">ชื่อรายการยา/เวชภัณฑ์</th>
                           <th className="p-3 text-center font-bold border-b">หน่วย</th>
                           <th className="p-3 text-center font-bold border-b text-blue-700 bg-blue-50">เครดิตที่มี</th>
                           <th className="p-3 text-center font-bold border-b bg-amber-50 text-amber-700">ยอดมีจริง (Input)</th>
                           <th className="p-3 text-center font-bold border-b text-red-700 bg-red-50">ผลการคำนวณ (ยอดคืน)</th>
                           <th className="p-3 text-center font-bold border-b">Lot <span className="text-[10px] font-normal text-slate-400">(ถ้ามี)</span></th>
                           <th className="p-3 text-center font-bold border-b">วันหมดอายุ <span className="text-[10px] font-normal text-slate-400">(ถ้ามี)</span></th>
                         </tr>
                       </thead>
                       <tbody>
                         {filteredItems.map((item) => (
                           <tr key={item.drugId} className={`border-b border-slate-200 transition ${item.selected ? 'bg-red-50' : 'hover:bg-slate-50'}`}>
                             <td className="p-3 text-center border-r border-slate-100">
                                <input type="checkbox" className="w-5 h-5 accent-red-600 cursor-pointer" checked={item.selected} onChange={() => handleToggle(item.drugId)} disabled={item.returnQty <= 0} />
                             </td>
                             <td className="p-3 font-mono text-slate-500">{item.drugId}</td>
                             <td className="p-3 font-bold text-slate-800">{item.name}</td>
                             <td className="p-3 text-center text-slate-600">{item.packSize} {item.unit}</td>
                             <td className="p-3 text-center font-bold text-blue-600 bg-blue-50/30">{item.currentBal}</td>
                             <td className="p-3 bg-amber-50/50 text-center relative w-32">
                               {/* ⭐️ เอา max ออก สามารถกรอกยอดเกินได้ */}
                               <input type="number" min="0" className="w-full bg-transparent border-b-2 border-amber-300 p-1 text-center font-bold text-amber-900 outline-none focus:bg-white focus:border-amber-600" value={item.actualBal} onChange={e => handleActualChange(item.drugId, e.target.value)} placeholder="ระบุยอดมีจริง" />
                             </td>
                             <td className="p-3 text-center font-extrabold text-red-600 bg-red-50/30 text-[15px]">
