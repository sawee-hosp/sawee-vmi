                         <div className="w-1/2"><label className="text-sm font-bold text-amber-600 mb-1 block">ระบุเครดิตใหม่</label><input type="number" name="new_balance" required className="w-full border-2 border-amber-400 p-3 rounded-xl outline-none focus:border-amber-600 font-bold text-amber-700" /></div>
                      </div>
                      <div><label className="text-sm font-bold text-slate-600 mb-1 block">เหตุผลการขอปรับ</label><textarea name="reason" required rows="2" className="w-full border p-3 rounded-xl outline-none" placeholder="เช่น ยาเสื่อมสภาพ, นับสต๊อกสิ้นเดือน, คีย์เบิกผิดรอบที่แล้ว..."></textarea></div>
                      <div className="pt-4 flex justify-end"><button type="submit" className="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold">ส่งคำขอ</button></div>
                   </form>
                )}
             </Modal>
          )}
        </div>
      );
    };

const CreateReqView = ({ ctx }) => {
      const hospId = ctx.targetUploadHosp || ctx.currentUser.hospital_id; 
      const isAdmin = ctx.currentUser.role === 'admin';
      const today = new Date();
      const hasExistingReq = !!ctx.editReqId;
      const editingReq = ctx.editReqId ? ctx.appDb.requisitions.find(r => r.id === ctx.editReqId) : null;

      // วันที่ 20-31 ของเดือน M = ใบเติมยาสำหรับรอบเดือน M+1
      // ถ้าเปิดใบเดิม ให้ยึด month/year ที่บันทึกในใบเดิม ไม่เลื่อนไปตามวันที่ปัจจุบัน
      const sourceMonth = today.getMonth() + 1;
      const sourceYear = today.getFullYear();
      const autoRoundPeriod = getNextCalendarPeriod(sourceMonth, sourceYear);
      const currentMonth = editingReq ? Number(editingReq.month) : autoRoundPeriod.month;
      const currentYear = editingReq ? Number(editingReq.year) : autoRoundPeriod.year;
      const usagePeriodEnd = getPreviousCalendarPeriod(currentMonth, currentYear);
      const uploadPeriodLabel = getUploadPeriodLabel(usagePeriodEnd.month, usagePeriodEnd.year);
      const requisitionFiscalYear = getFiscalInfo(currentMonth, currentYear).fiscalYear;
      
      const isOutOfPeriod = !isAdmin && (today.getDate() < 20 || today.getDate() > 31);
      const existingReqForMonth = ctx.appDb.requisitions.find(r =>
        String(r.hospitalId) === String(hospId) && Number(r.month) === currentMonth && Number(r.year) === currentYear && !String(r.id || '').startsWith('HIST-')
      );
      const duplicateCreateBlocked = !ctx.editReqId && !!existingReqForMonth;
      const duplicateCanBeDeleted = !!existingReqForMonth && (['Draft','Pending','Rejected'].includes(existingReqForMonth.status) || (isAdmin && existingReqForMonth.status === 'ApprovalFailed'));
      
      const [acknowledged, setAcknowledged] = useState(false);
      const [searchTerm, setSearchTerm] = useState(''); 
      const [filterType, setFilterType] = useState('all'); 
      const [showCalc, setShowCalc] = useState(false); 
      const [showInactive, setShowInactive] = useState(false);
      const [showChangedOnly, setShowChangedOnly] = useState(false);
      const [isDirty, setIsDirty] = useState(false);
      const dirtyRef = useRef(false);
      const [pendingLeaveAction, setPendingLeaveAction] = useState(null);
      const [requisitionTerm, setRequisitionTerm] = useState(() =>
        editingReq
          ? getEffectiveFiscalTerm(editingReq, ctx.appDb.requisitions)
          : getNextFiscalTerm(hospId, currentMonth, currentYear, ctx.appDb.requisitions)
      );
      
      const [excelFile, setExcelFile] = useState(null);
      const [uploadedExcelUrl, setUploadedExcelUrl] = useState(editingReq?.excel_url || '');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isProcessing, setIsProcessing] = useState(false);
      const [isRefreshingInvsPrice, setIsRefreshingInvsPrice] = useState(false);

      const [showImportModal, setShowImportModal] = useState(false);
      const [importData, setImportData] = useState({ hospInfo: '', periodInfo: '', isDateValid: true, items: [] });
      const [showZeroImport, setShowZeroImport] = useState(false);
      const [focusImportItemId, setFocusImportItemId] = useState(null);
      const fuzzyLearningRef = useRef(new Set());
      const fuzzyPermissionWarnedRef = useRef(false);
      
      const [manualAddSearch, setManualAddSearch] = useState('');
      const [manualAddCandidate, setManualAddCandidate] = useState(null);
      const [manualAddQty, setManualAddQty] = useState('');
      const [editingQtyDrugId, setEditingQtyDrugId] = useState(null);
      const [editingActualDrugId, setEditingActualDrugId] = useState(null);
      const [focusDrugId, setFocusDrugId] = useState(null);
      const [targetHelpData, setTargetHelpData] = useState(null);

      useEffect(() => {
        if (!editingReq?.is_printed) return;
        ctx.setCurrentReqId(editingReq.id);
        ctx.setEditReqId(null);
        ctx.forceSetCurrentView ? ctx.forceSetCurrentView('view_req') : ctx.setCurrentView('view_req');
      }, [editingReq?.id, editingReq?.is_printed]);

      useEffect(() => {
        const nextTerm = editingReq
          ? getEffectiveFiscalTerm(editingReq, ctx.appDb.requisitions)
          : getNextFiscalTerm(hospId, currentMonth, currentYear, ctx.appDb.requisitions);
        setRequisitionTerm(nextTerm);
      }, [editingReq?.id, hospId, currentMonth, currentYear]);

      const [items, setItems] = useState(() => {
        if (!ctx.appDb || !ctx.appDb.parLevels) return [];
        
        let existingReqItems = [];
        if (ctx.editReqId) {
           const reqToEdit = ctx.appDb.requisitions.find(r => r.id === ctx.editReqId);
           if (reqToEdit) existingReqItems = reqToEdit.items || [];
        }

        const myPars = ctx.appDb.parLevels.filter(p => String(p.hospital_id) === String(hospId));
        const generatedList = myPars.map(par => {
          const drug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(par.drug_id));
          const bal = ctx.appDb.balances.find(b => String(b.hospital_id) === String(hospId) && String(b.drug_id) === String(par.drug_id));
          
          const unitObj = drug ? ctx.appDb.units.find(u => String(u.unit_id) === String(drug.unit_id)) : null;
          const unitName = unitObj ? unitObj.unit_name : (drug?.unit_id || '');
          
          const existingItem = existingReqItems.find(ex => ex.drugId === par.drug_id);
          const prevExcess = bal ? Number(bal.excess_balance) : 0;
          const isUnpacked = drug ? !!drug.unpacked : false;
          const type = drug ? drug.type : '1';
          const price = drug ? toNonNegativeNumber(drug.price) : 0;
          const packSize = drug ? safePackSize(drug.pack_size) : 1;
          const dispenseStep = drug ? toNonNegativeNumber(drug.dispense_step, 0) : 0;
          const usageMultiplier = drug ? getUsageMultiplier(drug) : 1;
          const maximumQty = drug ? getMaximumQty(drug) : 0;
          const isDisabledForHospital = false;
          const isDiscontinued = isDrugDiscontinued(drug);
          const drugStatus = getDrugStatusText(drug);
          
          let m_usages = [];
          for(let i=1; i<=5; i++) {
            let m = currentMonth - i; let y = currentYear;
            if(m <= 0) { m += 12; y -= 1; }
            const key = getYearMonthKey(m, y);
            const hist = ctx.appDb.historicalUsages?.find(h => String(h.hospital_id) === String(hospId) && String(h.drug_id) === String(par.drug_id));
            const usage = (hist && hist.history && hist.history[key]) ? Number(hist.history[key]) : 0;
            m_usages.push(usage);
          }
          const pastHistory = m_usages.slice(0,5);

          if (existingItem) {
             return lockRequisitionItem({ ...existingItem, isUnpacked, type, price, packSize, dispenseStep, usageMultiplier, maximumQty, isDisabledForHospital, isDiscontinued, drugStatus, requestMore: existingItem.requestMore || 0, isUnlocked: true, pastHistory, actualStock: existingItem.actualStock ?? null, actualStockTouched: !!existingItem.actualStockTouched, systemSuggestedQty: getSystemSuggestedQty(existingItem), currentSuggestedQty: toNonNegativeNumber(existingItem.currentSuggestedQty ?? existingItem.systemSuggestedQty ?? getSystemSuggestedQty(existingItem)), finalRequestedQty: toNonNegativeNumber(existingItem.finalRequestedQty ?? existingItem.dispenseQty), manualQtyOverride: !!existingItem.manualQtyOverride, requestLess: toNonNegativeNumber(existingItem.requestLess) });
          }

          const isVaccine = type === '6';

          return {
            drugId: par.drug_id, name: drug ? drug.drug_name : 'N/A', unit: unitName,
            packSize, isUnpacked, type, price, dispenseStep, usageMultiplier, maximumQty, isDisabledForHospital, isDiscontinued, drugStatus, pastHistory,
            prevExcess, usage: 0, targetVMI: 0, 
            netNeed: 0, dispensePack: 0, dispenseQty: 0, 
            newExcess: prevExcess, isSpecial: false,
            requestMore: 0, requestLess: 0, isUnlocked: true, isNewDrug: true,
            actualStock: null, actualStockTouched: false, systemStock: prevExcess, systemSuggestedQty: 0, currentSuggestedQty: 0, finalRequestedQty: 0, manualQtyOverride: false, manualAdded: false, usageSource: 'none', importedUsageQty: 0, rawImportedUsageQty: 0, sourceRawNames: [], sourceImports: []
          };
        });

        existingReqItems.forEach(ex => {
           if(!generatedList.find(g => g.drugId === ex.drugId)) {
             const drug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(ex.drugId));
             const merged = {
               ...ex,
               packSize: safePackSize(drug?.pack_size ?? ex.packSize),
               isUnpacked: drug ? !!drug.unpacked : !!ex.isUnpacked,
               type: safeText(drug?.type ?? ex.type, '1') || '1',
               price: toNonNegativeNumber(drug?.price ?? ex.price),
               dispenseStep: toNonNegativeNumber(drug?.dispense_step ?? ex.dispenseStep ?? ex.dispense_step, 0),
               usageMultiplier: getUsageMultiplier(drug || ex),
               maximumQty: getMaximumQty(drug || ex),
               isDiscontinued: drug ? isDrugDiscontinued(drug) : !!ex.isDiscontinued,
               drugStatus: drug ? getDrugStatusText(drug) : safeText(ex.drugStatus),
               pastHistory: [0,0,0,0,0], requestMore: ex.requestMore || 0, requestLess: ex.requestLess || 0, isUnlocked: true, actualStock: ex.actualStock ?? null, actualStockTouched: !!ex.actualStockTouched, systemStock: ex.systemStock ?? (toSafeNumber(ex.prevExcess)-toNonNegativeNumber(ex.usage)), systemSuggestedQty: toNonNegativeNumber(ex.systemSuggestedQty ?? ex.netNeed), currentSuggestedQty: toNonNegativeNumber(ex.currentSuggestedQty ?? ex.systemSuggestedQty ?? ex.netNeed), finalRequestedQty: toNonNegativeNumber(ex.finalRequestedQty ?? ex.dispenseQty), manualQtyOverride: !!ex.manualQtyOverride
             };
             generatedList.push(lockRequisitionItem(merged));
           }
        });
        return generatedList.sort(sortDrugs);
      });

      const markDirty = () => { dirtyRef.current = true; setIsDirty(true); };
      const clearDirty = () => { dirtyRef.current = false; setIsDirty(false); };

      const calculateTargetForItem = (item, usage) => {
        const recent5 = item.pastHistory ? item.pastHistory.slice(0, 5) : [0,0,0,0,0];
        const activeUsages = [...recent5, toNonNegativeNumber(usage)].filter(u => u > 0);
        const count = activeUsages.length || 1;
        const mean = activeUsages.reduce((a,b)=>a+b, 0) / count;
        const variance = activeUsages.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / (count === 1 ? 1 : count - 1);
        return Math.ceil(mean + (1.645 * Math.sqrt(variance)));
      };

      // Working-sheet calculation: เก็บ "ระบบเสนอเดิม" แยกจาก "ยอดที่ผู้ใช้ขอจริง"
      const recalcWorkingItem = (rawItem, options = {}) => {
        const item = { ...rawItem };
        // Maximum เป็น App-owned master field; ทุกการคำนวณใช้ค่าปัจจุบันจาก master_drugs แล้ว snapshot ลงใบเบิก
        const masterDrugForMaximum = ctx.appDb?.drugs?.find(d => String(d.drug_id) === String(item.drugId));
        item.maximumQty = getMaximumQty(masterDrugForMaximum || item);
        const usage = options.usage !== undefined ? toNonNegativeNumber(options.usage) : toNonNegativeNumber(item.usage);
        const targetVMI = calculateTargetForItem(item, usage);
        const systemStock = toSafeNumber(item.prevExcess) - usage;
        const actualTouched = options.actualStockTouched !== undefined ? !!options.actualStockTouched : !!item.actualStockTouched;
        const actualStock = actualTouched
          ? toNonNegativeNumber(options.actualStock !== undefined ? options.actualStock : item.actualStock)
          : null;
        const effectiveStock = actualTouched ? actualStock : systemStock;
        const systemNetNeed = Math.max(0, targetVMI - systemStock);
        const actualNetNeed = Math.max(0, targetVMI - effectiveStock);
        const systemSuggestedBeforeMaximum = isNonBillableInRequisition(item) ? 0 : roundDispenseQtyUncapped(systemNetNeed, item);
        const actualSuggestedBeforeMaximum = isNonBillableInRequisition(item) ? 0 : roundDispenseQtyUncapped(actualNetNeed, item);
        const systemSuggestedQty = isNonBillableInRequisition(item) ? 0 : applyMaximumQty(systemSuggestedBeforeMaximum, item);
        const actualSuggestedQty = isNonBillableInRequisition(item) ? 0 : applyMaximumQty(actualSuggestedBeforeMaximum, item);
        const manualOverride = options.manualQtyOverride !== undefined ? !!options.manualQtyOverride : !!item.manualQtyOverride;
        const requestedRaw = options.finalRequestedQty !== undefined ? options.finalRequestedQty : (item.finalRequestedQty ?? item.dispenseQty);
        const beforeMaximum = isNonBillableInRequisition(item)
          ? 0
          : (manualOverride ? toNonNegativeNumber(requestedRaw) : actualSuggestedBeforeMaximum);
        const normalizedFinal = isNonBillableInRequisition(item)
          ? 0
          : (manualOverride ? applyMaximumQty(toNonNegativeNumber(requestedRaw), item) : actualSuggestedQty);
        const maximumApplied = item.maximumQty > 0 && beforeMaximum > normalizedFinal + 0.000001;
        const delta = normalizedFinal - systemSuggestedQty;
        return {
          ...item,
          usage,
          targetVMI,
          systemStock,
          actualStock,
          actualStockTouched: actualTouched,
          effectiveStock,
          netNeed: actualNetNeed,
          systemSuggestedQty,
          systemSuggestedBeforeMaximum,
          currentSuggestedQty: actualSuggestedQty,
          currentSuggestedBeforeMaximum: actualSuggestedBeforeMaximum,
          finalRequestedQty: normalizedFinal,
          dispenseQty: normalizedFinal,
          dispensePack: normalizedFinal > 0 ? Math.ceil(normalizedFinal / safePackSize(item.packSize)) : 0,
          newExcess: effectiveStock + normalizedFinal,
          requestMore: Math.max(0, delta),
          requestLess: Math.max(0, -delta),
          maximumApplied,
          maximumBeforeQty: maximumApplied ? beforeMaximum : 0,
          isAdjusted: Math.abs(delta) > 0.000001 || actualTouched || manualOverride || maximumApplied,
          manualQtyOverride: manualOverride
        };
      };

      const setWorkingItems = (updater, shouldDirty = true) => {
        setItems(prev => typeof updater === 'function' ? updater(prev) : updater);
        if (shouldDirty) markDirty();
      };

      const scrollToDrugRow = (drugId) => {
        if (!drugId) return;
        setFocusDrugId(String(drugId));
        setSearchTerm('');
        setFilterType('all');
        setShowInactive(true);
        window.setTimeout(() => {
          const el = document.getElementById(`req-row-${drugId}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 120);
        window.setTimeout(() => setFocusDrugId(prev => String(prev) === String(drugId) ? null : prev), 2600);
      };

      useEffect(() => {
        const handler = (e) => {
          if (!dirtyRef.current) return;
          e.preventDefault();
          e.returnValue = '';
        };
        window.addEventListener('beforeunload', handler);
        return () => window.removeEventListener('beforeunload', handler);
      }, []);

      useEffect(() => {
        if (!ctx.registerNavigationGuard) return;
        ctx.registerNavigationGuard((action) => {
          if (!dirtyRef.current || isSubmitting) return true;
          setPendingLeaveAction(action);
          return false;
        });
        return () => ctx.registerNavigationGuard(null);
      }, [isSubmitting]);

      const performLeaveAction = (action) => {
        ctx.registerNavigationGuard?.(null);
        if (!action) return;
        if (action.type === 'logout') { auth.signOut(); return; }
        if (action.type === 'view') {
          if (action.view !== 'create_req') { ctx.setEditReqId(null); ctx.setTargetUploadHosp(null); }
          ctx.forceSetCurrentView?.(action.view);
        }
      };

      const askRemoveItem = (item, reasonText = 'จำนวนเบิกรอบนี้เป็น 0') => {
        ctx.setConfirmDialog({
          title: 'ต้องการลบยานี้ออกจากใบเบิกหรือไม่?',
          message: `${item.name}: ${reasonText} หากต้องการเก็บรายการไว้เพื่อให้ระบบคำนวณต่อ ให้กด “ยกเลิก”`,
          icon: 'fa-trash-can',
          iconColor: 'text-red-500',
          confirmBtnClass: 'bg-red-600 hover:bg-red-700',
          cancelText: 'เก็บรายการไว้',
          confirmText: 'ลบออกจากใบเบิก',
          onConfirm: () => setWorkingItems(prev => prev.filter(i => i.drugId !== item.drugId))
        });
      };

      const handleActualStockChange = (drugId, value) => {
        setWorkingItems(prev => prev.map(item => {
          if (item.drugId !== drugId) return item;
          if (value === '') return recalcWorkingItem(item, { actualStockTouched: false, actualStock: null, manualQtyOverride: false });
          return recalcWorkingItem(item, { actualStockTouched: true, actualStock: toNonNegativeNumber(value), manualQtyOverride: false });
        }));
      };

      const handleActualStockCommit = (drugId) => {
        const item = items.find(i => i.drugId === drugId);
        setEditingActualDrugId(null);
        if (item?.actualStockTouched && toNonNegativeNumber(item.actualStock) === 0) askRemoveItem(item, 'คุณระบุยอดคงเหลือจริงเป็น 0');
      };

      const handleFinalQtyChange = (drugId, value) => {
        const raw = value === '' ? 0 : toNonNegativeNumber(value);
        setWorkingItems(prev => prev.map(item => item.drugId === drugId
          ? recalcWorkingItem(item, { finalRequestedQty: raw, manualQtyOverride: true })
          : item));
      };

      const handleFinalQtyCommit = (drugId) => {
        const current = items.find(i => i.drugId === drugId);
        setEditingQtyDrugId(null);
        if (!current) return;
        const before = toNonNegativeNumber(current.finalRequestedQty);
        const normalized = normalizeDispenseQty(before, current);
        if (before === 0) {
          askRemoveItem(current, 'คุณระบุจำนวนเบิกรอบนี้เป็น 0');
          return;
        }
        if (Math.abs(before - normalized) > 0.000001) {
          setWorkingItems(prev => prev.map(item => item.drugId === drugId
            ? recalcWorkingItem(item, { finalRequestedQty: normalized, manualQtyOverride: true })
            : item));
          ctx.showToast(getMaximumQty(current)>0 && before>getMaximumQty(current) ? `ยอด ${current.name} เกิน Maximum ${getMaximumQty(current)} — ระบบตัดเหลือ ${normalized} ${current.unit || 'หน่วย'}` : `ระบบปรับ ${current.name} จาก ${before} → ${normalized} ${current.unit || 'หน่วย'} ให้ครบหน่วยเติม`);
        }
      };

      const getRequestBadge = (item) => {
        const delta = toNonNegativeNumber(item.finalRequestedQty ?? item.dispenseQty) - toNonNegativeNumber(item.systemSuggestedQty);
        if (delta > 0.000001) return { type: 'more', qty: delta };
        if (delta < -0.000001) return { type: 'less', qty: Math.abs(delta) };
        return null;
      };

      const getLocalFuzzyCache = () => {
        try { return JSON.parse(localStorage.getItem('sawee_rxfill_fuzzy_cache_v1') || '{}') || {}; }
        catch(e) { return {}; }
      };

      const rememberLocalFuzzy = (rawName, drugId) => {
        try {
          const cache = getLocalFuzzyCache();
          const key = normalizeForMatch(rawName);
          if (key && drugId) {
            cache[key] = String(drugId);
            localStorage.setItem('sawee_rxfill_fuzzy_cache_v1', JSON.stringify(cache));
          }
        } catch(e) { console.warn('Local fuzzy cache failed:', e); }
      };

      const learnFuzzyAliasNow = async (importItem, nextDrugId, previousDrugId = '') => {
        const rawName = safeText(importItem?.rawName);
        const aliasKey = normalizeForMatch(rawName);
        const newDrug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(nextDrugId));
        if (!rawName || !aliasKey || !newDrug) return;

        // จำใน browser ทันที เพื่อให้การจับคู่ครั้งนี้เสร็จสิ้นแม้ยังไม่ส่งใบเบิก
        rememberLocalFuzzy(rawName, nextDrugId);

        const localUpdateDrug = (drug, addAlias) => {
          if (!drug) return drug;
          let aliases = cleanFuzzyAliases(drug.fuzzy, drug.drug_name);
          aliases = aliases.filter(a => normalizeForMatch(a) !== aliasKey);
          if (addAlias && normalizeForMatch(drug.drug_name) !== aliasKey) aliases.push(rawName);
          return { ...drug, fuzzy: cleanFuzzyAliases(aliases, drug.drug_name).join(',') };
        };

        // update memory ก่อน เพื่อให้ auto-match รอบถัดไปใน session นี้ใช้ได้ทันที
        if (ctx.setAppDb) {
          ctx.setAppDb(prev => ({
            ...prev,
            drugs: (prev.drugs || []).map(d => {
              if (previousDrugId && String(d.drug_id) === String(previousDrugId) && String(previousDrugId) !== String(nextDrugId)) return localUpdateDrug(d, false);
              if (String(d.drug_id) === String(nextDrugId)) return localUpdateDrug(d, true);
              return d;
            })
          }));
        }

        const opKey = `${aliasKey}=>${nextDrugId}`;
        if (fuzzyLearningRef.current.has(opKey)) return;
        fuzzyLearningRef.current.add(opKey);
        try {
          await db.runTransaction(async tx => {
            const newRef = db.collection('master_drugs').doc(newDrug.id || String(newDrug.drug_id));
            const refs = [newRef];
            let oldRef = null;
            const oldDrug = previousDrugId && String(previousDrugId) !== String(nextDrugId)
              ? ctx.appDb.drugs.find(d => String(d.drug_id) === String(previousDrugId)) : null;
            if (oldDrug) { oldRef = db.collection('master_drugs').doc(oldDrug.id || String(oldDrug.drug_id)); refs.unshift(oldRef); }
            const snaps = [];
            for (const ref of refs) snaps.push(await tx.get(ref));
            let offset = 0;
            if (oldRef) {
              const oldSnap = snaps[offset++];
              if (oldSnap.exists) {
                const od = oldSnap.data();
                const oldAliases = cleanFuzzyAliases(od.fuzzy, od.drug_name).filter(a => normalizeForMatch(a) !== aliasKey);
                tx.update(oldRef, { fuzzy: oldAliases.join(',') });
              }
            }
            const newSnap = snaps[offset];
            if (!newSnap.exists) throw new Error('ไม่พบยาใน master_drugs');
            const nd = newSnap.data();
            const aliases = cleanFuzzyAliases(nd.fuzzy, nd.drug_name);
            const seen = new Set(aliases.map(normalizeForMatch));
            if (aliasKey !== normalizeForMatch(nd.drug_name) && !seen.has(aliasKey)) aliases.push(rawName);
            tx.update(newRef, { fuzzy: cleanFuzzyAliases(aliases, nd.drug_name).join(',') });
          });
        } catch(err) {
          // ไม่ขวางการจับคู่/นำเข้า: cache ในเครื่องถูกบันทึกแล้ว แต่แจ้งถ้า rules ไม่อนุญาต global fuzzy
          console.warn('Immediate fuzzy persist failed:', err);
          if (String(err?.code || '').includes('permission') || /permission|insufficient/i.test(String(err?.message || err))) {
            if (!fuzzyPermissionWarnedRef.current) {
              fuzzyPermissionWarnedRef.current = true;
              ctx.showToast('จับคู่ยาแล้วและจำไว้ในเครื่องนี้ แต่ Firestore ยังไม่อนุญาตให้ผู้ใช้บันทึก Fuzzy กลาง', 'error');
            }
          } else {
            ctx.showToast('จับคู่ยาแล้ว แต่บันทึก Fuzzy กลางไม่สำเร็จ: ' + (err?.message || err), 'error');
          }
        } finally {
          fuzzyLearningRef.current.delete(opKey);
        }
      };

      const handleImportMappingChange = (item, value) => {
        const nextDrugId = safeText(value);
        const previousDrugId = safeText(item?.mappedDrugId);
        setImportData(prev => ({...prev, items: prev.items.map(i => i.id === item.id ? { ...i, mappedDrugId: nextDrugId, wasAutoMatched: i.wasAutoMatched && nextDrugId === previousDrugId } : i)}));
        const validDrug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(nextDrugId));
        if (validDrug && nextDrugId !== previousDrugId) {
          learnFuzzyAliasNow(item, nextDrugId, previousDrugId);
        }
      };

      const scrollToImportItem = (itemId) => {
        if (!itemId) return;
        setFocusImportItemId(itemId);
        setTimeout(() => {
          const el = document.getElementById(`import-row-${itemId}`);
          if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
        }, 40);
      };

      const handleJHCISUpload = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        setExcelFile(file); 
        markDirty();
        setIsProcessing(true);

        const processData = (dataRows) => {
          let hospInfo = ""; let periodInfo = ""; let isDateValid = true; let extracted = [];
          dataRows.forEach(row => {
            const rowArr = Array.isArray(row) ? row : Object.values(row);
            const compacted = rowArr.map(c => String(c || '').trim()).filter(c => c !== '');
            if (compacted.length === 0) return;
            if (compacted.some(c => c.includes('สถานบริการ'))) hospInfo = compacted.find(c => c.includes('สถานบริการ'));
            if (compacted.some(c => c.includes('ระหว่างวันที่'))) {
               periodInfo = compacted.find(c => c.includes('ระหว่างวันที่')) || compacted.join(' ');
               const dateRegex = /(\d{1,2})\s*([ก-๙\.]+)\s*(\d{4})\s*-\s*(\d{1,2})\s*([ก-๙\.]+)\s*(\d{4})/;
               const match = periodInfo.match(dateRegex);
               if (match) {
                  const startDay = parseInt(match[1]); const endDay = parseInt(match[4]);
                  if (startDay < 20 && endDay < 20) isDateValid = false;
               }
            }
            if (compacted.length >= 7 && /^\d+\.?$/.test(compacted[0])) {
               const rawName = compacted[1]; const usageStr = compacted[6]; 
               const usageNum = parseFloat(usageStr?.replace(/,/g, ''));
               if (!isNaN(usageNum) && usageNum >= 0 && rawName && !rawName.includes('รวม')) {
                   extracted.push({ id: Math.random().toString(), rawName, usage: usageNum, mappedDrugId: '' });
               }
            }
          });

          // ⭐️ อัปเกรดระบบ Fuzzy Logic ให้รัดกุมขึ้น
          extracted = extracted.map(item => {
            const normRaw = normalizeForMatch(item.rawName);
            let mappedId = '';
            const localFuzzyId = getLocalFuzzyCache()[normRaw];
            let matched = localFuzzyId ? ctx.appDb.drugs.find(d => String(d.drug_id) === String(localFuzzyId)) : null;
            
            // 1. ตรวจสอบแบบ Exact Match ก่อน (ปลอดภัยที่สุด)
            if (!matched) matched = ctx.appDb.drugs.find(d => {
               const normSys = normalizeForMatch(d.drug_name);
               const fuzzyArr = d.fuzzy ? String(d.fuzzy).split(',').map(normalizeForMatch).filter(f => f !== '') : [];
               return normSys === normRaw || fuzzyArr.includes(normRaw);
            });
            
            // 2. ถ้าไม่เจอแบบ Exact Match ถึงจะยอมให้ใช้ Partial Match แต่มีเงื่อนไขว่าความยาวต้อง > 5 อักษร
            if (!matched) {
              matched = ctx.appDb.drugs.find(d => {
                 const normSys = normalizeForMatch(d.drug_name);
                 const fuzzyArr = d.fuzzy ? String(d.fuzzy).split(',').map(normalizeForMatch).filter(f => f !== '') : [];
                 
                 if (normSys.length > 5 && (normRaw.includes(normSys) || normSys.includes(normRaw))) return true;
                 return fuzzyArr.some(f => f.length > 5 && (normRaw.includes(f) || f.includes(normRaw)));
              });
            }
            
            if (matched) mappedId = matched.drug_id; 
            return { ...item, mappedDrugId: mappedId, wasAutoMatched: !!mappedId };
          });

          setImportData({ hospInfo, periodInfo, isDateValid, items: extracted });
          setShowImportModal(true);
          setIsProcessing(false);
        };

        if (file.name.endsWith('.csv')) {
          Papa.parse(file, { header: false, skipEmptyLines: true, complete: function(results) { processData(results.data); } });
        } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            const bstr = evt.target.result; const wb = XLSX.read(bstr, {type:'binary'});
            const wsname = wb.SheetNames[0]; const ws = wb.Sheets[wsname];
            const data = XLSX.utils.sheet_to_json(ws, {header:1});
            processData(data);
          };
          reader.readAsBinaryString(file);
        } else { ctx.showToast("รองรับเฉพาะไฟล์ .csv, .xls, .xlsx", "error"); setIsProcessing(false); e.target.value = null; }
      };

      const updateRow = (drugIdToUpdate, usageVal, requestMoreVal = null) => {
        setWorkingItems(prev => prev.map(item => {
          if (item.drugId !== drugIdToUpdate) return item;
          if (usageVal !== null) {
            return recalcWorkingItem({ ...item, usageSource: 'manual_edit' }, { usage: toNonNegativeNumber(usageVal), manualQtyOverride: false });
          }
          // backward-compatible path: requestMore เก่าแปลงเป็น final qty เทียบกับ system suggestion
          const requestedExtra = toNonNegativeNumber(requestMoreVal);
          const base = recalcWorkingItem(item, { manualQtyOverride: false });
          return recalcWorkingItem(base, { finalRequestedQty: base.systemSuggestedQty + requestedExtra, manualQtyOverride: true });
        }));
      };

      const handleDeleteItem = (drugId) => {
         ctx.setConfirmDialog({
           title: 'ยืนยันลบออกจากใบเบิก',
           message: 'ปุ่มนี้คือลบออกจากใบเบิกและรีเซ็ตจำนวนเบิกยานี้เป็น 0 แต่ยาจะยังคงอยู่ในคลังของคุณ ยืนยันหรือไม่?',
           icon: 'fa-trash',
           iconColor: 'text-red-500',
           confirmBtnClass: 'bg-red-600 hover:bg-red-700',
           confirmText: 'ลบออกจากใบเบิก',
           onConfirm: () => {
              setWorkingItems(prev => prev.filter(i => i.drugId !== drugId));
              ctx.showToast('ลบรายการยาออกจากตารางแล้ว (จะไม่ปรากฏในใบเบิก)');
           }
         });
      };

      const buildManualCandidate = (drug) => {
         const unitObj = ctx.appDb.units.find(u => String(u.unit_id) === String(drug.unit_id));
         const unitDisplay = unitObj ? unitObj.unit_name : (drug.unit_id || '');
         const par = ctx.appDb.parLevels.find(p => String(p.hospital_id) === String(hospId) && String(p.drug_id) === String(drug.drug_id));
         const bal = ctx.appDb.balances.find(b => String(b.hospital_id) === String(hospId) && String(b.drug_id) === String(drug.drug_id));
         const pastHistory = [];
         for (let i=1; i<=5; i++) {
           let m = currentMonth - i; let y = currentYear;
           if (m <= 0) { m += 12; y -= 1; }
           const key = getYearMonthKey(m, y);
           const hist = ctx.appDb.historicalUsages?.find(h => String(h.hospital_id) === String(hospId) && String(h.drug_id) === String(drug.drug_id));
           pastHistory.push((hist && hist.history && hist.history[key]) ? Number(hist.history[key]) : 0);
         }
         const base = {
            drugId: drug.drug_id, name: drug.drug_name, unit: unitDisplay,
            packSize: safePackSize(drug.pack_size), isUnpacked: !!drug.unpacked, type: drug.type || '1', price: toNonNegativeNumber(drug.price),
            dispenseStep: toNonNegativeNumber(drug.dispense_step, 0), usageMultiplier: getUsageMultiplier(drug), maximumQty: getMaximumQty(drug), isDisabledForHospital: false,
            isDiscontinued: isDrugDiscontinued(drug), drugStatus: getDrugStatusText(drug),
            prevExcess: bal ? toSafeNumber(bal.excess_balance) : 0, usage: 0, targetVMI: 0, netNeed: 0, dispensePack: 0, dispenseQty: 0, newExcess: bal ? toSafeNumber(bal.excess_balance) : 0,
            isSpecial: false, requestMore: 0, requestLess: 0, isUnlocked: true, isNewDrug: true, pastHistory, isAdjusted: true, manualAdded: true, usageSource: 'manual', importedUsageQty: 0,
            actualStock: null, actualStockTouched: false, systemStock: bal ? toSafeNumber(bal.excess_balance) : 0, systemSuggestedQty: 0, finalRequestedQty: 0, manualQtyOverride: false
         };
         return recalcWorkingItem(base);
      };

      const handleManualAdd = () => {
         if(!manualAddSearch) return;
         const drug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(manualAddSearch));
         if(!drug) return ctx.showToast('ไม่พบรหัสยานี้ในระบบ', 'error');
         if (isDrugDiscontinued(drug)) return ctx.showToast(`${drug.drug_name} มีสถานะ "ยกเลิกใช้" ไม่สามารถเพิ่มเข้ามาเพื่อเบิกได้`, 'error');
         const existing = items.find(i => String(i.drugId) === String(drug.drug_id));
         if(existing) {
           ctx.showToast('มีรายการนี้ในใบเบิกอยู่แล้ว ระบบจะเลื่อนไปยังรายการนั้น');
           scrollToDrugRow(existing.drugId);
           return;
         }
         const candidate = buildManualCandidate(drug);
         setManualAddCandidate(candidate);
         setManualAddQty('');
      };

      const confirmManualAdd = () => {
         if (!manualAddCandidate) return;
         const rawQty = toNonNegativeNumber(manualAddQty);
         if (rawQty <= 0) return ctx.showToast('กรุณาระบุจำนวนที่ต้องการเพิ่ม', 'error');
         const normalized = normalizeDispenseQty(rawQty, manualAddCandidate);
         const inserted = recalcWorkingItem(manualAddCandidate, { finalRequestedQty: normalized, manualQtyOverride: true });
         setWorkingItems(prev => [inserted, ...prev].sort(sortDrugs));
         setManualAddSearch('');
         setManualAddCandidate(null);
         setManualAddQty('');
         if (Math.abs(normalized - rawQty) > 0.000001) {
           ctx.showToast(`ระบบปรับ ${manualAddCandidate.name} จาก ${rawQty} → ${normalized} ${manualAddCandidate.unit || 'หน่วย'} ให้ครบหน่วยเติม`);
         } else {
           ctx.showToast(`เพิ่ม ${manualAddCandidate.name} ลงในใบเบิกแล้ว`);
         }
         scrollToDrugRow(inserted.drugId);
      };

      const executeSubmit = async (saveStatus = 'Pending', navigateAfter = true) => {
         let uploadFailed = false;
         let savedReqForLocal = null;
         let uploadedThisSave = false;
         const resolvedFiscalTerm = Math.max(1, toNonNegativeInt(requisitionTerm, 1));
         const resolvedFiscalYear = getFiscalInfo(currentMonth, currentYear).fiscalYear;
         const resolvedRequisitionNo = formatRequisitionNo(resolvedFiscalTerm, resolvedFiscalYear);
         try {
           const skipped = importData.items.filter(i => i.mappedDrugId === '').map(i => ({ rawName: safeText(i.rawName), usage: toNonNegativeNumber(i.usage) }));
           const sanitizedItems = items.filter(item => toNonNegativeNumber(item.usage) > 0 || toNonNegativeNumber(item.finalRequestedQty ?? item.dispenseQty) > 0).map(item => {
              const currentDrug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(item.drugId));
              const currentPar = ctx.appDb.parLevels.find(p => String(p.hospital_id) === String(hospId) && String(p.drug_id) === String(item.drugId));
              const currentDiscontinued = currentDrug ? isDrugDiscontinued(currentDrug) : !!item.isDiscontinued;
              const base = {
                drugId: safeText(item.drugId), name: safeText(currentDrug?.drug_name ?? item.name, 'N/A') || 'N/A', unit: safeText(item.unit),
                packSize: safePackSize(currentDrug?.pack_size ?? item.packSize), isUnpacked: currentDrug ? !!currentDrug.unpacked : !!item.isUnpacked, type: safeText(currentDrug?.type ?? item.type, '1') || '1', price: toNonNegativeNumber(currentDrug?.price ?? item.price),
                dispenseStep: toNonNegativeNumber(currentDrug?.dispense_step ?? item.dispenseStep ?? item.dispense_step, 0), usageMultiplier: getUsageMultiplier(currentDrug || item), maximumQty: getMaximumQty(currentDrug || item), isDisabledForHospital: false, isDiscontinued: currentDiscontinued, drugStatus: currentDrug ? getDrugStatusText(currentDrug) : safeText(item.drugStatus),
                prevExcess: toSafeNumber(item.prevExcess), usage: toNonNegativeNumber(item.usage), targetVMI: toNonNegativeNumber(item.targetVMI), netNeed: toNonNegativeNumber(item.netNeed),
                dispensePack: toNonNegativeNumber(item.dispensePack), dispenseQty: toNonNegativeNumber(item.dispenseQty), newExcess: toSafeNumber(item.newExcess),
                isSpecial: false, requestMore: toNonNegativeNumber(item.requestMore), requestLess: toNonNegativeNumber(item.requestLess), isNewDrug: !!item.isNewDrug, isAdjusted: !!item.isAdjusted,
                manualAdded: !!item.manualAdded, usageSource: safeText(item.usageSource || 'none'), importedUsageQty: toNonNegativeNumber(item.importedUsageQty),
                rawImportedUsageQty: toNonNegativeNumber(item.rawImportedUsageQty), sourceRawNames: Array.isArray(item.sourceRawNames) ? [...new Set(item.sourceRawNames.map(x=>safeText(x)).filter(Boolean))] : [],
                sourceImports: Array.isArray(item.sourceImports) ? item.sourceImports.map(src => ({ rawName: safeText(src?.rawName), rawUsage: toNonNegativeNumber(src?.rawUsage), normalizedUsage: toNonNegativeNumber(src?.normalizedUsage) })).filter(src => src.rawName || src.rawUsage > 0 || src.normalizedUsage > 0) : [],
                systemStock: toSafeNumber(item.systemStock), actualStock: item.actualStockTouched ? toNonNegativeNumber(item.actualStock) : null, actualStockTouched: !!item.actualStockTouched,
                systemSuggestedQty: toNonNegativeNumber(item.systemSuggestedQty), currentSuggestedQty: toNonNegativeNumber(item.currentSuggestedQty ?? item.systemSuggestedQty), finalRequestedQty: toNonNegativeNumber(item.finalRequestedQty ?? item.dispenseQty), manualQtyOverride: !!item.manualQtyOverride,
                maximumApplied: !!item.maximumApplied, maximumBeforeQty: toNonNegativeNumber(item.maximumBeforeQty)
              };
              const locked = lockRequisitionItem(base);
              locked.systemSuggestedQty = toNonNegativeNumber(item.systemSuggestedQty);
              locked.finalRequestedQty = toNonNegativeNumber(locked.dispenseQty);
              const lockedDelta = locked.finalRequestedQty - locked.systemSuggestedQty;
              locked.requestMore = Math.max(0, lockedDelta);
              locked.requestLess = Math.max(0, -lockedDelta);
              locked.submittedDispenseQty = locked.finalRequestedQty;
              locked.requestedExtraQty = locked.requestMore;
              locked.extraDispenseQtyAtSubmit = Math.max(0, lockedDelta);
              return locked;
           }).filter(item => item.drugId);

           if (sanitizedItems.some(i => i.packSize <= 0 || !Number.isFinite(i.usage) || !Number.isFinite(i.dispenseQty) || !Number.isFinite(i.newExcess))) {
             throw new Error('พบข้อมูลจำนวนยาที่ไม่ถูกต้อง กรุณาตรวจสอบรายการก่อนส่ง');
           }

           let fileUrl = uploadedExcelUrl || editingReq?.excel_url || '';
           if (excelFile) {
             try {
               // ใช้ flow เดียวกับเวอร์ชันแรกที่เคยอัปโหลดได้จริง: FileReader DataURL -> text/plain POST -> response.json()
               const base64Str = await new Promise((resolve, reject) => {
                 const reader = new FileReader();
                 reader.onerror = () => reject(new Error('ไม่สามารถอ่านไฟล์ รบ.301 ได้'));
                 reader.onload = (event) => resolve(String(event.target?.result || '').split(',')[1] || '');
                 reader.readAsDataURL(excelFile);
               });
               if (!base64Str) throw new Error('ข้อมูลไฟล์ รบ.301 ว่าง');
               if (!GAS_DRIVE_URL.includes('/exec')) throw new Error('GAS_DRIVE_URL ต้องเป็น Web app URL ที่ลงท้าย /exec ไม่ใช่ Preview หรือ /dev');
               const ext = (String(excelFile.name || '').split('.').pop() || 'xlsx').toLowerCase();
               const uploadRes = await fetch(GAS_DRIVE_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                  body: JSON.stringify({
                    filename: `Rxfill_${hospId}_${currentMonth}_${currentYear}.${ext}`,
                    mimeType: excelFile.type || (ext === 'xlsx' ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : 'application/octet-stream'),
                    base64: base64Str
                  })
               });
               const uploadData = await uploadRes.json();
               if(uploadData.status === 'success') {
                 fileUrl = uploadData.url || '';
                 uploadedThisSave = true;
                 setUploadedExcelUrl(fileUrl);
                 setExcelFile(null);
               } else {
                 throw new Error(uploadData.message || 'GAS ไม่ตอบสถานะ success');
               }
             } catch(err) {
               console.error('Upload GAS Failed:', err);
               uploadFailed = true;
               if (saveStatus === 'Pending') {
                 throw new Error('อัปโหลดไฟล์ รบ.301 ไม่สำเร็จ จึงยังไม่ส่งใบเบิก: ' + (err?.message || err));
               }
             }
           }

           const finalStatus = saveStatus;
           if (ctx.editReqId) {
             const reqRef = db.collection('requisitions').doc(ctx.editReqId);
             let auditDetails = null;
             try {
               await db.runTransaction(async (tx) => {
                 const snap = await tx.get(reqRef);
                 if (!snap.exists) throw new Error('ไม่พบใบเบิกที่ต้องการแก้ไข');
                 const current = snap.data();
                 if (!isAdmin && String(current.hospitalId) !== String(ctx.currentUser.hospital_id)) throw new Error('ไม่มีสิทธิ์แก้ไขใบเบิกของหน่วยงานอื่น');
                 if (!['Draft','Pending','Rejected'].includes(current.status)) throw new Error('ใบเบิกนี้ไม่อยู่ในสถานะที่แก้ไข/ส่งใหม่ได้แล้ว');
                 if (current.is_printed && !isAdmin) throw new Error('ใบเบิกนี้พิมพ์แล้ว จึงล็อกการแก้ไขสำหรับผู้ใช้ รพ.สต.');
                 const payload = {
                   items: sanitizedItems,
                   skipped_items: skipped,
                   updated_at: firebase.firestore.FieldValue.serverTimestamp(),
                   updated_by_uid: ctx.currentUser.uid,
                   updated_by_name: ctx.currentUser.name,
                   status: finalStatus,
                   fiscal_year: resolvedFiscalYear,
                   fiscal_term: resolvedFiscalTerm,
                   requisition_no: resolvedRequisitionNo,
                   revision: toNonNegativeInt(current.revision, 0) + 1,
                   schema_version: APP_SCHEMA_VERSION
                 };
                 if (fileUrl) payload.excel_url = fileUrl;
                 tx.update(reqRef, payload);
                 auditDetails = { hospital_id: current.hospitalId, month: current.month, year: current.year, fiscal_year:resolvedFiscalYear, fiscal_term:resolvedFiscalTerm, requisition_no:resolvedRequisitionNo, revision: payload.revision };
               });
             } catch (err) {
               const msg = err?.message || String(err);
               if (/permission|insufficient/i.test(msg)) throw new Error('Firestore ปฏิเสธสิทธิ์ที่ขั้นตอนแก้ไข requisitions: ' + msg);
               throw err;
             }
             // Audit เป็นงานรอง: ห้ามทำให้ใบเบิกที่บันทึกสำเร็จแล้วล้มทั้ง transaction
             if (auditDetails) await writeAuditLog(ctx.currentUser, 'REQUISITION_UPDATE', 'requisitions', ctx.editReqId, auditDetails);
             savedReqForLocal = {
               ...(editingReq || {}),
               id: ctx.editReqId, hospitalId: hospId, month: currentMonth, year: currentYear,
               status: finalStatus, excel_url: fileUrl || editingReq?.excel_url || '',
               fiscal_year:resolvedFiscalYear, fiscal_term:resolvedFiscalTerm, requisition_no:resolvedRequisitionNo,
               items: sanitizedItems, skipped_items: skipped,
               updated_at: firebase.firestore.Timestamp.now(),
               revision: toNonNegativeInt(editingReq?.revision, 0) + 1, schema_version: APP_SCHEMA_VERSION
             };

             ctx.showToast(uploadFailed ? 'อัปเดตใบเบิกสำเร็จ แต่ไฟล์ รบ.301 อัปโหลดไม่สำเร็จ' : 'อัปเดตใบเบิกสำเร็จ', uploadFailed ? 'error' : 'success');
           } else {
             // เช็กจาก state ก่อน เพื่อให้ตอบสนองเร็ว
             const existing = ctx.appDb.requisitions.find(r => String(r.hospitalId) === String(hospId) && Number(r.month) === currentMonth && Number(r.year) === currentYear && !String(r.id || '').startsWith('HIST-'));
             if (existing) throw new Error(`เดือน ${currentMonth}/${currentYear} มีใบเบิกอยู่แล้ว (${existing.id}) กรุณาลบอันเก่าออกก่อน จึงจะสร้างใบเบิกใหม่ได้`);

             // สำคัญ: ห้าม tx.get(document ที่ยังไม่มี) เพราะ Rules แบบ owner ใช้ resource.data และจะ deny เอกสารที่ยังไม่เกิด
             // ใช้ query ที่ constrain hospitalId ของผู้ใช้แทน ซึ่งสอดคล้องกับ Firestore Rules
             let duplicateReq = null;
             try {
               const ownReqSnap = await db.collection('requisitions').where('hospitalId', '==', hospId).get();
               duplicateReq = ownReqSnap.docs.map(d => ({ id:d.id, ...d.data() })).find(r =>
                 Number(r.month) === currentMonth && Number(r.year) === currentYear && !String(r.id || '').startsWith('HIST-')
               ) || null;
             } catch (err) {
               const msg = err?.message || String(err);
               if (/permission|insufficient/i.test(msg)) throw new Error('Firestore ปฏิเสธสิทธิ์ที่ขั้นตอนตรวจใบเบิกเดิม (requisitions query): ' + msg);
               throw err;
             }
             if (duplicateReq) throw new Error(`เดือน ${currentMonth}/${currentYear} มีใบเบิกอยู่แล้ว (${duplicateReq.id}) กรุณาเปิดใบเดิมเพื่อแก้ไข หรือลบใบเดิมก่อน`);

             const newId = buildRequisitionId(hospId, currentMonth, currentYear);
             const reqRef = db.collection('requisitions').doc(newId);
             const createPayload = {
               hospitalId: hospId,
               month: currentMonth,
               year: currentYear,
               fiscal_year: resolvedFiscalYear,
               fiscal_term: resolvedFiscalTerm,
               requisition_no: resolvedRequisitionNo,
               status: finalStatus,
               is_printed: false,
               excel_url: fileUrl || '',
               items: sanitizedItems,
               skipped_items: skipped,
               created_by_uid: ctx.currentUser?.uid || '',
               created_by_name: ctx.currentUser?.name || 'System',
               created_by_position: ctx.currentUser?.position || 'เจ้าหน้าที่',
               created_at: firebase.firestore.FieldValue.serverTimestamp(),
               updated_at: firebase.firestore.FieldValue.serverTimestamp(),
               revision: 1,
               schema_version: APP_SCHEMA_VERSION
             };
             try {
               await reqRef.set(createPayload);
             } catch (err) {
               const msg = err?.message || String(err);
               if (/permission|insufficient/i.test(msg)) {
                 throw new Error(`Firestore ปฏิเสธสิทธิ์ตอนสร้าง requisitions/${newId}. โปรดตรวจ users/${ctx.currentUser.uid}: role=${ctx.currentUser.role || '-'}, hospital_id=${ctx.currentUser.hospital_id || '-'}; ใบกำลังส่ง hospitalId=${hospId}. (${msg})`);
               }
               throw err;
             }
             // Audit แยกออกจาก write หลัก เพื่อไม่ให้ audit permission ทำให้ใบเบิกล้ม
             await writeAuditLog(ctx.currentUser, 'REQUISITION_CREATE', 'requisitions', newId, { hospital_id: hospId, month: currentMonth, year: currentYear, fiscal_year:resolvedFiscalYear, fiscal_term:resolvedFiscalTerm, requisition_no:resolvedRequisitionNo, item_count: sanitizedItems.length });

             savedReqForLocal = {
               id: newId, hospitalId: hospId, month: currentMonth, year: currentYear, status: finalStatus,
               fiscal_year:resolvedFiscalYear, fiscal_term:resolvedFiscalTerm, requisition_no:resolvedRequisitionNo,
               is_printed: false, excel_url: fileUrl || '', items: sanitizedItems, skipped_items: skipped,
               created_by_uid: ctx.currentUser?.uid || '', created_by_name: ctx.currentUser?.name || 'System',
               created_by_position: ctx.currentUser?.position || 'เจ้าหน้าที่',
               created_at: firebase.firestore.Timestamp.now(), updated_at: firebase.firestore.Timestamp.now(),
               revision: 1, schema_version: APP_SCHEMA_VERSION
             };

             ctx.showToast(uploadFailed ? 'ส่งข้อมูลสำเร็จ แต่ไฟล์ รบ.301 อัปโหลดไม่สำเร็จ' : (isAdmin ? 'อัปโหลดแทน รพ.สต. สำเร็จ (รอตรวจสอบ)' : 'ส่งข้อมูลสำเร็จ รอห้องยาจัดยา'), uploadFailed ? 'error' : 'success');
           }

           if (savedReqForLocal && ctx.setAppDb) {
             ctx.setAppDb(prev => {
               const rest = (prev.requisitions || []).filter(r => String(r.id) !== String(savedReqForLocal.id));
               return { ...prev, requisitions: [savedReqForLocal, ...rest] };
             });
           }
           if (uploadedThisSave) setExcelFile(null);
           clearDirty();
           if (navigateAfter) {
             ctx.setEditReqId(null);
             ctx.setTargetUploadHosp(null);
             ctx.forceSetCurrentView ? ctx.forceSetCurrentView('dashboard') : ctx.setCurrentView('dashboard');
           }
           return ctx.editReqId || buildRequisitionId(hospId, currentMonth, currentYear);
         } finally {
           setIsSubmitting(false);
         }
      };

      const handleSubmitPreCheck = () => {
         if (isSubmitting) return;
         if (duplicateCreateBlocked) return ctx.showToast(`เดือนนี้มีใบเบิกอยู่แล้ว (${existingReqForMonth.id}) กรุณาลบอันเก่าออกก่อน`, 'error');
         if(!excelFile && !uploadedExcelUrl && !editingReq?.excel_url && !isAdmin) return ctx.showToast('กรุณาแนบไฟล์ รบ.301 (.xlsx) เพื่อใช้เป็นหลักฐานประกอบการเบิก', 'error');
         if(items.filter(i => toNonNegativeNumber(i.usage) > 0 || toNonNegativeNumber(i.finalRequestedQty ?? i.dispenseQty) > 0).length === 0) return ctx.showToast('ไม่มีรายการเบิกใดๆ กรุณากรอกยอด', 'error');
         if(items.some(i => !Number.isFinite(Number(i.packSize)) || Number(i.packSize) <= 0 || toSafeNumber(i.usage) < 0 || toSafeNumber(i.requestMore) < 0)) return ctx.showToast('พบจำนวนยาหรือขนาดบรรจุไม่ถูกต้อง', 'error');
         
         ctx.setConfirmDialog({
            title: 'ยืนยันการส่งใบเบิก?',
            message: 'กรุณาตรวจสอบข้อมูลให้ครบถ้วน ยืนยันการส่งข้อมูลเข้าระบบหรือไม่?',
            icon: 'fa-paper-plane',
            confirmText: 'ส่งใบเบิก',
            onConfirm: () => {
               setIsSubmitting(true);
               executeSubmit('Pending', true).catch(e => { ctx.showToast(e.message, 'error'); setIsSubmitting(false); });
            }
         });
      };

      const previousReqPriceByDrug = useMemo(() => {
        const currentKey = currentYear * 100 + currentMonth;
        const previousReqs = (ctx.appDb.requisitions || [])
          .filter(r => String(r.hospitalId) === String(hospId)
            && !String(r.id || '').startsWith('HIST-')
            && (Number(r.year) * 100 + Number(r.month)) < currentKey
            && ['Completed','Pending','Approving','ApprovalFailed'].includes(String(r.status || '')))
          .sort((a,b) => (Number(b.year)*100+Number(b.month)) - (Number(a.year)*100+Number(a.month)));
        const map = new Map();
        previousReqs.forEach(r => {
          (Array.isArray(r.items) ? r.items : []).forEach(it => {
            const key = String(it.drugId || '');
            const price = toNonNegativeNumber(it.price);
            if (key && !map.has(key)) map.set(key, {
              price,
              packSize:safePackSize(it.packSize ?? it.pack_size),
              unit:safeText(it.unit),
              reqId:r.id, month:Number(r.month), year:Number(r.year), status:r.status
            });
          });
        });
        return map;
      }, [ctx.appDb.requisitions, hospId, currentMonth, currentYear]);

      const getReqPriceChange = (item) => {
        const prev = previousReqPriceByDrug.get(String(item?.drugId || ''));
        const current = toNonNegativeNumber(item?.price);
        if (!prev || prev.price <= 0 || current <= 0 || Math.abs(current - prev.price) < 0.005) return null;
        const pct = ((current - prev.price) / prev.price) * 100;
        return { ...prev, current, pct, delta:current-prev.price };
      };

      const getReqPackChange = (item) => {
        const prev = previousReqPriceByDrug.get(String(item?.drugId || ''));
        const current = safePackSize(item?.packSize ?? item?.pack_size);
        if (!prev || !prev.packSize || Math.abs(current - prev.packSize) < 0.0001) return null;
        const pct = prev.packSize > 0 ? ((current-prev.packSize)/prev.packSize)*100 : 0;
        return { ...prev, current, pct, delta:current-prev.packSize };
      };

      const priceChangedItems = items.map(item => ({ item, change:getReqPriceChange(item) })).filter(x => x.change);
      const packChangedItems = items.map(item => ({ item, change:getReqPackChange(item) })).filter(x => x.change);

      const refreshInvsPriceForRequisition = async () => {
        if (isRefreshingInvsPrice) return;
        setIsRefreshingInvsPrice(true);
        try {
          const [drugSnap, unitSnap] = await Promise.all([
            db.collection('master_drugs').get(),
            db.collection('master_unit').get()
          ]);
          const freshDrugs = drugSnap.docs.map(d => ({ id:d.id, ...d.data() }));
          const freshUnits = unitSnap.docs.map(d => ({ id:d.id, ...d.data() }));
          const freshMap = new Map(freshDrugs.map(d => [String(d.drug_id), d]));
          const unitMap = new Map(freshUnits.map(u => [String(u.unit_id), u]));
          let priceChanged=0, packChanged=0, unitChanged=0;
          items.forEach(item => {
            const d=freshMap.get(String(item.drugId)); if(!d) return;
            if(Math.abs(toNonNegativeNumber(d.price)-toNonNegativeNumber(item.price))>=0.005) priceChanged++;
            if(Math.abs(safePackSize(d.pack_size)-safePackSize(item.packSize))>=0.0001) packChanged++;
            const u=unitMap.get(String(d.unit_id));
            const freshUnit=safeText(u?.unit_name || d.unit_id);
            if(freshUnit && freshUnit!==safeText(item.unit)) unitChanged++;
          });
          setItems(prev => prev.map(item => {
            const d = freshMap.get(String(item.drugId));
            if (!d) return item;
            const u=unitMap.get(String(d.unit_id));
            const next={ ...item,
              price:toNonNegativeNumber(d.price),
              packSize:safePackSize(d.pack_size),
              unit:safeText(u?.unit_name || d.unit_id || item.unit),
              type:safeText(d.type ?? item.type,'1') || '1',
              isUnpacked:!!d.unpacked,
              dispenseStep:toNonNegativeNumber(d.dispense_step ?? item.dispenseStep ?? item.dispense_step,0),
              usageMultiplier:getUsageMultiplier(d || item),
              maximumQty:getMaximumQty(d || item)
            };
            return recalcWorkingItem(next);
          }));
          ctx.setAppDb(prev => ({ ...prev, drugs:freshDrugs, units:freshUnits }));
          const totalChanged=priceChanged+packChanged+unitChanged;
          if (totalChanged > 0) markDirty();
          const pieces=[];
          if(priceChanged) pieces.push(`ราคา ${priceChanged}`);
          if(packChanged) pieces.push(`Pack ${packChanged}`);
          if(unitChanged) pieces.push(`หน่วย ${unitChanged}`);
          ctx.showToast(pieces.length ? `อัปเดตข้อมูล INVS ในใบเบิกแล้ว: ${pieces.join(' • ')}` : 'ข้อมูลในใบเบิกตรงกับ INVS ล่าสุดแล้ว');
        } catch(err) {
          ctx.showToast('รีเฟรชข้อมูล INVS ไม่สำเร็จ: ' + (err?.message || err), 'error');
        } finally {
          setIsRefreshingInvsPrice(false);
        }
      };

      const filteredItems = items.filter(item => {
        const matchSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || String(item.drugId).includes(searchTerm.toLowerCase());
        const matchType = filterType === 'all' ? true : filterType === item.type;
        const inactive = toNonNegativeNumber(item.usage) === 0 && toNonNegativeNumber(item.finalRequestedQty ?? item.dispenseQty) === 0 && !item.manualAdded;
        const matchInactive = showInactive ? true : !inactive;
        return matchSearch && matchType && matchInactive;
      });
      const workingGroupedItems = filteredItems.reduce((acc, item) => {
        const key = safeText(item.type, '1') || '1';
        (acc[key] ||= []).push(item);
        return acc;
      }, {});
      const workingTypeKeys = Object.keys(workingGroupedItems).sort((a,b)=>Number(a)-Number(b));
      const rowNumberByDrug = new Map(filteredItems.map((item, idx) => [String(item.drugId), idx + 1]));

      const deleteExistingReqForMonth = async () => {
        if (!existingReqForMonth || !duplicateCanBeDeleted) return;
        try {
          const reqRef = db.collection('requisitions').doc(existingReqForMonth.id);
          const auditRef = db.collection('audit_logs').doc();
          await db.runTransaction(async (tx) => {
            const snap = await tx.get(reqRef);
            if (!snap.exists) throw new Error('ไม่พบใบเบิกเดิม');
            const current = snap.data();
            const ownsReq = String(current.hospitalId) === String(hospId);
            const hospitalAllowed = !isAdmin && ownsReq && ['Draft','Pending','Rejected'].includes(current.status);
            const adminAllowed = isAdmin && ['Draft','Pending','Rejected','ApprovalFailed'].includes(current.status);
            if (!hospitalAllowed && !adminAllowed) throw new Error('ใบเบิกสถานะนี้ไม่อนุญาตให้ลบ');
            tx.delete(reqRef);
            tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'REQUISITION_DELETE', 'requisitions', existingReqForMonth.id, { hospital_id: current.hospitalId, month: current.month, year: current.year, status: current.status, source: 'duplicate_recovery' }));
          });
          if (ctx.setAppDb) {
            ctx.setAppDb(prev => ({ ...prev, requisitions: (prev.requisitions || []).filter(r => String(r.id) !== String(existingReqForMonth.id)) }));
          }
          ctx.setEditReqId(null);
          ctx.setCurrentReqId(null);
          ctx.showToast('ลบใบเบิกเดิมแล้ว สามารถสร้างใบเบิกรอบนี้ใหม่ได้');
        } catch (e) {
          ctx.showToast(e.message || String(e), 'error');
        }
      };

      if (duplicateCreateBlocked) {
        return (
          <div className="bg-white rounded-3xl p-10 text-center shadow-sm max-w-2xl mx-auto mt-10 border border-red-200 animate-fade-in">
            <i className="fa-solid fa-copy text-6xl text-red-500 mb-6"></i>
            <h2 className="text-2xl font-bold text-slate-800 mb-3">เดือนนี้มีใบเบิกอยู่แล้ว</h2>
            <p className="text-slate-600 mb-2 text-lg">พบใบเบิก <span className="font-bold text-red-600">{existingReqForMonth.id}</span> สำหรับเดือน {currentMonth}/{currentYear}</p>
            <p className="font-bold mb-8 text-red-600">{duplicateCanBeDeleted ? 'มีใบเบิกรอบนี้อยู่แล้ว กรุณาเปิดใบเดิมเพื่อแก้ไข หรือหากต้องการสร้างใหม่ให้ลบใบเดิมก่อน' : 'ใบเบิกเดือนนี้ถูกดำเนินการแล้ว จึงไม่อนุญาตให้สร้างใบใหม่ซ้ำ กรุณาติดต่อ Admin หากต้องแก้ไขข้อมูลย้อนหลัง'}</p>
            <div className="flex flex-col sm:flex-row justify-center gap-4">
              <button onClick={() => { ctx.setTargetUploadHosp(null); ctx.setCurrentView('dashboard'); }} className="bg-slate-100 text-slate-600 px-6 py-3 rounded-xl font-bold hover:bg-slate-200 transition">กลับหน้าหลัก</button>
              <button onClick={() => { ctx.setEditReqId(existingReqForMonth.id); ctx.setCurrentReqId(existingReqForMonth.id); ctx.setCurrentView((!existingReqForMonth?.is_printed && ['Draft','Pending','Rejected'].includes(existingReqForMonth?.status)) ? 'create_req' : 'view_req'); }} className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">เปิดใบเบิกเดิม</button>
              {duplicateCanBeDeleted && <button onClick={() => ctx.setConfirmDialog({ title: 'ลบใบเบิกเดิม?', message: `ต้องการลบ ${existingReqForMonth.id} แล้วสร้างใบเบิกรอบนี้ใหม่หรือไม่? ข้อมูลใบเดิมจะถูกลบ`, icon: 'fa-trash', iconColor: 'text-red-500', confirmBtnClass: 'bg-red-600 hover:bg-red-700', confirmText: 'ลบใบเบิกเดิม', onConfirm: deleteExistingReqForMonth })} className="bg-red-100 text-red-700 border border-red-200 px-6 py-3 rounded-xl font-bold hover:bg-red-200 transition"><i className="fa-solid fa-trash mr-2"></i>ลบใบเบิกเดิม</button>}
            </div>
          </div>
        );
      }

      if (isOutOfPeriod && !acknowledged && !ctx.editReqId) {
        return (
          <div className="bg-white rounded-3xl p-10 text-center shadow-sm max-w-2xl mx-auto mt-10 border border-amber-200 animate-fade-in">
            <i className="fa-solid fa-triangle-exclamation text-6xl text-amber-500 mb-6"></i>
            <h2 className="text-2xl font-bold text-slate-800 mb-3">แจ้งเตือน: นอกช่วงเวลาเบิกยา</h2>
            <p className="text-slate-500 mb-8 text-lg">ระบบเปิดให้ทำเรื่องเติมยาเฉพาะ <span className="font-bold text-slate-700">วันที่ 20 ถึง 31 ของเดือน</span></p>
            <div className="flex flex-col sm:flex-row justify-center gap-4">
              <button onClick={() => { ctx.setTargetUploadHosp(null); ctx.setCurrentView('dashboard'); }} className="bg-slate-100 text-slate-600 px-6 py-3 rounded-xl font-bold hover:bg-slate-200 transition">กลับหน้าหลัก</button>
              <button onClick={() => setAcknowledged(true)} className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-6 py-3 rounded-xl font-bold hover:scale-105 transition shadow-lg shadow-amber-200">เข้าสู่โหมดฉุกเฉิน</button>
            </div>
          </div>
        );
      }

      const unmatchedCount = importData.items.filter(i => (showZeroImport || i.usage > 0) && !i.mappedDrugId).length;

      return (
        <div className="animate-fade-in relative w-full print-safe-wrapper">
          {isProcessing && <FullScreenSpinner />}

          {/* Toolbar เล็ก ๆ — หน้าหลักยังคงเป็นกระดาษ */}
          <div className="no-print bg-white border border-slate-200 rounded-xl shadow-sm p-3 mb-4 flex flex-wrap items-center gap-2">
            <button onClick={() => ctx.setCurrentView('dashboard')} className="h-9 px-3 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 font-bold text-sm"><i className="fa-solid fa-arrow-left mr-1"></i>กลับ</button>
            <div className="h-6 border-l border-slate-200 mx-1"></div>

            {(!editingReq?.is_printed && (!editingReq || ['Draft','Pending','Rejected'].includes(editingReq.status))) && (
              <label className="min-h-10 px-3 py-1.5 rounded-lg border border-emerald-300 text-emerald-700 bg-emerald-50 hover:bg-emerald-100 cursor-pointer font-bold text-sm flex items-center leading-tight" title={excelFile?.name || ''}>
                <i className="fa-solid fa-file-excel mr-2 text-base"></i>
                <span className="flex flex-col">
                  <span>{uploadedExcelUrl ? 'เปลี่ยนไฟล์ รบ.301' : 'Upload รบ.301'}</span>
                  <span className="text-[10px] font-semibold text-emerald-600">วันที่ {uploadPeriodLabel}</span>
                </span>
                <input type="file" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" className="hidden" onChange={handleJHCISUpload} />
              </label>
            )}
            {(excelFile || uploadedExcelUrl || editingReq?.excel_url) && <span className="text-xs text-emerald-700"><i className="fa-solid fa-circle-check mr-1"></i>มีไฟล์ รบ.301</span>}
            <button onClick={refreshInvsPriceForRequisition} disabled={isRefreshingInvsPrice} className="h-9 px-3 rounded-lg border border-emerald-200 text-emerald-700 bg-emerald-50 hover:bg-emerald-100 font-bold text-xs disabled:opacity-50" title="โหลดราคา Pack และหน่วยปัจจุบันจาก INVS Master Sync"><i className={`fa-solid ${isRefreshingInvsPrice?'fa-spinner fa-spin':'fa-arrows-rotate'} mr-1`}></i>{isRefreshingInvsPrice?'กำลังรีเฟรช':'รีเฟรชข้อมูล INVS'}</button>
            <div className="h-9 px-3 rounded-lg border border-indigo-200 bg-indigo-50 flex items-center gap-1 text-xs text-indigo-800" title={requisitionFiscalYear <= RXFILL_TRANSITION_FISCAL_YEAR ? 'ปีเริ่มระบบ: ค่าเริ่มต้นตามลำดับเดือนงบ และแก้เลขได้' : 'เลข run ตามใบเบิกจริงของ รพ.สต. และ reset ทุกปีงบประมาณ'}>
              <span className="font-bold">เลขใบเบิก</span>
              <input type="number" min="1" step="1" value={requisitionTerm} onChange={e=>{setRequisitionTerm(Math.max(1,toNonNegativeInt(e.target.value,1)));markDirty();}} className="w-14 h-7 rounded border border-indigo-200 bg-white text-center font-black outline-none focus:ring-2 focus:ring-indigo-400" />
              <span className="font-black">/{requisitionFiscalYear}</span>
            </div>

            <div className="flex-1 min-w-[120px]"></div>
            <div className="relative min-w-[220px] max-w-sm flex-1">
              <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
              <input value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="ค้นหายา / รหัสยา" className="w-full h-9 pl-9 pr-3 border border-slate-200 rounded-lg text-sm outline-none focus:border-emerald-400" />
            </div>

                            if (!aggregatedRawNames[i.mappedDrugId]) aggregatedRawNames[i.mappedDrugId] = [];
                            if (!aggregatedSources[i.mappedDrugId]) aggregatedSources[i.mappedDrugId] = [];
                            const rawName = safeText(i.rawName);
                            if (rawName && !aggregatedRawNames[i.mappedDrugId].some(n => normalizeForMatch(n) === normalizeForMatch(rawName))) aggregatedRawNames[i.mappedDrugId].push(rawName);

                                  isDisabledForHospital: false,
                                  prevExcess: 0, usage: 0, targetVMI: 0, netNeed: 0,
                                  dispensePack: 0, dispenseQty: 0, newExcess: 0, isSpecial: false, requestMore: 0,
                                  isUnlocked: true, isNewDrug: true, pastHistory: [0,0,0,0,0], isAdjusted: false, manualAdded: false, usageSource: 'rb301', importedUsageQty: 0,
                                  actualStock: null, actualStockTouched: false, systemStock: 0, systemSuggestedQty: 0, finalRequestedQty: 0, manualQtyOverride: false, requestLess: 0
                               };
                               newItemsArr.push(existing);
                               newAdded = true;
                            }
                         }
                      });

                      if(newAdded) newItemsArr.sort(sortDrugs);
                      
                      const calcItems = newItemsArr.map(item => {
                         const totalImportUsage = aggregatedUsages[item.drugId];
                         if (totalImportUsage !== undefined) {
                            const usage = toNonNegativeNumber(totalImportUsage);
                            const requestMore = item.requestMore || 0;
                            
                            const recent5 = item.pastHistory ? item.pastHistory.slice(0, 5) : [0,0,0,0,0];
                            const activeUsages = [...recent5, usage].filter(u => u > 0);
                            const count = activeUsages.length || 1;
                            const mean = activeUsages.reduce((a,b)=>a+b, 0) / count;
                            const variance = activeUsages.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / (count === 1 ? 1 : count - 1);
                            const SD = Math.sqrt(variance);
                            const dynamicTargetVMI = Math.ceil(mean + (1.645 * SD));

                            const currentBal = item.prevExcess - usage;
                            let netNeed = dynamicTargetVMI - currentBal;
                            if (netNeed <= 0) netNeed = 0;

                            const totalNeed = netNeed + requestMore;
                            
                            let dispensePack=0, dispenseQty=0, newExcess=currentBal;

                            if (item.isDiscontinued) {
                               dispensePack = 0; dispenseQty = 0; newExcess = currentBal; netNeed = 0;

                               dispensePack = Math.ceil(dispenseQty / safePackSize(item.packSize));
