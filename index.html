          <div className="grid grid-cols-1 xl:grid-cols-4 gap-5">
            <div className="bg-white border rounded-2xl shadow-sm p-5">
              <div className="font-black text-slate-800 mb-4"><i className="fa-solid fa-ranking-star text-indigo-500 mr-2"></i>มูลค่าเบิกสูงสุด</div>
              <div className="space-y-4">{topRequestValue.map((h,idx)=><button key={h.hospitalId} onClick={()=>focusHospital(h.hospitalId)} className="block w-full text-left group"><div className="flex justify-between gap-2 text-sm"><span className="font-bold text-slate-700 truncate"><span className="text-slate-400 mr-2">#{idx+1}</span>{h.hospital_name}</span><span className="font-black text-indigo-600">฿{Math.round(h.requestValue).toLocaleString('th-TH')}</span></div><div className="h-1.5 bg-slate-100 rounded-full mt-2 overflow-hidden"><div className="h-full bg-indigo-500 rounded-full" style={{width:rankingBar(h.requestValue,maxReqValue)}}></div></div></button>)}{topRequestValue.length===0&&<div className="text-slate-400 text-sm text-center py-8">ยังไม่มีใบเบิกในรอบนี้</div>}</div>
            </div>
            <div className="bg-white border rounded-2xl shadow-sm p-5">
              <div className="font-black text-slate-800 mb-4"><i className="fa-solid fa-boxes-stacked text-sky-500 mr-2"></i>มูลค่าสต๊อก/เครดิตสูงสุด</div>
              <div className="space-y-4">{topStockValue.map((h,idx)=><button key={h.hospitalId} onClick={()=>focusHospital(h.hospitalId)} className="block w-full text-left"><div className="flex justify-between gap-2 text-sm"><span className="font-bold text-slate-700 truncate"><span className="text-slate-400 mr-2">#{idx+1}</span>{h.hospital_name}</span><span className="font-black text-sky-600">฿{Math.round(h.stockValue).toLocaleString('th-TH')}</span></div><div className="h-1.5 bg-slate-100 rounded-full mt-2 overflow-hidden"><div className="h-full bg-sky-500 rounded-full" style={{width:rankingBar(h.stockValue,maxStockValue)}}></div></div></button>)}</div>
            </div>
            <div className="bg-white border rounded-2xl shadow-sm p-5">
              <div className="font-black text-slate-800 mb-4"><i className="fa-solid fa-arrow-trend-up text-orange-500 mr-2"></i>มูลค่าเบิกเพิ่มสูงสุด</div>
              <div className="space-y-3">{topExtraValue.map((h,idx)=><button key={h.hospitalId} onClick={()=>focusHospital(h.hospitalId)} className="w-full text-left p-2 rounded-xl hover:bg-orange-50"><div className="flex justify-between gap-2 text-sm"><span className="font-bold text-slate-700 truncate"><span className="text-slate-400 mr-2">#{idx+1}</span>{h.hospital_name}</span><span className="font-black text-orange-600">฿{Math.round(h.extraValue).toLocaleString('th-TH')}</span></div><div className="text-[10px] text-orange-500 mt-1">{h.extraItemCount} รายการ • รบ.301 ฿{Math.round(h.usageValue).toLocaleString('th-TH')}</div></button>)}{topExtraValue.length===0&&<div className="text-slate-400 text-sm text-center py-8">ไม่มีการเบิกเพิ่มในรอบนี้</div>}</div>
            </div>
            <div className="bg-white border rounded-2xl shadow-sm p-5">
              <div className="font-black text-slate-800 mb-4"><i className="fa-solid fa-clock text-amber-500 mr-2"></i>รอจัดนานสุด</div>
              <div className="space-y-2">{pendingLongest.map(h=><button key={h.hospitalId} onClick={()=>focusHospital(h.hospitalId)} className="w-full flex items-center justify-between p-3 rounded-xl bg-amber-50 hover:bg-amber-100 text-left"><div className="min-w-0"><div className="font-bold text-slate-700 truncate">{h.hospital_name}</div><div className="text-[10px] text-amber-600">{h.statusText}</div></div><div className="font-black text-amber-700 shrink-0 ml-3">{h.waitingDays} วัน</div></button>)}{pendingLongest.length===0&&<div className="text-slate-400 text-sm text-center py-8">ไม่มีรายการรอจัด</div>}</div>
            </div>
          </div>

          <div className="bg-white border rounded-2xl shadow-sm overflow-hidden">
            <div className="p-5 border-b bg-slate-50 flex justify-between items-center"><div className="font-black text-slate-800"><i className="fa-solid fa-table-list text-emerald-500 mr-2"></i>ตารางสถานการณ์ราย รพ.สต.</div><div className="text-xs text-slate-400">{filteredData.length} หน่วยงาน</div></div>
            <div className="overflow-x-auto"><table className="w-full text-sm whitespace-nowrap"><thead className="bg-slate-50"><tr><th className="p-3 text-left">รพ.สต.</th><th className="p-3 text-center">สถานะ</th><th className="p-3 text-right">รบ.301 ก่อนปรับ</th><th className="p-3 text-right">เบิกเพิ่ม</th><th className="p-3 text-center">รายการเพิ่ม</th><th className="p-3 text-right">มูลค่าเบิก</th><th className="p-3 text-right">สต๊อก/เครดิต</th><th className="p-3 text-center">รายการจ่าย</th><th className="p-3 text-center">พิกัด</th><th className="p-3 text-center">เปิดดู</th></tr></thead><tbody>{filteredData.map(h=><tr key={h.hospitalId} className={`border-t hover:bg-slate-50 ${selectedHospitalId===h.hospitalId?'bg-emerald-50':''}`}><td className="p-3"><button onClick={()=>focusHospital(h.hospitalId)} className={`font-black text-left ${affiliationTextClass(h)}`}><span className="text-[9px] mr-1 opacity-70">{affiliationLabel(h)}</span>{h.hospital_name}</button><div className="text-[10px] text-slate-400">{h.hospital_id}</div></td><td className="p-3 text-center">{statusBadge(h)}</td><td className="p-3 text-right font-bold text-emerald-600">฿{h.usageValue.toLocaleString('th-TH',{maximumFractionDigits:0})}</td><td className="p-3 text-right font-bold text-orange-600">฿{h.extraValue.toLocaleString('th-TH',{maximumFractionDigits:0})}</td><td className="p-3 text-center font-bold text-rose-600">{h.extraItemCount}</td><td className="p-3 text-right font-bold text-indigo-600">฿{h.requestValue.toLocaleString('th-TH',{maximumFractionDigits:0})}</td><td className="p-3 text-right font-bold text-sky-600">฿{h.stockValue.toLocaleString('th-TH',{maximumFractionDigits:0})}</td><td className="p-3 text-center">{h.dispenseItemCount}</td><td className="p-3 text-center">{h.hasCoords?<span className="text-emerald-600"><i className="fa-solid fa-location-dot"></i></span>:<button onClick={openHospitalConfig} className="text-amber-600 font-bold text-xs">เพิ่มพิกัด</button>}</td><td className="p-3 text-center">{h.req?<button onClick={()=>{ctx.setCurrentReqId(h.req.id);ctx.setCurrentView('view_req')}} className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg font-bold">ใบเบิก</button>:<span className="text-slate-300">-</span>}</td></tr>)}{filteredData.length===0&&<tr><td colSpan="10" className="p-10 text-center text-slate-400">ไม่พบข้อมูลตามตัวกรอง</td></tr>}</tbody></table></div>
          </div>

          {missingCoords.length > 0 && <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5"><div className="flex flex-col md:flex-row md:items-center justify-between gap-3"><div><div className="font-black text-amber-800"><i className="fa-solid fa-location-crosshairs mr-2"></i>รพ.สต. ที่ยังไม่แสดงบนแผนที่ ({missingCoords.length})</div><div className="text-sm text-amber-700 mt-1">{missingCoords.map(h=>h.hospital_name).join(' • ')}</div></div><button onClick={openHospitalConfig} className="bg-amber-600 text-white px-5 py-2.5 rounded-xl font-bold shrink-0">ไปกรอกพิกัด</button></div></div>}

          <Modal title="จัดการพิกัด รพ.สต. สำหรับแผนที่" isOpen={showCoordinateManager} onClose={()=>setShowCoordinateManager(false)} maxWidth="max-w-5xl">
            <div className="mb-4 bg-sky-50 border border-sky-100 rounded-xl p-4 text-sm text-sky-800">
              <i className="fa-solid fa-circle-info mr-2"></i>ส่วนนี้จัดการเฉพาะ Latitude/Longitude สำหรับ Map Dashboard เท่านั้น และไม่เปลี่ยนหน้า "จัดการฐานข้อมูล" เดิม
            </div>
            <div className="overflow-x-auto border rounded-xl">
              <table className="w-full text-sm whitespace-nowrap">
                <thead className="bg-slate-50 border-b"><tr><th className="p-3 text-left">รหัส</th><th className="p-3 text-left">รพ.สต.</th><th className="p-3 text-left">พิกัดปัจจุบัน</th><th className="p-3 text-center">สถานะ</th><th className="p-3 text-center">จัดการ</th></tr></thead>
                <tbody>{dashboardData.map(h=><tr key={h.hospitalId} className="border-b hover:bg-slate-50"><td className="p-3 font-mono text-slate-500">{h.hospital_id}</td><td className="p-3 font-bold text-slate-700">{h.hospital_name}</td><td className="p-3 font-mono text-xs">{h.hasCoords?`${h.lat.toFixed(6)}, ${h.lng.toFixed(6)}`:'-'}</td><td className="p-3 text-center">{h.hasCoords?<span className="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold"><i className="fa-solid fa-location-dot mr-1"></i>มีพิกัด</span>:<span className="px-2 py-1 rounded-lg bg-amber-50 text-amber-700 border border-amber-200 text-xs font-bold">ยังไม่มี</span>}</td><td className="p-3 text-center"><button onClick={()=>openCoordinateEditor(h)} className="bg-sky-600 hover:bg-sky-700 text-white px-3 py-1.5 rounded-lg font-bold"><i className="fa-solid fa-pen-to-square mr-1"></i>{h.hasCoords?'แก้พิกัด':'เพิ่มพิกัด'}</button></td></tr>)}</tbody>
              </table>
            </div>
          </Modal>

          <Modal title={`พิกัด: ${coordTarget?.hospitalName || ''}`} isOpen={!!coordTarget} onClose={()=>!isSavingCoordinate&&setCoordTarget(null)} maxWidth="max-w-lg">
            {coordTarget && <div className="space-y-4">
              <div className="bg-slate-50 rounded-xl p-3 border"><div className="font-bold text-slate-800">{coordTarget.hospitalName}</div><div className="text-xs font-mono text-slate-400">{coordTarget.hospitalId}</div></div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label className="text-sm font-bold text-slate-600 block mb-1">Latitude</label><input type="number" step="any" value={coordTarget.lat} onChange={e=>setCoordTarget({...coordTarget,lat:e.target.value})} placeholder="เช่น 10.245631" className="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-sky-500" /></div>
                <div><label className="text-sm font-bold text-slate-600 block mb-1">Longitude</label><input type="number" step="any" value={coordTarget.lng} onChange={e=>setCoordTarget({...coordTarget,lng:e.target.value})} placeholder="เช่น 99.108521" className="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-sky-500" /></div>
              </div>
              <div className="text-xs text-slate-500 bg-sky-50 border border-sky-100 rounded-xl p-3"><i className="fa-solid fa-circle-info mr-1"></i>คัดลอกพิกัดจาก Google Maps/OpenStreetMap ได้โดยตรง รูปแบบ WGS84</div>
              <div className="flex justify-between gap-3 pt-2">
                <button disabled={isSavingCoordinate} onClick={()=>setCoordTarget({...coordTarget,lat:'',lng:''})} className="px-4 py-2.5 rounded-xl bg-red-50 text-red-600 font-bold hover:bg-red-100"><i className="fa-solid fa-location-crosshairs mr-1"></i>ล้างพิกัด</button>
                <div className="flex gap-2"><button disabled={isSavingCoordinate} onClick={()=>setCoordTarget(null)} className="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold">ยกเลิก</button><button disabled={isSavingCoordinate} onClick={saveCoordinate} className="px-5 py-2.5 rounded-xl bg-sky-600 text-white font-bold shadow hover:bg-sky-700 disabled:opacity-50">{isSavingCoordinate?<><i className="fa-solid fa-spinner fa-spin mr-2"></i>กำลังบันทึก</>:<><i className="fa-solid fa-save mr-2"></i>บันทึกพิกัด</>}</button></div>
              </div>
            </div>}
          </Modal>
        </div>
      );
    };

const AdminConfigView = ({ ctx }) => {
      const [activeTab, setActiveTab] = useState(ctx.adminActiveTab || 'drugs');
      const [editTarget, setEditTarget] = useState(null); 
      const [isSaving, setIsSaving] = useState(false);
      
      const [fuzzyList, setFuzzyList] = useState([]); // ⭐️ State สำหรับระบบ Badge ของ Fuzzy
      // เก็บ filter ของหน้ารายการยาไว้ที่ parent + localStorage เพื่อไม่ reset หลังเปิด/ปิดหน้าแก้ไขหรือกลับมาหน้านี้
      const [drugSearchTerm, setDrugSearchTerm] = useState(() => {
        try { return safeText(JSON.parse(localStorage.getItem('sawee_rxfill_admin_drug_filter_v1') || '{}')?.search); } catch(e) { return ''; }
      });
      const [drugTypeFilter, setDrugTypeFilter] = useState(() => {
        try { return safeText(JSON.parse(localStorage.getItem('sawee_rxfill_admin_drug_filter_v1') || '{}')?.type, 'all') || 'all'; } catch(e) { return 'all'; }
      });

      useEffect(() => { ctx.setAdminActiveTab(activeTab); }, [activeTab]);
      useEffect(() => {
        try { localStorage.setItem('sawee_rxfill_admin_drug_filter_v1', JSON.stringify({ search:drugSearchTerm, type:drugTypeFilter })); } catch(e) {}
      }, [drugSearchTerm, drugTypeFilter]);

      // ⭐️ ดึง Fuzzy เข้า State แยกต่างหากเมื่อเปิดกล่องแก้ข้อมูลยา
      useEffect(() => {
         if (editTarget && editTarget.col === 'master_drugs') {
             const existingFuzzy = cleanFuzzyAliases(editTarget.data.fuzzy, editTarget.data.drug_name);
             setFuzzyList(existingFuzzy);
         }
      }, [editTarget]);

      const executeDelete = async (col, id) => {
        try {
          const batch = db.batch();
          batch.delete(db.collection(col).doc(id));
          addAuditToBatch(batch, ctx.currentUser, 'ADMIN_DELETE', col, id, {});
          await batch.commit();
          ctx.showToast('ลบข้อมูลสำเร็จ'); await ctx.refreshData(); 
        } catch(e) { ctx.showToast(e.message, 'error'); }
      };

      const handleSave = async (col, id, data) => {
        setIsSaving(true);
        try {
          const batch = db.batch();
          batch.set(db.collection(col).doc(id), { ...data, updated_at: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          addAuditToBatch(batch, ctx.currentUser, 'ADMIN_SAVE', col, id, { fields: Object.keys(data || {}) });
          await batch.commit();
          ctx.showToast('อัปเดตข้อมูลสำเร็จ'); await ctx.refreshData(); setEditTarget(null);
        } catch(e) { ctx.showToast(e.message, 'error'); } finally { setIsSaving(false); }
      };

      const handleSaveForm = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd);
        let payload = {};
        let docId = editTarget.data.id || data.drug_id || data.unit_id || data.hospital_id || data.type_id;
        
        if (editTarget.col === 'master_drugs') {
           docId = data.drug_id;
           // ⭐️ กรองคำพ้องที่ว่างและคำซ้ำออกก่อนเซฟ
           const finalFuzzy = cleanFuzzyAliases(fuzzyList, data.drug_name).join(',');
           const packSize = safePackSize(data.pack_size);
           const unpacked = data.unpacked === "true";
           const rawDispenseStep = toNonNegativeNumber(data.dispense_step, 0);
           const lockedDispenseStep = rawDispenseStep > 0
             ? (unpacked ? rawDispenseStep : Math.ceil(rawDispenseStep / packSize) * packSize)
             : 0;
           const maximumRaw = toNonNegativeNumber(data.maximum_qty, 0);
           const maximumQty = normalizeMaximumQty(maximumRaw, { pack_size:packSize, unpacked, dispense_step:lockedDispenseStep });
           payload = {
             drug_id: safeText(data.drug_id), drug_name: safeText(data.drug_name), type: safeText(data.type, '1') || '1',
             pack_size: packSize, usage_multiplier: Math.max(1, toNonNegativeNumber(data.usage_multiplier, 1)), dispense_step: lockedDispenseStep, maximum_qty: maximumQty,
             price: toNonNegativeNumber(data.price), unit_id: safeText(data.unit_id), unpacked, fuzzy: finalFuzzy,
             status: data.status === 'discontinued' ? 'ยกเลิกใช้' : 'Active',
             needs_vmi_setup: false,
             app_master_reviewed_at: firebase.firestore.FieldValue.serverTimestamp(),
             schema_version: APP_SCHEMA_VERSION
           };
           if (!unpacked && rawDispenseStep > 0 && lockedDispenseStep !== rawDispenseStep) {
             ctx.showToast(`ยานี้ห้ามแตกย่อย: รอบจ่าย ${rawDispenseStep} ถูกปรับเป็น ${lockedDispenseStep} ให้ลงตัวกับ Pack ${packSize}`);
           } else if (maximumRaw > 0 && Math.abs(maximumQty - maximumRaw) > 0.000001) {
             ctx.showToast(`Maximum ถูกปรับ ${maximumRaw} → ${maximumQty} ให้ลงตัวกับรอบจ่าย ${getDispenseStep({pack_size:packSize,unpacked,dispense_step:lockedDispenseStep})}`);
           }
        } else if (editTarget.col === 'master_unit') {
           docId = data.unit_id; payload = { unit_id: data.unit_id, unit_name: data.unit_name };
        } else if (editTarget.col === 'master_drug_types') {
           docId = data.type_id; payload = { [data.type_id]: data.type_name }; 
          const batch = db.batch();
          batch.set(db.collection('config').doc('drug_types'), payload, { merge: true });
          addAuditToBatch(batch, ctx.currentUser, 'ADMIN_SAVE', 'config', 'drug_types', { type_id: data.type_id });
          await batch.commit();
          ctx.showToast('อัปเดตหมวดหมู่สำเร็จ'); await ctx.refreshData(); setEditTarget(null); return;
        } else if (editTarget.col === 'master_hospitals') {
           docId = data.hospital_id; payload = { hospital_id: data.hospital_id, hospital_name: data.hospital_name, affiliation: data.affiliation, invs_dept_id: safeText(data.invs_dept_id), invs_stock_id: safeText(data.invs_stock_id) };
        } else if (editTarget.col === 'users') {
          docId = editTarget.data.id;
          payload = {
            name: safeText(data.name),
            email: safeText(editTarget.data.email),
            position: safeText(data.position),
            hospital_id: safeText(data.hospital_id),
            role: data.role === 'admin' ? 'admin' : 'hospital'
          };
        }
        await handleSave(editTarget.col, docId, payload);
      };

      const handleInlineDrugUpdate = async (drug, field, rawValue) => {
        if (!drug?.drug_id) return;
        let patch = {};
        try {
          if (field === 'status') {
            patch.status = rawValue === 'discontinued' ? 'ยกเลิกใช้' : 'Active';
          } else if (field === 'usage_multiplier') {
            patch.usage_multiplier = Math.max(1, toNonNegativeNumber(rawValue, 1));
          } else if (field === 'unit_id') {
            patch.unit_id = safeText(rawValue);
          } else if (field === 'unpacked') {
            const unpacked = rawValue === true || rawValue === 'true';
            const packSize = safePackSize(drug.pack_size);
            const rawStep = toNonNegativeNumber(drug.dispense_step, 0);
            const lockedStep = rawStep > 0 ? (unpacked ? rawStep : Math.ceil(rawStep / packSize) * packSize) : 0;
            const maximumRaw = getMaximumQty(drug);
            patch.unpacked = unpacked;
            patch.dispense_step = lockedStep;
            if (maximumRaw > 0) patch.maximum_qty = normalizeMaximumQty(maximumRaw, {pack_size:packSize,unpacked,dispense_step:lockedStep});
          } else if (field === 'maximum_qty') {
            const raw = toNonNegativeNumber(rawValue, 0);
            patch.maximum_qty = normalizeMaximumQty(raw, drug);
            if (raw > 0 && Math.abs(raw - patch.maximum_qty) > 0.000001) {
              ctx.showToast(`Maximum ${drug.drug_name} ถูกปรับ ${raw} → ${patch.maximum_qty} ให้ลงตัวกับรอบจ่าย`);
            }
          } else return;

          const batch = db.batch();
          batch.set(db.collection('master_drugs').doc(String(drug.drug_id)), { ...patch, updated_at:firebase.firestore.FieldValue.serverTimestamp(), app_master_reviewed_at:firebase.firestore.FieldValue.serverTimestamp(), schema_version:APP_SCHEMA_VERSION }, {merge:true});
          addAuditToBatch(batch, ctx.currentUser, 'ADMIN_INLINE_DRUG_UPDATE', 'master_drugs', String(drug.drug_id), { field, value:patch[field] ?? rawValue, fields:Object.keys(patch) });
          await batch.commit();
          ctx.setAppDb(prev => ({ ...prev, drugs:(prev.drugs || []).map(d => String(d.drug_id) === String(drug.drug_id) ? { ...d, ...patch } : d) }));
          ctx.showToast(`บันทึก ${drug.drug_name} แล้ว`);
        } catch(e) {
          ctx.showToast('บันทึกไม่สำเร็จ: ' + (e?.message || e), 'error');
          await ctx.refreshData();
        }
      };

      const TabBtn = ({id, icon, label}) => (
        <button onClick={()=>setActiveTab(id)} className={`px-4 py-3 font-bold rounded-t-xl transition border-b-4 ${activeTab === id ? 'bg-white text-emerald-700 border-emerald-500' : 'bg-slate-100 text-slate-500 border-transparent hover:bg-slate-200'}`}><i className={`fa-solid ${icon} mr-2`}></i> {label}</button>
      );

      const TypeManager = () => {
         const types = ctx.appDb.drugTypes || DEFAULT_DRUG_TYPES;

         const deleteType = async (typeId) => {
             try {
                 await db.collection('config').doc('drug_types').update({
                     [typeId]: firebase.firestore.FieldValue.delete()
                 });
                 ctx.showToast('ลบหมวดหมู่สำเร็จ');
                 ctx.refreshData();
             } catch(e) { ctx.showToast(e.message, 'error'); }
         };

         return (
            <div className="p-6">
               <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-lg text-slate-800">จัดการหมวดหมู่ยา</h3>
                  <button onClick={()=>setEditTarget({ col: 'master_drug_types', data: {}, isNew: true })} className="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg hover:scale-105 transition"><i className="fa-solid fa-plus mr-1"></i> เพิ่มหมวดหมู่ใหม่</button>
               </div>
               <div className="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                 <table className="w-full text-left text-sm border-collapse">
                   <thead className="bg-slate-50 border-b"><tr><th className="p-4">รหัสหมวด (Type ID)</th><th className="p-4">ชื่อหมวดหมู่</th><th className="p-4 text-center">จัดการ</th></tr></thead>
                   <tbody>
                     {Object.keys(types).map(k=>(
                       <tr key={k} className="border-b hover:bg-slate-50">
                         <td className="p-4 font-mono font-bold text-indigo-600">{k}</td>
                         <td className="p-4 font-bold text-slate-800">{types[k]}</td>
                         <td className="p-4 text-center space-x-2">
                           <button onClick={()=>setEditTarget({ col: 'master_drug_types', data: {type_id: k, type_name: types[k]}, isNew: false })} className="text-blue-500 hover:text-blue-700 bg-blue-50 w-8 h-8 rounded-lg"><i className="fa-solid fa-pen-to-square"></i></button>
                           <button onClick={()=>ctx.setConfirmDialog({title:'ยืนยันลบข้อมูล', message:`คุณต้องการลบหมวดหมู่ ${types[k]} ใช่หรือไม่?`, onConfirm: ()=>deleteType(k), iconColor:'text-red-500', confirmBtnClass:'bg-red-500 hover:bg-red-600'})} className="text-red-500 hover:text-red-700 bg-red-50 w-8 h-8 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                         </td>
                       </tr>
                     ))}
                   </tbody>
                 </table>
               </div>
            </div>
         );
      };

      const DrugManager = () => {

        const requestCleanAllFuzzy = () => {
          let beforeCount = 0;
          let afterCount = 0;
          let changedDrugs = 0;
          ctx.appDb.drugs.forEach(d => {
            const before = String(d.fuzzy || '').split(',').map(x => safeText(x)).filter(Boolean);
            const after = cleanFuzzyAliases(before, d.drug_name);
            beforeCount += before.length;
            afterCount += after.length;
            if (before.join(',') !== after.join(',')) changedDrugs++;
          });
          const removed = beforeCount - afterCount;
          if (removed <= 0) return ctx.showToast('ไม่พบ Fuzzy ซ้ำที่ต้องล้าง');

          ctx.setConfirmDialog({
            title: 'ล้าง Fuzzy ซ้ำทั้งหมด?',
            message: `พบ Fuzzy ${beforeCount} รายการ จะลบรายการซ้ำ/รายการที่ซ้ำกับชื่อยาหลัก ${removed} รายการ เหลือ ${afterCount} รายการ กระทบยา ${changedDrugs} รายการ`,
            icon: 'fa-broom',
            iconColor: 'text-indigo-500',
            confirmBtnClass: 'bg-indigo-600 hover:bg-indigo-700',
            confirmText: 'ล้าง Fuzzy ซ้ำ',
            onConfirm: async () => {
              try {
                const ops = [];
                ctx.appDb.drugs.forEach(d => {
                  const before = String(d.fuzzy || '').split(',').map(x => safeText(x)).filter(Boolean);
                  const after = cleanFuzzyAliases(before, d.drug_name);
                  if (before.join(',') !== after.join(',')) {
                    ops.push({
                      type: 'update',
                      ref: db.collection('master_drugs').doc(d.drug_id),
                      data: { fuzzy: after.join(','), fuzzy_cleaned_at: firebase.firestore.FieldValue.serverTimestamp(), schema_version: APP_SCHEMA_VERSION }
                    });
                  }
                });
                if (ops.length) await executeBatchChunks(ops);
                await writeAuditLog(ctx.currentUser, 'FUZZY_CLEAN_ALL', 'master_drugs', 'ALL', { before_count: beforeCount, after_count: afterCount, removed_count: removed, changed_drugs: changedDrugs });
                await ctx.refreshData();
                ctx.showToast(`ล้าง Fuzzy ซ้ำแล้ว ${removed} รายการ`);
              } catch (e) {
                ctx.showToast('ล้าง Fuzzy ไม่สำเร็จ: ' + e.message, 'error');
              }
            }
          });
        };

        const handleCSVUpload = (e) => {
          const file = e.target.files[0];
          if(!file) return;
          Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: async (results) => {
              const ops = results.data.map(row => {
                const isUnpacked = String(row.unpacked).toUpperCase() === 'TRUE';
                const packSize = safePackSize(row.pack_size);
                const rawDispenseStep = toNonNegativeNumber(row.dispense_step, 0);
                const lockedDispenseStep = rawDispenseStep > 0
                  ? (isUnpacked ? rawDispenseStep : Math.ceil(rawDispenseStep / packSize) * packSize)
                  : 0;
                const existingDrug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(row.drug_id));
                const incomingStatus = safeText(row.status || row.drug_status || row.use_status || row.active || row.is_active);
                const status = incomingStatus ? normalizeDrugMasterStatus(incomingStatus) : (isDrugDiscontinued(existingDrug) ? 'ยกเลิกใช้' : 'Active');
                return {
                  type: 'set', ref: db.collection('master_drugs').doc(row.drug_id),
                  data: {
                    drug_id: row.drug_id, drug_name: row.drug_name, pack_size: packSize,
                    unit_id: row.unit_id, price: toNonNegativeNumber(row.price), type: String(row.type) || '1', unpacked: isUnpacked,
                    usage_multiplier: Math.max(1, toNonNegativeNumber(row.usage_multiplier, 1)), dispense_step: lockedDispenseStep,
                    maximum_qty: normalizeMaximumQty(row.maximum_qty ?? row.maximum ?? row.max_qty, {pack_size:packSize,unpacked:isUnpacked,dispense_step:lockedDispenseStep}),
                    fuzzy: cleanFuzzyAliases(row.fuzzy, row.drug_name).join(','),
                    status,
                    schema_version: APP_SCHEMA_VERSION
                  }
                };
              }).filter(op => op.data.drug_id);
              await executeBatchChunks(ops);
              ctx.refreshData(); ctx.showToast('อัปโหลดและอัปเดตข้อมูลยาผ่าน CSV สำเร็จ');
              e.target.value = null;
            }
          });
        };

        // ค้นหาชื่อ/รหัส/Fuzzy + กรองหมวด และคง filter ล่าสุดไว้แม้เปิดหน้าแก้ไขแล้วกลับ
        const q = drugSearchTerm.trim().toLowerCase();
        const filteredDrugs = ctx.appDb.drugs.filter(d => {
          const matchesText = !q || (d.drug_name || '').toLowerCase().includes(q) || (d.drug_id || '').toLowerCase().includes(q) || (d.fuzzy || '').toLowerCase().includes(q);
          const matchesType = drugTypeFilter === 'all' || String(d.type || '1') === String(drugTypeFilter);
          return matchesText && matchesType;
        }).sort(sortDrugs);

        return (
          <div className="p-6">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-indigo-50 p-4 rounded-xl mb-6 gap-4 border border-indigo-100">
              <div>
                <h3 className="font-bold text-indigo-800">นำเข้า/อัปเดตยาด้วยไฟล์ CSV</h3>
                <p className="text-xs text-indigo-600 mt-1">INVS Master Sync เป็นแหล่งหลักของ price / pack_size / unit_id ส่วน CSV นี้ใช้สำหรับงานเฉพาะกิจ; type / unpacked / fuzzy / usage_multiplier / dispense_step / maximum_qty / status ยังคงเป็นค่าที่ดูแลใน Sawee Rxfill</p>
              </div>
              <label className="bg-indigo-600 text-white px-4 py-2 rounded-lg cursor-pointer font-bold hover:bg-indigo-700 shrink-0 shadow-lg">
                <i className="fa-solid fa-file-csv mr-2"></i>อัปโหลด CSV ยา <input type="file" accept=".csv" className="hidden" onChange={handleCSVUpload}/>
              </label>
            </div>
            
            <div className="flex justify-between items-center mb-4 gap-3 flex-wrap">
               <div className="relative w-full max-w-sm">
                 <i className="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                 <input type="text" placeholder="ค้นหารายการยา / รหัส / Fuzzy..." className="w-full pl-10 pr-4 py-3 border rounded-xl outline-none focus:border-emerald-500" value={drugSearchTerm} onChange={e=>setDrugSearchTerm(e.target.value)} />
               </div>
               <select value={drugTypeFilter} onChange={e=>setDrugTypeFilter(e.target.value)} className="min-w-[220px] p-3 border rounded-xl bg-white font-bold text-slate-700 outline-none focus:border-emerald-500">
                 <option value="all">ทุกหมวดหมู่</option>
                 {Object.keys(ctx.appDb.drugTypes || DEFAULT_DRUG_TYPES).sort((a,b)=>String((ctx.appDb.drugTypes||DEFAULT_DRUG_TYPES)[a]).localeCompare(String((ctx.appDb.drugTypes||DEFAULT_DRUG_TYPES)[b]),'th')).map(k=><option key={k} value={k}>{(ctx.appDb.drugTypes || DEFAULT_DRUG_TYPES)[k]}</option>)}
               </select>
               {(drugSearchTerm || drugTypeFilter !== 'all') && <button onClick={()=>{setDrugSearchTerm('');setDrugTypeFilter('all')}} className="px-3 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 font-bold hover:bg-slate-100"><i className="fa-solid fa-xmark mr-1"></i>ล้างตัวกรอง</button>}
               <div className="flex gap-2 ml-auto">
                 <button onClick={requestCleanAllFuzzy} className="bg-indigo-100 text-indigo-700 border border-indigo-200 px-4 py-3 rounded-xl font-bold shrink-0 hover:bg-indigo-200 transition" title="ลบ Fuzzy ที่ซ้ำกันหลัง normalize โดยไม่ทำงานอัตโนมัติตอน Login">
                   <i className="fa-solid fa-broom mr-1"></i> ล้าง Fuzzy ซ้ำ
                 </button>
                 <button onClick={()=>setEditTarget({ col: 'master_drugs', data: {}, isNew: true })} className="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg shrink-0 hover:scale-105 transition">
                   <i className="fa-solid fa-plus mr-1"></i> เพิ่มรายการยา
                 </button>
               </div>
            </div>

            <div className="border border-slate-200 rounded-xl shadow-sm overflow-visible">
              <table className="w-full min-w-[1780px] text-left text-sm border-collapse whitespace-nowrap">
                <thead className="bg-slate-100 border-b sticky top-0 z-10">
                  <tr><th className="p-4">รหัส</th><th className="p-4">หมวด</th><th className="p-4">ชื่อยา</th><th className="p-4 text-center">สถานะ</th><th className="p-4">ชื่อพ้อง (Fuzzy)</th><th className="p-4 text-center">Pack</th><th className="p-4 text-center">ตัวคูณยอดใช้</th><th className="p-4 text-center">รอบจ่าย</th><th className="p-4 text-center">Maximum</th><th className="p-4 text-center">หน่วย</th><th className="p-4 text-center">แตกย่อย</th><th className="p-4 text-right">ราคา (฿)</th><th className="p-4 text-center">จัดการ</th></tr>
                </thead>
                <tbody>
                  {filteredDrugs.map(d=>(
                    <tr key={d.id} className={`border-b transition ${isDrugDiscontinued(d) ? 'bg-slate-100 text-slate-500 hover:bg-slate-200' : 'hover:bg-slate-50'}`}>
                      <td className="p-4 font-mono text-slate-500">{d.drug_id}</td>
                      <td className="p-4 font-bold text-slate-600">{(ctx.appDb.drugTypes || DEFAULT_DRUG_TYPES)[d.type] || DEFAULT_DRUG_TYPES['1']}</td>
                      <td className="p-4 font-bold text-slate-800"><div>{d.drug_name}</div>{d.needs_vmi_setup && <div className="mt-1"><span className="bg-amber-100 text-amber-800 border border-amber-200 rounded px-2 py-0.5 text-[10px] font-black">ใหม่จาก INVS • รอตั้งค่า VMI</span></div>}{safeText(d.master_sync_source)==='INVS' && <div className="text-[9px] text-emerald-600 mt-1">INVS Master Sync</div>}</td>
                      <td className="p-3 text-center"><select value={isDrugDiscontinued(d)?'discontinued':'active'} onChange={e=>handleInlineDrugUpdate(d,'status',e.target.value)} className={`w-[105px] rounded-lg border px-2 py-1.5 text-[11px] font-black outline-none ${isDrugDiscontinued(d)?'bg-slate-700 text-white border-slate-700':'bg-emerald-50 text-emerald-700 border-emerald-200'}`}><option value="active">Active</option><option value="discontinued">ยกเลิกใช้</option></select></td>
                      <td className="p-4 whitespace-normal">
                        <div className="flex flex-wrap gap-1 max-w-[250px]">
                           {/* ⭐️ แสดง Fuzzy แบบป้ายในตาราง */}
                           {cleanFuzzyAliases(d.fuzzy, d.drug_name).length ? cleanFuzzyAliases(d.fuzzy, d.drug_name).map((f, i) => <span key={i} className="bg-slate-100 text-slate-600 text-[10px] px-1.5 py-0.5 rounded border border-slate-200">{f}</span>) : '-'}
                        </div>
                      </td>
                      <td className="p-4 text-center font-medium text-slate-600">{d.pack_size}</td>
                      <td className="p-3 text-center"><input key={`um-${d.drug_id}-${getUsageMultiplier(d)}`} type="number" min="1" step="0.0001" defaultValue={getUsageMultiplier(d)} onBlur={e=>{const v=Math.max(1,toNonNegativeNumber(e.target.value,1));if(Math.abs(v-getUsageMultiplier(d))>0.000001) handleInlineDrugUpdate(d,'usage_multiplier',v);}} onKeyDown={e=>{if(e.key==='Enter') e.currentTarget.blur();}} className="w-20 rounded-lg border border-indigo-200 bg-indigo-50 px-2 py-1.5 text-center font-black text-indigo-700 outline-none focus:ring-2 focus:ring-indigo-400" /></td>
                      <td className="p-4 text-center">{toNonNegativeNumber(d.dispense_step, 0) > 0 ? <span className="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded font-bold text-xs">{d.dispense_step}</span> : <span className="text-slate-300">Auto</span>}</td>
                      <td className="p-3 text-center"><input key={`max-${d.drug_id}-${getMaximumQty(d)}`} type="number" min="0" step={Math.max(1,getDispenseStep(d))} defaultValue={getMaximumQty(d) || 0} title="0 = ไม่จำกัดยอดเบิกสูงสุด" onBlur={e=>{const v=toNonNegativeNumber(e.target.value,0);if(Math.abs(v-getMaximumQty(d))>0.000001) handleInlineDrugUpdate(d,'maximum_qty',v);}} onKeyDown={e=>{if(e.key==='Enter') e.currentTarget.blur();}} className="w-24 rounded-lg border border-amber-200 bg-amber-50 px-2 py-1.5 text-center font-black text-amber-800 outline-none focus:ring-2 focus:ring-amber-400" /><div className="text-[9px] text-slate-400 mt-1">0 = ไม่จำกัด</div></td>
                      <td className="p-3 text-center"><select value={safeText(d.unit_id)} onChange={e=>handleInlineDrugUpdate(d,'unit_id',e.target.value)} className="max-w-[130px] rounded-lg border border-sky-200 bg-sky-50 px-2 py-1.5 text-xs font-bold text-sky-800 outline-none"><option value="">- หน่วย -</option>{ctx.appDb.units.map(u=><option key={u.id||u.unit_id} value={u.unit_id}>{u.unit_name}</option>)}</select></td>
                      <td className="p-3 text-center"><select value={d.unpacked?'true':'false'} onChange={e=>handleInlineDrugUpdate(d,'unpacked',e.target.value)} className={`w-[80px] rounded-lg border px-2 py-1.5 text-xs font-black outline-none ${d.unpacked?'bg-purple-50 text-purple-700 border-purple-200':'bg-slate-50 text-slate-600 border-slate-200'}`}><option value="true">TRUE</option><option value="false">FALSE</option></select></td>
                      <td className="p-4 text-right text-emerald-600 font-bold">{formatUnitPrice(d.price)}</td>
                      <td className="p-4 text-center space-x-2">
                        <button onClick={()=>setEditTarget({ col: 'master_drugs', data: d, isNew: false })} className="text-blue-500 hover:text-blue-700 bg-blue-50 w-8 h-8 rounded-lg"><i className="fa-solid fa-pen-to-square"></i></button>
                        <button onClick={()=>ctx.setConfirmDialog({title:'ยืนยันลบข้อมูล', message:`คุณต้องการลบยา ${d.drug_name} ใช่หรือไม่?`, onConfirm: ()=>executeDelete('master_drugs', d.drug_id), iconColor:'text-red-500', confirmBtnClass:'bg-red-500 hover:bg-red-600'})} className="text-red-500 hover:text-red-700 bg-red-50 w-8 h-8 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                      </td>
                    </tr>
                  ))}
                  {filteredDrugs.length === 0 && <tr><td colSpan="13" className="text-center p-8 text-slate-400 font-bold">ไม่พบข้อมูลยา</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      const UnitManager = () => {
        const [searchTerm, setSearchTerm] = useState('');
        
        const handleCSVUploadAndClear = (e) => {
          const file = e.target.files[0];
          if(!file) return;
          
          ctx.setConfirmDialog({
            title: 'คำเตือน: ลบข้อมูลเดิมทั้งหมด?',
            message: 'คุณกำลังจะลบข้อมูลหน่วยนับเดิมทิ้งทั้งหมด แล้วนำเข้าข้อมูลใหม่จากไฟล์ CSV ยืนยันหรือไม่?',
            icon: 'fa-triangle-exclamation',
            iconColor: 'text-red-500',
            confirmBtnClass: 'bg-red-600 hover:bg-red-700',
            confirmText: 'ยืนยัน ลบและนำเข้า',
            onConfirm: () => {
               Papa.parse(file, {
                 header: true, skipEmptyLines: true,
                 complete: async (results) => {
                   setIsSaving(true);
                   try {
                     const existingDocs = await db.collection('master_unit').get();
                     const deleteOps = existingDocs.docs.map(doc => ({ type: 'delete', ref: db.collection('master_unit').doc(doc.id) }));
                     
                     const setOps = results.data.map(row => ({
                       type: 'set', ref: db.collection('master_unit').doc(row.unit_id), data: { unit_id: row.unit_id, unit_name: row.unit_name }
                     })).filter(op => op.data.unit_id);
                     
                     await executeBatchChunks([...deleteOps, ...setOps]);
                     ctx.refreshData(); ctx.showToast('ล้างข้อมูลเดิมและนำเข้า CSV หน่วยนับแล้ว');
                   } catch(err) {
                     ctx.showToast(err.message, 'error');
                   } finally {
                     setIsSaving(false);
                     e.target.value = null;
                   }
                 }
               });
            }
          });
        };

        const filteredUnits = ctx.appDb.units.filter(u => 
          (u.unit_name || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
          (u.unit_id || '').toLowerCase().includes(searchTerm.toLowerCase())
        );

        return (
          <div className="p-6">
            <div className="flex justify-between items-center bg-red-50 p-4 rounded-xl mb-6 border border-red-100">
              <div>
                 <h3 className="font-bold text-red-800"><i className="fa-solid fa-triangle-exclamation mr-2"></i> ลบข้อมูลเดิม และนำเข้า CSV หน่วยนับใหม่</h3>
                 <p className="text-xs text-red-600 mt-1">คอลัมน์: unit_id, unit_name (จะลบข้อมูลหน่วยเดิมที่มีอยู่ทั้งหมดทิ้ง)</p>
              </div>
              <label className="bg-red-600 text-white px-4 py-2 rounded-lg cursor-pointer font-bold hover:bg-red-700 shadow-lg transition">
                 อัปโหลดไฟล์ CSV <input type="file" accept=".csv" className="hidden" onChange={handleCSVUploadAndClear}/>
              </label>
            </div>
            <div className="flex justify-between items-center mb-4 gap-4">
               <div className="relative w-full max-w-sm">
                 <i className="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                 <input type="text" placeholder="ค้นหาหน่วยนับ..." className="w-full pl-10 pr-4 py-3 border rounded-xl outline-none focus:border-emerald-500" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} />
               </div>
               <button onClick={()=>setEditTarget({ col: 'master_unit', data: {}, isNew: true })} className="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:scale-105 transition">
                 <i className="fa-solid fa-plus mr-1"></i> เพิ่มหน่วยนับ
               </button>
            </div>
            <div className="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
              <table className="w-full text-left text-sm border-collapse">
                <thead className="bg-slate-50 border-b"><tr><th className="p-4">รหัสหน่วย</th><th className="p-4">ชื่อหน่วย</th><th className="p-4 text-center">จัดการ</th></tr></thead>
                <tbody>
                  {filteredUnits.map(u=>(
                    <tr key={u.id} className="border-b hover:bg-slate-50">
                      <td className="p-4 font-mono">{u.unit_id}</td>
                      <td className="p-4 font-bold text-slate-800">{u.unit_name}</td>
                      <td className="p-4 text-center space-x-2">
                        <button onClick={()=>setEditTarget({ col: 'master_unit', data: u, isNew: false })} className="text-blue-500 hover:text-blue-700 bg-blue-50 w-8 h-8 rounded-lg"><i className="fa-solid fa-pen-to-square"></i></button>
                        <button onClick={()=>ctx.setConfirmDialog({title:'ยืนยันลบข้อมูล', message:`คุณต้องการลบหน่วย ${u.unit_name} ใช่หรือไม่?`, onConfirm: ()=>executeDelete('master_unit', u.unit_id), iconColor:'text-red-500', confirmBtnClass:'bg-red-500 hover:bg-red-600'})} className="text-red-500 hover:text-red-700 bg-red-50 w-8 h-8 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                      </td>
                    </tr>
                  ))}
                  {filteredUnits.length === 0 && <tr><td colSpan="3" className="text-center p-8 text-slate-400">ไม่มีข้อมูลหน่วยนับ</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      const HospitalManager = () => {
        const [searchTerm, setSearchTerm] = useState('');
        const filteredHosp = ctx.appDb.hospitals.filter(h => 
          (h.hospital_name || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
          (h.hospital_id || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (h.invs_dept_id || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (h.invs_stock_id || '').toLowerCase().includes(searchTerm.toLowerCase())
        );
        return (
          <div className="p-6">
            <div className="flex justify-between items-center mb-4 gap-4">
               <div className="relative w-full max-w-sm">
                 <i className="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                 <input type="text" placeholder="ค้นหา รพ.สต...." className="w-full pl-10 pr-4 py-3 border rounded-xl outline-none focus:border-emerald-500" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} />
               </div>
               <button onClick={()=>setEditTarget({ col: 'master_hospitals', data: {}, isNew: true })} className="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:scale-105 transition">
                 <i className="fa-solid fa-plus mr-1"></i> เพิ่ม รพ.สต.
               </button>
            </div>
            <div className="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
              <table className="w-full text-left text-sm border-collapse">
                <thead className="bg-slate-50 border-b"><tr><th className="p-4">รหัส</th><th className="p-4">สังกัด</th><th className="p-4">ชื่อ รพ.สต.</th><th className="p-4">INVS Dept</th><th className="p-4">INVS Stock</th><th className="p-4 text-center">จัดการ</th></tr></thead>
                <tbody>
                  {filteredHosp.map(h=>(
                    <tr key={h.id} className="border-b hover:bg-slate-50">
                      <td className="p-4 font-mono">{h.hospital_id}</td>
                      <td className="p-4 font-bold text-indigo-600">{h.affiliation === 'OPT' ? 'อปท.' : 'สสอ.'}</td>
                      <td className="p-4 font-bold text-slate-800">{h.hospital_name}</td>
                      <td className="p-4 font-mono font-bold text-cyan-700">{h.invs_dept_id || '-'}</td>
                      <td className="p-4 font-mono text-slate-600">{h.invs_stock_id || '10'}</td>
                      <td className="p-4 text-center space-x-2">
                        <button onClick={()=>setEditTarget({ col: 'master_hospitals', data: h, isNew: false })} className="text-blue-500 hover:text-blue-700 bg-blue-50 w-8 h-8 rounded-lg"><i className="fa-solid fa-pen-to-square"></i></button>
                        <button onClick={()=>ctx.setConfirmDialog({title:'ยืนยันลบข้อมูล', message:`คุณต้องการลบ ${h.hospital_name} ใช่หรือไม่?`, onConfirm: ()=>executeDelete('master_hospitals', h.hospital_id), iconColor:'text-red-500', confirmBtnClass:'bg-red-500 hover:bg-red-600'})} className="text-red-500 hover:text-red-700 bg-red-50 w-8 h-8 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      const UserManager = () => {
        return (
          <div className="p-6">
            <div className="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
              <table className="w-full text-left text-sm border-collapse">
                <thead className="bg-slate-50 border-b"><tr><th className="p-4">ชื่อผู้ใช้งาน</th><th className="p-4">อีเมล</th><th className="p-4">ตำแหน่ง</th><th className="p-4">รพ.สต. ที่สังกัด</th><th className="p-4">ระดับสิทธิ์</th><th className="p-4 text-center">จัดการ</th></tr></thead>
                <tbody>
                  {ctx.appDb.usersList.map(u=>(
                    <tr key={u.id} className="border-b hover:bg-slate-50">
                      <td className="p-4 font-bold text-slate-800">{u.name}</td>
                      <td className="p-4 text-slate-500">{u.email}</td>
                      <td className="p-4 text-slate-600">{u.position || '-'}</td>
                      <td className="p-4 text-slate-600 font-medium">{ctx.appDb.hospitals.find(h=>h.hospital_id === u.hospital_id)?.hospital_name || u.hospital_id}</td>
                      <td className="p-4">
                        <span className={`px-2 py-1 rounded text-xs font-bold ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>{u.role === 'admin' ? 'แอดมิน' : 'รพ.สต.'}</span>
                      </td>
                      <td className="p-4 text-center space-x-2">
                        <button onClick={()=>setEditTarget({ col: 'users', data: u, isNew: false })} className="text-blue-500 hover:text-blue-700 bg-blue-50 w-8 h-8 rounded-lg"><i className="fa-solid fa-pen-to-square"></i></button>
                        <button onClick={()=>ctx.setConfirmDialog({title:'ยืนยันลบผู้ใช้งาน', message:`คุณต้องการลบโปรไฟล์ผู้ใช้งาน ${u.name} ใช่หรือไม่? บัญชี Firebase Authentication จะยังคงอยู่จนกว่าจะลบผ่าน Firebase Console/Backend แต่จะเข้าใช้งานระบบนี้ไม่ได้เพราะไม่มี profile`, onConfirm: ()=>executeDelete('users', u.id), iconColor:'text-red-500', confirmBtnClass:'bg-red-500 hover:bg-red-600'})} className="text-red-500 hover:text-red-700 bg-red-50 w-8 h-8 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      const ApproveStockManager = () => {
        const pendingAdjustments = ctx.appDb.stockAdjustments ? ctx.appDb.stockAdjustments.filter(a => a.status === 'Pending') : [];

        const handleApprove = async (adj) => {
          setIsSaving(true);
          try {
            const adjRef = db.collection('stock_adjustments').doc(adj.id);
            const currentRef = db.collection('current_excess').doc(`${adj.hospital_id}_${adj.drug_id}`);
            const auditRef = db.collection('audit_logs').doc();
            await db.runTransaction(async (tx) => {
              const [adjSnap, currentSnap] = await Promise.all([tx.get(adjRef), tx.get(currentRef)]);
              if (!adjSnap.exists) throw new Error('ไม่พบคำขอปรับสต๊อก');
              const latestAdj = adjSnap.data();
              if (latestAdj.status !== 'Pending') throw new Error('คำขอนี้ถูกดำเนินการไปแล้ว');
              const latestBalance = currentSnap.exists ? toNonNegativeNumber(currentSnap.data().excess_balance) : 0;
              if (Math.abs(latestBalance - toNonNegativeNumber(latestAdj.old_balance)) > 0.000001) {
                throw new Error(`ยอดปัจจุบันเปลี่ยนจาก ${latestAdj.old_balance} เป็น ${latestBalance} กรุณาตรวจสอบก่อนอนุมัติ`);
              }
              tx.update(adjRef, { status: 'Approved', approved_at: firebase.firestore.FieldValue.serverTimestamp(), approved_by_uid: ctx.currentUser.uid, approved_by_name: ctx.currentUser.name });
              tx.set(currentRef, { hospital_id: latestAdj.hospital_id, drug_id: latestAdj.drug_id, excess_balance: toNonNegativeNumber(latestAdj.new_balance), last_updated: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
              tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'STOCK_ADJUST_APPROVE', 'stock_adjustments', adj.id, { hospital_id: latestAdj.hospital_id, drug_id: latestAdj.drug_id, old_balance: latestBalance, new_balance: latestAdj.new_balance }));
            });
            ctx.showToast('อนุมัติปรับสต๊อกเรียบร้อยแล้ว');
            await ctx.refreshData();
          } catch(e) { ctx.showToast(e.message, 'error'); } finally { setIsSaving(false); }
        };

        const handleReject = async (adj) => {
          setIsSaving(true);
          try {
            const adjRef = db.collection('stock_adjustments').doc(adj.id);
            const auditRef = db.collection('audit_logs').doc();
            await db.runTransaction(async (tx) => {
              const snap = await tx.get(adjRef);
              if (!snap.exists) throw new Error('ไม่พบคำขอปรับสต๊อก');
              if (snap.data().status !== 'Pending') throw new Error('คำขอนี้ถูกดำเนินการไปแล้ว');
              tx.update(adjRef, { status: 'Rejected', rejected_at: firebase.firestore.FieldValue.serverTimestamp(), rejected_by_uid: ctx.currentUser.uid, rejected_by_name: ctx.currentUser.name });
              tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'STOCK_ADJUST_REJECT', 'stock_adjustments', adj.id, { hospital_id: adj.hospital_id, drug_id: adj.drug_id }));
            });
            ctx.showToast('ปฏิเสธคำขอแล้ว');
            await ctx.refreshData();
          } catch(e) { ctx.showToast(e.message, 'error'); } finally { setIsSaving(false); }
        };

        return (
          <div className="p-6">
            <div className="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
              <table className="w-full text-left border-collapse text-sm">
                <thead className="bg-slate-50 text-slate-600 border-b">
                  <tr>
                    <th className="p-4">รพ.สต.</th>
                    <th className="p-4">รายการยา</th>
                    <th className="p-4 text-center">ยอดเดิม <i className="fa-solid fa-arrow-right mx-1 text-slate-400"></i> ยอดใหม่</th>
                    <th className="p-4 w-1/4">เหตุผลในการขอปรับ</th>
                    <th className="p-4 text-center">จัดการ</th>
                  </tr>
                </thead>
                <tbody>
                  {pendingAdjustments.map(adj => {
                    const hospName = ctx.appDb.hospitals.find(h => h.hospital_id === adj.hospital_id)?.hospital_name || adj.hospital_id;
                    const drugName = ctx.appDb.drugs.find(d => d.drug_id === adj.drug_id)?.drug_name || adj.drug_id;
                    return (
                      <tr key={adj.id} className="border-b hover:bg-slate-50 transition">
                        <td className="p-4">
                           <div className="font-semibold text-slate-800">{hospName}</div>
                           <div className="text-xs text-slate-500 mt-1">ผู้ขอ: {adj.user_name}</div>
                        </td>
                        <td className="p-4 font-bold text-slate-800">{drugName} <span className="text-xs font-normal text-slate-500">[{adj.drug_id}]</span></td>
                        <td className="p-4 text-center bg-slate-50/50">
                          <span className="text-slate-400 line-through mr-2">{adj.old_balance}</span>
                          <span className="text-emerald-600 font-bold text-lg">{adj.new_balance}</span>
                        </td>
                        <td className="p-4 text-amber-700 bg-amber-50/50 italic leading-snug">"{adj.reason}"</td>
                        <td className="p-4 text-center space-x-2 whitespace-nowrap">
                          <button onClick={()=>ctx.setConfirmDialog({title:'ยืนยันอนุมัติ', message:'คุณต้องการอนุมัติปรับสต๊อกนี้ใช่หรือไม่?', onConfirm: ()=>handleApprove(adj), icon:'fa-check', confirmText:'อนุมัติ'})} className="bg-emerald-500 text-white px-3 py-2 rounded-lg shadow hover:bg-emerald-600"><i className="fa-solid fa-check mr-1"></i> อนุมัติ</button>
                          <button onClick={()=>ctx.setConfirmDialog({title:'ปฏิเสธคำขอ', message:'คุณต้องการปฏิเสธการขอปรับสต๊อกนี้ใช่หรือไม่?', onConfirm: ()=>handleReject(adj), iconColor:'text-red-500', confirmBtnClass:'bg-red-500 hover:bg-red-600'})} className="bg-red-500 text-white px-3 py-2 rounded-lg shadow hover:bg-red-600"><i className="fa-solid fa-xmark mr-1"></i> ปฏิเสธ</button>
                        </td>
                      </tr>
                    )
                  })}
                  {pendingAdjustments.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-400">ไม่มีคำขอปรับสต๊อกที่รออนุมัติ</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        );
      };


      const HistManager = () => {
         const [selHosp, setSelHosp] = useState(ctx.appDb.hospitals[0]?.hospital_id || '');
         const [localHist, setLocalHist] = useState([]);
         const [isSavingHist, setIsSavingHist] = useState(false);

         const today = new Date();
         const targetMonths = [];
         for(let i=1; i<=6; i++) {
            let m = today.getMonth() + 1 - i; let y = today.getFullYear();
            if(m <= 0) { m += 12; y -= 1; }
            targetMonths.push({ m, y, key: getYearMonthKey(m, y) });
         }
         targetMonths.reverse();

         useEffect(() => {
            const records = ctx.appDb.historicalUsages.filter(h => h.hospital_id === selHosp);
            const myPars = ctx.appDb.parLevels.filter(p => p.hospital_id === selHosp);
            const tableData = myPars.map(p => {
               const drug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(p.drug_id));
               const hist = records.find(h => String(h.drug_id) === String(p.drug_id));
               
               const monthData = {};
               targetMonths.forEach(tm => {
                  monthData[tm.key] = (hist && hist.history && hist.history[tm.key]) ? Number(hist.history[tm.key]) : 0;
               });

               return {
                  drug_id: p.drug_id,
                  drug_name: drug ? drug.drug_name : 'N/A',
                  history: monthData,
                  isDirty: false
               };
            }).sort((a,b) => a.drug_id.localeCompare(b.drug_id));
            setLocalHist(tableData);
         }, [selHosp, ctx.appDb]);

         const handleCellChange = (drugId, key, val) => {
             const numVal = Number(val) || 0;
             setLocalHist(prev => prev.map(row => {
                 if (row.drug_id === drugId) {
                     return { ...row, history: { ...row.history, [key]: numVal }, isDirty: true };
                 }
                 return row;
             }));
         };

         const saveDirtyRows = async () => {
             const dirty = localHist.filter(r => r.isDirty);
             if(dirty.length === 0) {
                 ctx.showToast('ไม่มีข้อมูลเปลี่ยนแปลง');
                 return;
             }
             setIsSavingHist(true);
             try {
                 const batches = [];
                 let currentBatch = db.batch();
                 let count = 0;
                 dirty.forEach(row => {
                     currentBatch.set(db.collection('historical_usages').doc(`${selHosp}_${row.drug_id}`), {
                         hospital_id: selHosp, drug_id: row.drug_id, 
                         history: row.history,
                         updated_at: firebase.firestore.FieldValue.serverTimestamp()
                     }, { merge: true });
                     count++;
                     if (count >= 450) { batches.push(currentBatch.commit()); currentBatch = db.batch(); count = 0; }
                 });
                 if (count > 0) batches.push(currentBatch.commit());
                 await Promise.all(batches);
                 ctx.showToast(`บันทึกประวัติตั้งต้น ${dirty.length} รายการ สำเร็จ`);
                 await ctx.refreshData();
             } catch (e) {
                 ctx.showToast(e.message, 'error');
             } finally {
                 setIsSavingHist(false);
             }
         };

         return (
            <div className="p-6">
                <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl mb-6 border border-indigo-100">
                   <div>
                       <h3 className="font-bold text-indigo-800"><i className="fa-solid fa-history mr-2"></i> จัดการฐานข้อมูลประวัติเก่า (Fallback History)</h3>
                       <p className="text-xs text-indigo-600 mt-1">แก้ไขตัวเลขประวัติเก่าสำหรับใช้เป็น "ตัวตายตัวแทน" คำนวณ Target VMI (ระบบจะดึงข้อมูลนี้ไปใช้เฉพาะเดือนที่ยังไม่มีบิลเบิกจริงในระบบเท่านั้น)</p>
                   </div>
                   <div className="flex gap-4 items-center">
                       <select className="border border-slate-300 rounded-lg p-2 font-bold text-indigo-700 outline-none shadow-sm" value={selHosp} onChange={e=>setSelHosp(e.target.value)}>
                           {ctx.appDb.hospitals.map(h=><option key={h.id} value={h.hospital_id}>{h.hospital_name}</option>)}
                       </select>
                       <button onClick={saveDirtyRows} disabled={isSavingHist} className="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg hover:scale-105 transition disabled:opacity-50">
                           {isSavingHist ? 'กำลังบันทึก...' : 'บันทึกประวัติเก่า'}
                       </button>
                   </div>
                </div>
                <div className="overflow-x-auto border border-slate-200 rounded-xl shadow-sm max-h-[600px] overflow-y-auto">
                   <table className="w-full text-left text-[13px] border-collapse whitespace-nowrap bg-white">
                      <thead className="bg-slate-100 border-b sticky top-0 z-10 shadow-sm">
                         <tr>
                            <th className="p-3 border-r border-slate-200 w-24 text-center">รหัสยา</th>
                            <th className="p-3 border-r border-slate-200 min-w-[200px]">ชื่อยา</th>
                            {targetMonths.map(tm => (
                                <th key={tm.key} className="p-3 border-r border-slate-200 text-center text-indigo-800 bg-indigo-50/50">{THAI_MONTHS[tm.m-1]}<br/>{(tm.y+543).toString().substring(2)}</th>
                            ))}
                         </tr>
                      </thead>
                      <tbody>
                         {localHist.map(row => (
                            <tr key={row.drug_id} className={`border-b border-slate-100 hover:bg-slate-50 transition ${row.isDirty ? 'bg-amber-50/30' : ''}`}>
                               <td className="p-3 font-mono text-slate-500 text-center border-r border-slate-100">{row.drug_id}</td>
                               <td className="p-3 font-bold text-slate-700 border-r border-slate-100">{row.drug_name}</td>
                               {targetMonths.map(tm => (
                                   <td key={tm.key} className="p-0 border-r border-slate-100 relative">
                                       <input 
                                           type="number" 
                                           min="0"
                                           value={row.history[tm.key]} 
                                           onChange={(e) => handleCellChange(row.drug_id, tm.key, e.target.value)}
                                           className="w-full h-full min-h-[40px] p-2 text-center bg-transparent outline-none focus:bg-white focus:ring-inset focus:ring-2 focus:ring-indigo-500 font-semibold text-slate-600"
                                       />
                                   </td>
                               ))}
                            </tr>
                         ))}
                         {localHist.length === 0 && <tr><td colSpan="9" className="p-8 text-center text-slate-400">ไม่มีข้อมูลยา (Par Level) สำหรับหน่วยงานนี้</td></tr>}
                      </tbody>
                   </table>
                </div>
            </div>
         );
      };

      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-slate-100 animate-fade-in relative ${activeTab==='drugs'?'overflow-visible min-w-[1780px]':'overflow-hidden'}`}>
          <div className="bg-slate-800 text-white p-6 flex justify-between items-center">
            <h2 className="text-2xl font-bold"><i className="fa-solid fa-server mr-2 text-emerald-400"></i> จัดการฐานข้อมูล (Admin Console)</h2>
            {isSaving && <div className="flex items-center text-emerald-400 font-bold animate-pulse"><i className="fa-solid fa-circle-notch fa-spin mr-2"></i> กำลังบันทึก...</div>}
          </div>
          <div className="flex overflow-x-auto border-b bg-slate-50 whitespace-nowrap scrollbar-hide">
            <TabBtn id="drugs" icon="fa-pills" label="รายการยาและราคา" />
            <TabBtn id="types" icon="fa-tags" label="หมวดยา" />
            <TabBtn id="units" icon="fa-box" label="หน่วยนับ" />
            <TabBtn id="hospitals" icon="fa-hospital" label="รพ.สต." />
            <TabBtn id="approve_stock" icon="fa-check-to-slot" label="อนุมัติปรับสต๊อก" />
            <TabBtn id="users" icon="fa-users" label="ผู้ใช้งาน" />
            <TabBtn id="raw_db" icon="fa-table" label="ฐานข้อมูลดิบ (Raw DB)" />
            <TabBtn id="hist_manager" icon="fa-history" label="จัดการประวัติย้อนหลัง" />
          </div>
          <div className="bg-white">
            {activeTab === 'drugs' && DrugManager()}
            {activeTab === 'types' && <TypeManager />}
            {activeTab === 'units' && <UnitManager />}
            {activeTab === 'hospitals' && <HospitalManager />}
            {activeTab === 'approve_stock' && <ApproveStockManager />}
            {activeTab === 'users' && <UserManager />}
            {activeTab === 'raw_db' && <RawDBManager />}
            {activeTab === 'hist_manager' && <HistManager />}
          </div>
          
          {editTarget && (
            <Modal title={`${editTarget.isNew ? 'เพิ่ม' : 'แก้ไข'}ข้อมูล ${editTarget.col === 'master_drugs' ? 'ยา' : editTarget.col === 'master_unit' ? 'หน่วยนับ' : editTarget.col === 'master_drug_types' ? 'หมวดหมู่' : editTarget.col === 'users' ? 'ผู้ใช้งาน' : 'รพ.สต.'}`} isOpen={true} onClose={()=>setEditTarget(null)}>
              <form className="space-y-4" onSubmit={handleSaveForm}>
                <div className="grid grid-cols-1 gap-4">
                  {editTarget.col === 'master_drugs' && (
                    <>
                      <div>
                        <label className="text-sm font-bold text-slate-600 block mb-1">รหัสยา</label>
                        <input name="drug_id" defaultValue={editTarget.data.drug_id} placeholder="เช่น 01201" className="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500" required />
                      </div>
                      <div>
                        <label className="text-sm font-bold text-slate-600 block mb-1">ชื่อยา</label>
                        <input name="drug_name" defaultValue={editTarget.data.drug_name} placeholder="ชื่อยา" className="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500" required />
                      </div>
                      
                      {/* ⭐️ แก้ไข UI สำหรับเพิ่ม/ลบ Fuzzy ทีละคำ */}
                      <div>
                        <label className="text-sm font-bold text-slate-600 block mb-1">ชื่อพ้อง (Fuzzy)</label>
                        <div className="p-3 border rounded-xl bg-slate-50 focus-within:ring-2 focus-within:ring-emerald-500 flex flex-wrap gap-2 items-center">
                           {fuzzyList.map((f, idx) => (
                              <span key={idx} className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-1 rounded flex items-center gap-1 border border-emerald-200">
                                 {f}
                                 <button type="button" onClick={() => setFuzzyList(prev => prev.filter((_, i) => i !== idx))} className="text-emerald-600 hover:text-red-500 focus:outline-none"><i className="fa-solid fa-xmark"></i></button>
                              </span>
                           ))}
                           <input 
                              type="text" 
                              placeholder="พิมพ์คำค้นหาแล้วกด Enter..." 
                              className="flex-grow bg-transparent outline-none min-w-[150px] text-sm" 
                              onKeyDown={(e) => {
                                 if (e.key === 'Enter') {
                                    e.preventDefault();
                                    const val = e.target.value.trim();
                                    if (val) {
                                       setFuzzyList(cleanFuzzyAliases([...fuzzyList, val], editTarget.data.drug_name));
                                       e.target.value = '';
                                    }
                                 }
                              }}
                           />
                        </div>

          }
          setIsInitializing(false);
        });
        return () => unsubscribe();
      }, []);

      if (isInitializing) return <FullScreenSpinner />;

      if (currentView === 'login') return <><LoginView ctx={{handleLogin, setCurrentView, showToast}} />{toast && <Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)} />}</>;
      if (currentView === 'register') return <><RegisterView ctx={{setCurrentView, showToast, appDb, registrationInProgressRef}} />{toast && <Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)} />}</>;

      const ctx = { appDb, setAppDb, currentUser, setCurrentView: requestView, forceSetCurrentView: setCurrentView, registerNavigationGuard, showToast, refreshData, currentReqId, setCurrentReqId, editReqId, setEditReqId, setConfirmDialog, adminActiveTab, setAdminActiveTab, targetUploadHosp, setTargetUploadHosp, handleLogin };

      return (
        <div className="flex h-screen bg-[#f8fafc] overflow-hidden print-safe-wrapper">
          <div className="w-64 bg-slate-900 text-white flex flex-col no-print shrink-0 shadow-2xl z-20 h-full">
            <div className="p-6 flex items-center border-b border-slate-800 bg-slate-900 shrink-0">
              <div className="bg-gradient-main p-2 rounded-lg mr-3 shadow-lg"><i className="fa-solid fa-truck-medical text-white"></i></div>
              <div><h1 className="text-xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-emerald-400">Sawee Rxfill</h1><div className="text-[9px] text-slate-500 font-mono mt-0.5">v4.14 Production</div></div>
            </div>
            <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
              <button onClick={() => requestView('dashboard')} className={`w-full text-left p-4 rounded-xl font-bold transition flex items-center ${currentView==='dashboard'?'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50':'hover:bg-slate-800 text-slate-300'}`}><i className="fa-solid fa-house w-6 text-center mr-2"></i> แดชบอร์ด</button>
              {currentUser?.role === 'hospital' && <button onClick={() => { if (currentView !== 'create_req') setEditReqId(null); requestView('create_req'); }} className={`w-full text-left p-4 rounded-xl font-bold transition flex items-center ${currentView==='create_req'?'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50':'hover:bg-slate-800 text-slate-300'}`}><i className="fa-solid fa-boxes-packing w-6 text-center mr-2"></i> เบิกยา / เติมยา</button>}
              <button onClick={() => requestView('drug_history')} className={`w-full text-left p-4 rounded-xl font-bold transition flex items-center ${currentView==='drug_history'?'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50':'hover:bg-slate-800 text-slate-300'}`}><i className="fa-solid fa-chart-line w-6 text-center mr-2"></i> ประวัติการใช้ยา</button>
              {currentUser?.role === 'admin' && <button onClick={() => requestView('map_dashboard')} className={`w-full text-left p-4 rounded-xl font-bold transition flex items-center ${currentView==='map_dashboard'?'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50':'hover:bg-slate-800 text-slate-300'}`}><i className="fa-solid fa-map-location-dot w-6 text-center mr-2"></i> VMI Map Dashboard</button>}
              {currentUser?.role === 'admin' && <button onClick={() => requestView('config')} className={`w-full text-left p-4 rounded-xl font-bold transition flex items-center ${currentView==='config'?'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50':'hover:bg-slate-800 text-slate-300'}`}><i className="fa-solid fa-database w-6 text-center mr-2"></i> จัดการฐานข้อมูล</button>}
              
              <div className="border-t border-slate-800 my-2 pt-2"></div>
              <button onClick={() => requestView('profile_edit')} className={`w-full text-left p-4 rounded-xl font-bold transition flex items-center ${currentView==='profile_edit'?'bg-slate-700 text-white':'hover:bg-slate-800 text-slate-300'}`}><i className="fa-solid fa-user-pen w-6 text-center mr-2"></i> แก้ไขข้อมูลส่วนตัว</button>
            </nav>
            <div className="p-5 border-t border-slate-800 bg-slate-900 shrink-0">
              <div className="flex items-center mb-4 text-sm text-slate-300 font-medium bg-slate-800 p-3 rounded-xl border border-slate-700">
                <div className="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold mr-3 shrink-0">{currentUser?.name?.charAt(0)}</div>
                <div className="truncate w-full">
                   <div className="truncate">{currentUser?.name}</div>
                   <div className="text-[10px] text-slate-500">{currentUser?.position || currentUser?.role}</div>
                </div>
              </div>
              <button onClick={requestLogout} className="w-full text-left p-3 rounded-xl text-red-400 hover:bg-red-500/10 font-bold border border-red-500/30 transition flex items-center justify-center"><i className="fa-solid fa-power-off mr-2"></i> ออกจากระบบ</button>
            </div>
          </div>
          <div className="flex-1 p-4 lg:p-10 overflow-auto w-full relative print-safe-wrapper print:p-0 print:bg-white">
            <div className={`${currentView==='config'?'w-max min-w-full':'max-w-7xl'} mx-auto pb-20 print-safe-wrapper print:pb-0 print:max-w-full`}>
              {currentView === 'dashboard' && <DashboardView ctx={ctx} />}
              {currentView === 'create_req' && <CreateReqView ctx={ctx} />}
              {currentView === 'view_req' && <ViewReqView ctx={ctx} />}
              {currentView === 'my_stock' && <MyStockView ctx={ctx} />}
              {currentView === 'return_drug' && <ReturnDrugView ctx={ctx} />}
              {currentView === 'map_dashboard' && currentUser?.role === 'admin' && <MapDashboardView ctx={ctx} />}
              {currentView === 'config' && <AdminConfigView ctx={ctx} />}
              {currentView === 'profile_edit' && <ProfileEditView ctx={ctx} />}
              {currentView === 'summary_report' && <SummaryReportView ctx={ctx} />}
              {currentView === 'item_usage_report' && <ItemUsageReportView ctx={ctx} />}
              {currentView === 'drug_history' && <DrugHistoryView ctx={ctx} />}
            </div>
          </div>
          <UniversalConfirmModal confirmDialog={confirmDialog} setConfirmDialog={setConfirmDialog} />
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
