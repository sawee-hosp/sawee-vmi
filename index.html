const ViewReqView = ({ ctx }) => {
      const req = ctx.appDb.requisitions.find(r => r.id === ctx.currentReqId);
      const [isApproving, setIsApproving] = useState(false);
      const [editableItems, setEditableItems] = useState(req?.items || []);
      const [showSkipped, setShowSkipped] = useState(false);
      const [skippedMapping, setSkippedMapping] = useState({});
      const [localPrintedAt, setLocalPrintedAt] = useState(null);
      const [isPrinting, setIsPrinting] = useState(false);
      
      const isHospital = ctx.currentUser?.role === 'hospital';
      const isAdmin = ctx.currentUser?.role === 'admin';
      const isPending = ['Draft','Pending'].includes(req?.status); // legacy Draft = Pending สำหรับกู้เอกสารรุ่นก่อน
      const isApprovalFailed = req?.status === 'ApprovalFailed';
      const isApprovingStatus = req?.status === 'Approving';
      const ownsReq = isHospital && String(req?.hospitalId) === String(ctx.currentUser?.hospital_id);
      const isPrinted = !!req?.is_printed || !!localPrintedAt;
      const invsSent = String(req?.invs_status || '').toUpperCase() === 'SENT' || !!req?.invs_sub_po_no;
      const invsDisplayItems = Array.isArray(req?.invs_dispense_snapshot) && req.invs_dispense_snapshot.length
        ? req.invs_dispense_snapshot
        : (Array.isArray(req?.invs_request_lot_snapshot) && req.invs_request_lot_snapshot.length
          ? req.invs_request_lot_snapshot
          : (Array.isArray(req?.invs_items_snapshot) ? req.invs_items_snapshot : []));
      const invsConfirmed = String(req?.invs_confirm_flag || '').toUpperCase() === 'Y';
      const adminEditableStatus = ['Draft','Pending','Rejected','ApprovalFailed'].includes(req?.status);
      const adminHistoricalRematchOnly = isAdmin && !adminEditableStatus && req?.status === 'Completed';
      const canAdminRematch = isAdmin && req?.status !== 'Approving' && (!invsSent || req?.status === 'Completed');
      // เมื่อส่งเข้า INVS แล้ว ล็อกการแก้รายการ/ลบ/Reject เพื่อไม่ให้ Sawee VMI ต่างจากใบที่อยู่ใน INVS
      const canEdit = !invsSent && (isAdmin ? adminEditableStatus : (isPending && ownsReq && !isPrinted));
      const canDeleteReq = !invsSent && (isAdmin ? ['Draft','Pending','Rejected','ApprovalFailed'].includes(req?.status) : (ownsReq && ['Draft','Pending','Rejected'].includes(req?.status)));
      const canApproveReq = isAdmin && (isPending || isApprovalFailed);
      const canSendInvs = isAdmin && isPending && !invsSent;
      
      const userInfo = ctx.appDb.usersList.find(u => u.name === req?.created_by_name) || { position: 'เจ้าหน้าที่', role: '' };
      const [reqName, setReqName] = useState(req?.created_by_name || '');
      const [reqPosition, setReqPosition] = useState(req?.created_by_position || userInfo?.position || 'เจ้าหน้าที่');
      const [fiscalTermDraft, setFiscalTermDraft] = useState(() => req ? getEffectiveFiscalTerm(req, ctx.appDb.requisitions) : 1);
      const [isSavingReqNo, setIsSavingReqNo] = useState(false);
      
      const [manualAddSearch, setManualAddSearch] = useState('');
      const [manualAddCandidate, setManualAddCandidate] = useState(null);
      const [manualAddQty, setManualAddQty] = useState('');
      const [isManualAddSaving, setIsManualAddSaving] = useState(false);
      const [editingPreviewQtyDrugId, setEditingPreviewQtyDrugId] = useState(null);
      const [editingQtyDraft, setEditingQtyDraft] = useState({});
      const [showHiddenItems, setShowHiddenItems] = useState(false);
      const [targetHelpData, setTargetHelpData] = useState(null);
      const [showValueAudit, setShowValueAudit] = useState(false);
      const [auditSortMode, setAuditSortMode] = useState('usage');
      const [rematchTarget, setRematchTarget] = useState(null);
      const [rematchDrugId, setRematchDrugId] = useState('');
      const [rematchRawName, setRematchRawName] = useState('');
      const [rematchRawUsage, setRematchRawUsage] = useState('');
      const [rematchSourceIndex, setRematchSourceIndex] = useState(0);
      const [isRematching, setIsRematching] = useState(false);
      const [showInvsModal, setShowInvsModal] = useState(false);
      const [invsPreflight, setInvsPreflight] = useState(null);
      const [isInvsBusy, setIsInvsBusy] = useState(false);

      const toDateSafe = (value) => {
        if (!value) return null;
        if (value instanceof Date) return value;
        if (typeof value.toDate === 'function') return value.toDate();
        if (value.seconds) return new Date(value.seconds * 1000);
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? null : d;
      };
      const printedAtDate = localPrintedAt || toDateSafe(req?.printed_at);
      const printedAtLabel = printedAtDate ? printedAtDate.toLocaleString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false }) : 'ไม่พบเวลาพิมพ์เดิม';

      const valueAudit = useMemo(() => {
        const idCounts = {};
        (editableItems || []).forEach(it => { const k=String(it.drugId||''); idCounts[k]=(idCounts[k]||0)+1; });
        const rows = (editableItems || []).map((it, itemIndex) => {
          const drug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(it.drugId));
          const unitObj = drug ? ctx.appDb.units.find(u => String(u.unit_id) === String(drug.unit_id)) : null;
          const unitName = unitObj?.unit_name || it.unit || drug?.unit_id || 'หน่วย';
          const pack = safePackSize(it.packSize);
          const masterPack = safePackSize(drug?.pack_size ?? pack);
          const price = toNonNegativeNumber(it.price);
          const masterPrice = toNonNegativeNumber(drug?.price ?? price);
          const qty = toNonNegativeNumber(it.dispenseQty);
          const usage = toNonNegativeNumber(it.usage);
          const rb301Usage = getRb301UsageQty(it);
          const lineValue = getRequisitionItemValue(it);
          const usageValue = getUsageItemValue(it);
          const target = toNonNegativeNumber(it.targetVMI);
          const credit = toSafeNumber(it.prevExcess) - usage;
          const suggestedQty = getSystemSuggestedQty(it);
          const flags = [];
          if ((idCounts[String(it.drugId||'')]||0) > 1) flags.push('รหัสยาซ้ำ');
          if (pack !== masterPack) flags.push(`Pack ใบเบิก ${pack} ≠ Master ${masterPack}`);
          if (Math.abs(price-masterPrice) > 0.000001) flags.push(`ราคาใบเบิก ${formatUnitPrice(price)} ≠ Master ${formatUnitPrice(masterPrice)}`);
          if (toNonNegativeNumber(it.requestMore) > 0) flags.push('ขอเพิ่ม');
          if (it.manualAdded) flags.push('เพิ่มเอง');
          if (getUsageMultiplier(it) !== 1) flags.push(`Multiplier ${getUsageMultiplier(it)}`);
          if (usage > 0 && qty === 0) flags.push('มีใช้แต่ไม่จ่าย: ตรวจเครดิต/Target');
          if (Array.isArray(it.analyticsCorrections) && it.analyticsCorrections.length) flags.push('แก้ mapping สถิติย้อนหลังแล้ว');
          if (usageValue >= 5000) flags.push('มูลค่า รบ.301 สูง');
          if (usageValue >= 1000 && lineValue > 0 && usageValue >= lineValue * 3) flags.push('มูลค่าใช้สูงกว่าจ่ายมาก');
          return { ...it, itemIndex, drug, unitName, pack, masterPack, price, masterPrice, qty, usage, rb301Usage, lineValue, usageValue, target, credit, suggestedQty, flags };
        });
        return {
          rows,
          requestTotal: rows.reduce((sum,r)=>sum+r.lineValue,0),
          usageTotal: rows.reduce((sum,r)=>sum+r.usageValue,0),
          duplicateDrugCount: Object.values(idCounts).filter(n=>n>1).length,
          flaggedCount: rows.filter(r=>r.flags.length>0).length
        };
      }, [editableItems, ctx.appDb.drugs, ctx.appDb.units]);

      const auditRowsToDisplay = useMemo(() => [...valueAudit.rows].sort((a,b) => auditSortMode === 'usage' ? (b.usageValue - a.usageValue) : (b.lineValue - a.lineValue)), [valueAudit, auditSortMode]);
      const topUsageRow = useMemo(() => [...valueAudit.rows].sort((a,b)=>b.usageValue-a.usageValue)[0] || null, [valueAudit]);
      const topUsagePct = topUsageRow && valueAudit.usageTotal > 0 ? (topUsageRow.usageValue / valueAudit.usageTotal) * 100 : 0;

      const getPastHistoryForReqDrug = (drugId) => {
        const values = [];
        for (let i=1; i<=5; i++) {
          let m = Number(req?.month || 1) - i;
          let y = Number(req?.year || new Date().getFullYear());
          if (m <= 0) { m += 12; y -= 1; }
          const key = getYearMonthKey(m, y);
          const hist = ctx.appDb.historicalUsages?.find(h => String(h.hospital_id) === String(req?.hospitalId) && String(h.drug_id) === String(drugId));
          values.push(toNonNegativeNumber(hist?.history?.[key]));
        }
        return values;
      };

      const recalcRematchedItem = (base, usage) => {
        const recent5 = Array.isArray(base.pastHistory) ? base.pastHistory.slice(0,5) : getPastHistoryForReqDrug(base.drugId);
        const activeUsages = [...recent5, toNonNegativeNumber(usage)].filter(v => v > 0);
        const count = activeUsages.length || 1;
        const mean = activeUsages.reduce((a,b)=>a+b,0) / count;
        const variance = activeUsages.reduce((acc,val)=>acc + Math.pow(val-mean,2),0) / (count === 1 ? 1 : count - 1);
        const targetVMI = Math.ceil(mean + 1.645 * Math.sqrt(variance));
        const systemStock = toSafeNumber(base.prevExcess) - toNonNegativeNumber(usage);
        const actualTouched = !!base.actualStockTouched;
        const actualStock = actualTouched ? toNonNegativeNumber(base.actualStock) : null;
        const effectiveStock = actualTouched ? actualStock : systemStock;
        const systemNeed = Math.max(0, targetVMI - systemStock);
        const actualNeed = Math.max(0, targetVMI - effectiveStock);
        const systemSuggestedQty = isNonBillableInRequisition(base) ? 0 : roundDispenseQty(systemNeed, base);
        const finalQty = isNonBillableInRequisition(base) ? 0 : roundDispenseQty(actualNeed, base);
        return {
          ...base, usage: toNonNegativeNumber(usage), pastHistory: recent5, targetVMI, systemStock, effectiveStock,
          netNeed: actualNeed, systemSuggestedQty, currentSuggestedQty: finalQty, finalRequestedQty: finalQty,
          dispenseQty: finalQty, dispensePack: finalQty > 0 ? Math.ceil(finalQty / safePackSize(base.packSize)) : 0,
          newExcess: effectiveStock + finalQty, requestMore: Math.max(0, finalQty-systemSuggestedQty),
          requestLess: Math.max(0, systemSuggestedQty-finalQty), manualQtyOverride: false, isAdjusted: actualTouched
        };
      };

      const openRematchDialog = (row) => {
        if (!canAdminRematch) return;
        setShowValueAudit(false);
        const sourceNames = Array.isArray(row?.sourceRawNames) ? row.sourceRawNames.filter(Boolean) : [];
        const oldAliases = cleanFuzzyAliases(row?.drug?.fuzzy, row?.drug?.drug_name);
        const multiplier = Math.max(1, getUsageMultiplier(row?.drug || row));
        const inferredRawUsage = row?.rawImportedUsageQty !== undefined && row?.rawImportedUsageQty !== null && Number(row.rawImportedUsageQty) > 0
          ? toNonNegativeNumber(row.rawImportedUsageQty)
          : (toNonNegativeNumber(row?.importedUsageQty) > 0 ? toNonNegativeNumber(row.importedUsageQty) / multiplier : toNonNegativeNumber(row?.usage) / multiplier);
        let sources = Array.isArray(row?.sourceImports) ? row.sourceImports.map(src => ({ rawName: safeText(src?.rawName), rawUsage: toNonNegativeNumber(src?.rawUsage), normalizedUsage: toNonNegativeNumber(src?.normalizedUsage) })).filter(src => src.rawName || src.rawUsage > 0 || src.normalizedUsage > 0) : [];
        if (!sources.length) {
          sources = [{ rawName: sourceNames.length === 1 ? sourceNames[0] : '', rawUsage: inferredRawUsage, normalizedUsage: getRb301UsageQty(row) }];
        }
        const first = sources[0];
        setRematchTarget({ ...row, suggestedAliases: [...new Set([...sourceNames, ...oldAliases])], sourceImportsResolved: sources });
        setRematchSourceIndex(0);
        setRematchDrugId('');
        setRematchRawName(first?.rawName || '');
        setRematchRawUsage(String(toNonNegativeNumber(first?.rawUsage)));
      };

      const persistAdminRematchAlias = async (rawName, oldDrugId, newDrugId) => {
        const alias = safeText(rawName);
        const aliasKey = normalizeForMatch(alias);
        if (!alias || !aliasKey || !newDrugId || String(oldDrugId) === String(newDrugId)) return;
        try {
          const cache = JSON.parse(localStorage.getItem('sawee_rxfill_fuzzy_cache_v1') || '{}') || {};
          cache[aliasKey] = String(newDrugId);
          localStorage.setItem('sawee_rxfill_fuzzy_cache_v1', JSON.stringify(cache));
        } catch(e) { console.warn('Local fuzzy rematch cache failed:', e); }

        const oldDrug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(oldDrugId));
        const newDrug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(newDrugId));
        if (!newDrug) return;
        await db.runTransaction(async tx => {
          let oldRef = null;
          let oldSnap = null;
          if (oldDrug) {
            oldRef = db.collection('master_drugs').doc(oldDrug.id || String(oldDrug.drug_id));
            oldSnap = await tx.get(oldRef);
          }
          const newRef = db.collection('master_drugs').doc(newDrug.id || String(newDrug.drug_id));
          const newSnap = await tx.get(newRef);
          if (!newSnap.exists) throw new Error('ไม่พบยาใหม่ใน master_drugs');
          if (oldRef && oldSnap?.exists) {
            const oldData = oldSnap.data();
            const oldList = cleanFuzzyAliases(oldData.fuzzy, oldData.drug_name).filter(a => normalizeForMatch(a) !== aliasKey);
            tx.update(oldRef, { fuzzy: oldList.join(',') });
          }
          const newData = newSnap.data();
          const newList = cleanFuzzyAliases(newData.fuzzy, newData.drug_name);
          if (aliasKey !== normalizeForMatch(newData.drug_name) && !newList.some(a => normalizeForMatch(a) === aliasKey)) newList.push(alias);
          tx.update(newRef, { fuzzy: cleanFuzzyAliases(newList, newData.drug_name).join(','), fuzzy_rematched_at: firebase.firestore.FieldValue.serverTimestamp() });
        });
        if (ctx.setAppDb) {
          ctx.setAppDb(prev => ({ ...prev, drugs: (prev.drugs || []).map(d => {
            if (String(d.drug_id) === String(oldDrugId)) return { ...d, fuzzy: cleanFuzzyAliases(d.fuzzy, d.drug_name).filter(a => normalizeForMatch(a) !== aliasKey).join(',') };
            if (String(d.drug_id) === String(newDrugId)) {
              const list = cleanFuzzyAliases(d.fuzzy, d.drug_name);
              if (aliasKey !== normalizeForMatch(d.drug_name) && !list.some(a => normalizeForMatch(a) === aliasKey)) list.push(alias);
              return { ...d, fuzzy: cleanFuzzyAliases(list, d.drug_name).join(',') };
            }
            return d;
          }) }));
        }
      };

      const confirmAdminRematch = async () => {
        if (!rematchTarget) return;
        const newDrug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(rematchDrugId));
        if (!newDrug) return ctx.showToast('กรุณาเลือกยาที่ถูกต้องจาก Master Drug', 'error');
        if (String(newDrug.drug_id) === String(rematchTarget.drugId)) return ctx.showToast('ยาที่เลือกเป็นตัวเดิม กรุณาเลือกยาที่ถูกต้องตัวอื่น', 'error');

        const sources = Array.isArray(rematchTarget.sourceImportsResolved) && rematchTarget.sourceImportsResolved.length
          ? rematchTarget.sourceImportsResolved
          : [{ rawName:'', rawUsage: toNonNegativeNumber(rematchRawUsage), normalizedUsage: getRb301UsageQty(rematchTarget) }];
        const selectedSource = sources[Math.max(0, Math.min(sources.length-1, Number(rematchSourceIndex)||0))] || sources[0];
        const sourceName = safeText(rematchRawName || selectedSource?.rawName);
        const rawUsage = toNonNegativeNumber(rematchRawUsage);
        const oldNormalizedContribution = toNonNegativeNumber(selectedSource?.normalizedUsage) > 0
          ? toNonNegativeNumber(selectedSource.normalizedUsage)
          : Math.min(getRb301UsageQty(rematchTarget), convertImportedUsage(selectedSource?.rawUsage ?? rawUsage, rematchTarget.drug || rematchTarget));
        const normalizedUsage = convertImportedUsage(rawUsage, newDrug);
        const unitObj = ctx.appDb.units.find(u => String(u.unit_id) === String(newDrug.unit_id));
        const unitName = unitObj?.unit_name || newDrug.unit_id || '';
        const bal = ctx.appDb.balances.find(b => String(b.hospital_id) === String(req.hospitalId) && String(b.drug_id) === String(newDrug.drug_id));
        const selectedIndex = Math.max(0, Math.min(sources.length-1, Number(rematchSourceIndex)||0));
        setIsRematching(true);
        try {
          // ใบ Completed: แก้เฉพาะ mapping/mูลค่า รบ.301 สำหรับ analytics ย้อนหลัง
          // ไม่เปลี่ยน drugId, จำนวนจ่าย, newExcess, current_excess หรือ stock_adjustments ของใบที่จัดยาไปแล้ว
          if (adminHistoricalRematchOnly) {
            const oldDrug = rematchTarget.drug || ctx.appDb.drugs.find(d => String(d.drug_id) === String(rematchTarget.drugId));
            const oldPack = safePackSize(rematchTarget.pack ?? oldDrug?.pack_size ?? rematchTarget.packSize);
            const oldPrice = toNonNegativeNumber(rematchTarget.price ?? oldDrug?.price);
            const oldContributionValue = (oldNormalizedContribution / oldPack) * oldPrice;
            const newPack = safePackSize(newDrug.pack_size);
            const newPrice = toNonNegativeNumber(newDrug.price);
            const newContributionValue = (normalizedUsage / newPack) * newPrice;
            const correction = {
              sourceName, rawUsage, oldNormalizedUsage: oldNormalizedContribution, newNormalizedUsage: normalizedUsage,
              oldDrugId: String(rematchTarget.drugId || ''), oldDrugName: safeText(rematchTarget.name), oldPack, oldPrice, oldValue: oldContributionValue,
              newDrugId: String(newDrug.drug_id || ''), newDrugName: safeText(newDrug.drug_name), newPack, newPrice, newValue: newContributionValue,
              deltaValue: newContributionValue - oldContributionValue, correctedByUid: ctx.currentUser.uid, correctedByName: ctx.currentUser.name,
              correctedAtIso: new Date().toISOString()
            };
            const reqRef = db.collection('requisitions').doc(req.id);
            const auditRef = db.collection('audit_logs').doc();
            let persistedItems = null;
            await db.runTransaction(async tx => {
              const snap = await tx.get(reqRef);
              if (!snap.exists) throw new Error('ไม่พบใบเบิก');
              const current = snap.data();
              if (current.status !== 'Completed') throw new Error('สถานะใบเบิกเปลี่ยนแล้ว กรุณารีเฟรช');
              const arr = Array.isArray(current.items) ? current.items.map(x => ({...x})) : [];
              const idx = arr.findIndex((x,i) => i === rematchTarget.itemIndex || String(x.drugId) === String(rematchTarget.drugId));
              if (idx < 0) throw new Error('ไม่พบรายการเดิมในใบเบิก');
              const prior = Array.isArray(arr[idx].analyticsCorrections) ? arr[idx].analyticsCorrections : [];
              const correctionKey = `${normalizeForMatch(sourceName)}|${rawUsage}|${String(rematchTarget.drugId||'')}`;
              const cleanedPrior = prior.filter(c => `${normalizeForMatch(c?.sourceName)}|${toNonNegativeNumber(c?.rawUsage)}|${String(c?.oldDrugId||'')}` !== correctionKey);
              arr[idx].analyticsCorrections = [...cleanedPrior, correction];
              arr[idx].analyticsRematched = true;
              arr[idx].analyticsRematchedToDrugId = String(newDrug.drug_id);
              arr[idx].analyticsRematchedToDrugName = safeText(newDrug.drug_name);
              arr[idx].analyticsRematchedAtIso = new Date().toISOString();
              persistedItems = arr;
              tx.update(reqRef, { items: arr, analytics_corrected_at: firebase.firestore.FieldValue.serverTimestamp(), analytics_corrected_by: ctx.currentUser.name });
              tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'REQUISITION_ANALYTICS_REMATCH', 'requisitions', req.id, {
                sourceName, oldDrugId: rematchTarget.drugId, newDrugId: newDrug.drug_id, oldValue: oldContributionValue, newValue: newContributionValue
              }));
            });
            if (sourceName) {
              try { await persistAdminRematchAlias(sourceName, rematchTarget.drugId, newDrug.drug_id); }
              catch (fuzzyErr) { console.warn('Admin historical rematch fuzzy persist failed:', fuzzyErr); }
            }
            if (persistedItems) setEditableItems(persistedItems);
            if (ctx.setAppDb && persistedItems) {
              ctx.setAppDb(prev => ({...prev, requisitions:(prev.requisitions||[]).map(r=>r.id===req.id?{...r,items:persistedItems,analytics_corrected_by:ctx.currentUser.name}:r)}));
            }
            ctx.showToast(`แก้ mapping สถิติย้อนหลัง ${sourceName || rematchTarget.name} → ${newDrug.drug_name} แล้ว โดยไม่เปลี่ยนจำนวนจัดยา/stock`);
            setRematchTarget(null); setRematchDrugId(''); setRematchRawName(''); setRematchRawUsage(''); setRematchSourceIndex(0);
            return;
          }

          setEditableItems(prev => {
            const original = prev[rematchTarget.itemIndex];
            if (!original) return prev;
            const withoutOriginal = prev.filter((_,idx) => idx !== rematchTarget.itemIndex);

            // 1) ถ้ายังมี source อื่นที่ถูกจับคู่กับยาตัวเดิม ให้เก็บยาตัวเดิมไว้และหักเฉพาะ source ที่ย้ายออก
            const remainingSources = sources.filter((_,idx) => idx !== selectedIndex);
            const remainingImported = Math.max(0, getRb301UsageQty(original) - oldNormalizedContribution);
            const remainingRaw = Math.max(0, toNonNegativeNumber(original.rawImportedUsageQty) - toNonNegativeNumber(selectedSource?.rawUsage));
            if (remainingImported > 0.000001 || remainingSources.length > 0) {
              const remainingNames = [...new Set(remainingSources.map(src=>safeText(src.rawName)).filter(Boolean))];
              const oldBase = { ...original, importedUsageQty: remainingImported, rawImportedUsageQty: remainingRaw, sourceRawNames: remainingNames, sourceImports: remainingSources, usageSource:'rb301', manualQtyOverride:false };
              withoutOriginal.push(recalcRematchedItem(oldBase, remainingImported));
            }

            // 2) ใส่ source ที่ย้ายไปยาตัวใหม่ ถ้ามียาตัวใหม่นี้อยู่แล้วให้รวมยอด ไม่สร้างรหัสซ้ำ
            const newSource = { rawName: sourceName, rawUsage, normalizedUsage };
            const existingIdx = withoutOriginal.findIndex(i => String(i.drugId) === String(newDrug.drug_id));
            if (existingIdx >= 0) {
              const existing = withoutOriginal[existingIdx];
              const mergedSources = [...(Array.isArray(existing.sourceImports)?existing.sourceImports:[]), newSource];
              const mergedRawNames = [...new Set(mergedSources.map(src=>safeText(src.rawName)).filter(Boolean))];
              const mergedUsage = getRb301UsageQty(existing) + normalizedUsage;
              const merged = recalcRematchedItem({
                ...existing, importedUsageQty: mergedUsage, rawImportedUsageQty: toNonNegativeNumber(existing.rawImportedUsageQty) + rawUsage,
                sourceRawNames: mergedRawNames, sourceImports: mergedSources, usageSource:'rb301', rematchedFromDrugId: rematchTarget.drugId, rematchedByAdmin:true, manualQtyOverride:false
              }, mergedUsage);
              withoutOriginal[existingIdx] = merged;
            } else {
              const base = {
                drugId: newDrug.drug_id, name: newDrug.drug_name, unit: unitName, packSize: safePackSize(newDrug.pack_size),
                isUnpacked: !!newDrug.unpacked, type: safeText(newDrug.type,'1') || '1', price: toNonNegativeNumber(newDrug.price),
                dispenseStep: toNonNegativeNumber(newDrug.dispense_step,0), usageMultiplier: getUsageMultiplier(newDrug), maximumQty: getMaximumQty(newDrug),
                isDisabledForHospital:false, isDiscontinued:isDrugDiscontinued(newDrug), drugStatus:getDrugStatusText(newDrug),
                prevExcess: bal ? toSafeNumber(bal.excess_balance) : 0, usage: normalizedUsage, pastHistory:getPastHistoryForReqDrug(newDrug.drug_id),
                actualStock:null, actualStockTouched:false, manualAdded:false, usageSource:'rb301', importedUsageQty:normalizedUsage,
                rawImportedUsageQty:rawUsage, sourceRawNames:sourceName?[sourceName]:[], sourceImports:[newSource], rematchedFromDrugId:rematchTarget.drugId, rematchedByAdmin:true,
                requestMore:0, requestLess:0, manualQtyOverride:false
              };
              withoutOriginal.push(recalcRematchedItem(base, normalizedUsage));
            }
            return withoutOriginal.sort(sortDrugs);
          });

          if (sourceName) {
            try {
              await persistAdminRematchAlias(sourceName, rematchTarget.drugId, newDrug.drug_id);
            } catch (fuzzyErr) {
              console.warn('Admin rematch fuzzy persist failed:', fuzzyErr);
              ctx.showToast('แก้รายการในใบเบิกแล้ว แต่บันทึก Fuzzy กลางไม่สำเร็จ: ' + (fuzzyErr?.message || fuzzyErr), 'error');
            }
          }
          ctx.showToast(`จับคู่ใหม่ ${sourceName || rematchTarget.name} → ${newDrug.drug_name} แล้ว ระบบคำนวณ Target/จำนวนจ่ายใหม่ กรุณากดบันทึกการแก้ไขข้อมูล`);
          setRematchTarget(null); setRematchDrugId(''); setRematchRawName(''); setRematchRawUsage(''); setRematchSourceIndex(0);
          setShowHiddenItems(true);
          setTimeout(()=>document.getElementById(`req-item-${newDrug.drug_id}`)?.scrollIntoView({behavior:'smooth',block:'center'}),150);
        } catch(e) {
          ctx.showToast('จับคู่ใหม่ไม่สำเร็จ: ' + (e?.message || e), 'error');
        } finally { setIsRematching(false); }
      };

      useEffect(() => {
        if(!req) return;
        const merged = (req.items || []).map(item => {
          // เอกสาร Completed เป็นหลักฐานย้อนหลัง: ห้าม re-normalize/เปลี่ยนราคา/สถานะตาม master ปัจจุบัน
          if (req.status === 'Completed' || invsSent || (req.is_printed && !isAdmin)) return { ...item };
          const par = ctx.appDb.parLevels.find(p => String(p.hospital_id) === String(req.hospitalId) && String(p.drug_id) === String(item.drugId));
          const drug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(item.drugId));
          const isDisabledForHospital = false;
          const mergedItem = {
            ...item,
            packSize: safePackSize(drug?.pack_size ?? item.packSize),
            isUnpacked: drug ? !!drug.unpacked : !!item.isUnpacked,
            type: safeText(drug?.type ?? item.type, '1') || '1',
            price: toNonNegativeNumber(drug?.price ?? item.price),
            dispenseStep: toNonNegativeNumber(drug?.dispense_step ?? item.dispenseStep ?? item.dispense_step, 0),
            usageMultiplier: getUsageMultiplier(drug || item),
            maximumQty: getMaximumQty(drug || item),
            isDiscontinued: drug ? isDrugDiscontinued(drug) : !!item.isDiscontinued,
            drugStatus: drug ? getDrugStatusText(drug) : safeText(item.drugStatus),
            isDisabledForHospital
          };
          return lockRequisitionItem(mergedItem);
        });
        setEditableItems(merged);
      }, [req, ctx.appDb.parLevels, ctx.appDb.drugs, invsSent]);
      if(!req) return null;
      
      const hosp = ctx.appDb.hospitals.find(h => h.hospital_id === req.hospitalId);
      const hospNameClean = hosp?.hospital_name?.replace('รพ.สต.', '') || '';

      const { fiscalYear } = getFiscalInfo(req.month, req.year);
      const term = getEffectiveFiscalTerm(req, ctx.appDb.requisitions);

      const handleAdjust = (idx, val) => {
        const current = editableItems[idx];
        if (!current) return;
        setEditingQtyDraft(prev => ({ ...prev, [String(current.drugId)]: val }));
      };

      const handleAdjustCommit = (idx) => {
        const current = editableItems[idx];
        if (!current) return;
        const key = String(current.drugId);
        const draftValue = Object.prototype.hasOwnProperty.call(editingQtyDraft, key) ? editingQtyDraft[key] : current.dispenseQty;
        // ถ้าลบตัวเลขจนช่องว่าง ให้ถือว่ายกเลิกการแก้ ไม่เปลี่ยนข้อมูลเดิม
        if (draftValue === '') {
          setEditingPreviewQtyDrugId(null);
          setEditingQtyDraft(prev => { const next={...prev}; delete next[key]; return next; });
          return;
        }
        const requestedQty = toNonNegativeNumber(draftValue);
        setEditingPreviewQtyDrugId(null);
        setEditingQtyDraft(prev => { const next={...prev}; delete next[key]; return next; });

        const makeAdjustedItem = (qty) => {
          const systemSuggested = getSystemSuggestedQty(current);
          return {
            ...current,
            dispenseQty: qty,
            finalRequestedQty: qty,
            dispensePack: qty > 0 ? Math.ceil(qty / safePackSize(current.packSize)) : 0,
            newExcess: (current.actualStockTouched && current.actualStock !== null && current.actualStock !== undefined ? toNonNegativeNumber(current.actualStock) : (toSafeNumber(current.prevExcess) - toNonNegativeNumber(current.usage))) + qty,
            requestMore: Math.max(0, qty - systemSuggested),
            requestLess: Math.max(0, systemSuggested - qty),
            isAdjusted: true
          };
        };

        if (requestedQty === 0) {
          // สำคัญ: ยังไม่ลบ/ยังไม่แก้รายการ จนกว่าผู้ใช้จะเลือกใน Modal
          ctx.setConfirmDialog({
            title: 'จำนวนจ่ายเป็น 0 — ต้องการลบรายการหรือไม่?',
            message: `คุณกำลังเปลี่ยนจำนวนจ่าย ${current.name} จาก ${toNonNegativeNumber(current.dispenseQty).toLocaleString()} เป็น 0 หากต้องการเพียงให้จำนวนจ่ายเป็น 0 ให้กด “เก็บรายการไว้ 0” รายการจะไม่ถูกลบและ Admin สามารถเปิด “รายการที่ซ่อน” เพื่อแก้กลับได้`,
            icon: 'fa-triangle-exclamation', iconColor: 'text-amber-500', confirmBtnClass:'bg-red-600 hover:bg-red-700',
            cancelText:'เก็บรายการไว้ 0', confirmText:'ลบออกจากใบเบิก',
            onCancel: () => {
              const zeroItem = makeAdjustedItem(0);
              setEditableItems(prev => prev.map(i => String(i.drugId) === key ? zeroItem : i));
              setShowHiddenItems(true);
              ctx.showToast(`${current.name}: เก็บรายการไว้โดยจำนวนจ่าย = 0`);
            },
            onConfirm: () => {
              setEditableItems(prev => prev.filter(i => String(i.drugId) !== key));
              ctx.showToast(`ลบ ${current.name} ออกจากใบเบิกแล้ว`);
            }
          });
          return;
        }

        const candidate = makeAdjustedItem(requestedQty);
        const locked = lockRequisitionItem(candidate);
        const systemSuggested = getSystemSuggestedQty(locked);
        locked.finalRequestedQty = toNonNegativeNumber(locked.dispenseQty);
        locked.requestMore = Math.max(0, locked.finalRequestedQty - systemSuggested);
        locked.requestLess = Math.max(0, systemSuggested - locked.finalRequestedQty);
        setEditableItems(prev => prev.map(i => String(i.drugId) === key ? locked : i));
        if (Math.abs(requestedQty - locked.dispenseQty) > 0.000001) {
          ctx.showToast(getMaximumQty(current)>0 && requestedQty>getMaximumQty(current) ? `ยอด ${current.name} เกิน Maximum ${getMaximumQty(current)} — ระบบตัดเหลือ ${locked.dispenseQty} ${current.unit || 'หน่วย'}` : `ระบบปรับ ${current.name} จาก ${requestedQty} → ${locked.dispenseQty} ${current.unit || 'หน่วย'} ให้ครบหน่วยเติม`);
        }
      };

      // ⭐️ ฟังก์ชันลบรายการยาออกจากใบเบิก (ไม่เอาไปรวมในเอกสาร)
      const handleDeleteItem = (drugId) => {
         ctx.setConfirmDialog({
           title: 'ยืนยันลบออกจากใบเบิก',
           message: 'ปุ่มนี้คือลบออกจากใบเบิกและรีเซ็ตจำนวนเบิกยานี้เป็น 0 แต่ยาจะยังคงอยู่ในคลังของคุณ ยืนยันหรือไม่?',
           icon: 'fa-trash',
           iconColor: 'text-red-500',
           confirmBtnClass: 'bg-red-600 hover:bg-red-700',
           confirmText: 'ลบออกจากใบเบิก',
           onConfirm: () => {
              setEditableItems(prev => prev.filter(i => i.drugId !== drugId));
              ctx.showToast('ลบรายการยาออกจากตารางแล้ว (จะไม่ปรากฏในใบเบิก)');
           }
         });
      };

      // ⭐️ เพิ่มยาในหน้า Admin Preview: เลือกยา -> ถามจำนวน -> บันทึก Firestore ทันที
      const handleManualAdd = () => {
         const selected = safeText(manualAddSearch);
         if(!selected) return ctx.showToast('กรุณาเลือกยาที่ต้องการเพิ่ม', 'error');
         const drug = ctx.appDb.drugs.find(d => String(d.drug_id) === selected) || ctx.appDb.drugs.find(d => safeText(d.drug_name).toLowerCase() === selected.toLowerCase());
         if(!drug) return ctx.showToast('ไม่พบยานี้ใน Master Drug กรุณาเลือกจากรายการ', 'error');
         if(isDrugDiscontinued(drug)) return ctx.showToast(`${drug.drug_name} มีสถานะ "ยกเลิกใช้" ไม่สามารถเพิ่มเข้ามาเพื่อเบิกได้`, 'error');
         if(editableItems.find(i => String(i.drugId) === String(drug.drug_id))) return ctx.showToast('มีรายการนี้ในใบเบิกอยู่แล้ว', 'error');
         if(String(drug.type || '') === '6') return ctx.showToast('วัคซีนเป็นรายการไม่ร่วมระบบเบิก จึงไม่สามารถเพิ่มจำนวนเบิกผ่านเมนูนี้ได้', 'error');

         const unitObj = ctx.appDb.units.find(u => String(u.unit_id) === String(drug.unit_id));
         const unitDisplay = unitObj ? unitObj.unit_name : (drug.unit_id || '');
         const bal = ctx.appDb.balances.find(b => String(b.hospital_id) === String(req.hospitalId) && String(b.drug_id) === String(drug.drug_id));
         const prevExcess = bal ? toSafeNumber(bal.excess_balance) : 0;
         const candidate = {
            drugId: safeText(drug.drug_id), name: safeText(drug.drug_name), unit: unitDisplay,
            packSize: safePackSize(drug.pack_size), isUnpacked: !!drug.unpacked, type: safeText(drug.type, '1') || '1', price: toNonNegativeNumber(drug.price),
            dispenseStep: toNonNegativeNumber(drug.dispense_step, 0), usageMultiplier: getUsageMultiplier(drug), maximumQty: getMaximumQty(drug), isDisabledForHospital: false,
            isDiscontinued: false, drugStatus: getDrugStatusText(drug),
            prevExcess, usage: 0, targetVMI: 0, netNeed: 0, dispensePack: 0, dispenseQty: 0, newExcess: prevExcess,
            isSpecial: false, requestMore: 0, requestLess: 0, isUnlocked: false, isNewDrug: true, pastHistory: [0,0,0,0,0], isAdjusted: true,
            manualAdded: true, usageSource: 'manual_admin', importedUsageQty: 0, rawImportedUsageQty: 0, sourceRawNames: [], sourceImports: [],
            actualStock: null, actualStockTouched: false, systemStock: prevExcess, systemSuggestedQty: 0, currentSuggestedQty: 0, finalRequestedQty: 0, manualQtyOverride: true
         };
         setManualAddCandidate(candidate);
         setManualAddQty('');
      };

      const confirmManualAdd = async () => {
         if (!manualAddCandidate || isManualAddSaving) return;
         const rawQty = toNonNegativeNumber(manualAddQty);
         if (rawQty <= 0) return ctx.showToast('กรุณาระบุจำนวนที่ต้องการเพิ่ม', 'error');

         const prepared = lockRequisitionItem({
           ...manualAddCandidate,
           dispenseQty: rawQty,
           finalRequestedQty: rawQty,
           manualQtyOverride: true,
           systemSuggestedQty: 0,
           currentSuggestedQty: rawQty
         });
         const normalizedQty = toNonNegativeNumber(prepared.dispenseQty);
         if (normalizedQty <= 0) return ctx.showToast('จำนวนที่ระบุไม่สามารถนำมาเบิกได้ กรุณาตรวจ Pack / รอบจ่าย / Maximum', 'error');

         prepared.finalRequestedQty = normalizedQty;
         prepared.currentSuggestedQty = normalizedQty;
         prepared.systemSuggestedQty = 0;
         prepared.requestMore = normalizedQty;
         prepared.requestLess = 0;
         prepared.submittedDispenseQty = normalizedQty;
         prepared.requestedExtraQty = normalizedQty;
         prepared.extraDispenseQtyAtSubmit = normalizedQty;
         prepared.manualQtyOverride = true;
         prepared.manualAdded = true;
         prepared.usageSource = 'manual_admin';

         setIsManualAddSaving(true);
         let persistedItems = null;
         let savedRevision = null;
         try {
           const reqRef = db.collection('requisitions').doc(req.id);
           const auditRef = db.collection('audit_logs').doc();
           await db.runTransaction(async (tx) => {
             const snap = await tx.get(reqRef);
             if (!snap.exists) throw new Error('ไม่พบใบเบิก');
             const current = snap.data();
             const editableNow = isAdmin ? ['Draft','Pending','Rejected','ApprovalFailed'].includes(current.status) : ['Draft','Pending'].includes(current.status);
             if (!editableNow) throw new Error('ใบเบิกนี้ถูกเปลี่ยนสถานะแล้ว กรุณารีเฟรช');
             if (String(current.invs_status || '').toUpperCase() === 'SENT' || current.invs_sub_po_no) throw new Error('ใบเบิกนี้ส่งเข้า INVS แล้ว จึงเพิ่มยาไม่ได้');
             const currentItems = Array.isArray(current.items) ? current.items : [];
             if (currentItems.some(i => String(i.drugId) === String(prepared.drugId))) throw new Error('ยานี้ถูกเพิ่มเข้าใบเบิกแล้วจากอีกหน้าจอ กรุณารีเฟรช');

             persistedItems = [prepared, ...currentItems].sort(sortDrugs).map(it => {
               const locked = lockRequisitionItem({ ...it, packSize: safePackSize(it.packSize) });
               locked.systemSuggestedQty = toNonNegativeNumber(it.systemSuggestedQty ?? getSystemSuggestedQty(locked));
               locked.submittedDispenseQty = toNonNegativeNumber(it.submittedDispenseQty ?? locked.dispenseQty);
               locked.requestedExtraQty = toNonNegativeNumber(it.requestedExtraQty ?? it.requestMore);
               locked.extraDispenseQtyAtSubmit = Math.max(0, locked.submittedDispenseQty - locked.systemSuggestedQty);
               return locked;
             });
             savedRevision = toNonNegativeInt(current.revision, 0) + 1;
             tx.update(reqRef, {
               items: persistedItems,
               updated_by_uid: ctx.currentUser.uid,
               updated_by_name: ctx.currentUser.name,
               updated_at: firebase.firestore.FieldValue.serverTimestamp(),
               revision: savedRevision,
               status: 'Pending'
             });
             tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'REQUISITION_MANUAL_DRUG_ADD', 'requisitions', req.id, {
               drug_id: prepared.drugId,
               drug_name: prepared.name,
               requested_qty: rawQty,
               saved_qty: normalizedQty,
               unit: prepared.unit,
               pack_size: prepared.packSize,
               dispense_step: getDispenseStep(prepared),
               maximum_qty: getMaximumQty(prepared)
             }));
           });

           // เก็บการแก้ไขอื่นที่ Admin ยังไม่ได้กด Save ไว้บนหน้าจอ แต่ appDb สะท้อนเฉพาะสิ่งที่เขียน Firestore จริง
           const localItems = [prepared, ...editableItems.filter(i => String(i.drugId) !== String(prepared.drugId))].sort(sortDrugs);
           const storedItems = Array.isArray(persistedItems) ? persistedItems : localItems;
           setEditableItems(localItems);
           if (ctx.setAppDb) {
             ctx.setAppDb(prev => ({
               ...prev,
               requisitions: (prev.requisitions || []).map(r => String(r.id) === String(req.id)
                 ? { ...r, items: storedItems, revision: savedRevision ?? r.revision, status: 'Pending', updated_by_uid: ctx.currentUser.uid, updated_by_name: ctx.currentUser.name }
                 : r)
             }));
           }
           setManualAddSearch('');
           setManualAddCandidate(null);
           setManualAddQty('');
           const roundedNote = Math.abs(normalizedQty - rawQty) > 0.000001 ? ` (ระบบปรับจาก ${rawQty} → ${normalizedQty} ${prepared.unit || 'หน่วย'})` : '';
           ctx.showToast(`เพิ่ม ${prepared.name} จำนวน ${normalizedQty} ${prepared.unit || 'หน่วย'} และบันทึกลงใบเบิกแล้ว${roundedNote}`);
           setTimeout(() => document.getElementById(`req-item-${prepared.drugId}`)?.scrollIntoView({ behavior:'smooth', block:'center' }), 100);
         } catch(e) {
           ctx.showToast('เพิ่มยาไม่สำเร็จ: ' + (e?.message || e), 'error');
         } finally {
           setIsManualAddSaving(false);
         }
      };

      const handleAddMappedSkipped = (idx, mappedDrugId, usage) => {
          const drug = ctx.appDb.drugs.find(d => d.drug_id === mappedDrugId);
          if(!drug) return;

          const bal = ctx.appDb.balances.find(b => String(b.hospital_id) === String(req.hospitalId) && String(b.drug_id) === mappedDrugId);
          const prevExcess = bal ? Number(bal.excess_balance) : 0;
          const packSize = safePackSize(drug.pack_size);
          const par = ctx.appDb.parLevels.find(p => String(p.hospital_id) === String(req.hospitalId) && String(p.drug_id) === String(mappedDrugId));
          const isDisabledForHospital = false;
          const isDiscontinued = isDrugDiscontinued(drug);
          const dispenseStep = toNonNegativeNumber(drug.dispense_step, 0);
          const usageMultiplier = getUsageMultiplier(drug);
          const normalizedUsage = convertImportedUsage(usage, drug);
          
          let m_usages = [];
          for(let i=1; i<=6; i++) {
              let m = req.month - i; let y = req.year;
              if(m <= 0) { m += 12; y -= 1; }
              const key = getYearMonthKey(m, y);
              const hist = ctx.appDb.historicalUsages?.find(h => String(h.hospital_id) === String(req.hospitalId) && String(h.drug_id) === mappedDrugId);
              const pastUsage = (hist && hist.history && hist.history[key]) ? Number(hist.history[key]) : 0;
              m_usages.push(pastUsage);
          }
          const total6M = m_usages.reduce((a,b)=>a+b, 0);
          const mean6M = total6M / 6;
          const variance = m_usages.reduce((acc, val) => acc + Math.pow(val - mean6M, 2), 0) / 5;
          const SD = Math.sqrt(variance || 0);
          const targetVMI = Math.ceil(mean6M + (1.645 * SD));

          const currentBal = prevExcess - normalizedUsage;
          let netNeed = targetVMI - currentBal;
          if (netNeed <= 0) netNeed = 0;

          let dispensePack=0, dispenseQty=0, newExcess=currentBal;
          
          if (isDiscontinued) {
             netNeed = 0; dispensePack = 0; dispenseQty = 0; newExcess = currentBal;
          } else if (drug.type === '6') {
             netNeed = 0; dispensePack = 0; dispenseQty = 0; newExcess = currentBal;
          } else if (netNeed > 0) {
              const tempItem = { packSize, isUnpacked: !!drug.unpacked, dispenseStep };
              dispenseQty = roundDispenseQty(netNeed, tempItem);
              dispensePack = Math.ceil(dispenseQty / packSize);
              newExcess = currentBal + dispenseQty;
          }

          const unitObj = ctx.appDb.units.find(u => String(u.unit_id) === String(drug.unit_id));
          const unitDisplay = unitObj ? unitObj.unit_name : (drug.unit_id || '');

          const newItem = {
              drugId: mappedDrugId, name: drug.drug_name, unit: unitDisplay,
              packSize, isUnpacked: !!drug.unpacked, type: drug.type || '1', price: toNonNegativeNumber(drug.price),
              dispenseStep, usageMultiplier, isDisabledForHospital, isDiscontinued, drugStatus: getDrugStatusText(drug),
              prevExcess, usage: normalizedUsage, targetVMI, netNeed, dispensePack, dispenseQty, newExcess,
              isSpecial: false, requestMore: 0, isNewDrug: true, isAdjusted: true,
              manualAdded: false, usageSource: 'rb301', importedUsageQty: normalizedUsage, rawImportedUsageQty: toNonNegativeNumber(usage), sourceRawNames: safeText(req.skipped_items?.[idx]?.rawName) ? [safeText(req.skipped_items[idx].rawName)] : [], sourceImports: [{ rawName: safeText(req.skipped_items?.[idx]?.rawName), rawUsage: toNonNegativeNumber(usage), normalizedUsage }]
          };

          setEditableItems(prev => {
              const existingIdx = prev.findIndex(i => i.drugId === mappedDrugId);
              if (existingIdx >= 0) {
                  const arr = [...prev];
                  arr[existingIdx].usage += normalizedUsage;
                  arr[existingIdx].usageSource = 'rb301';
                  arr[existingIdx].importedUsageQty = toNonNegativeNumber(arr[existingIdx].importedUsageQty) + normalizedUsage;
                  arr[existingIdx].rawImportedUsageQty = toNonNegativeNumber(arr[existingIdx].rawImportedUsageQty) + toNonNegativeNumber(usage);
                  const skippedRawName = safeText(req.skipped_items?.[idx]?.rawName);
                  arr[existingIdx].sourceRawNames = [...new Set([...(Array.isArray(arr[existingIdx].sourceRawNames)?arr[existingIdx].sourceRawNames:[]), ...(skippedRawName?[skippedRawName]:[])])];
                  arr[existingIdx].sourceImports = [...(Array.isArray(arr[existingIdx].sourceImports)?arr[existingIdx].sourceImports:[]), { rawName: skippedRawName, rawUsage: toNonNegativeNumber(usage), normalizedUsage }];
                  let cBal = arr[existingIdx].prevExcess - arr[existingIdx].usage;
                  let nNeed = arr[existingIdx].targetVMI - cBal;
                  if (nNeed < 0) nNeed = 0;
                  arr[existingIdx].netNeed = nNeed;
                  
                  let dPack=0, dQty=0, nExcess=cBal;
                  if (arr[existingIdx].isDiscontinued) {
                      nNeed = 0; dPack = 0; dQty = 0; nExcess = cBal;
                  } else if (arr[existingIdx].type === '6') {
                      nNeed = 0; dPack = 0; dQty = 0; nExcess = cBal;
                  } else if(nNeed > 0) {
                      dQty = roundDispenseQty(nNeed, arr[existingIdx]);
                      dPack = Math.ceil(dQty / safePackSize(arr[existingIdx].packSize));
                      nExcess = cBal + dQty;
                  }
                  arr[existingIdx].dispensePack = dPack;
                  arr[existingIdx].dispenseQty = dQty;
                  arr[existingIdx].newExcess = nExcess;
                  arr[existingIdx].isAdjusted = true;
                  return arr;
              }
              return [...prev, newItem].sort(sortDrugs);
          });

          const updatedSkipped = [...req.skipped_items];
          updatedSkipped.splice(idx, 1);
          req.skipped_items = updatedSkipped;
          ctx.showToast(`นำยา ${drug.drug_name} เข้ารายการแล้ว`);
      };

      const invsItemsSignature = (items) => JSON.stringify((items || []).map(it => ({
        drugId: String(it?.drugId || ''), qty: toNonNegativeNumber(it?.dispenseQty ?? it?.finalRequestedQty),
        pack: safePackSize(it?.packSize), type: safeText(it?.type), discontinued: !!it?.isDiscontinued
      })).sort((a,b)=>a.drugId.localeCompare(b.drugId)));

      const handleInvsPreflight = async () => {
        if (!isAdmin || !req || invsSent) return;
        if (invsItemsSignature(editableItems) !== invsItemsSignature(req.items || [])) {
          return ctx.showToast('มีรายการที่แก้ไขแต่ยังไม่ได้บันทึก กรุณากด “บันทึกการแก้ไขข้อมูล” ก่อนตรวจ/ส่งเข้า INVS', 'error');
        }
        setIsInvsBusy(true);
        try {
          const data = await callInvsBridge('preflight', req.id);
          setInvsPreflight(data);
          setShowInvsModal(true);
          if (data.already_sent) await ctx.refreshData();
        } catch(e) {
          if (e?.payload && (Array.isArray(e.payload.items) || Array.isArray(e.payload.errors))) {
            setInvsPreflight(e.payload);
            setShowInvsModal(true);
          } else {
            ctx.showToast('ตรวจ INVS ไม่สำเร็จ: ' + (e?.message || e), 'error');
          }
        } finally { setIsInvsBusy(false); }
      };

      const handleInvsSend = async () => {
        if (!isAdmin || !req || invsSent || isInvsBusy) return;
        setIsInvsBusy(true);
        try {
          const data = await callInvsBridge('send', req.id);
          setInvsPreflight(data);
          ctx.showToast(data.already_sent ? `ใบนี้มีใน INVS แล้ว: ${data.sub_po_no}` : `ส่งเข้า INVS สำเร็จ เลข ${data.sub_po_no}`);
          await ctx.refreshData();
          setShowInvsModal(false);
        } catch(e) {
          if (e?.payload) setInvsPreflight(e.payload);
          ctx.showToast('ส่งเข้า INVS ไม่สำเร็จ: ' + (e?.message || e), 'error');
        } finally { setIsInvsBusy(false); }
      };

      const handleSaveChanges = async () => {
          setIsApproving(true);
          try {
              const reqRef = db.collection('requisitions').doc(req.id);
              const auditRef = db.collection('audit_logs').doc();
              await db.runTransaction(async (tx) => {
                const snap = await tx.get(reqRef);
                if (!snap.exists) throw new Error('ไม่พบใบเบิก');
                const current = snap.data();
                const editableNow = isAdmin ? ['Draft','Pending','Rejected','ApprovalFailed'].includes(current.status) : ['Draft','Pending'].includes(current.status);
                if (!editableNow) throw new Error('ใบเบิกนี้ถูกเปลี่ยนสถานะแล้ว กรุณารีเฟรช');
                if (String(current.invs_status || '').toUpperCase() === 'SENT' || current.invs_sub_po_no) throw new Error('ใบเบิกนี้ส่งเข้า INVS แล้ว จึงล็อกการแก้ไข');
                if (current.is_printed && !isAdmin) throw new Error('ใบเบิกนี้พิมพ์แล้ว จึงล็อกการแก้ไขสำหรับผู้ใช้ รพ.สต.');
                if (!isAdmin && String(current.hospitalId) !== String(ctx.currentUser.hospital_id)) throw new Error('ไม่มีสิทธิ์แก้ไขใบเบิกของหน่วยงานอื่น');
                const revision = toNonNegativeInt(current.revision, 0) + 1;
                tx.update(reqRef, {
                  items: editableItems.map(it => {
                    const locked = lockRequisitionItem({ ...it, packSize: safePackSize(it.packSize) });
                    locked.systemSuggestedQty = getSystemSuggestedQty(locked);
                    locked.submittedDispenseQty = toNonNegativeNumber(locked.dispenseQty);
                    locked.requestedExtraQty = toNonNegativeNumber(locked.requestMore);
                    locked.extraDispenseQtyAtSubmit = Math.max(0, locked.submittedDispenseQty - locked.systemSuggestedQty);
                    return locked;
                  }),
                  created_by_name: safeText(reqName),
                  created_by_position: safeText(reqPosition),
                  updated_by_uid: ctx.currentUser.uid,
                  updated_by_name: ctx.currentUser.name,
                  updated_at: firebase.firestore.FieldValue.serverTimestamp(),
                  revision,
                  status: 'Pending' // legacy Draft จะถูก normalize เป็น Pending เมื่อบันทึกครั้งถัดไป
                });
                tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'REQUISITION_EDIT_FINAL', 'requisitions', req.id, { revision }));
              });
              ctx.showToast('บันทึกการแก้ไขข้อมูลสำเร็จ');
              await ctx.refreshData();
          } catch(e) { ctx.showToast(e.message, 'error'); }
          setIsApproving(false);
      };

      const handleApprove = async () => {
        setIsApproving(true);
        const reqRef = db.collection('requisitions').doc(req.id);
        const approvalToken = makeActionToken();

        // ก่อนอนุมัติ Admin re-derive master fields/สถานะยกเลิกจากฐานปัจจุบันอีกครั้ง
        // เพื่อไม่เชื่อข้อมูลราคา/pack/type/สถานะที่มาจาก client เพียงอย่างเดียว
        const approvedItems = editableItems.map(raw => {
          const drug = ctx.appDb.drugs.find(d => String(d.drug_id) === String(raw.drugId));
          const par = ctx.appDb.parLevels.find(p => String(p.hospital_id) === String(req.hospitalId) && String(p.drug_id) === String(raw.drugId));
          const item = {
            ...raw,
            name: drug?.drug_name || raw.name,
            packSize: safePackSize(drug?.pack_size ?? raw.packSize),
            isUnpacked: drug ? !!drug.unpacked : !!raw.isUnpacked,
            type: safeText(drug?.type ?? raw.type, '1') || '1',
            price: toNonNegativeNumber(drug?.price ?? raw.price),
            dispenseStep: toNonNegativeNumber(drug?.dispense_step ?? raw.dispenseStep ?? raw.dispense_step, 0),
            usageMultiplier: getUsageMultiplier(drug || raw),
            maximumQty: getMaximumQty(drug || raw),
            isDiscontinued: drug ? isDrugDiscontinued(drug) : !!raw.isDiscontinued,
            drugStatus: drug ? getDrugStatusText(drug) : safeText(raw.drugStatus),
            isDisabledForHospital: false,
            usage: toNonNegativeNumber(raw.usage),
            prevExcess: toSafeNumber(raw.prevExcess)
          };
          const reconciliationBase = raw.actualStockTouched && raw.actualStock !== null && raw.actualStock !== undefined
            ? toNonNegativeNumber(raw.actualStock)
            : (item.prevExcess - item.usage);
          item.systemStock = item.prevExcess - item.usage;
          item.actualStock = raw.actualStockTouched ? toNonNegativeNumber(raw.actualStock) : null;
          item.actualStockTouched = !!raw.actualStockTouched;
          if (item.isDiscontinued || item.type === '6') {
            item.netNeed = 0;
            item.dispenseQty = 0;
            item.dispensePack = 0;
            item.newExcess = reconciliationBase;
          } else {
            const requestedQty = toNonNegativeNumber(raw.dispenseQty);
            item.dispenseQty = requestedQty > 0 ? roundDispenseQty(requestedQty, item) : 0;
            if (item.maximumQty > 0 && requestedQty > item.dispenseQty + 0.000001) {
              item.maximumApplied = true;
              item.maximumBeforeQty = Math.max(toNonNegativeNumber(raw.maximumBeforeQty), requestedQty);
            }
            item.dispensePack = Math.ceil(item.dispenseQty / safePackSize(item.packSize));
            item.newExcess = reconciliationBase + item.dispenseQty;
          }
          item.systemSuggestedQty = getSystemSuggestedQty(item);
          item.submittedDispenseQty = toNonNegativeNumber(item.submittedDispenseQty || raw.submittedDispenseQty || raw.dispenseQty);
          item.requestedExtraQty = toNonNegativeNumber(item.requestedExtraQty ?? raw.requestMore);
          item.approvedExtraQty = Math.max(0, toNonNegativeNumber(item.dispenseQty) - item.systemSuggestedQty);
          item.approvedExtraValue = (item.approvedExtraQty / safePackSize(item.packSize)) * toNonNegativeNumber(item.price);
          item.usageValueSnapshot = getUsageItemValue(item);
          item.analytics_schema = 1;
          return item;
        });

        try {
          // Phase 1: claim ใบเบิกด้วย transaction เพื่อกันแอดมินสองคนอนุมัติพร้อมกัน
          await db.runTransaction(async (tx) => {
            const snap = await tx.get(reqRef);
            if (!snap.exists) throw new Error('ไม่พบใบเบิก');
            const current = snap.data();
            if (!['Draft','Pending','ApprovalFailed'].includes(current.status)) throw new Error(`ใบเบิกอยู่ในสถานะ ${current.status} จึงไม่สามารถอนุมัติซ้ำได้`);
            tx.update(reqRef, {
              status: 'Approving',
              approval_token: approvalToken,
              approval_started_at: firebase.firestore.FieldValue.serverTimestamp(),
              approval_started_by_uid: ctx.currentUser.uid,
              approval_started_by_name: ctx.currentUser.name,
              approval_error: firebase.firestore.FieldValue.delete()
            });
          });

          const currentKey = getYearMonthKey(req.month, req.year);
          const operations = [];
          approvedItems.forEach(it => {
              if (!it.drugId) return;
              if (it.actualStockTouched) {
                const safeReqId = String(req.id || 'REQ').replace(/[^A-Za-z0-9_-]/g, '_');
                const safeDrugId = String(it.drugId || 'DRUG').replace(/[^A-Za-z0-9_-]/g, '_');
                operations.push({
                  type: 'set',
                  ref: db.collection('stock_adjustments').doc(`${safeReqId}__RECON__${safeDrugId}`),
                  data: {
                    hospital_id: req.hospitalId,
                    drug_id: it.drugId,
                    old_balance: toSafeNumber(it.systemStock),
                    new_balance: toNonNegativeNumber(it.actualStock),
                    reason: `ปรับยอดคงเหลือจริงจากใบเบิก ${req.id}`,
                    user_name: req.created_by_name || ctx.currentUser.name,
                    user_uid: req.created_by_uid || '',
                    status: 'Approved',
                    source: 'REQUISITION_RECONCILIATION',
                    source_requisition_id: req.id,
                    approved_at: firebase.firestore.FieldValue.serverTimestamp(),
                    approved_by_uid: ctx.currentUser.uid,
                    approved_by_name: ctx.currentUser.name,
                    date: firebase.firestore.FieldValue.serverTimestamp(),
                    schema_version: APP_SCHEMA_VERSION
                  },
                  options: { merge: true }
                });
              }
              operations.push({
                type: 'set',
                ref: db.collection('current_excess').doc(`${req.hospitalId}_${it.drugId}`),
                data: {
                  hospital_id: req.hospitalId,
                  drug_id: it.drugId,
                  excess_balance: toSafeNumber(it.newExcess),
                  last_updated: firebase.firestore.FieldValue.serverTimestamp()
                },
                options: { merge: true }
              });
              operations.push({
                type: 'set',
                ref: db.collection('historical_usages').doc(`${req.hospitalId}_${it.drugId}`),
                data: {
                  hospital_id: req.hospitalId,
                  drug_id: it.drugId,
                  history: { [currentKey]: toNonNegativeNumber(it.usage) },
                  updated_at: firebase.firestore.FieldValue.serverTimestamp()
                },
                options: { merge: true }
              });
          });
          await executeBatchChunks(operations);

          // Phase 2: finalize เฉพาะผู้ที่ถือ approval token นี้
          const auditRef = db.collection('audit_logs').doc();
          await db.runTransaction(async (tx) => {
            const snap = await tx.get(reqRef);
            if (!snap.exists) throw new Error('ไม่พบใบเบิกระหว่าง finalize');
            const current = snap.data();
            if (current.status !== 'Approving' || current.approval_token !== approvalToken) throw new Error('สิทธิ์การอนุมัติใบนี้ถูกเปลี่ยนโดยผู้ใช้อื่น');
            tx.update(reqRef, {
              status: 'Completed',
              items: approvedItems,
              skipped_items: req.skipped_items || [],
              created_by_name: safeText(reqName),
              created_by_position: safeText(reqPosition),
              approved_at: firebase.firestore.FieldValue.serverTimestamp(),
              approved_by_uid: ctx.currentUser.uid,
              approved_by_name: ctx.currentUser.name,
              approval_token: firebase.firestore.FieldValue.delete(),
              approval_error: firebase.firestore.FieldValue.delete(),
              updated_at: firebase.firestore.FieldValue.serverTimestamp()
            });
            tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'REQUISITION_APPROVE', 'requisitions', req.id, { hospital_id: req.hospitalId, month: req.month, year: req.year, item_count: approvedItems.length, reconciled_stock_items: approvedItems.filter(i => i.actualStockTouched).length }));
          });

          ctx.showToast('อนุมัติและอัปเดตสต๊อกเรียบร้อยแล้ว');
          await ctx.refreshData();
          ctx.setCurrentView('dashboard');
        } catch(e) {
          console.error('Approve failed:', e);
          // ถ้าขั้นตอนเขียน stock บางส่วนล้มเหลว จะ mark failed และสามารถกด retry ได้; writes เป็น deterministic จึงทำซ้ำได้
          try {
            await db.runTransaction(async (tx) => {
              const snap = await tx.get(reqRef);
              if (!snap.exists) return;
              const current = snap.data();
              if (current.status === 'Approving' && current.approval_token === approvalToken) {
                tx.update(reqRef, {
                  status: 'ApprovalFailed',
                  approval_error: String(e.message || e).slice(0, 500),
                  approval_failed_at: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
            });
          } catch(markErr) { console.warn('Cannot mark ApprovalFailed:', markErr); }
          ctx.showToast('อนุมัติไม่สำเร็จ: ' + e.message + ' (สามารถเปิดใบนี้แล้วกดลองอนุมัติใหม่ได้)', 'error');
          await ctx.refreshData();
        } finally { setIsApproving(false); }
      };

      const handleRejectReq = async () => {
        setIsApproving(true);
        try {
            const reqRef = db.collection('requisitions').doc(req.id);
            const auditRef = db.collection('audit_logs').doc();
            await db.runTransaction(async (tx) => {
              const snap = await tx.get(reqRef);
              if (!snap.exists) throw new Error('ไม่พบใบเบิก');
              if (!['Draft','Pending'].includes(snap.data().status)) throw new Error('ใบเบิกนี้ถูกเปลี่ยนสถานะแล้ว');
              if (String(snap.data().invs_status || '').toUpperCase() === 'SENT' || snap.data().invs_sub_po_no) throw new Error('ใบเบิกนี้ส่งเข้า INVS แล้ว ไม่สามารถ Reject ได้');
              tx.update(reqRef, {
                status: 'Rejected',
                rejected_at: firebase.firestore.FieldValue.serverTimestamp(),
                rejected_by_uid: ctx.currentUser.uid,
                rejected_by_name: ctx.currentUser.name,
                updated_at: firebase.firestore.FieldValue.serverTimestamp()
              });
              tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'REQUISITION_REJECT', 'requisitions', req.id, { hospital_id: req.hospitalId }));
            });
            ctx.showToast('ไม่อนุมัติใบเบิก');
            await ctx.refreshData();
            ctx.setCurrentView('dashboard');
        } catch(e) { ctx.showToast(e.message, 'error'); } finally { setIsApproving(false); }
      };

      const handleDeleteReq = async () => {
        setIsApproving(true);
        try {
            const reqRef = db.collection('requisitions').doc(req.id);
            const auditRef = db.collection('audit_logs').doc();
            await db.runTransaction(async (tx) => {
              const snap = await tx.get(reqRef);
              if (!snap.exists) throw new Error('ไม่พบใบเบิก');
              const current = snap.data();
              if (String(current.invs_status || '').toUpperCase() === 'SENT' || current.invs_sub_po_no) throw new Error('ใบเบิกนี้ส่งเข้า INVS แล้ว ไม่สามารถลบจาก Sawee VMI ได้');
              const hospitalOwnPending = !isAdmin && String(current.hospitalId) === String(ctx.currentUser.hospital_id) && ['Draft','Pending','Rejected'].includes(current.status);
              const adminAllowed = isAdmin && ['Draft','Pending','Rejected','ApprovalFailed'].includes(current.status);
              if (!hospitalOwnPending && !adminAllowed) throw new Error('ใบเบิกสถานะนี้ไม่อนุญาตให้ลบ');
              tx.delete(reqRef);
              tx.set(auditRef, buildAuditPayload(ctx.currentUser, 'REQUISITION_DELETE', 'requisitions', req.id, { hospital_id: current.hospitalId, month: current.month, year: current.year, status: current.status }));
            });
            ctx.showToast('ลบใบเบิกสำเร็จ');
            await ctx.refreshData();
            ctx.setCurrentView('dashboard');
        } catch(e) { ctx.showToast(e.message, 'error'); } finally { setIsApproving(false); }
      };

      const handleTriggerPrint = async () => {
         if (isPrinting) return;
         setIsPrinting(true);
         const now = new Date();
         try {
           const reqRef = db.collection('requisitions').doc(req.id);
           if (!isPrinted) {
             await reqRef.update({
               is_printed: true,
               printed_at: firebase.firestore.FieldValue.serverTimestamp(),
               printed_by_uid: ctx.currentUser.uid,
               printed_by_name: ctx.currentUser.name
             });
             setLocalPrintedAt(now);
             if (ctx.setAppDb) {
               const clientTs = firebase.firestore.Timestamp.fromDate(now);
               ctx.setAppDb(prev => ({ ...prev, requisitions: (prev.requisitions || []).map(r => String(r.id) === String(req.id) ? { ...r, is_printed: true, printed_at: r.printed_at || clientTs, printed_by_uid: ctx.currentUser.uid, printed_by_name: ctx.currentUser.name } : r) }));
             }
           } else {
             // พิมพ์ซ้ำไม่แก้ requisition อีกครั้ง เพื่อลด write/permission risk; audit ด้านล่างยังเก็บเหตุการณ์พิมพ์ซ้ำ
           }
           writeAuditLog(ctx.currentUser, 'REQUISITION_PRINT', 'requisitions', req.id, { hospital_id: req.hospitalId, reprint: isPrinted });

           const originalTitle = document.title;
           document.title = `ใบเบิก ${hospNameClean} ${req.month}/${fiscalYear}`;
           // window.print เปิด print dialog ของ browser; ไม่จำเป็นต้องสร้าง PDF tab ใหม่
           window.setTimeout(() => {
             window.print();
             document.title = originalTitle;
             setIsPrinting(false);
           }, 250);
         } catch (err) {
           console.error('Cannot mark printed:', err);
           setIsPrinting(false);
           ctx.showToast('ไม่สามารถบันทึกสถานะพิมพ์ได้ จึงยังไม่เปิดหน้าพิมพ์: ' + (err?.message || err), 'error');
         }
      };

      const handleSaveRequisitionNumber = async () => {
        if (!isAdmin || !req) return;
        const info = getFiscalInfo(req.month, req.year);
        const nextTerm = Math.max(1, toNonNegativeInt(fiscalTermDraft, 1));
        const nextNo = formatRequisitionNo(nextTerm, info.fiscalYear);
        setIsSavingReqNo(true);
        try {
          await db.collection('requisitions').doc(req.id).update({
            fiscal_year: info.fiscalYear,
            fiscal_term: nextTerm,
            requisition_no: nextNo,
            requisition_no_updated_at: firebase.firestore.FieldValue.serverTimestamp(),
            requisition_no_updated_by_uid: ctx.currentUser.uid,
            requisition_no_updated_by_name: ctx.currentUser.name,
            schema_version: APP_SCHEMA_VERSION
          });
          await writeAuditLog(ctx.currentUser, 'REQUISITION_NUMBER_UPDATE', 'requisitions', req.id, { fiscal_year:info.fiscalYear, fiscal_term:nextTerm, requisition_no:nextNo });
          if (ctx.setAppDb) ctx.setAppDb(prev => ({ ...prev, requisitions:(prev.requisitions || []).map(r => String(r.id)===String(req.id) ? { ...r, fiscal_year:info.fiscalYear, fiscal_term:nextTerm, requisition_no:nextNo } : r) }));
          ctx.showToast(`บันทึกเลขใบเบิก ${nextNo} แล้ว`);
        } catch(e) {
          ctx.showToast('บันทึกเลขใบเบิกไม่สำเร็จ: ' + (e?.message || e), 'error');
        } finally { setIsSavingReqNo(false); }
      };

      const groupedItems = {};
      const typeKeys = Object.keys(ctx.appDb.drugTypes || DEFAULT_DRUG_TYPES);
      typeKeys.forEach(k => groupedItems[k] = []);
      
      // ปกติซ่อนรายการจำนวนจ่าย 0 แต่ Admin สามารถเปิดดู/แก้กลับได้ เพื่อป้องกันข้อมูลหายจากการพิมพ์ผิด
      const isHiddenReqItem = (it) => !(it.dispenseQty > 0 || it.type === '6' || it.isDiscontinued || isDrugDiscontinued(ctx.appDb.drugs.find(d => String(d.drug_id) === String(it.drugId))));
      const hiddenItemCount = editableItems.filter(isHiddenReqItem).length;
      const itemsToDisplay = (isAdmin && showHiddenItems) ? editableItems : editableItems.filter(it => !isHiddenReqItem(it));

      itemsToDisplay.forEach(it => { if(groupedItems[it.type]) groupedItems[it.type].push(it); else groupedItems['1'].push(it); });
      
      let grandTotalItems = 0;
      let grandTotalPrice = 0;
      let globalItemIndex = 0;

      const directorText = hosp?.affiliation === 'OPT' ? `ผอ.${hospNameClean}` : `ผอ.รพ.สต.${hospNameClean}`;

      return (
        <div className="bg-white rounded-2xl shadow-sm p-4 lg:p-8 animate-fade-in border border-slate-100 print-safe-wrapper print:p-0 print:border-none print:shadow-none w-full relative">
          
          <div className="flex justify-between items-center mb-6 no-print pb-4 border-b relative z-10">
            <button onClick={() => ctx.setCurrentView('dashboard')} className="text-slate-500 font-bold hover:text-slate-800"><i className="fa-solid fa-arrow-left mr-1"></i> กลับ</button>
            <div className="flex gap-2">
              {req.excel_url && <a href={req.excel_url} target="_blank" rel="noopener noreferrer" className="bg-emerald-100 px-4 py-2 rounded-xl font-bold flex items-center text-emerald-700 hover:bg-emerald-200 transition border border-emerald-200 shadow-sm"><i className="fa-solid fa-file-excel mr-2"></i> ดูไฟล์ Excel (รบ.301)</a>}
              {isAdmin && <button onClick={()=>setShowValueAudit(true)} className="bg-violet-100 text-violet-700 border border-violet-200 px-4 py-2 rounded-xl font-bold shadow-sm hover:bg-violet-200 transition"><i className="fa-solid fa-magnifying-glass-chart mr-2"></i>ตรวจสอบมูลค่า</button>}
              {canSendInvs && <button onClick={handleInvsPreflight} disabled={isInvsBusy} className="bg-cyan-600 text-white border border-cyan-700 px-4 py-2 rounded-xl font-bold shadow hover:bg-cyan-700 transition disabled:opacity-50"><i className={`fa-solid ${isInvsBusy?'fa-spinner fa-spin':'fa-database'} mr-2`}></i>{isInvsBusy?'กำลังตรวจ INVS...':'ส่งเข้า INVS'}</button>}
              {isAdmin && invsSent && <div className="bg-cyan-50 text-cyan-800 border border-cyan-200 px-3 py-2 rounded-xl text-xs font-black"><i className="fa-solid fa-circle-check mr-1"></i>INVS {req.invs_sub_po_no || 'SENT'}</div>}
              {isAdmin && <div className="flex items-center gap-1 bg-indigo-50 border border-indigo-200 rounded-xl px-2 py-1 text-xs text-indigo-800" title="Admin แก้เลขใบเบิกได้โดยไม่กระทบจำนวนยา/Stock"><span className="font-bold">เลขใบเบิก</span><input type="number" min="1" step="1" value={fiscalTermDraft} onChange={e=>setFiscalTermDraft(Math.max(1,toNonNegativeInt(e.target.value,1)))} className="w-14 h-7 border border-indigo-200 rounded bg-white text-center font-black outline-none"/><span className="font-black">/{fiscalYear}</span><button onClick={handleSaveRequisitionNumber} disabled={isSavingReqNo} className="h-7 px-2 rounded bg-indigo-600 text-white font-bold disabled:opacity-50">{isSavingReqNo?'...':'บันทึก'}</button></div>}
              {isAdmin && canEdit && <button onClick={()=>setShowHiddenItems(v=>!v)} className={`border px-4 py-2 rounded-xl font-bold shadow-sm transition ${showHiddenItems?'bg-slate-800 text-white border-slate-800':'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200'}`}><i className={`fa-solid ${showHiddenItems?'fa-eye-slash':'fa-eye'} mr-2`}></i>{showHiddenItems?'ซ่อนรายการ 0':`แสดงรายการที่ซ่อน (${hiddenItemCount})`}</button>}
              <button onClick={() => {
                if (isPrinted) return handleTriggerPrint();
                ctx.setConfirmDialog({
                  title: 'ตรวจสอบก่อนพิมพ์',
                  message: isAdmin
                    ? 'การพิมพ์จะล็อกการแก้ไขเฉพาะผู้ใช้ รพ.สต. ส่วน Admin ยังสามารถแก้จำนวนได้จนกว่าจะกด “บันทึกจัดยา” ยืนยันพิมพ์หรือไม่?'
                    : 'หากท่านกดพิมพ์แล้ว จะไม่สามารถแก้ไขข้อมูลใบเบิกนี้ได้อีก กรุณาตรวจสอบข้อมูลให้ครบถ้วนก่อนยืนยัน (หากต้องแก้ภายหลัง สามารถลบใบเบิกนี้แล้วเบิกใหม่ได้)',
                  icon: 'fa-print',
                  iconColor: 'text-blue-600',
                  confirmBtnClass: 'bg-blue-600 hover:bg-blue-700',
                  cancelText: 'ตรวจสอบซ้ำ',
                  confirmText: 'ยืนยัน',
                  onConfirm: handleTriggerPrint
                });
              }} disabled={isPrinting} className={`text-white px-4 py-2 rounded-xl font-bold shadow-lg flex items-center transition bg-blue-600 hover:bg-blue-700 disabled:opacity-50`}><i className={`fa-solid ${isPrinting ? 'fa-spinner fa-spin' : 'fa-print'} mr-2`}></i> {isPrinting ? 'กำลังเตรียมพิมพ์...' : isPrinted ? 'พิมพ์เอกสารซ้ำ' : 'พิมพ์เอกสารเบิก'}</button>
              
              {canDeleteReq && (
                 <button onClick={() => ctx.setConfirmDialog({ title: 'ยืนยันลบใบเบิก', message: `ลบใบเบิก เดือน ${THAI_MONTHS[req.month - 1]} ของ ${hosp?.hospital_name} แล้วข้อมูลจะหายไป และโปรดเบิกเข้ามาใหม่อีก`, icon: 'fa-triangle-exclamation', iconColor: 'text-red-500', confirmBtnClass: 'bg-red-600 hover:bg-red-700 shadow-lg', confirmText: 'รับทราบ ลบทิ้ง', onConfirm: handleDeleteReq })} disabled={isApproving} className="bg-red-100 text-red-700 px-4 py-2 rounded-xl font-bold shadow-sm flex items-center hover:bg-red-200 transition">
                   <i className="fa-solid fa-trash mr-2"></i> ลบใบเบิกทิ้ง
                 </button>
              )}
              
              {canApproveReq && (
                 <>
                    {isPending && <button onClick={() => ctx.setConfirmDialog({ title: 'ยืนยันไม่อนุมัติ', message: 'คุณต้องการไม่อนุมัติใบเบิกนี้ใช่หรือไม่?', icon: 'fa-xmark', iconColor: 'text-red-500', confirmBtnClass: 'bg-red-600 hover:bg-red-700', confirmText: 'ไม่อนุมัติ', onConfirm: handleRejectReq })} disabled={isApproving} className="bg-white border-2 border-red-500 text-red-600 px-6 py-2 rounded-xl font-bold shadow hover:bg-red-50 transition">ไม่อนุมัติ</button>}
                    <button onClick={() => ctx.setConfirmDialog({ title: isApprovalFailed ? 'ลองอนุมัติอีกครั้ง' : 'ยืนยันจัดยา', message: isApprovalFailed ? 'การอนุมัติครั้งก่อนล้มเหลว ระบบจะเขียนข้อมูลเดิมซ้ำแบบ idempotent แล้ว finalize อีกครั้ง' : 'คุณตรวจสอบยอดและต้องการจัดยานี้ใช่หรือไม่?', icon: 'fa-check-double', confirmText: isApprovalFailed ? 'ลองใหม่' : 'ยืนยันจัดยา', onConfirm: handleApprove })} disabled={isApproving} className="bg-gradient-main text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center hover:scale-105">{isApproving ? '...' : <span><i className="fa-solid fa-check-double mr-2"></i> {isApprovalFailed ? 'ลองอนุมัติอีกครั้ง' : 'บันทึกจัดยาแล้ว'}</span>}</button>
                 </>
              )}
            </div>
          </div>

          {invsSent && (
            <div className="mb-5 no-print bg-cyan-50 border border-cyan-200 rounded-xl p-4 text-cyan-900 relative z-10">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-2">
                <div>
                  <div className="font-black"><i className="fa-solid fa-database mr-2"></i>INVS {req.invs_sub_po_no ? `เลข ${req.invs_sub_po_no}` : ''} <span className={`ml-2 text-xs px-2 py-1 rounded-full ${invsConfirmed?'bg-emerald-100 text-emerald-800':'bg-amber-100 text-amber-800'}`}>{invsConfirmed?'ยืนยันจ่ายแล้ว':'ส่งใบเบิกแล้ว'}</span></div>
                  <div className="text-xs mt-1">{isAdmin ? 'รายการถูกล็อกหลังส่งเข้า INVS เพื่อป้องกันข้อมูลสองระบบไม่ตรงกัน' : 'ข้อมูล Lot/EXP ด้านล่างมาจาก INVS ที่ sync กลับเข้าสู่ Sawee VMI'}</div>
                </div>
                {req.invs_last_status_sync_at && <div className="text-[10px] text-cyan-700">Sync สถานะล่าสุด {formatAppDateTime(req.invs_last_status_sync_at)}</div>}
              </div>
              {invsDisplayItems.length>0 && <div className="mt-3 overflow-auto border border-cyan-200 rounded-lg bg-white">
                <table className="w-full text-xs whitespace-nowrap">
                  <thead className="bg-cyan-100/60"><tr><th className="p-2 text-left">ยา</th><th className="p-2 text-right">เบิก</th><th className="p-2 text-right">รับ/จ่าย</th><th className="p-2">Lot</th><th className="p-2">EXP</th><th className="p-2">สถานะ</th></tr></thead>
                  <tbody>{invsDisplayItems.map((x,i)=><tr key={`invs-lot-${x.drug_id||x.WORKING_CODE||i}-${i}`} className="border-t border-cyan-100">
                    <td className="p-2"><div className="font-bold">{x.drug_name || ctx.appDb.drugs.find(d=>String(d.drug_id)===String(x.drug_id||x.WORKING_CODE))?.drug_name || ''}</div><div className="font-mono text-[10px] text-slate-400">{x.drug_id || x.WORKING_CODE || '-'}</div></td>
                    <td className="p-2 text-right">{toNonNegativeNumber(x.qty_order ?? x.qty ?? x.QTY_ORDER).toLocaleString()}</td>
                    <td className="p-2 text-right font-bold">{toNonNegativeNumber(x.qty_rcv ?? x.QTY_RCV ?? x.qty ?? x.QTY_ORDER).toLocaleString()}</td>
                    <td className="p-2 font-mono">{x.lot_no || x.LOT_NO || '-'}</td>
                    <td className="p-2">{x.expiry || x.EXPIRED_DATE || '-'}</td>
                    <td className="p-2">{String(x.confirm_flag || x.CONFIRM_FLAG || req.invs_confirm_flag || '').toUpperCase()==='Y'?<span className="text-emerald-700 font-bold">ยืนยันแล้ว</span>:<span className="text-amber-700">รอยืนยัน</span>}</td>
                  </tr>)}</tbody>
                </table>
              </div>}
              {!invsDisplayItems.length && <div className="text-xs mt-2 text-cyan-700">ยังไม่มีข้อมูล Lot/EXP ที่ sync กลับมา</div>}
            </div>
          )}

          {canEdit && (
