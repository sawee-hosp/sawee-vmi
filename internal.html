        if (!usageMeta) { ctx.showToast('ยังไม่ได้ดึงยอดใช้', 'error'); return null; }
        const cur = effEdit();
        if (cur && cur.status && cur.status !== 'Draft') { if (!quiet) ctx.showToast('ใบนี้ส่งแล้ว — แก้ไขแล้วกด "ส่งใบที่แก้ไข" แทน', 'error'); return null; }
        if (!cur && round && ctx.reqs.some(q => q.round_id === round.id && q.status !== 'Cancelled')) { ctx.showToast(`มีใบเบิกของรอบที่ ${round.round_no} แล้ว — เปิดใบเดิมจากรายการใบเบิก`, 'error'); return null; }
        setBusy('draft');
        try {
          const { items, extra } = buildPharmPayload();
          const id = await saveInternalReq({ ctx, editReq: cur, round, kind: 'pharmacy', items, extra: { ...extra, draft_saved_at: firebase.firestore.FieldValue.serverTimestamp() }, status: 'Draft' });
          draftRef.current = { ...(cur || {}), id, status: 'Draft' };
          if (!quiet) ctx.showToast('บันทึกเก็บไว้แล้ว (รอส่ง) — ดูได้ที่ "ใบเบิกของฉัน"');
          ctx.reload();
          return id;
        } catch (e) { ctx.showToast('บันทึกไม่สำเร็จ: ' + (e?.message || e), 'error'); return null; }
        finally { setBusy(''); }
      };

      // v6.5.2 ลบใบ "รอส่ง" (เปลี่ยนสถานะเป็นยกเลิก ไม่นับเลขที่) เพื่อเลือกรอบเบิกใหม่/ดึงข้อมูลใหม่
      const deleteDraft = () => {
        const cur = effEdit();
        if (!cur?.id || cur.status !== 'Draft') return;
        ctx.setConfirmDialog({
          title: 'ลบใบรอส่งนี้?', message: 'ใบที่บันทึกไว้จะถูกลบออก แล้วกลับไปเลือกรอบเบิกและดึงยอดใช้ใหม่ได้',
          icon: 'fa-trash-can', iconColor: 'text-red-500', confirmBtnClass: 'bg-red-500 hover:bg-red-600', confirmText: 'ลบใบรอส่ง',
          onConfirm: async () => {
            setBusy('del');
            try {
              await cancelDraftReq(ctx, cur.id);
              ctx.showToast('ลบใบรอส่งแล้ว — เลือกรอบเบิกใหม่ได้'); draftRef.current = null;
              await ctx.reload(); onDone();
            } catch (e) { ctx.showToast(e?.message || String(e), 'error'); }
            finally { setBusy(''); }
          }
        });
      };

      const applyAll = (mode) => setRowState(prev => {
        const m = new Map(prev);
        derived.forEach(r => {
          const cur = m.get(r.id) || {};
          if (mode === 'suggest') m.set(r.id, { ...cur, dispenseManual: null });
          if (mode === 'zero') m.set(r.id, { ...cur, dispenseManual: 0 });
          if (mode === 'resetOnHand') m.set(r.id, { ...cur, onHand: null });
        });
        return m;
      });

      const FilterBtn = ({ id, label, count }) => (
        <button onClick={() => setFilter(id)} aria-pressed={filter === id}
          className={`px-3 py-1.5 rounded-lg text-sm font-bold transition ${filter === id ? 'bg-slate-800 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
          {label}{count !== undefined && <span className={`ml-1.5 text-xs ${filter === id ? 'text-slate-300' : 'text-slate-400'}`}>{fmtNum(count)}</span>}
        </button>
      );

      return (
        <div className="space-y-5 animate-fade-in">
          <div className="flex flex-wrap items-end justify-between gap-3">
            <div>
              <div className="text-xs font-bold text-teal-700 tracking-wide">ใบเบิกยาห้องยา · ตามยอดใช้ HOSxP</div>
              <h2 className="text-2xl font-extrabold text-slate-800">{editReq ? `แก้ไขใบ ${editReq.doc_no || ''}` : 'สร้างใบเบิกห้องยา'}</h2>
              <div className="text-sm text-slate-500">{ctx.dept?.dept_name} · แนะนำ = (ใช้/วัน × วันสำรอง) − เครดิต − ค้างรับ แล้วปัดตามแพ็ค · ยาที่เครดิตพอใช้ถึงรอบหน้าจะแนะนำให้ข้าม</div>
              <div className="mt-2"><RoundBanner round={round} editReq={editReq} /></div>
            </div>
            {editReq?.status === 'Rejected' && <div className="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-2 text-sm max-w-md"><b>ถูกส่งกลับ:</b> {editReq.reject_reason || 'ไม่ระบุเหตุผล'}</div>}
          </div>

          {/* ขั้นที่ 1: ช่วงวันที่ + แหล่งยอดใช้ */}
          <div className="bg-white rounded-2xl border shadow-sm p-5">
            <div className="grid gap-4 lg:grid-cols-[auto_auto_auto_auto_1fr] items-end">
              <label className="block"><span className="text-xs font-bold text-slate-500">ยอดใช้ตั้งแต่</span>
                <input type="date" id="usage-from" value={from} max={to} disabled={!!editReq || fromLocked || !!usageMeta} onChange={e => setFrom(e.target.value)} className="block mt-1 p-2.5 border border-slate-300 rounded-xl disabled:bg-slate-100" />
                {fromLocked && !editReq && <span className="text-[11px] text-slate-500"><i className="fa-solid fa-lock mr-1"></i>ต่อจากใบก่อน{isAdmin && <button type="button" onClick={() => setFromUnlocked(true)} className="ml-2 text-teal-700 underline">ปลดล็อก</button>}</span>}</label>
              <label className="block"><span className="text-xs font-bold text-slate-500">ถึง</span>
                <input type="date" id="usage-to" value={to} min={from} max={today} disabled={!!editReq || !!usageMeta} onChange={e => setTo(e.target.value)} className="block mt-1 p-2.5 border border-slate-300 rounded-xl disabled:bg-slate-100" />
                {usageMeta && !usageMeta.stored && !editReq && <button type="button" onClick={() => { setUsageRaw(null); setUsageMeta(null); }} className="text-[11px] text-teal-700 underline">เปลี่ยนช่วงแล้วดึงใหม่</button>}</label>
              <label className="block"><span className="text-xs font-bold text-slate-500">สำรองกี่วัน</span>
                <input type="number" id="cover-days" min="1" max="365" value={coverDays} onChange={e => setCoverDays(Math.max(1, Math.min(365, toNonNegativeInt(e.target.value, 1))))} className="block mt-1 p-2.5 border border-slate-300 rounded-xl w-24 text-right" /></label>
              <label className="block" title="ถ้ายอดที่ต้องเบิกมีมูลค่าต่ำกว่านี้ และเครดิตยังพอใช้อย่างน้อยครึ่งรอบ ระบบจะแนะนำให้รวบไปเบิกรอบหน้า"><span className="text-xs font-bold text-slate-500">รวบเบิกถ้าน้อยกว่า (บาท)</span>
                <input type="number" id="min-order-value" min="0" step="50" value={minOrderValue} onChange={e => setMinOrderValue(Math.max(0, toNonNegativeNumber(e.target.value, 0)))} className="block mt-1 p-2.5 border border-slate-300 rounded-xl w-28 text-right" /></label>
              <div className="flex flex-wrap gap-2 lg:justify-end">
                <button onClick={fetchFromBridge} disabled={!!busy || !!editReq} className="px-4 py-2.5 rounded-xl bg-teal-600 text-white font-bold shadow hover:bg-teal-700 disabled:opacity-40">
                  {busy === 'bridge' ? <i className="fa-solid fa-spinner fa-spin mr-2"></i> : <i className="fa-solid fa-database mr-2"></i>}ดึงยอดใช้จาก HOSxP
                </button>
                <button onClick={() => fileRef.current?.click()} disabled={!!busy || !!editReq} className="px-4 py-2.5 rounded-xl bg-white border border-slate-300 font-bold text-slate-700 hover:bg-slate-50 disabled:opacity-40">
                  {busy === 'file' ? <i className="fa-solid fa-spinner fa-spin mr-2"></i> : <i className="fa-solid fa-file-arrow-up mr-2"></i>}นำเข้าไฟล์
                </button>
                <input ref={fileRef} type="file" accept=".csv,.xls,.xlsx" className="hidden" onChange={e => importFile(e.target.files?.[0])} />
                <button onClick={runDiag} disabled={!!busy} className="px-3 py-2.5 rounded-xl text-slate-500 hover:bg-slate-100 font-bold text-sm"><i className={`fa-solid ${busy === 'diag' ? 'fa-spinner fa-spin' : 'fa-stethoscope'} mr-1`}></i>ตรวจการเชื่อม HOSxP</button>
                <button onClick={() => setShowSql(true)} className="px-3 py-2.5 rounded-xl text-slate-500 hover:bg-slate-100 font-bold text-sm"><i className="fa-solid fa-code mr-1"></i>SQL สำหรับ export</button>
              </div>
            </div>
            <div className="mt-4 flex flex-wrap gap-x-6 gap-y-2 text-sm">
              <span className="text-slate-500">ช่วงที่เลือก <b className="text-slate-800">{periodDays || '-'}</b> วัน · ห่างรอบหน้า <b className="text-slate-800">{roundDays}</b> วัน{prevReq && !editReq && <span className="text-slate-400"> · ใบก่อน {prevReq.form_no || prevReq.doc_no} ยอดใช้ {formatThaiDate(prevReq.period_from)}–{formatThaiDate(prevReq.period_to)}</span>}</span>
              {usageMeta ? (
                <span className={usageStale ? 'text-amber-700 font-bold' : 'text-emerald-700'}>
                  <i className={`fa-solid ${usageStale ? 'fa-triangle-exclamation' : 'fa-circle-check'} mr-1`}></i>
                  {usageMeta.stored ? 'ใช้ยอดใช้ที่บันทึกไว้ในใบนี้' : `${usageMeta.source === 'bridge' ? 'HOSxP Bridge' : `ไฟล์ ${usageMeta.fileName}`} · ${formatThaiDate(usageMeta.from)}–${formatThaiDate(usageMeta.to)} · ${fmtNum(usageMeta.count)} icode`}
                  {usageStale && ' — ช่วงวันที่เปลี่ยน กรุณาดึงยอดใหม่'}
                  {usageMeta.combinedOnly && ' · ไฟล์มีแต่ยอดรวม (ไม่แยก OPD/IPD)'}
                </span>
              ) : <span className="text-slate-400"><i className="fa-regular fa-circle mr-1"></i>ยังไม่ได้ดึงยอดใช้</span>}
              {overlapReq && <span className="text-red-600 font-bold"><i className="fa-solid fa-triangle-exclamation mr-1"></i>ทับช่วงกับใบ {overlapReq.doc_no || overlapReq.id}</span>}
            </div>
          </div>

          {/* สรุป */}
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
            {[
              ['มีการใช้', stats.used, 'รายการ', 'used'],
              ['แนะนำให้เบิก', stats.suggest, 'รายการ', 'suggest'],
              ['จะเบิก', stats.order, 'รายการ', 'order'],
              ['มูลค่าเบิก', fmtMoney(stats.value), 'บาท', 'order'],
              ['ไม่จับคู่ icode', unmatched.length, 'รายการ', null]
            ].map(([label, v, unit, f]) => (
              <button key={label} onClick={() => f ? setFilter(f) : setShowUnmatched(true)}
                className={`text-left bg-white rounded-xl border p-4 hover:border-teal-400 transition ${label.startsWith('ไม่จับคู่') && unmatched.length ? 'border-amber-300 bg-amber-50' : ''}`}>
                <div className="text-xs font-bold text-slate-500">{label}</div>
                <div className="text-2xl font-extrabold tnum text-slate-800">{typeof v === 'number' ? fmtNum(v) : v} <span className="text-xs font-medium text-slate-400">{unit}</span></div>
              </button>
            ))}
          </div>

          {/* ตาราง */}
          <div className="bg-white rounded-2xl border shadow-sm">
            <div className="p-4 border-b flex flex-wrap gap-2 items-center">
              <FilterBtn id="all" label="ทั้งหมด" count={derived.length} />
              <FilterBtn id="used" label="มีการใช้" count={stats.used} />
              <FilterBtn id="suggest" label="แนะนำให้เบิก" count={stats.suggest} />
              <FilterBtn id="order" label="จะเบิก" count={stats.order} />
              <FilterBtn id="unused" label="ไม่มีการใช้" />
              <FilterBtn id="skip" label="แนะนำข้ามรอบนี้" count={stats.skip} />
              <FilterBtn id="changed" label="แก้ไขเอง" count={stats.changed} />
              <div className="flex-1"></div>
              <label className="inline-flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                <input type="checkbox" checked={showHistory} onChange={e => setShowHistory(e.target.checked)} className="w-4 h-4 accent-teal-600" /> แสดงยาที่เคยเบิก/มีสต็อก แม้ไม่มีการใช้
              </label>
              {['5', '6'].map(t => (
                <label key={t} className="inline-flex items-center gap-2 text-sm text-slate-600 cursor-pointer" title="ซ่อนจากตาราง ใบเบิก และใบพิมพ์">
                  <input type="checkbox" id={`ph-hide-type-${t}`} checked={hideTypes.includes(t)} onChange={() => toggleHideType(t)} className="w-4 h-4 accent-teal-600" />
                  ซ่อน{(ctx.drugTypes || DEFAULT_DRUG_TYPES)[t] || `หมวด ${t}`} (หมวด {t}){hiddenByType[t] ? <span className="text-xs text-slate-400">{fmtNum(hiddenByType[t])}</span> : null}
                </label>
              ))}
            </div>
            <div className="p-4 border-b grid gap-3 md:grid-cols-[1fr_1fr_auto] items-center">
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="กรองในตาราง: ชื่อยา / รหัส / icode" aria-label="กรองในตาราง" className="px-4 py-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-teal-500" />
              <DrugSearchBox ctx={ctx} excludeIds={rowIds} placeholder="+ เพิ่มยา / เวชภัณฑ์มิใช่ยา ที่ไม่มีในรายการ (ไม่มียอดจาก HOSxP — กรอกคงเหลือ/จำนวนจ่ายเอง หรือเว้นว่างไว้เขียนในกระดาษ)"
                onPick={d => { patchRow(String(d.drug_id), { base: baseItemFromDrug(ctx, d), source: 'manual', dispenseManual: 0 }); if (hideTypes.includes(String(d.type || '1'))) toggleHideType(String(d.type || '1')); setFilter('all'); setSearch(d.drug_name); }} />
              <div className="flex gap-2 items-center">
                <select value={sortBy} onChange={e => setSortBy(e.target.value)} aria-label="เรียงตาม" className="p-2.5 border border-slate-300 rounded-xl text-sm">
                  <option value="name">เรียงชื่อยา</option><option value="loc">หมวด + ตำแหน่งยา (แบบใบเบิก)</option><option value="value">มูลค่าเบิก</option><option value="usage">มูลค่าที่ใช้</option>
                </select>
              </div>
            </div>
            <div className="px-4 py-2 border-b flex flex-wrap gap-2 text-sm bg-slate-50">
              <button onClick={() => applyAll('suggest')} className="px-3 py-1 rounded-lg bg-white border hover:bg-teal-50 font-bold text-teal-700"><i className="fa-solid fa-wand-magic-sparkles mr-1"></i>ใช้ตามแนะนำทั้งหมด</button>
              <button onClick={() => applyAll('zero')} className="px-3 py-1 rounded-lg bg-white border hover:bg-slate-100 font-bold text-slate-600">ตั้งจำนวนเบิกเป็น 0 ทั้งหมด</button>
              {!editReq && <button onClick={() => applyAll('resetOnHand')} className="px-3 py-1 rounded-lg bg-white border hover:bg-slate-100 font-bold text-slate-600">คืนค่าคงเหลือที่แก้</button>}
              <span className="text-slate-400 self-center ml-auto">ช่องสีเหลือง = แก้ไขเอง · กด Enter เพื่อยืนยันตัวเลข</span>
            </div>
            <div className="overflow-auto max-h-[70vh]">
              <table className="w-full text-sm sticky-head">
                <thead className="text-[11px] text-slate-500">
                  <tr className="bg-slate-100">
                    <th className="p-2 text-left bg-slate-100 min-w-[16rem]">รายการ (INVS / HOSxP)</th>
                    <th className="p-2 text-right bg-slate-100">OPD</th>
                    <th className="p-2 text-right bg-slate-100">IPD</th>
                    <th className="p-2 text-right bg-slate-100" title="ตัวคูณแปลงหน่วย HOSxP → หน่วย INVS">×แปลงหน่วย</th>
                    <th className="p-2 text-right bg-slate-100">ใช้ (INVS)</th>
                    <th className="p-2 text-right bg-slate-100">เฉลี่ย/วัน</th>
                    <th className="p-2 text-right bg-slate-100" title="คงเหลือจากใบก่อน − ยอดใช้รอบนี้">เครดิต</th>
                    <th className="p-2 text-right bg-slate-100">ค้างรับ</th>
                    <th className="p-2 text-right bg-slate-100">เป้า {coverDays} วัน</th>
                    <th className="p-2 text-right bg-slate-100">แนะนำ</th>
                    <th className="p-2 text-right bg-slate-100">เบิกจริง</th>
                    <th className="p-2 text-right bg-slate-100">มูลค่า</th>
                  </tr>
                </thead>
                <tbody>
                  {visible.length === 0 && <tr><td colSpan="12" className="p-10 text-center text-slate-400">{usageMeta ? 'ไม่มีรายการตามตัวกรอง' : 'เลือกช่วงวันที่แล้วกด "ดึงยอดใช้จาก HOSxP" หรือ "นำเข้าไฟล์"'}</td></tr>}
                  {visible.slice(0, 800).map(r => {
                    const pack = safePackSize(r.base.packSize);
                    const hint = !r.follow ? dispenseStepHint(r.dispense, r.base) : null;
                    return (
                      <tr key={r.id} className={`border-t align-top ${r.dispense > 0 ? '' : 'text-slate-500'} ${r.blocked ? 'bg-slate-50' : ''}`}>
                        <td className="p-2">
                          <div className="font-semibold text-slate-800">{r.base.name}</div>
                          <div className="text-[11px] text-slate-400 font-mono flex flex-wrap gap-x-2">
                            <span>{r.id}</span>
                            {r.icodes.length > 0 && <span className="text-purple-500">HOSxP {r.icodes.join(',')}</span>}
                            <span>{r.base.unit}{pack > 1 ? ` ×${pack}` : ''}</span>
                            {r.hosxpUnits && r.hosxpUnits !== r.base.unit && <span className="text-amber-600">HOSxP หน่วย: {r.hosxpUnits}</span>}
                            {r.source === 'manual' && <span className="text-teal-600 font-bold">เพิ่มเอง</span>}
                            {r.source === 'history' && <span>เคยเบิก</span>}
                            {r.blocked && <span className="text-red-500 font-bold">{String(r.base.type) === '6' ? 'วัคซีน (ไม่ส่ง INVS)' : 'ยกเลิกใช้'}</span>}
                          </div>
                        </td>
                        <td className="p-2 text-right tnum">{r.opdRaw ? fmtNum(r.opdRaw) : '-'}</td>
                        <td className="p-2 text-right tnum">{r.ipdRaw ? fmtNum(r.ipdRaw) : '-'}</td>
                        <td className="p-2 text-right"><NumCell value={r.multiplier} touched={r.multiplierChanged} ariaLabel={`ตัวคูณ ${r.base.name}`} className="w-16"
                          onCommit={v => patchRow(r.id, { multiplier: v === null || v <= 0 ? getHosxpMultiplier(r.drug) : v })} /></td>
                        <td className="p-2 text-right tnum font-semibold">{r.usage ? fmtNum(r.usage) : '-'}</td>
                        <td className="p-2 text-right tnum">{r.dailyAvg ? fmtNum(r.dailyAvg, 1) : '-'}</td>
                        <td className="p-2 text-right whitespace-nowrap">
                          <NumCell value={r.onHand} touched={r.onHandTouched} ariaLabel={`เครดิต ${r.base.name}`} onCommit={v => patchRow(r.id, { onHand: v })} />
                          {!r.onHandTouched && r.hasStock && r.usage > 0 && <div className="text-[10px] text-slate-400">{fmtNum(r.stockBal)} − {fmtNum(r.usage)}</div>}
                          {r.onHandTouched && !editReq && <button onClick={() => patchRow(r.id, { onHand: null })} className="text-[10px] text-slate-400 hover:text-teal-600 block ml-auto">↺ คืนค่า</button>}
                        </td>
                        <td className="p-2 text-right tnum">{r.inTransit ? fmtNum(r.inTransit) : '-'}</td>
                        <td className="p-2 text-right tnum">{r.target ? fmtNum(r.target) : '-'}</td>
                        <td className="p-2 text-right tnum font-bold text-teal-700">{r.suggested ? <QtyWithPack qty={r.suggested} packSize={pack} /> : '-'}
                          {r.skipReason && <div className="mt-0.5"><span className="text-[10px] font-bold text-amber-800 bg-amber-100 rounded px-1.5 py-0.5 whitespace-nowrap">ข้าม: {r.skipReason}</span></div>}
                          {r.suggested > 0 && r.coverRounds >= 1.9 && <div className="text-[10px] text-slate-400 font-normal">พอ ~{Math.floor(r.coverRounds)} รอบ</div>}</td>
                        <td className="p-2 text-right whitespace-nowrap">
                          <NumCell value={r.dispense} touched={!r.follow} disabled={r.blocked} ariaLabel={`เบิกจริง ${r.base.name}`} onCommit={v => patchRow(r.id, { dispenseManual: v === null ? null : v })} />
                          {pack > 1 && r.dispense > 0 && <div className="text-[10px] text-slate-400">= {formatQty(r.dispense, pack)} แพ็ค</div>}
                          {!r.follow && <button onClick={() => patchRow(r.id, { dispenseManual: null })} className="text-[10px] text-teal-600 hover:underline block ml-auto">ใช้ตามแนะนำ</button>}
                          {hint && <button onClick={() => patchRow(r.id, { dispenseManual: hint })} className="text-[10px] text-amber-700 hover:underline block ml-auto">ปัดเป็น {fmtNum(hint)}</button>}
                        </td>
                        <td className="p-2 text-right tnum">{r.value ? fmtMoney(r.value) : '-'}</td>
                      </tr>
                    );
                  })}
                  {visible.length > 800 && <tr><td colSpan="12" className="p-4 text-center text-slate-400">แสดง 800 จาก {fmtNum(visible.length)} รายการ — ใช้ตัวกรองหรือค้นหาเพื่อดูรายการอื่น (ทุกรายการยังถูกคำนวณและส่งตามปกติ)</td></tr>}
                </tbody>
              </table>
            </div>
          </div>

          <div className="bg-white rounded-2xl border shadow-sm p-5 grid md:grid-cols-[1fr_auto] gap-4 items-end">
            <div>
              <label className="block text-sm font-bold text-slate-600 mb-1" htmlFor="ph-note">หมายเหตุ</label>
              <textarea id="ph-note" rows="2" value={note} onChange={e => setNote(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-teal-500" />
            </div>
            <div className="text-right space-y-3">
              <div className="text-sm text-slate-500">เบิก {fmtNum(stats.order)} รายการ · <span className="font-bold text-slate-800 tnum">{fmtMoney(stats.value)}</span> บาท</div>
              <div className="flex gap-2 justify-end">
                <button onClick={onDone} className="px-5 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">ยกเลิก</button>
                {(editReq?.status === 'Draft' || draftRef.current?.status === 'Draft') && <button id="ph-draft-del" onClick={deleteDraft} disabled={!!busy} title="ลบใบรอส่งนี้ แล้วเลือกรอบเบิก/ดึงยอดใช้ใหม่" className="px-5 py-3 rounded-xl bg-white border-2 border-red-300 text-red-600 font-bold hover:bg-red-50 disabled:opacity-40"><i className="fa-solid fa-trash-can mr-2"></i>ลบใบรอส่ง / เริ่มใหม่</button>}
                <button id="ph-estimate" onClick={() => setShowEstimate(true)} disabled={!derived.length} title="พิมพ์ใบเบิกไปเสนออนุมัติ และเก็บไว้รอส่ง — ยังไม่ส่ง VMI" className="px-5 py-3 rounded-xl bg-white border-2 border-teal-600 text-teal-700 font-bold hover:bg-teal-50 disabled:opacity-40"><i className="fa-solid fa-print mr-2"></i>พิมพ์ใบเบิก / บันทึกรอส่ง</button>
