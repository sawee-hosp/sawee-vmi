<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Sawee Rxfill — เบิกยาภายใน รพ.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2310b981%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23047857%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M9%2020a3%203%200%200%201%203-3h22a3%203%200%200%201%203%203v3h7.2a3%203%200%200%201%202.4%201.2l6.8%209a3%203%200%200%201%20.6%201.8V43a3%203%200%200%201-3%203h-2.2a6%206%200%200%201-11.6%200H27.8a6%206%200%200%201-11.6%200H12a3%203%200%200%201-3-3Zm28%207v7h11.4l-5.2-7Z%22%2F%3E%3Ccircle%20cx%3D%2222%22%20cy%3D%2245%22%20r%3D%223.2%22%20fill%3D%22%23047857%22%2F%3E%3Ccircle%20cx%3D%2243%22%20cy%3D%2245%22%20r%3D%223.2%22%20fill%3D%22%23047857%22%2F%3E%3Cpath%20fill%3D%22%23047857%22%20d%3D%22M21%2025h4v4h4v4h-4v4h-4v-4h-4v-4h4Z%22%2F%3E%3C%2Fsvg%3E">
  <meta name="theme-color" content="#047857">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
    .bg-gradient-main { background: linear-gradient(135deg, #0d9488 0%, #059669 100%); }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0d9488; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .animate-fade-in { animation: fadeIn 0.25s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .animate-fade-in, .loader { animation: none; } }
    .tnum { font-variant-numeric: tabular-nums; }
    .num-in { width: 5.5rem; text-align: right; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font-variant-numeric: tabular-nums; }
    .num-in:focus { outline: none; border-color: #0d9488; box-shadow: 0 0 0 2px rgba(13,148,136,.2); }
    .num-in.touched { background: #fffbeb; border-color: #f59e0b; }
    .sticky-head th { position: sticky; top: 0; z-index: 5; }
    .print-area { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      body { background: #fff !important; }
      .no-print { display: none !important; }
      .print-area { display: block !important; }
      .screen-only { display: none !important; }
      .print-area table { border-collapse: collapse; width: 100%; font-size: 12px; }
      .print-area th, .print-area td { border: 1px solid #000; padding: 3px 5px; }
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen">
  <div id="root"></div>

  <!-- shared utilities: Firebase init, constants, helpers (NO JSX) -->
  <script src="shared.js?v=6.6.2"></script>
  <!-- กันไฟล์ shared.js เก่าค้าง cache: ถ้าเวอร์ชันไม่ตรง แสดงแถบเตือนแทนการพังเงียบ -->
  <script>
    (function () {
      var need = '6.6.2';
      var got = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '(ไม่พบ shared.js)';
      if (got === need) return;
      var show = function () {
        var d = document.createElement('div');
        d.setAttribute('role', 'alert');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;padding:12px 16px;font:600 14px Sarabun,sans-serif;text-align:center';
        d.textContent = 'ไฟล์ shared.js ไม่ตรงเวอร์ชัน (ต้องการ v' + need + ' แต่ได้ v' + got + ') — อัปโหลด shared.js ชุดใหม่ขึ้น GitHub ให้ครบ แล้วรอ 1-2 นาที กด Ctrl+F5';
        document.body.appendChild(d);
      };
      if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ===== Shared UI (ซ้ำกับ app.html เพราะ Babel standalone แชร์ JSX ข้ามไฟล์ไม่ได้) =====
    const Toast = ({ message, type, onClose }) => {
      useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, [onClose]);
      const bg = type === 'error' ? 'bg-red-500' : type === 'warn' ? 'bg-amber-500' : 'bg-emerald-500';
      return (
        <div role="status" className={`no-print fixed top-6 right-6 ${bg} text-white px-6 py-4 rounded-xl shadow-2xl flex items-center z-[250] animate-fade-in font-medium max-w-md`}>
          <i className={`fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} mr-3 text-xl`}></i>
          {message}
        </div>
      );
    };

    const Modal = ({ title, children, onClose, isOpen, maxWidth }) => {
      if (!isOpen) return null;
      return (
        <div className="no-print fixed inset-0 z-[150] flex items-center justify-center px-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in py-8">
          <div className={`bg-white rounded-2xl shadow-2xl w-full ${maxWidth || 'max-w-2xl'} overflow-hidden flex flex-col max-h-full`}>
            <div className="p-5 border-b flex justify-between items-center bg-slate-50 shrink-0">
              <h3 className="text-xl font-bold text-slate-800">{title}</h3>
              <button onClick={onClose} aria-label="ปิด" className="text-slate-400 hover:text-red-500 transition bg-white border border-slate-200 rounded-full w-8 h-8 flex items-center justify-center shadow-sm">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>
            <div className="p-6 overflow-y-auto">{children}</div>
          </div>
        </div>
      );
    };

    const UniversalConfirmModal = ({ confirmDialog, setConfirmDialog }) => {
      if (!confirmDialog) return null;
      return (
        <div className="no-print fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[200] px-4 animate-fade-in">
          <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <div className="flex items-center text-slate-800 mb-4">
              <i className={`fa-solid ${confirmDialog.icon || 'fa-circle-question'} text-3xl mr-3 ${confirmDialog.iconColor || 'text-indigo-500'}`}></i>
              <h3 className="text-xl font-bold">{confirmDialog.title}</h3>
            </div>
            <div className="text-slate-600 mb-6 whitespace-pre-line">{confirmDialog.message}</div>
            <div className="flex justify-end gap-3">
              <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200">{confirmDialog.cancelText || 'ยกเลิก'}</button>
              <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className={`px-4 py-2 text-white rounded-xl font-bold shadow-lg ${confirmDialog.confirmBtnClass || 'bg-indigo-600 hover:bg-indigo-700'}`}>
                {confirmDialog.confirmText || 'ยืนยัน'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    const FullScreenSpinner = ({ text }) => (
      <div className="fixed inset-0 z-[300] bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center">
        <div className="loader mb-4 w-16 h-16"></div>
        <p className="text-white font-bold text-lg tracking-wider">{text || 'กำลังโหลดข้อมูล...'}</p>
      </div>
    );

    // ===== Internal helpers (JSX) =====
    const STATUS_STYLE = {
      Draft: 'bg-violet-100 text-violet-800',
      Pending: 'bg-amber-100 text-amber-800', Approving: 'bg-blue-100 text-blue-700', Completed: 'bg-emerald-100 text-emerald-700',
      Rejected: 'bg-red-100 text-red-700', Cancelled: 'bg-slate-200 text-slate-500', ApprovalFailed: 'bg-red-100 text-red-700'
    };
    const StatusPill = ({ status }) => (
      <span className={`px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap ${STATUS_STYLE[status] || 'bg-slate-100 text-slate-600'}`}>
        {INTERNAL_STATUS_LABELS[status] || status || '-'}
      </span>
    );

    const fmtNum = (v, digits) => {
      const n = Number(v);
      if (!Number.isFinite(n)) return '0';
      return n.toLocaleString('th-TH', { maximumFractionDigits: digits ?? 2 });
    };
    const fmtMoney = (v) => toNonNegativeNumber(v).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // จำนวนเป็นหน่วยย่อย + แสดงเป็นแพ็ค เช่น 1,000 เม็ด = 10 แพ็ค×100
    const QtyWithPack = ({ qty, packSize, unit }) => {
      const pack = safePackSize(packSize);
      const q = toNonNegativeNumber(qty);
      return (
        <span className="tnum">
          <span className="font-bold">{fmtNum(q)}</span>
          {pack > 1 && q > 0 && <span className="text-[11px] text-slate-400 ml-1">({formatQty(q, pack)}×{pack})</span>}
          {unit && <span className="text-[11px] text-slate-400 ml-1">{unit}</span>}
        </span>
      );
    };

    // ช่องตัวเลขที่ commit ตอน blur/Enter — กัน re-render ทั้งตารางทุกครั้งที่พิมพ์
    const NumCell = ({ value, onCommit, disabled, touched, className, ariaLabel, min }) => {
      const [text, setText] = useState(value === null || value === undefined ? '' : String(value));
      useEffect(() => { setText(value === null || value === undefined ? '' : String(value)); }, [value]);
      const commit = () => {
        const raw = String(text).replace(/,/g, '').trim();
        if (raw === '') { onCommit(null); return; }
        const n = Number(raw);
        if (!Number.isFinite(n) || n < (min ?? 0)) { setText(value === null || value === undefined ? '' : String(value)); return; }
        if (n !== Number(value)) onCommit(n);
      };
      return (
        <input type="text" inputMode="decimal" aria-label={ariaLabel} disabled={disabled}
          className={`num-in ${touched ? 'touched' : ''} ${disabled ? 'opacity-40' : ''} ${className || ''}`}
          value={text} onChange={e => setText(e.target.value)} onBlur={commit}
          onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') { setText(value === null || value === undefined ? '' : String(value)); } }} />
      );
    };

    const drugMatches = (d, q) => {
      if (!q) return true;
      const needle = normalizeForMatch(q);
      if (!needle) return true;
      return normalizeForMatch(d.drug_name).includes(needle)
        || String(d.drug_id || '').toLowerCase().includes(q.toLowerCase().trim())
        || String(d.hosxp_code || '').toLowerCase().includes(q.toLowerCase().trim())
        || normalizeForMatch(d.fuzzy).includes(needle)
        || normalizeForMatch(d.invs_keywords).includes(needle)
        || String(d.invs_location || '').toLowerCase() === q.toLowerCase().trim();
    };

    // ช่องค้นหายาจาก master_drugs (ไม่แสดงยา "ยกเลิกใช้" ทุกหน่วย และวัคซีน type 6 · ยา "ยกเลิก รพ.สต." ยังเบิกได้)
    const DrugSearchBox = ({ ctx, onPick, excludeIds, placeholder, autoFocus }) => {
      const [q, setQ] = useState('');
      const [open, setOpen] = useState(false);
      const [hi, setHi] = useState(0);
      const results = useMemo(() => {
        if (!q.trim()) return [];
        const ex = excludeIds || new Set();
        return ctx.drugs.filter(d => !isDrugDiscontinuedAll(d) && String(d.type) !== '6' && drugMatches(d, q))
          .slice(0, 30)
          .map(d => ({ d, added: ex.has(String(d.drug_id)) }));
      }, [q, ctx.drugs, excludeIds]);
      const pick = (d) => { onPick(d); setQ(''); setOpen(false); setHi(0); };
      return (
        <div className="relative">
          <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input value={q} autoFocus={autoFocus} placeholder={placeholder || 'ค้นหาชื่อยา / รหัส INVS / รหัส HOSxP แล้วกด Enter'}
            aria-label="ค้นหายา"
            className="w-full pl-11 pr-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-teal-500 bg-white"
            onChange={e => { setQ(e.target.value); setOpen(true); setHi(0); }}
            onFocus={() => setOpen(true)} onBlur={() => setTimeout(() => setOpen(false), 150)}
            onKeyDown={e => {
              if (e.key === 'ArrowDown') { e.preventDefault(); setHi(h => Math.min(h + 1, results.length - 1)); }
              else if (e.key === 'ArrowUp') { e.preventDefault(); setHi(h => Math.max(0, h - 1)); }
              else if (e.key === 'Enter' && results[hi]) { e.preventDefault(); pick(results[hi].d); }
              else if (e.key === 'Escape') setOpen(false);
            }} />
          {open && results.length > 0 && (
            <div className="absolute z-30 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-xl max-h-80 overflow-y-auto">
              {results.map(({ d, added }, i) => (
                <button key={d.drug_id} type="button" onMouseDown={e => e.preventDefault()} onClick={() => pick(d)}
                  className={`w-full text-left px-4 py-2.5 flex items-center gap-3 border-b last:border-0 ${i === hi ? 'bg-teal-50' : 'hover:bg-slate-50'}`}>
                  <span className="font-mono text-xs text-slate-400 w-16 shrink-0">{d.drug_id}</span>
                  <span className="flex-1 text-sm font-medium">{d.drug_name}{d.invs_keywords ? <span className="block text-[11px] text-slate-400 font-normal">{d.invs_keywords}</span> : null}</span>
                  <span className="text-xs text-slate-400 shrink-0">{ctx.unitName(d)}{safePackSize(d.pack_size) > 1 ? ` · แพ็ค ${safePackSize(d.pack_size)}` : ''}</span>
                  {added && <span className="text-[10px] font-bold text-teal-700 bg-teal-100 px-1.5 py-0.5 rounded">อยู่ในใบแล้ว</span>}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    };

    const baseItemFromDrug = (ctx, drug) => {
      const snap = drugSnapshot(drug);
      return {
        drugId: String(drug.drug_id), name: safeText(drug.drug_name), unit: ctx.unitName(drug),
        packSize: snap.packSize, isUnpacked: snap.isUnpacked, dispenseStep: snap.dispenseStep, maximumQty: snap.maximumQty,
        // หน่วยงานใน รพ. ล็อกเฉพาะยา "ยกเลิกใช้" (ทุกหน่วย) — "ยกเลิก รพ.สต." ยังเบิกได้
        type: snap.type, price: snap.price, isDiscontinued: snap.discontinuedAll, discontinuedAll: snap.discontinuedAll
      };
    };

    const dispenseStepHint = (qty, item) => {
      const q = toNonNegativeNumber(qty);
      if (q <= 0) return null;
      const step = Math.max(1, getDispenseStep(item));
      if (step <= 1 || Math.abs(q / step - Math.round(q / step)) < 1e-9) return null;
      return roundDispenseQtyUncapped(q, item);
    };

    const buildDocNo = (deptId) => {
      const d = new Date();
      return `${deptId}-${String(d.getFullYear() + 543).slice(2)}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}`;
    };

    // ===== ใบพิมพ์ (ใช้ได้ทั้งหน่วยงานและห้องยา) =====
    const PrintSheet = ({ req, dept, drugById }) => {
      if (!req) return null;
      const locOf = (id) => safeText(drugById?.get(String(id))?.invs_location);
      const items = (req.items || []).filter(it => toNonNegativeNumber(it.dispenseQty ?? it.requestQty) > 0);
      const total = items.reduce((s, it) => s + internalItemValue(it), 0);
      return (
        <div className="print-area">
          <div style={{ textAlign: 'center', fontWeight: 700, fontSize: 18 }}>ใบเบิกยา{req.kind === 'pharmacy' ? ' (ห้องยา)' : ''} — โรงพยาบาลสวี</div>
          <div style={{ display: 'flex', justifyContent: 'space-between', margin: '8px 0', fontSize: 13 }}>
            <div>หน่วยเบิก: <b>{req.dept_name || dept?.dept_name}</b></div>
            <div>เลขที่: <b>{req.doc_no || req.id}</b></div>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8, fontSize: 13 }}>
            <div>วันที่ส่ง: {formatAppDateTime(req.submitted_at || req.created_at)}</div>
            {req.kind === 'pharmacy' && <div>ยอดใช้ช่วง {formatThaiDate(req.period_from)} – {formatThaiDate(req.period_to)} ({req.period_days} วัน) · สำรอง {req.cover_days} วัน</div>}
            {req.invs_sub_po_no && <div>INVS: {req.invs_sub_po_no}</div>}
          </div>
          <table>
            <thead><tr><th>#</th><th>ตำแหน่ง</th><th>รหัส</th><th>รายการ</th><th>หน่วย</th>{req.kind === 'pharmacy' && <th>ใช้/ช่วง</th>}{req.kind === 'pharmacy' && <th>คงเหลือ</th>}<th>จำนวนเบิก</th><th>มูลค่า</th><th>หมายเหตุ</th></tr></thead>
            <tbody>
              {items.map((it, i) => (
                <tr key={it.drugId}>
                  <td style={{ textAlign: 'center' }}>{i + 1}</td><td>{locOf(it.drugId)}</td><td>{it.drugId}</td><td>{it.name}</td><td>{it.unit}{safePackSize(it.packSize) > 1 ? ` (×${safePackSize(it.packSize)})` : ''}</td>
                  {req.kind === 'pharmacy' && <td style={{ textAlign: 'right' }}>{fmtNum(it.usage)}</td>}
                  {req.kind === 'pharmacy' && <td style={{ textAlign: 'right' }}>{fmtNum(it.onHand)}</td>}
                  <td style={{ textAlign: 'right', fontWeight: 700 }}>{fmtNum(it.dispenseQty ?? it.requestQty)}</td>
                  <td style={{ textAlign: 'right' }}>{fmtMoney(internalItemValue(it))}</td>
                  <td>{it.note || ''}</td>
                </tr>
              ))}
              <tr><td colSpan={req.kind === 'pharmacy' ? 8 : 6} style={{ textAlign: 'right', fontWeight: 700 }}>รวม {items.length} รายการ</td><td style={{ textAlign: 'right', fontWeight: 700 }}>{fmtMoney(total)}</td><td></td></tr>
            </tbody>
          </table>
          {req.note && <div style={{ marginTop: 8, fontSize: 13 }}>หมายเหตุ: {req.note}</div>}
          <div style={{ display: 'flex', justifyContent: 'space-around', marginTop: 40, fontSize: 13, textAlign: 'center' }}>
            <div>ลงชื่อ ........................................ ผู้เบิก<br />({req.created_by_name || '...................................'})<br />{req.created_by_position || ''}</div>
            <div>ลงชื่อ ........................................ ผู้จ่าย<br />({req.approved_by_name || '...................................'})</div>
            <div>ลงชื่อ ........................................ ผู้รับ<br />(...................................)</div>
          </div>
        </div>
      );
    };

    // ===== จำนวนเบิกแบบ "หน่วยเบิกเต็ม" (แพ็ค) เป็นค่าเริ่มต้น / สลับไปกรอกหน่วยย่อยได้ =====
    // requestQty เก็บเป็นหน่วยย่อยเสมอ (ตรงกับ INVS) ส่วน requestMode บอกว่าผู้เบิกกรอกแบบไหน
    const defaultRequestMode = (qty, pack) => (pack > 1 && (!qty || Math.abs(qty / pack - Math.round(qty / pack)) < 1e-9)) ? 'pack' : 'unit';
    const parseQtyText = (t) => { const n = Number(String(t).replace(/,/g, '').trim()); return Number.isFinite(n) && n >= 0 ? n : null; };
    const PackQtyInput = ({ item, onChange, inputId, autoFocus, onEnter, compact }) => {
      const pack = safePackSize(item.packSize);
      const hasPack = pack > 1;
      const mode = hasPack ? (item.requestMode || defaultRequestMode(item.requestQty, pack)) : 'unit';
      const qty = toNonNegativeNumber(item.requestQty);
      const shown = mode === 'pack' ? (qty ? String(Math.round((qty / pack) * 1000) / 1000) : '') : (qty ? String(qty) : '');
      const [text, setText] = useState(shown);
      useEffect(() => { if (parseQtyText(text) !== parseQtyText(shown)) setText(shown); }, [shown]);
      const commit = (t) => {
        setText(t);
        const n = parseQtyText(t);
        if (n === null) return;
        onChange(mode === 'pack' ? Math.round(n * pack) : n, mode);
      };
      const keys = (e) => { if (e.key === 'Enter' && onEnter) { e.preventDefault(); onEnter(); } };
      const toggle = () => onChange(qty, mode === 'pack' ? 'unit' : 'pack');
      const box = compact ? 'w-20' : 'w-24';
      return (
        <div className="inline-flex flex-wrap items-center gap-1.5">
          {hasPack && (
            <span className={`inline-flex items-center gap-1 ${mode === 'pack' ? '' : 'opacity-40'}`}>
              <input id={mode === 'pack' ? inputId : undefined} type="text" inputMode="decimal" autoFocus={autoFocus && mode === 'pack'} disabled={mode !== 'pack'}
                aria-label={`จำนวนเบิก (หน่วยเต็ม) ${item.name}`} className={`num-in ${box}`} placeholder="0"
                value={mode === 'pack' ? text : (qty ? formatQty(qty, pack) : '')} onChange={e => commit(e.target.value)} onKeyDown={keys} />
              <span className="text-xs text-slate-500 whitespace-nowrap">แพ็ค <span className="text-slate-400">×{pack}</span></span>
            </span>
          )}
          {(!hasPack || mode === 'unit') && (
            <span className="inline-flex items-center gap-1">
              <input id={inputId} type="text" inputMode="decimal" autoFocus={autoFocus} aria-label={`จำนวนเบิก (หน่วยย่อย) ${item.name}`}
                className={`num-in ${box} ${hasPack ? 'touched' : ''}`} placeholder="0" value={text} onChange={e => commit(e.target.value)} onKeyDown={keys} />
              <span className="text-xs text-slate-500 whitespace-nowrap">{item.unit || 'หน่วย'}</span>
            </span>
          )}
          {hasPack && (
            <button type="button" onClick={toggle} aria-pressed={mode === 'unit'} title={mode === 'pack' ? 'เปลี่ยนไปกรอกเป็นหน่วยย่อย' : 'กลับไปกรอกเป็นหน่วยเต็ม (แพ็ค)'}
              className={`px-2 py-0.5 rounded-md border text-[11px] font-bold whitespace-nowrap ${mode === 'unit' ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-slate-300 text-slate-500 hover:bg-slate-50'}`}>
              {mode === 'pack' ? 'ขอหน่วยย่อย' : 'ใช้หน่วยเต็ม'}
            </button>
          )}
          {hasPack && mode === 'pack' && qty > 0 && <span className="text-[11px] text-slate-400 whitespace-nowrap">= {fmtNum(qty)} {item.unit}</span>}
        </div>
      );
    };

    // ===== พิมพ์ใบเบิกวัสดุ/เวชภัณฑ์ (แก้เลขที่/วันที่ได้ก่อนพิมพ์) =====
    const FormPrintModal = ({ ctx, req, onClose }) => {
      const [formNo, setFormNo] = useState(() => internalFormNoFor(req, ctx.reqs));
      const [formDate, setFormDate] = useState(() => safeText(req.form_date) || tsToYmd(req.submitted_at || req.created_at));
      // v6.6 ผู้ลงนาม 4 จุด — ใบนี้ → ใบก่อนของหน่วยงาน → ผู้สร้าง/ผู้อนุมัติ
      const [signers, setSigners] = useState(() => internalSignersFor(req, (ctx.reqs.filter(r => r.id !== req.id && Array.isArray(r.sign_people))
        .sort((a, b) => tsToMillis(b.updated_at) - tsToMillis(a.updated_at))[0] || {}).sign_people));
      const [busy, setBusy] = useState(false);
      const doPrint = async () => {
        setBusy(true);
        try {
          let changed = false;
          if (formNo !== safeText(req.form_no) || formDate !== safeText(req.form_date)) {
            try { await db.collection('internal_requisitions').doc(req.id).update({ form_no: safeText(formNo), form_date: formDate, fiscal_year: fiscalYearBEOfYmd(formDate) }); changed = true; }
            catch (e) { /* ใบที่อนุมัติแล้วผู้เบิกแก้ไม่ได้ — ใช้ค่าที่แก้เฉพาะการพิมพ์ครั้งนี้ */ }
          }
          if (!sameSigners(signers, req.sign_people)) {
            try { await db.collection('internal_requisitions').doc(req.id).update({ sign_people: signersForSave(signers) }); changed = true; }
            catch (e) { ctx.showToast('พิมพ์ได้ แต่จำผู้ลงนามในใบนี้ไม่สำเร็จ: ' + (e?.message || e), 'warn'); }
          }
          if (changed) await ctx.reload();
          await printHtmlDocument(buildInternalReqFormHtml({
            req, formNo, formDate, deptName: req.dept_name || ctx.dept?.dept_name, drugTypes: ctx.drugTypes,
            locOf: (id) => safeText(ctx.drugById.get(String(id))?.invs_location), signers
          }));
          await writeAuditLog(ctx.currentUser, 'INTERNAL_REQ_PRINT', 'internal_requisitions', req.id, { form_no: formNo });
          onClose();
          rxTaskDone('int_print');
        } finally { setBusy(false); }
      };
      return (
        <Modal isOpen onClose={onClose} title="พิมพ์ใบเบิกวัสดุ/เวชภัณฑ์" maxWidth="max-w-xl">
          <div className="space-y-4">
            <label className="block"><span className="text-sm font-bold text-slate-600">เลขที่</span>
              <input id="form-no" value={formNo} onChange={e => setFormNo(e.target.value)} className="mt-1 w-full p-2.5 border border-slate-300 rounded-xl font-mono" /></label>
            <label className="block"><span className="text-sm font-bold text-slate-600">วันที่</span>
              <input id="form-date" type="date" value={formDate} onChange={e => setFormDate(e.target.value)} className="mt-1 w-full p-2.5 border border-slate-300 rounded-xl" />
              <span className="text-xs text-slate-500">{thaiDateLong(formDate)}</span></label>
            <InternalSignersEditor value={signers} onChange={setSigners} />
            <p className="text-xs text-slate-500">เลขที่สร้างอัตโนมัติ = ลำดับใบของหน่วยงานในปีงบประมาณ / ปีงบ (พ.ศ.) แก้ได้ก่อนพิมพ์</p>
            <div className="flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-bold text-slate-600">ยกเลิก</button>
              <button onClick={doPrint} disabled={busy} className="px-5 py-2 rounded-xl bg-slate-800 text-white font-bold disabled:opacity-50"><i className={`fa-solid ${busy ? 'fa-spinner fa-spin' : 'fa-print'} mr-2`}></i>พิมพ์ / บันทึก PDF</button>
            </div>
          </div>
        </Modal>
      );
    };

    // ===== ขั้นแรกของการสร้างใบ: เลือกรอบเบิก (เลขที่/วันที่ของใบยึดตามรอบ ไม่ว่าจะเบิกวันไหน) =====
    const RoundPickStep = ({ ctx, onPick, onOpenReq }) => {
      const today = toYmd(new Date());
      const fyNow = fiscalYearBEOfYmd(today);
      const list = ctx.rounds.filter(r => Number(r.fiscal_year) >= fyNow - 1 && Number(r.fiscal_year) <= fyNow + 1);
      const usedBy = (r) => ctx.reqs.find(q => q.round_id === r.id && q.status !== 'Cancelled');
      const [sel, setSel] = useState(() => { const open = list.filter(r => !usedBy(r)); return pickDefaultRound(open, today)?.id || ''; });
      const [fyViewState, setFyView] = useState(0);
      if (!list.length) {
        return (
          <div className="bg-white rounded-2xl border shadow-sm p-8 max-w-2xl space-y-4 animate-fade-in">
            <h2 className="text-xl font-extrabold">ยังไม่มีรอบเบิกในระบบ</h2>
            <p className="text-slate-600">แอดมินยังไม่ได้กำหนดรอบเบิกของปีงบนี้ (จัดการฐานข้อมูล › รอบเบิก) ระบบจะใช้เลขที่ใบอัตโนมัติและวันที่วันนี้แทน</p>
            <button onClick={() => onPick(null)} className="px-6 py-3 rounded-xl bg-gradient-main text-white font-bold">สร้างใบเบิกต่อ</button>
          </div>
        );
      }
      const chosen = list.find(r => r.id === sel);
      const fyList = [...new Set(list.map(r => Number(r.fiscal_year)))].sort();
      const nextRound = pickDefaultRound(list.filter(r => !usedBy(r) && String(r.round_date) >= today), today);
      const fyView = fyViewState || Number(chosen?.fiscal_year) || fyNow;
      const todayMonth = today.slice(0, 7);
      const months = (() => {
        const m = new Map();
        list.filter(r => Number(r.fiscal_year) === fyView || fyList.length === 1).slice().sort((a, b) => String(a.round_date).localeCompare(String(b.round_date)))
          .forEach(r => { const k = String(r.round_date).slice(0, 7); if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
        return [...m.entries()];
      })();
      return (
        <div className="space-y-5 animate-fade-in max-w-6xl">
          <div>
            <div className="text-xs font-bold text-teal-700 tracking-wide">ขั้นที่ 1 จาก 2</div>
            <h2 className="text-2xl font-extrabold text-slate-800">เลือกรอบเบิก</h2>
            <p className="text-sm text-slate-500">เลขที่และวันที่ในใบเบิกจะเป็นไปตามรอบที่เลือก ไม่ว่าจะกรอกวันไหน · 1 รอบ เบิกได้ 1 ใบต่อหน่วยงาน</p>
          </div>
          {/* v6.3 ปฏิทินเบิก: จัดรอบตามเดือนของปีงบ เหมือนตารางเบิกของกลุ่มงานเภสัชกรรม */}
          <div className="flex flex-wrap items-center gap-2">
            {fyList.length > 1 && fyList.map(y => (
              <button key={y} onClick={() => setFyView(y)} className={`px-3 py-1.5 rounded-lg text-sm font-bold ${fyView === y ? 'bg-slate-800 text-white' : 'bg-white border text-slate-600'}`}>ปีงบ {y}</button>
            ))}
            {nextRound && <span className="text-sm text-slate-600 ml-auto"><i className="fa-regular fa-calendar-check mr-1 text-teal-600"></i>รอบถัดไป <b>{thaiWeekday(nextRound.round_date)} {thaiDateLong(nextRound.round_date)}</b> · ส่งสมุดเบิกภายใน <b>{thaiWeekday(roundSubmitBy(nextRound), true)} {thaiDateShort(roundSubmitBy(nextRound))}</b></span>}
          </div>
          <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3" role="radiogroup" aria-label="รอบเบิก">
            {months.map(([key, rs]) => (
              <section key={key} className={`rounded-2xl border bg-white overflow-hidden ${key === todayMonth ? 'border-teal-400 shadow-md' : 'border-slate-200'}`}>
                <header className={`px-4 py-2 flex items-baseline justify-between ${key === todayMonth ? 'bg-teal-600 text-white' : 'bg-slate-50 text-slate-700'}`}>
                  <span className="font-extrabold">{THAI_MONTHS[Number(key.slice(5, 7)) - 1]} {Number(key.slice(0, 4)) + 543}</span>
                  <span className={`text-xs ${key === todayMonth ? 'text-teal-100' : 'text-slate-400'}`}>{rs.length} รอบ</span>
                </header>
                <div className="divide-y">
                  {rs.map(r => {
                    const used = usedBy(r);
                    const past = String(r.round_date) < today;
                    const on = sel === r.id;
                    const d = parseYmd(r.round_date);
                    return (
                      <div key={r.id} role="radio" aria-checked={on} tabIndex={used ? -1 : 0}
                        onClick={() => !used && setSel(r.id)} onKeyDown={e => { if (!used && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setSel(r.id); } }}
                        className={`flex items-center gap-3 px-4 py-3 transition ${used ? 'bg-slate-50 cursor-default' : on ? 'bg-teal-50 ring-2 ring-inset ring-teal-400 cursor-pointer' : past ? 'opacity-60 hover:bg-slate-50 cursor-pointer' : 'hover:bg-teal-50/50 cursor-pointer'}`}>
                        <div className={`w-12 shrink-0 text-center rounded-xl py-1 ${on ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700'}`}>
                          <div className="text-[10px] font-bold leading-none mt-0.5">{thaiWeekday(r.round_date, true)}</div>
                          <div className="text-xl font-extrabold leading-tight tabular-nums">{d ? d.getDate() : '-'}</div>
                        </div>
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-extrabold text-slate-800">รอบที่ {r.round_no}<span className="text-xs text-slate-400">/{r.fiscal_year}</span></span>
                            {used ? <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-200 text-slate-600">มีใบแล้ว</span> : past ? <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800">เลยวันแล้ว</span> : r.id === nextRound?.id ? <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-teal-100 text-teal-800">รอบถัดไป</span> : null}
                          </div>
                          <div className="text-xs text-slate-500">{thaiDateLong(r.round_date)} · ส่งสมุดภายใน {thaiWeekday(roundSubmitBy(r), true)} {thaiDateShort(roundSubmitBy(r))}</div>
                          {used && <button onClick={(e) => { e.stopPropagation(); onOpenReq(used); }} className="mt-1 text-xs font-bold text-teal-700 hover:underline">{['Draft', 'Pending', 'Rejected'].includes(used.status) ? 'แก้ไขใบเดิม' : 'ดูใบเดิม'} ({INTERNAL_STATUS_LABELS[used.status] || used.status})</button>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            ))}
          </div>
          <div className="flex items-center gap-3">
            <button onClick={() => chosen && onPick(chosen)} disabled={!chosen} className="px-6 py-3 rounded-xl bg-gradient-main text-white font-bold shadow-lg disabled:opacity-40"><i className="fa-solid fa-arrow-right mr-2"></i>เริ่มกรอกใบเบิก{chosen ? ` · ${roundFormNo(chosen)}` : ''}</button>
            {chosen && <span className="text-sm text-slate-500">ใบเบิกเลขที่ <b>{roundFormNo(chosen)}</b> วันที่ <b>{thaiDateLong(chosen.round_date)}</b></span>}
          </div>
        </div>
      );
    };
    const RoundBanner = ({ round, editReq }) => {
      const no = editReq ? (editReq.form_no || '') : (round ? roundFormNo(round) : '');
      const date = editReq ? editReq.form_date : round?.round_date;
      if (!no && !date) return null;
      return (
        <div className="inline-flex flex-wrap items-center gap-x-4 gap-y-1 bg-white border border-teal-200 rounded-xl px-4 py-2 text-sm">
          <span className="text-slate-500">ใบเบิกเลขที่ <b className="text-slate-800 font-mono">{no || '(อัตโนมัติ)'}</b></span>
          {date && <span className="text-slate-500">วันที่ <b className="text-slate-800">{thaiDateLong(date)}</b></span>}
          {(round || editReq?.round_no) && <span className="text-[11px] font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded">รอบที่ {round?.round_no || editReq.round_no}</span>}
        </div>
      );
    };

    // ===== ใบเบิก: บันทึก/ส่งใหม่ (ใช้ทั้งหน่วยงานและห้องยา) =====
    const saveInternalReq = async ({ ctx, editReq, kind, items, extra, stockOps, round, status = 'Pending' }) => {
      const isDraft = status === 'Draft'; // v6.5 "รอส่ง": บันทึกเก็บไว้ ยังไม่เข้าคิว ไม่แตะสต็อก
      const dept = ctx.dept;
      const user = ctx.currentUser;
      const total = items.reduce((s, it) => s + internalItemValue(it), 0);
      const common = {
        deptId: String(dept.dept_id), dept_name: safeText(dept.dept_name), kind,
        status,
        items: JSON.parse(JSON.stringify(items)),
        item_count: items.length,
        total_value: Math.round(total * 100) / 100,
        schema_version: APP_SCHEMA_VERSION,
        app_version: APP_VERSION,
        updated_at: firebase.firestore.FieldValue.serverTimestamp(),
        updated_by_uid: user.uid, updated_by_name: safeText(user.name),
        ...extra
      };
      let reqId;
      if (editReq) {
        reqId = editReq.id;
        const ref = db.collection('internal_requisitions').doc(reqId);
        await db.runTransaction(async (tx) => {
          const snap = await tx.get(ref);
          if (!snap.exists) throw new Error('ไม่พบใบเบิกเดิม');
          const cur = snap.data();
          if (!['Draft', 'Pending', 'Rejected'].includes(cur.status)) throw new Error(`ใบเบิกอยู่ในสถานะ ${INTERNAL_STATUS_LABELS[cur.status] || cur.status} แก้ไขไม่ได้แล้ว`);
          if (isDraft && cur.status !== 'Draft') throw new Error('ใบนี้ส่งแล้ว บันทึกเป็นรอส่งไม่ได้');
          if (cur.invs_sub_po_no) throw new Error('ใบเบิกนี้ส่งเข้า INVS แล้ว แก้ไขไม่ได้');
          const patch = { ...common, revision: toNonNegativeInt(cur.revision) + 1 };
          // ใบที่ถูกส่งกลับแล้วส่งใหม่ → ต่อท้ายคิว
          if (cur.status === 'Rejected') { patch.submitted_at = firebase.firestore.FieldValue.serverTimestamp(); patch.resubmitted_from_rejected = true; }
          if (cur.status === 'Draft' && !isDraft) patch.submitted_at = firebase.firestore.FieldValue.serverTimestamp(); // ส่งจริงครั้งแรก → เข้าคิวตามเวลานี้
          tx.update(ref, patch);
        });
      } else {
        reqId = buildInternalReqId(dept.dept_id);
        const today = toYmd(new Date());
        if (round && ctx.reqs.some(q => q.round_id === round.id && q.status !== 'Cancelled')) throw new Error(`หน่วยงานนี้มีใบเบิกของรอบที่ ${round.round_no} แล้ว — แก้ไขใบเดิมแทน`);
        const fno = round ? { no: roundFormNo(round), fiscalYear: Number(round.fiscal_year) } : nextInternalFormNo(ctx.reqs, dept.dept_id, today);
        await db.collection('internal_requisitions').doc(reqId).set({
          ...common,
          id: reqId,
          form_no: fno.no, form_date: round ? round.round_date : today, fiscal_year: fno.fiscalYear,
          ...(round ? { round_id: round.id, round_no: Number(round.round_no), round_date: round.round_date } : {}),
          doc_no: buildDocNo(dept.dept_id),
          revision: 1,
          created_by_uid: user.uid, created_by_name: safeText(user.name), created_by_position: safeText(user.position),
          created_at: firebase.firestore.FieldValue.serverTimestamp(),
          ...(isDraft ? {} : { submitted_at: firebase.firestore.FieldValue.serverTimestamp() })
        });
      }
      if (!isDraft && stockOps && stockOps.length) {
        await executeBatchChunks(stockOps.map(op => ({ ...op, data: { ...op.data, last_req_id: reqId } })));
      }
      await writeAuditLog(user, isDraft ? 'INTERNAL_REQ_DRAFT_SAVE' : editReq ? 'INTERNAL_REQ_RESUBMIT' : 'INTERNAL_REQ_SUBMIT', 'internal_requisitions', reqId, { dept_id: dept.dept_id, kind, item_count: items.length, total_value: common.total_value });
      return reqId;
    };

    // ===== หน้าเบิกยาของหน่วยงาน: เลือกยา คีย์จำนวน ส่ง =====
    // ใบล่าสุดของหน่วยงาน (ไม่นับใบยกเลิก) ใช้เป็นโครงรายการยาของใบใหม่
    const lastDeptTemplate = (ctx) => ctx.reqs
      .filter(r => r.kind !== 'pharmacy' && r.status !== 'Cancelled' && (r.items || []).length)
      .sort((a, b) => tsToMillis(b.submitted_at || b.created_at) - tsToMillis(a.submitted_at || a.created_at))[0] || null;

    const DeptReqView = ({ ctx, editReq, round, onDone }) => {
      const [template] = useState(() => editReq ? null : lastDeptTemplate(ctx));
      const [items, setItems] = useState(() => {
        if (editReq) return (editReq.items || []).map(it => { const d = ctx.drugById.get(String(it.drugId)); return { ...it, isDiscontinued: d ? isDrugDiscontinuedAll(d) : !!it.discontinuedAll }; });
        if (!template) return [];
        // โครงจากใบล่าสุด: ข้อมูลยาอัปเดตจาก master, จำนวนเริ่มที่ 0 ให้กรอกเอง
        return (template.items || []).map(it => {
          const drug = ctx.drugById.get(String(it.drugId));
          if (!drug || isDrugDiscontinuedAll(drug)) return null;
          const base = baseItemFromDrug(ctx, drug);
          const lastQty = toNonNegativeNumber(it.requestQty ?? it.dispenseQty);
          return { ...base, requestQty: 0, dispenseQty: 0, note: '', source: 'template', lastQty, requestMode: it.requestMode || defaultRequestMode(lastQty, safePackSize(base.packSize)) };
        }).filter(Boolean);
      });
      const [note, setNote] = useState(editReq?.note || '');
      const [urgent, setUrgent] = useState(!!editReq?.urgent);
      const [saving, setSaving] = useState(false);
      const lastAddedRef = useRef(null);
      const [staged, setStaged] = useState(null); // ยาที่เลือกจากช่องค้นหา รอใส่จำนวน

      const itemIds = useMemo(() => new Set(items.map(it => String(it.drugId))), [items]);

      // ยาที่หน่วยงานนี้เคยเบิกบ่อย (จากใบที่อนุมัติ/รออนุมัติ)
      const frequent = useMemo(() => {
        const count = new Map();
        ctx.reqs.filter(r => ['Completed', 'Pending', 'Approving'].includes(r.status)).forEach(r => {
          (r.items || []).forEach(it => {
            const k = String(it.drugId);
            const c = count.get(k) || { n: 0, lastQty: 0 };
            c.n += 1; if (!c.lastQty) c.lastQty = toNonNegativeNumber(it.dispenseQty ?? it.requestQty);
            count.set(k, c);
          });
        });
        return [...count.entries()]
          .map(([id, c]) => ({ drug: ctx.drugById.get(id), ...c }))
          .filter(x => x.drug && !isDrugDiscontinuedAll(x.drug))
          .sort((a, b) => b.n - a.n)
          .slice(0, 30);
      }, [ctx.reqs, ctx.drugById]);

      const addDrug = (drug, qty, mode) => {
        const id = String(drug.drug_id);
        const base = baseItemFromDrug(ctx, drug);
        const q = toNonNegativeNumber(qty);
        const m = mode || defaultRequestMode(q, safePackSize(base.packSize));
        if (itemIds.has(id)) {
          if (q > 0) { setQty(id, q, m); ctx.showToast(`อัปเดตจำนวน ${drug.drug_name} แล้ว`); }
          else ctx.showToast(`${drug.drug_name} อยู่ในใบเบิกแล้ว`, 'warn');
          return;
        }
        if (!q) lastAddedRef.current = id;
        setItems(prev => [...prev, { ...base, requestQty: q, dispenseQty: q, requestMode: m, note: '', source: 'manual' }]);
      };
      const focusSearch = () => setTimeout(() => document.querySelector('input[aria-label="ค้นหายา"]')?.focus(), 30);
      const commitStaged = () => {
        if (!staged) return;
        if (!toNonNegativeNumber(staged.item.requestQty)) { ctx.showToast('ใส่จำนวนเบิกก่อน', 'error'); return; }
        addDrug(staged.drug, staged.item.requestQty, staged.item.requestMode);
        setStaged(null); focusSearch();
      };

      useEffect(() => {
        const id = lastAddedRef.current;
        if (!id) return;
        const el = document.getElementById(`qty-${id}`);
        el?.scrollIntoView?.({ block: 'center', behavior: 'smooth' });
        if (el) { el.focus(); el.select?.(); }
        lastAddedRef.current = null;
      }, [items.length]);

      const setQty = (id, qty, mode) => setItems(prev => prev.map(it => String(it.drugId) === id ? { ...it, requestQty: toNonNegativeNumber(qty), dispenseQty: toNonNegativeNumber(qty), ...(mode ? { requestMode: mode } : {}) } : it));
      const fillLast = () => setItems(prev => prev.map(it => it.lastQty ? { ...it, requestQty: it.lastQty, dispenseQty: it.lastQty } : it));
      const clearTemplate = () => setItems(prev => prev.filter(it => toNonNegativeNumber(it.requestQty) > 0));
      const setItemNote = (id, v) => setItems(prev => prev.map(it => String(it.drugId) === id ? { ...it, note: v } : it));
      const removeItem = (id) => setItems(prev => prev.filter(it => String(it.drugId) !== id));

      const valid = items.filter(it => toNonNegativeNumber(it.requestQty) > 0);
      const total = valid.reduce((s, it) => s + internalItemValue(it), 0);
      const hasPendingOther = ctx.reqs.some(r => r.status === 'Pending' && r.id !== editReq?.id);

      const submit = () => {
        if (!valid.length) return ctx.showToast('ยังไม่มีรายการที่ใส่จำนวนเบิก', 'error');
        const zero = items.length - valid.length;
        ctx.setConfirmDialog({
          title: editReq ? 'ส่งใบเบิกที่แก้ไขแล้ว?' : 'ยืนยันส่งใบเบิก?',
          message: `${valid.length} รายการ · มูลค่าประมาณ ${fmtMoney(total)} บาท${zero ? `\nรายการที่จำนวนเป็น 0 (${zero} รายการ) จะไม่ถูกส่ง` : ''}\nใบเบิกจะเข้าคิวรอห้องยาตรวจสอบ`,
          icon: 'fa-paper-plane', iconColor: 'text-teal-600', confirmBtnClass: 'bg-teal-600 hover:bg-teal-700', confirmText: 'ส่งใบเบิก',
          onConfirm: async () => {
            setSaving(true);
            try {
              const clean = valid.map(({ lastQty, ...it }) => ({ ...it, source: it.source === 'template' ? 'template' : (it.source || 'manual'), requestQty: toNonNegativeNumber(it.requestQty), dispenseQty: toNonNegativeNumber(it.requestQty), note: safeText(it.note) }));
              await saveInternalReq({ ctx, editReq, round, kind: 'dept', items: clean, extra: { note: safeText(note), urgent: !!urgent } });
              ctx.showToast(editReq ? 'ส่งใบเบิกที่แก้ไขแล้ว' : 'ส่งใบเบิกแล้ว รอห้องยาตรวจสอบ');
              rxTaskDone('int_search');
              await ctx.reload();
              onDone();
            } catch (e) { ctx.showToast('ส่งไม่สำเร็จ: ' + (e?.message || e), 'error'); }
            finally { setSaving(false); }
          }
        });
      };

      return (
        <div className="space-y-5 animate-fade-in">
          <div className="flex flex-wrap items-end justify-between gap-3">
            <div>
              <div className="text-xs font-bold text-teal-700 tracking-wide">ใบเบิกยาหน่วยงาน</div>
              <h2 className="text-2xl font-extrabold text-slate-800">{editReq ? `แก้ไขใบ ${editReq.doc_no || ''}` : 'สร้างใบเบิกใหม่'}</h2>
              <div className="text-sm text-slate-500">{ctx.dept?.dept_name} · คีย์จำนวนที่ต้องการได้เลย ห้องยาจะตรวจและจ่ายตามลำดับคิว</div>
              <div className="mt-2"><RoundBanner round={round} editReq={editReq} /></div>
            </div>
            {editReq?.status === 'Rejected' && (
              <div className="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-2 text-sm max-w-md">
                <b>ถูกส่งกลับ:</b> {editReq.reject_reason || 'ไม่ระบุเหตุผล'}
              </div>
            )}
          </div>

          {hasPendingOther && !editReq && (
            <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-4 py-3 text-sm">
              <i className="fa-solid fa-circle-info mr-2"></i>มีใบเบิกของหน่วยงานนี้ที่ยังรอตรวจสอบอยู่ — ถ้าลืมยา สามารถแก้ไขใบเดิมได้ที่เมนู "ใบเบิกของฉัน"
            </div>
          )}

          {template && (
            <div className="bg-teal-50 border border-teal-200 text-teal-900 rounded-xl px-4 py-3 text-sm flex flex-wrap items-center gap-3">
              <span><i className="fa-solid fa-clone mr-2"></i>ดึงรายการยาจากใบล่าสุด <b>{template.doc_no || template.id}</b> ({formatAppDateTime(template.submitted_at || template.created_at)}) มาเป็นโครงแล้ว — กรอกเฉพาะจำนวนที่ต้องการ รายการที่เป็น 0 จะไม่ถูกส่ง</span>
              <span className="flex gap-2 ml-auto">
                <button onClick={fillLast} className="px-3 py-1.5 rounded-lg bg-white border border-teal-300 font-bold hover:bg-teal-100">ใส่จำนวนเท่าครั้งก่อน</button>
                <button onClick={clearTemplate} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 font-bold text-slate-600 hover:bg-slate-100">ลบรายการที่ยังเป็น 0</button>
              </span>
            </div>
          )}

          <div className="bg-white rounded-2xl border shadow-sm p-5 space-y-4">
            <div className={`grid gap-3 items-start ${staged ? 'lg:grid-cols-[minmax(0,1fr)_auto]' : ''}`}>
              <DrugSearchBox ctx={ctx} excludeIds={itemIds} autoFocus={!editReq && !template}
                onPick={d => { const base = baseItemFromDrug(ctx, d); const ex = items.find(it => String(it.drugId) === String(d.drug_id)); setStaged({ drug: d, item: ex ? { ...ex } : { ...base, requestQty: 0, requestMode: defaultRequestMode(0, safePackSize(base.packSize)) } }); }} />
              {staged && (
                <div className="flex flex-wrap items-center gap-2 bg-teal-50 border border-teal-200 rounded-xl px-3 py-2 animate-fade-in" role="group" aria-label="ใส่จำนวนเบิก">
                  <div className="min-w-0 mr-1">
                    <div className="font-bold text-slate-800 truncate max-w-[16rem]">{staged.drug.drug_name}</div>
                    <div className="text-[11px] text-slate-500">{staged.item.unit}{safePackSize(staged.item.packSize) > 1 ? ` · แพ็คละ ${safePackSize(staged.item.packSize)}` : ''}{itemIds.has(String(staged.drug.drug_id)) ? ' · อยู่ในใบแล้ว (จะแก้จำนวน)' : ''}</div>
                  </div>
                  <PackQtyInput item={staged.item} inputId="staged-qty" autoFocus onEnter={commitStaged}
                    onChange={(q, m) => setStaged(st => ({ ...st, item: { ...st.item, requestQty: q, requestMode: m } }))} />
                  <button onClick={commitStaged} className="px-4 py-2 rounded-lg bg-teal-600 text-white font-bold"><i className="fa-solid fa-plus mr-1"></i>เพิ่ม</button>
                  <button onClick={() => { setStaged(null); focusSearch(); }} aria-label="ยกเลิกการเลือกยา" className="px-2 py-2 text-slate-400 hover:text-slate-700"><i className="fa-solid fa-xmark"></i></button>
                </div>
              )}
            </div>
            {frequent.length > 0 && (
              <div>
                <div className="text-xs font-bold text-slate-500 mb-2">ยาที่เคยเบิก (กดแล้วใส่จำนวนได้ทันที · ตั้งค่าเป็นจำนวนครั้งล่าสุด)</div>
                <div className="flex flex-wrap gap-2">
                  {frequent.filter(f => !itemIds.has(String(f.drug.drug_id))).map(f => (
                    <button key={f.drug.drug_id} onClick={() => { const base = baseItemFromDrug(ctx, f.drug); setStaged({ drug: f.drug, item: { ...base, requestQty: f.lastQty, requestMode: defaultRequestMode(f.lastQty, safePackSize(base.packSize)) } }); }}
                      className="px-3 py-1.5 rounded-full border border-slate-200 bg-slate-50 hover:bg-teal-50 hover:border-teal-300 text-sm transition">
                      <i className="fa-solid fa-plus text-[10px] text-teal-600 mr-1"></i>{f.drug.drug_name}
                      <span className="text-[10px] text-slate-400 ml-1">×{f.n}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div className="bg-white rounded-2xl border shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 text-slate-500 text-xs">
                  <tr>
                    <th className="p-3 text-left w-10">#</th>
                    <th className="p-3 text-left">รายการยา</th>
                    <th className="p-3 text-left">จำนวนเบิก <span className="font-normal text-slate-400">(หน่วยเต็ม · กด "ขอหน่วยย่อย" เพื่อเบิกเป็นหน่วยย่อย)</span></th>
                    <th className="p-3 text-left">หมายเหตุ</th>
                    <th className="p-3 text-right">มูลค่า</th>
                    <th className="p-3 w-10"></th>
                  </tr>
                </thead>
                <tbody>
                  {items.length === 0 && (
                    <tr><td colSpan="6" className="p-10 text-center text-slate-400">ค้นหายาด้านบน แล้วใส่จำนวนช่องข้างชื่อยา กด Enter เพื่อเพิ่ม</td></tr>
                  )}
                  {items.map((it, i) => {
                    const id = String(it.drugId);
                    return (
                      <tr key={id} className={`border-t hover:bg-slate-50/60 ${toNonNegativeNumber(it.requestQty) > 0 ? '' : 'bg-slate-50/40'}`}>
                        <td className="p-3 text-slate-400 tnum">{i + 1}</td>
                        <td className="p-3">
                          <div className="font-semibold">{it.name}</div>
                          <div className="text-[11px] text-slate-400"><span className="font-mono">{id}</span> · {it.unit}{safePackSize(it.packSize) > 1 ? ` · แพ็คละ ${safePackSize(it.packSize)}` : ''}</div>
                        </td>
                        <td className="p-3">
                          <PackQtyInput item={it} inputId={`qty-${id}`} compact onChange={(q, m) => setQty(id, q, m)} />
                          {it.lastQty ? <button type="button" onClick={() => setQty(id, it.lastQty, it.requestMode)} className="text-[11px] text-teal-700 hover:underline mt-1 block">ครั้งก่อน {safePackSize(it.packSize) > 1 ? `${formatQty(it.lastQty, it.packSize)} แพ็ค` : `${fmtNum(it.lastQty)} ${it.unit}`}</button> : null}
                        </td>
                        <td className="p-3"><input value={it.note || ''} onChange={e => setItemNote(id, e.target.value)} placeholder="-" aria-label={`หมายเหตุ ${it.name}`} className="w-full min-w-[8rem] px-2 py-1 border border-slate-200 rounded-lg text-sm" /></td>
                        <td className="p-3 text-right tnum text-slate-500">{fmtMoney(internalItemValue({ ...it, dispenseQty: it.requestQty }))}</td>
                        <td className="p-3 text-center"><button onClick={() => removeItem(id)} aria-label={`ลบ ${it.name}`} className="text-slate-300 hover:text-red-500"><i className="fa-solid fa-trash-can"></i></button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          <div className="bg-white rounded-2xl border shadow-sm p-5 grid md:grid-cols-[1fr_auto] gap-4 items-end">
            <div className="space-y-3">
              <label className="block text-sm font-bold text-slate-600" htmlFor="dept-note">หมายเหตุถึงห้องยา</label>
              <textarea id="dept-note" rows="2" value={note} onChange={e => setNote(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="เช่น ต้องการใช้ก่อนวันศุกร์" />
              <label className="inline-flex items-center gap-2 text-sm font-bold text-red-600 cursor-pointer">
                <input type="checkbox" checked={urgent} onChange={e => setUrgent(e.target.checked)} className="w-4 h-4 accent-red-600" /> ด่วน
              </label>
            </div>
            <div className="text-right space-y-3">
              <div className="text-sm text-slate-500">{valid.length} รายการ · <span className="font-bold text-slate-800 tnum">{fmtMoney(total)}</span> บาท</div>
              <div className="flex gap-2 justify-end">
                <button onClick={onDone} className="px-5 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">ยกเลิก</button>
                <button onClick={submit} disabled={saving || !valid.length} className="px-7 py-3 rounded-xl bg-gradient-main text-white font-bold shadow-lg disabled:opacity-40">
                  {saving ? <><i className="fa-solid fa-spinner fa-spin mr-2"></i>กำลังส่ง...</> : <><i className="fa-solid fa-paper-plane mr-2"></i>{editReq ? 'ส่งใบที่แก้ไข' : 'ส่งใบเบิก'}</>}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ===== หน้าเบิกยาของห้องยา: ยอดใช้ HOSxP (OPD+IPD) → แนะนำปริมาณเบิก =====
    const hosxpExportSql = (from, to) =>
`SELECT o.icode, d.name, d.units,
  SUM(CASE WHEN COALESCE(o.an,'')='' THEN o.qty ELSE 0 END) AS opd_qty,
  SUM(CASE WHEN COALESCE(o.an,'')<>'' THEN o.qty ELSE 0 END) AS ipd_qty
FROM opitemrece o
INNER JOIN drugitems d ON d.icode = o.icode
WHERE o.rxdate BETWEEN '${from}' AND '${to}'
GROUP BY o.icode, d.name, d.units
ORDER BY d.name`;

    // แปลงไฟล์ export (CSV/Excel) เป็นรูปแบบเดียวกับที่ Bridge ส่งกลับ
    const parseUsageFileRows = (rows) => {
      const list = (rows || []).filter(r => r && typeof r === 'object');
      if (!list.length) throw new Error('ไฟล์ไม่มีข้อมูล');
      const keys = Object.keys(list[0]);
      const low = (k) => String(k).toLowerCase().replace(/\s+/g, '');
      const find = (re, exclude) => keys.find(k => re.test(low(k)) && !(exclude && exclude.test(low(k))));
      const kIcode = find(/^icode$/) || find(/icode|รหัสยา|hoscode|drugcode/) || find(/code|รหัส/);
      const kOpd = find(/opd/, /rx|count/);
      const kIpd = find(/ipd/, /rx|count/);
      const kQty = find(/qty|จำนวน|total|รวม|sum|amount/, /opd|ipd|rx|price|ราคา|มูลค่า/);
      const kName = find(/name|ชื่อ/);
      const kUnit = find(/unit|หน่วย/);
      if (!kIcode) throw new Error(`ไม่พบคอลัมน์ icode (พบ: ${keys.join(', ')})`);
      if (!kOpd && !kIpd && !kQty) throw new Error(`ไม่พบคอลัมน์จำนวน (opd_qty / ipd_qty / qty) (พบ: ${keys.join(', ')})`);
      const agg = new Map();
      list.forEach(r => {
        const icode = safeText(r[kIcode]);
        if (!icode) return;
        const cur = agg.get(icode) || { icode, name: '', units: '', opd_qty: 0, ipd_qty: 0 };
        if (kOpd || kIpd) {
          cur.opd_qty += kOpd ? toSafeNumber(String(r[kOpd]).replace(/,/g, '')) : 0;
          cur.ipd_qty += kIpd ? toSafeNumber(String(r[kIpd]).replace(/,/g, '')) : 0;
        } else {
          cur.opd_qty += toSafeNumber(String(r[kQty]).replace(/,/g, ''));
        }
        if (!cur.name && kName) cur.name = safeText(r[kName]);
        if (!cur.units && kUnit) cur.units = safeText(r[kUnit]);
        agg.set(icode, cur);
      });
      return { rows: [...agg.values()].map(x => ({ ...x, total_qty: x.opd_qty + x.ipd_qty })), combinedOnly: !kOpd && !kIpd };
    };

    // จับคู่ยอดใช้ HOSxP กับรหัส INVS
    const matchUsage = (rawRows, drugs) => {
      const index = buildHosxpIndex(drugs);
      const byDrug = new Map();
      const unmatched = [];
      (rawRows || []).forEach(r => {
        const drug = index.get(String(r.icode));
        const opd = toNonNegativeNumber(r.opd_qty), ipd = toNonNegativeNumber(r.ipd_qty);
        if (!drug) { if (opd + ipd > 0) unmatched.push({ icode: r.icode, name: r.name, units: r.units, qty: opd + ipd }); return; }
        const id = String(drug.drug_id);
        const cur = byDrug.get(id) || { opd: 0, ipd: 0, icodes: [], hosxpNames: [], hosxpUnits: '' };
        cur.opd += opd; cur.ipd += ipd;
        if (!cur.icodes.includes(String(r.icode))) cur.icodes.push(String(r.icode));
        if (r.name && !cur.hosxpNames.includes(r.name)) cur.hosxpNames.push(r.name);
        if (!cur.hosxpUnits && r.units) cur.hosxpUnits = r.units;
        byDrug.set(id, cur);
      });
      unmatched.sort((a, b) => b.qty - a.qty);
      return { byDrug, unmatched };
    };

    const PharmacyReqView = ({ ctx, editReq, round, onDone }) => {
      const isAdmin = ctx.isAdmin;
      const today = toYmd(new Date());
      const yesterday = addDaysYmd(today, -1);

      // ช่วงวันที่เริ่มต้น = ต่อจากใบก่อนหน้า (กันยอดใช้ซ้ำซ้อน)
      const prevReq = useMemo(() => ctx.reqs.filter(r => r.kind === 'pharmacy' && !['Cancelled', 'Rejected', 'Draft'].includes(r.status) && r.id !== editReq?.id && r.period_to)
        .sort((a, b) => String(b.period_to).localeCompare(String(a.period_to)))[0] || null, [ctx.reqs, editReq?.id]);
      const lastPeriodTo = prevReq?.period_to || '';
      // วันเริ่มถูกล็อกให้ต่อจากใบก่อน (กันยอดใช้ซ้ำ/ขาดช่วง) — แอดมินปลดล็อกได้
      const [fromUnlocked, setFromUnlocked] = useState(false);
      const fromLocked = !!lastPeriodTo && !fromUnlocked;
      const defaultTo = (() => { let t = yesterday; if (round?.round_date && addDaysYmd(round.round_date, -1) < t) t = addDaysYmd(round.round_date, -1); return t; })();
      const [from, setFrom] = useState(() => editReq?.period_from || (lastPeriodTo ? addDaysYmd(lastPeriodTo, 1) : today.slice(0, 8) + '01'));
      const [to, setTo] = useState(() => editReq?.period_to || (lastPeriodTo && defaultTo < addDaysYmd(lastPeriodTo, 1) ? addDaysYmd(lastPeriodTo, 1) : defaultTo));
      const roundDays = useMemo(() => daysToNextRound(ctx.rounds, round || (editReq?.round_id ? ctx.rounds.find(r => r.id === editReq.round_id) : null), toNonNegativeNumber(ctx.dept?.round_days, 0) || 30), [ctx.rounds, round, editReq?.round_id, ctx.dept?.round_days]);
      const [minOrderValue, setMinOrderValue] = useState(() => toNonNegativeNumber(editReq?.min_order_value ?? ctx.dept?.min_order_value, 100));
      const [coverDays, setCoverDays] = useState(() => toNonNegativeNumber(editReq?.cover_days, 0) || toNonNegativeNumber(ctx.dept?.cover_days, 0) || INTERNAL_DEFAULT_COVER_DAYS);
      const [note, setNote] = useState(editReq?.note || '');

      // ยอดใช้ที่ดึงมา (raw) + meta
      const [usageRaw, setUsageRaw] = useState(null);
      const [usageMeta, setUsageMeta] = useState(() => editReq ? { source: editReq.usage_source || 'stored', from: editReq.period_from, to: editReq.period_to, days: editReq.period_days, fetchedAt: null, stored: true } : null);
      const [storedUsage] = useState(() => {
        if (!editReq) return null;
        const m = new Map();
        [...(editReq.items || []), ...(editReq.zero_rows || [])].forEach(it => {
          m.set(String(it.drugId), { opd: toNonNegativeNumber(it.opdRaw), ipd: toNonNegativeNumber(it.ipdRaw), icodes: it.hosxpCodes || [], hosxpNames: [], hosxpUnits: it.hosxpUnits || '' });
        });
        return m;
      });
      const [storedUnmatched] = useState(() => editReq?.unmatched || []);

      // การแก้ไขของผู้ใช้ต่อรายการ: multiplier / onHand / dispenseManual / base / source
      const [rowState, setRowState] = useState(() => {
        const m = new Map();
        if (editReq) {
          [...(editReq.items || []), ...(editReq.zero_rows || [])].forEach(it => {
            const id = String(it.drugId);
            m.set(id, {
              base: { drugId: id, name: it.name, unit: it.unit, packSize: it.packSize, isUnpacked: it.isUnpacked, dispenseStep: it.dispenseStep, maximumQty: it.maximumQty, type: it.type, price: it.price, isDiscontinued: ctx.drugById.get(id) ? isDrugDiscontinuedAll(ctx.drugById.get(id)) : !!it.discontinuedAll },
              multiplier: toNonNegativeNumber(it.hosxpMultiplier, 1) || 1,
              onHand: toNonNegativeNumber(it.onHand),
              dispenseManual: it.followSuggest === false ? toNonNegativeNumber(it.dispenseQty) : null,
              source: it.source || 'usage', note: it.note || ''
            });
          });
        }
        return m;
      });
      const [busy, setBusy] = useState('');
      const [showHistory, setShowHistory] = useState(true);
      const [filter, setFilter] = useState('all');
      const [search, setSearch] = useState('');
      const [sortBy, setSortBy] = useState('name');
      // v6.6 ซ่อนหมวดที่ไม่ต้องเบิก (5 = ยาโครงการฯ, 6 = วัคซีน) — ไม่อยู่ในตาราง/ใบเบิก/ใบพิมพ์ · จำค่าไว้ในเครื่อง
      const [hideTypes, setHideTypes] = useState(() => { try { const v = JSON.parse(localStorage.getItem('rxfill_ph_hide_types') || 'null'); if (Array.isArray(v)) return v.map(String); } catch (e) { /* storage blocked */ } return ['5', '6']; });
      const toggleHideType = (t) => setHideTypes(prev => { const next = prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]; try { localStorage.setItem('rxfill_ph_hide_types', JSON.stringify(next)); } catch (e) { /* ignore */ } return next; });
      // v6.6 ผู้ลงนาม 4 จุดท้ายใบ — บันทึกไปกับใบ (sign_people)
      const [signers, setSigners] = useState(() => internalSignersFor(editReq || { created_by_name: safeText(ctx.currentUser?.name), created_by_position: safeText(ctx.currentUser?.position) },
        (ctx.reqs.filter(r => r.kind === 'pharmacy' && r.id !== editReq?.id && Array.isArray(r.sign_people)).sort((a, b) => tsToMillis(b.updated_at) - tsToMillis(a.updated_at))[0] || {}).sign_people));
      const [showUnmatched, setShowUnmatched] = useState(false);
      const [showEstimate, setShowEstimate] = useState(false); // v6.4 พิมพ์ประมาณการ (ไม่ส่ง VMI)
      const [roundTarget, setRoundTarget] = useState(true);     // ปัด Target Stock เป็นจำนวนเต็มหน่วยบรรจุ
      const [fillQty, setFillQty] = useState(true);             // ใส่ยอดจำนวนจ่าย/มูลค่าในใบพิมพ์
      const [keepDraft, setKeepDraft] = useState(true);         // พิมพ์แล้วบันทึกเก็บไว้ "รอส่ง"
      const [estForm, setEstForm] = useState(() => ({ no: editReq?.form_no || (round ? roundFormNo(round) : ''), date: editReq?.form_date || round?.round_date || toYmd(new Date()) }));
      const [showSql, setShowSql] = useState(false);
      const [diag, setDiag] = useState(null);
      const runDiag = async () => {
        setBusy('diag');
        try { setDiag(await callInvsBridge('hosxp_diag', '', { date_from: from, date_to: to })); }
        catch (e) { setDiag({ error: e?.message || String(e) }); }
        finally { setBusy(''); }
      };
      const fileRef = useRef(null);

      const usageMatch = useMemo(() => usageRaw ? matchUsage(usageRaw, ctx.drugs) : null, [usageRaw, ctx.drugs]);
      const usageByDrug = usageMatch ? usageMatch.byDrug : (storedUsage || new Map());
      const unmatched = usageMatch ? usageMatch.unmatched : storedUnmatched;

      const stockMap = useMemo(() => new Map(ctx.stock.map(s => [String(s.drug_id), s])), [ctx.stock]);
      const inTransitMap = useMemo(() => {
        const m = new Map();
        ctx.reqs.filter(r => ['Pending', 'Approving', 'ApprovalFailed'].includes(r.status) && r.id !== editReq?.id)
          .forEach(r => (r.items || []).forEach(it => m.set(String(it.drugId), (m.get(String(it.drugId)) || 0) + toNonNegativeNumber(it.dispenseQty))));
        return m;
      }, [ctx.reqs, editReq?.id]);
      const historyIds = useMemo(() => {
        const s = new Set(ctx.stock.map(x => String(x.drug_id)));
        ctx.reqs.filter(r => r.kind === 'pharmacy' && r.status !== 'Cancelled').forEach(r => (r.items || []).forEach(it => s.add(String(it.drugId))));
        return s;
      }, [ctx.stock, ctx.reqs]);

      const periodDays = daysBetweenInclusive(from, to);
      const calcDays = usageMeta?.days || periodDays || 1;
      const usageStale = !!usageMeta && !usageMeta.stored && (usageMeta.from !== from || usageMeta.to !== to);
      const overlapReq = useMemo(() => ctx.reqs.find(r => r.kind === 'pharmacy' && r.id !== editReq?.id && !['Cancelled', 'Rejected', 'Draft'].includes(r.status)
        && r.period_from && r.period_to && !(to < r.period_from || from > r.period_to)), [ctx.reqs, from, to, editReq?.id]);

      const patchRow = (id, patch) => setRowState(prev => { const m = new Map(prev); m.set(id, { ...(m.get(id) || {}), ...patch }); return m; });

      // รวมรายการ: มียอดใช้ + (ประวัติเบิก/มีสต็อก) + เพิ่มเอง
      const derivedAll = useMemo(() => {
        const ids = new Set([...rowState.keys(), ...usageByDrug.keys()]);
        if (showHistory) historyIds.forEach(id => ids.add(id));
        const out = [];
        ids.forEach(id => {
          const st = rowState.get(id) || {};
          const drug = ctx.drugById.get(id);
          const base = st.base || (drug ? baseItemFromDrug(ctx, drug) : null);
          if (!base) return;
          const u = usageByDrug.get(id);
          const multiplier = st.multiplier ?? getHosxpMultiplier(drug);
          const opdRaw = u ? u.opd : 0, ipdRaw = u ? u.ipd : 0;
          const usage = Math.round((opdRaw + ipdRaw) * multiplier * 1000) / 1000;
          const stockDoc = stockMap.get(id);
          const stockBal = toNonNegativeNumber(stockDoc?.balance);
          const onHandTouched = st.onHand !== null && st.onHand !== undefined;
          const onHand = onHandTouched ? toNonNegativeNumber(st.onHand) : Math.max(0, stockBal - usage);
          const inTransit = inTransitMap.get(id) || 0;
          const blocked = String(base.type) === '6' || !!base.isDiscontinued;
          const sug = calcPharmacySuggestion({ usage, days: calcDays, coverDays, roundDays, minOrderValue, onHand, inTransit, item: base });
          const suggested = blocked ? 0 : sug.suggested;
          const follow = st.dispenseManual === null || st.dispenseManual === undefined;
          const dispense = follow ? suggested : toNonNegativeNumber(st.dispenseManual);
          const source = u ? 'usage' : (st.source || (historyIds.has(id) ? 'history' : 'manual'));
          out.push({
            id, base, drug, multiplier, multiplierChanged: !!drug && Math.abs(multiplier - getHosxpMultiplier(drug)) > 1e-9,
            opdRaw, ipdRaw, usage, icodes: u?.icodes || (drug?.hosxp_code ? String(drug.hosxp_code).split(/[,;\s]+/).filter(Boolean) : []),
            hosxpUnits: u?.hosxpUnits || '', hosxpNames: u?.hosxpNames || [],
            stockBal, hasStock: !!stockDoc, onHand, onHandTouched, inTransit,
            dailyAvg: sug.dailyAvg, target: sug.target, suggested, follow, dispense, blocked, source,
            skipReason: blocked ? '' : sug.skipReason, coverRounds: sug.coverRounds,
            value: internalItemValue({ dispenseQty: dispense, packSize: base.packSize, price: base.price }),
            note: st.note || ''
          });
        });
        return out;
      }, [rowState, usageByDrug, showHistory, historyIds, ctx.drugById, stockMap, inTransitMap, calcDays, coverDays, roundDays, minOrderValue]);
      const derived = useMemo(() => derivedAll.filter(r => !hideTypes.includes(String(r.base.type))), [derivedAll, hideTypes]);
      const hiddenByType = useMemo(() => { const m = {}; derivedAll.forEach(r => { const t = String(r.base.type); if (hideTypes.includes(t)) m[t] = (m[t] || 0) + 1; }); return m; }, [derivedAll, hideTypes]);

      const visible = useMemo(() => {
        let rows = derived;
        if (filter === 'used') rows = rows.filter(r => r.usage > 0);
        else if (filter === 'suggest') rows = rows.filter(r => r.suggested > 0);
        else if (filter === 'order') rows = rows.filter(r => r.dispense > 0);
        else if (filter === 'unused') rows = rows.filter(r => r.usage <= 0);
        else if (filter === 'changed') rows = rows.filter(r => !r.follow || r.onHandTouched || r.multiplierChanged);
        else if (filter === 'skip') rows = rows.filter(r => !!r.skipReason);
        if (search.trim()) {
          const n = normalizeForMatch(search);
          const q = search.trim().toLowerCase();
          rows = rows.filter(r => normalizeForMatch(r.base.name).includes(n) || r.id.toLowerCase().includes(q) || r.icodes.some(c => c.toLowerCase().includes(q)));
        }
        const sorted = [...rows];
        if (sortBy === 'value') sorted.sort((a, b) => b.value - a.value || a.base.name.localeCompare(b.base.name, 'th'));
        else if (sortBy === 'usage') sorted.sort((a, b) => (b.usage * b.base.price / safePackSize(b.base.packSize)) - (a.usage * a.base.price / safePackSize(a.base.packSize)));
        else if (sortBy === 'loc') sorted.sort((a, b) => Number(a.base.type) - Number(b.base.type) || compareByLocation(a.drug?.invs_location, a.base.name, b.drug?.invs_location, b.base.name));
        else sorted.sort((a, b) => a.base.name.localeCompare(b.base.name, 'th'));
        return sorted;
      }, [derived, filter, search, sortBy]);

      const stats = useMemo(() => ({
        used: derived.filter(r => r.usage > 0).length,
        suggest: derived.filter(r => r.suggested > 0).length,
        order: derived.filter(r => r.dispense > 0).length,
        value: derived.reduce((s, r) => s + r.value, 0),
        changed: derived.filter(r => !r.follow || r.onHandTouched || r.multiplierChanged).length,
        skip: derived.filter(r => !!r.skipReason).length
      }), [derived]);

      const rowIds = useMemo(() => new Set(derived.map(r => r.id)), [derived]);

      // ----- ดึงยอดใช้ -----
      const fetchFromBridge = async () => {
        if (!periodDays) return ctx.showToast('ช่วงวันที่ไม่ถูกต้อง', 'error');
        setBusy('bridge');
        try {
          const data = await callInvsBridge('hosxp_usage', '', { date_from: from, date_to: to });
          setUsageRaw(data.rows || []);
          setUsageMeta({ source: 'bridge', from, to, days: data.days || periodDays, fetchedAt: new Date().toISOString(), count: data.count });
          if (!data.count) {
            ctx.showToast('HOSxP คืนข้อมูล 0 รายการ — กำลังตรวจหาสาเหตุ', 'warn');
            try { setDiag(await callInvsBridge('hosxp_diag', '', { date_from: from, date_to: to })); } catch (de) { setDiag({ error: de?.message || String(de) }); }
          } else {
            ctx.showToast(`ดึงยอดใช้ ${fmtNum(data.count)} รายการจาก HOSxP แล้ว`);
          }
        } catch (e) {
          ctx.showToast((e?.message || String(e)) + ' — ถ้าเครื่องนี้ไม่มี Bridge ให้ใช้ "นำเข้าไฟล์" แทน', 'error');
        } finally { setBusy(''); }
      };
      const importFile = (file) => {
        if (!file) return;
        if (!periodDays) return ctx.showToast('เลือกช่วงวันที่ให้ตรงกับไฟล์ก่อน', 'error');
        setBusy('file');
        parseTabularFile(file, (rows) => {
          try {
            const parsed = parseUsageFileRows(rows);
            setUsageRaw(parsed.rows);
            setUsageMeta({ source: 'file', fileName: file.name, from, to, days: periodDays, fetchedAt: new Date().toISOString(), count: parsed.rows.length, combinedOnly: parsed.combinedOnly });
            ctx.showToast(`นำเข้า ${fmtNum(parsed.rows.length)} icode จาก ${file.name}`);
          } catch (e) { ctx.showToast('อ่านไฟล์ไม่สำเร็จ: ' + e.message, 'error'); }
          finally { setBusy(''); if (fileRef.current) fileRef.current.value = ''; }
        }, (e) => { ctx.showToast('อ่านไฟล์ไม่สำเร็จ: ' + (e?.message || e), 'error'); setBusy(''); }, { header: true });
      };

      // admin: จับคู่ icode ที่ยังไม่มีรหัส INVS
      const mapIcode = async (icode, drug) => {
        try {
          const codes = String(drug.hosxp_code || '').split(/[,;\s]+/).filter(Boolean);
          if (!codes.includes(String(icode))) codes.push(String(icode));
          await db.collection('master_drugs').doc(String(drug.drug_id)).update({ hosxp_code: codes.join(','), hosxp_mapped_at: firebase.firestore.FieldValue.serverTimestamp(), hosxp_mapped_by: safeText(ctx.currentUser.name) });
          await writeAuditLog(ctx.currentUser, 'HOSXP_CODE_MAP', 'master_drugs', drug.drug_id, { icode });
          await ctx.reloadMasters();
          ctx.showToast(`จับคู่ ${icode} → ${drug.drug_name}`);
        } catch (e) { ctx.showToast('จับคู่ไม่สำเร็จ: ' + e.message, 'error'); }
      };

      // ----- ส่งใบเบิก -----
      const submit = () => {
        if (!usageMeta) return ctx.showToast('ยังไม่ได้ดึงยอดใช้ — กด "ดึงยอดใช้จาก HOSxP" หรือ "นำเข้าไฟล์"', 'error');
        if (usageStale) return ctx.showToast('ช่วงวันที่เปลี่ยนหลังดึงยอดใช้ กรุณาดึงยอดใหม่ให้ตรงช่วง', 'error');
        const orderRows = derived.filter(r => r.dispense > 0);
        if (!orderRows.length) return ctx.showToast('ยังไม่มีรายการที่จะเบิก', 'error');
        const warn = [];
        if (overlapReq) return ctx.showToast(`ช่วงยอดใช้ทับกับใบ ${overlapReq.form_no || overlapReq.doc_no || overlapReq.id} (${formatThaiDate(overlapReq.period_from)}–${formatThaiDate(overlapReq.period_to)}) — ยอดใช้จะถูกนับซ้ำ ปรับวันที่ก่อนส่ง`, 'error');
        if (!effEdit() && round && ctx.reqs.some(q => q.round_id === round.id && q.status !== 'Cancelled')) return ctx.showToast(`มีใบเบิกของรอบที่ ${round.round_no} แล้ว`, 'error');
        if (unmatched.length) warn.push(`มี ${unmatched.length} icode ที่ยังไม่จับคู่รหัส INVS (ไม่ถูกนำมาคำนวณ)`);
        ctx.setConfirmDialog({
          title: editReq ? 'ส่งใบเบิกที่แก้ไข?' : 'ยืนยันส่งใบเบิกห้องยา?',
          message: `ยอดใช้ ${formatThaiDate(from)} – ${formatThaiDate(to)} (${calcDays} วัน) · สำรอง ${coverDays} วัน\nเบิก ${orderRows.length} รายการ · มูลค่า ${fmtMoney(stats.value)} บาท\nระบบจะบันทึกคงเหลือหลังหักยอดใช้เป็นยอดตั้งต้นของรอบนี้${warn.length ? '\n\n' + warn.join('\n') : ''}`,
          icon: 'fa-paper-plane', iconColor: 'text-teal-600', confirmBtnClass: 'bg-teal-600 hover:bg-teal-700', confirmText: 'ส่งใบเบิก',
          onConfirm: async () => {
            setBusy('submit');
            try {
              const { items, stockOps, multOps, extra } = buildPharmPayload();
              await saveInternalReq({ ctx, editReq: effEdit(), round, kind: 'pharmacy', items, stockOps, extra });
              if (multOps.length) { try { await executeBatchChunks(multOps); } catch (e) { ctx.showToast('ส่งใบแล้ว แต่บันทึกตัวคูณไม่สำเร็จ: ' + e.message, 'warn'); } }
              ctx.showToast('ส่งใบเบิกห้องยาแล้ว รอแอดมินตรวจสอบ');
              rxTaskDone('ph_suggest');
              await ctx.reload(); await ctx.reloadMasters();
              onDone();
            } catch (e) { ctx.showToast('ส่งไม่สำเร็จ: ' + (e?.message || e), 'error'); }
            finally { setBusy(''); }
          }
        });
      };

      // v6.5 ข้อมูลใบเบิกห้องยา (ใช้ทั้งส่งจริง / บันทึกรอส่ง / พิมพ์)
      const draftRef = useRef(null);
      const effEdit = () => editReq || draftRef.current;
      const buildPharmPayload = () => {
              const orderRows = derived.filter(r => r.dispense > 0);
              const toItem = (r) => ({
                ...r.base, drugId: r.id,
                opdRaw: r.opdRaw, ipdRaw: r.ipdRaw, hosxpMultiplier: r.multiplier, hosxpCodes: r.icodes, hosxpUnits: r.hosxpUnits,
                usage: r.usage, dailyAvg: Math.round(r.dailyAvg * 1000) / 1000, onHand: r.onHand, onHandTouched: r.onHandTouched,
                stockBefore: r.stockBal, inTransit: r.inTransit, targetQty: r.target, suggestedQty: r.suggested,
                requestQty: r.dispense, dispenseQty: r.dispense, followSuggest: r.follow, source: r.source, note: r.note, skipReason: r.skipReason || ''
              });
              const items = orderRows.map(toItem);
              const zeroRows = derived.filter(r => r.dispense <= 0 && (r.usage > 0 || r.onHandTouched || r.source === 'manual')).map(r => ({
                drugId: r.id, name: r.base.name, unit: r.base.unit, packSize: r.base.packSize, price: r.base.price, type: r.base.type,
                opdRaw: r.opdRaw, ipdRaw: r.ipdRaw, hosxpMultiplier: r.multiplier, hosxpCodes: r.icodes, usage: r.usage,
                onHand: r.onHand, suggestedQty: r.suggested, followSuggest: r.follow, dispenseQty: 0, source: r.source, skipReason: r.skipReason || ''
              }));
              const stockOps = derived.filter(r => r.usage > 0 || r.onHandTouched).map(r => ({
                type: 'set',
                ref: db.collection('internal_stock').doc(internalStockDocId(ctx.dept.dept_id, r.id)),
                data: {
                  dept_id: String(ctx.dept.dept_id), drug_id: r.id, balance: r.onHand,
                  last_source: 'REQ_SUBMIT', last_usage: r.usage, period_to: to,
                  updated_at: firebase.firestore.FieldValue.serverTimestamp(), updated_by_uid: ctx.currentUser.uid, updated_by_name: safeText(ctx.currentUser.name)
                },
                options: { merge: true }
              }));
              // บันทึกตัวคูณแปลงหน่วย HOSxP→INVS ที่แก้ไข กลับเข้า master_drugs
              const multOps = derived.filter(r => r.multiplierChanged).map(r => ({
                type: 'update', ref: db.collection('master_drugs').doc(r.id),
                data: { hosxp_multiplier: r.multiplier, hosxp_multiplier_updated_at: firebase.firestore.FieldValue.serverTimestamp(), hosxp_multiplier_updated_by: safeText(ctx.currentUser.name) }
              }));
              return { items, zeroRows, stockOps, multOps, extra: {
                  note: safeText(note), period_from: from, period_to: to, period_days: calcDays, cover_days: coverDays,
                  usage_source: usageMeta.source, usage_file: usageMeta.fileName || '', usage_fetched_at: usageMeta.fetchedAt || null,
                  round_days: roundDays, min_order_value: minOrderValue, prev_req_id: prevReq?.id || '', prev_period_to: lastPeriodTo || '', skipped_suggest_count: stats.skip,
                  zero_rows: zeroRows, unmatched: unmatched.slice(0, 300), unmatched_count: unmatched.length,
                  suggested_item_count: stats.suggest, changed_item_count: stats.changed, sign_people: signersForSave(signers)
                } };
      };
      // บันทึกเก็บไว้ "รอส่ง" — ยังไม่เข้าคิวแอดมิน ไม่หักสต็อก กลับมาแก้/พิมพ์/ส่งได้ภายหลัง
      const saveDraft = async ({ quiet } = {}) => {
