                </button>
              </div>
            </div>
          </div>

          {showEstimate && (() => {
            // v6.5 พิมพ์ใบเบิกห้องยาแบบเดียวกับใบจริง (หัวกระดาษ วันที่ ลายเซ็น) โดยยังไม่ส่งเข้าคิว/VMI
            const typesSrc = ctx.drugTypes || DEFAULT_DRUG_TYPES;
            const rows = derived.filter(r => r.usage > 0 || r.dispense > 0 || r.source === 'manual'); // หมวดที่ซ่อน (5/6) ถูกกรองออกแล้วใน derived
            const roundT = (r) => { const pack = safePackSize(r.base.packSize); return roundTarget ? (pack > 1 ? Math.ceil(r.target / pack - 1e-9) * pack : Math.ceil(r.target - 1e-9)) : r.target; };
            const items = rows.map(r => ({ ...r.base, drugId: r.id, usage: r.usage, onHand: r.onHand, targetQty: roundT(r), requestQty: r.dispense, dispenseQty: r.dispense, source: r.source }));
            const cur = effEdit();
            const formNo = estForm.no;
            const formDate = estForm.date;
            const fakeReq = { kind: 'pharmacy', dept_name: ctx.dept?.dept_name || '', note, items, created_by_name: safeText(ctx.currentUser?.name), created_by_position: safeText(ctx.currentUser?.position), sign_people: signers };
            const locOf = (id) => safeText(ctx.drugById.get(String(id))?.invs_location);
            const head = ['ที่', 'ชื่อยา/เวชภัณฑ์', 'หน่วย', 'บรรจุ', 'ยอดใช้', 'ยอดเหลือ', 'Target Stock', 'จำนวนจ่าย', 'ราคา/หน่วย', 'มูลค่า (บาท)', 'คงเหลือ', 'รหัส'];
            const aoa = () => {
              const out = [[`ใบเบิกวัสดุ/เวชภัณฑ์ — ${fakeReq.dept_name}`], [`เลขที่ ${formNo || '-'} · วันที่ ${thaiDateLong(formDate)} · ยอดใช้ ${thaiDateLong(from)} ถึง ${thaiDateLong(to)} (${calcDays} วัน) · จำนวนเป็นหน่วยย่อย`], [], head];
              const sorted = items.slice().sort((a, b) => Number(a.type) - Number(b.type) || compareByLocation(locOf(a.drugId), a.name, locOf(b.drugId), b.name));
              let i = 0, lastType = null, total = 0;
              sorted.forEach(r => {
                if (String(r.type) !== lastType) { out.push([typesSrc[r.type] || `หมวด ${r.type}`]); lastType = String(r.type); }
                const value = Math.round(internalItemValue(r) * 100) / 100; total += value;
                i += 1; out.push([i, r.name, r.unit, safePackSize(r.packSize), r.usage, r.onHand, r.targetQty, fillQty ? r.dispenseQty : '', toNonNegativeNumber(r.price), fillQty ? value : '', '', r.drugId]);
              });
              if (fillQty) out.push([], ['', `รวม ${i} รายการ`, '', '', '', '', '', '', '', Math.round(total * 100) / 100]);
              return out;
            };
            const fileBase = `ใบเบิก_${safeText(fakeReq.dept_name).replace(/[\\/:*?"<>|\s]+/g, '_')}_${safeText(formNo).replace(/\//g, '-') || toYmd(new Date())}`;
            const maybeSave = async () => { if (keepDraft) await saveDraft({ quiet: true }); };
            const doPrint = async () => { await maybeSave(); await printHtmlDocument(buildInternalReqFormHtml({ req: fakeReq, formNo, formDate, deptName: fakeReq.dept_name, drugTypes: ctx.drugTypes, locOf, blankQty: !fillQty, includeUsed: true, signers })); };
            const doXlsx = async () => {
              if (typeof XLSX === 'undefined' || !XLSX.utils) return ctx.showToast('โหลดตัวสร้าง Excel ไม่สำเร็จ — ใช้ CSV แทน', 'error');
              await maybeSave();
              const ws = XLSX.utils.aoa_to_sheet(aoa());
              ws['!cols'] = [5, 36, 8, 7, 10, 10, 12, 11, 10, 12, 12, 10].map(w => ({ wch: w }));
              const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'ใบเบิก'); XLSX.writeFile(wb, fileBase + '.xlsx');
            };
            const doCsv = async () => {
              await maybeSave();
              const esc = v => { const t = String(v ?? ''); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
              const blob = new Blob(['﻿' + aoa().map(r => r.map(esc).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
              const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileBase + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
            };
            const sent = cur && cur.status && cur.status !== 'Draft';
            return (
              <Modal isOpen onClose={() => setShowEstimate(false)} title="พิมพ์ใบเบิก (ยังไม่ส่ง VMI)" maxWidth="max-w-xl">
                <div className="space-y-4">
                  <div className="bg-slate-50 border rounded-xl p-3 text-sm text-slate-600">พิมพ์เป็นใบเบิกจริง (หัวกระดาษ เลขที่ วันที่ ลายเซ็น) เพื่อเสนอขออนุมัติ — <b>ยังไม่ส่งเข้าคิว / VMI</b> เมื่ออนุมัติกระดาษแล้วค่อยกลับมากด "ส่งใบเบิก"</div>
                  {!usageMeta && <div className="text-sm text-red-600 font-bold">ยังไม่ได้ดึงยอดใช้จาก HOSxP</div>}
                  <div className="grid grid-cols-2 gap-3">
                    <label className="block"><span className="text-xs font-bold text-slate-500">เลขที่</span><input id="ph-est-no" value={estForm.no} onChange={e => setEstForm(f => ({ ...f, no: e.target.value }))} className="w-full mt-1 p-2.5 border rounded-xl font-mono" /></label>
                    <label className="block"><span className="text-xs font-bold text-slate-500">วันที่ในใบ</span><input id="ph-est-date" type="date" value={estForm.date} onChange={e => setEstForm(f => ({ ...f, date: e.target.value }))} className="w-full mt-1 p-2.5 border rounded-xl" /><span className="text-[11px] text-slate-400">{thaiDateLong(estForm.date)}</span></label>
                  </div>
                  <div className="space-y-2">
                    <label className="flex items-start gap-2 text-sm font-bold text-slate-700 cursor-pointer"><input id="ph-est-fill" type="checkbox" checked={fillQty} onChange={e => setFillQty(e.target.checked)} className="w-4 h-4 mt-0.5" /><span>ใส่ยอดในช่องจำนวนจ่ายและมูลค่า<span className="block text-xs font-normal text-slate-500">เอาออกเพื่อพิมพ์ช่องว่างไว้เติมเอง</span></span></label>
                    <label className="flex items-start gap-2 text-sm font-bold text-slate-700 cursor-pointer"><input id="ph-est-round" type="checkbox" checked={roundTarget} onChange={e => setRoundTarget(e.target.checked)} className="w-4 h-4 mt-0.5" /><span>ปัด Target Stock เป็นจำนวนเต็มหน่วยบรรจุ<span className="block text-xs font-normal text-slate-500">เช่น 1,250 เม็ด บรรจุ 1,000 → 2,000</span></span></label>
                    <label className="flex items-start gap-2 text-sm font-bold text-slate-700 cursor-pointer"><input id="ph-est-keep" type="checkbox" checked={keepDraft && !sent} disabled={sent} onChange={e => setKeepDraft(e.target.checked)} className="w-4 h-4 mt-0.5" /><span>บันทึกเก็บไว้ใน "รอส่ง" ด้วย<span className="block text-xs font-normal text-slate-500">กลับมาแก้ไข/พิมพ์ซ้ำ/ส่งได้จาก "ใบเบิกของฉัน"{cur?.status === 'Draft' ? ' · ใบนี้บันทึกไว้แล้ว จะอัปเดตใบเดิม' : ''}</span></span></label>
                  </div>
                  <InternalSignersEditor value={signers} onChange={setSigners} />
                  <div className="text-xs text-slate-500">{items.length} รายการ · มูลค่า {fmtMoney(items.reduce((s, it) => s + internalItemValue(it), 0))} บาท</div>
                  <div className="flex flex-wrap justify-end gap-2 pt-2 border-t">
                    {!sent && <button id="ph-est-save" onClick={async () => { const id = await saveDraft(); if (id) setShowEstimate(false); }} disabled={!!busy} className="px-4 py-2.5 rounded-xl bg-white border-2 border-teal-600 text-teal-700 font-bold disabled:opacity-40"><i className="fa-solid fa-floppy-disk mr-2"></i>บันทึกอย่างเดียว</button>}
                    <button id="ph-est-print" onClick={doPrint} disabled={!items.length || !!busy} className="px-4 py-2.5 rounded-xl bg-slate-800 text-white font-bold disabled:opacity-40"><i className="fa-solid fa-file-pdf mr-2"></i>พิมพ์ / PDF</button>
                    <button id="ph-est-xlsx" onClick={doXlsx} disabled={!items.length || !!busy} className="px-4 py-2.5 rounded-xl bg-emerald-600 text-white font-bold disabled:opacity-40"><i className="fa-solid fa-file-excel mr-2"></i>Excel</button>
                    <button id="ph-est-csv" onClick={doCsv} disabled={!items.length || !!busy} className="px-4 py-2.5 rounded-xl bg-white border font-bold text-slate-700 disabled:opacity-40"><i className="fa-solid fa-file-csv mr-2"></i>CSV</button>
                  </div>
                </div>
              </Modal>
            );
          })()}

          <Modal isOpen={showUnmatched} onClose={() => setShowUnmatched(false)} title={`icode ที่ยังไม่จับคู่รหัส INVS (${unmatched.length})`} maxWidth="max-w-4xl">
            <p className="text-sm text-slate-500 mb-4">รายการเหล่านี้มีการใช้ใน HOSxP แต่ยังไม่มีรหัส INVS ที่ผูก hosxp_code ไว้ จึงไม่ถูกนำมาคำนวณ
              {isAdmin ? ' — เลือกยา INVS เพื่อจับคู่ได้ทันที (บันทึกลง master_drugs.hosxp_code)' : ' — แจ้งแอดมินให้จับคู่ หรือกด Sync HOSxP ในหน้าจัดการฐานข้อมูล'}</p>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 text-xs text-slate-500"><tr><th className="p-2 text-left">icode</th><th className="p-2 text-left">ชื่อใน HOSxP</th><th className="p-2 text-left">หน่วย</th><th className="p-2 text-right">ใช้</th>{isAdmin && <th className="p-2 text-left w-80">จับคู่กับ INVS</th>}</tr></thead>
                <tbody>
                  {unmatched.map(u => (
                    <tr key={u.icode} className="border-t">
                      <td className="p-2 font-mono text-purple-600">{u.icode}</td><td className="p-2">{u.name}</td><td className="p-2 text-slate-500">{u.units}</td><td className="p-2 text-right tnum">{fmtNum(u.qty)}</td>
                      {isAdmin && <td className="p-2"><DrugSearchBox ctx={ctx} placeholder="ค้นหายา INVS" onPick={d => mapIcode(u.icode, d)} /></td>}
                    </tr>
                  ))}
                  {!unmatched.length && <tr><td colSpan="5" className="p-6 text-center text-slate-400">จับคู่ครบทุกรายการ</td></tr>}
                </tbody>
              </table>
            </div>
          </Modal>

          <Modal isOpen={!!diag} onClose={() => setDiag(null)} title="ตรวจการเชื่อม HOSxP ทีละขั้น" maxWidth="max-w-3xl">
            {diag?.error ? (
              <div className="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm">
                <b>เรียก Bridge ไม่ได้:</b> {diag.error}
                <div className="mt-2 text-slate-600">ถ้าข้อความบอกว่า action ไม่รองรับ แปลว่าเครื่องนี้ยังใช้ Bridge รุ่นเก่า ให้ติดตั้ง Bridge v2.5.0 แล้วลองใหม่</div>
              </div>
            ) : diag && (
              <div className="space-y-2">
                {(diag.steps || []).map((st, i) => (
                  <div key={i} className={`rounded-xl border p-3 text-sm ${st.ok ? 'border-emerald-200 bg-emerald-50' : 'border-red-200 bg-red-50'}`}>
                    <div className="font-bold"><i className={`fa-solid ${st.ok ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-red-600'} mr-2`}></i>{({ config: 'ค่าใน config.php', connect: 'เชื่อมต่อฐาน HOSxP', tables: 'ตาราง', data_range: 'ช่วงข้อมูลที่มี', rows_in_range: 'ข้อมูลในช่วงที่เลือก', join_drugitems: 'จับคู่กับ drugitems', sample: 'ตัวอย่างข้อมูล', custom_sql: 'SQL กำหนดเอง', dates: 'วันที่' })[st.step] || st.step}</div>
                    <div className="text-slate-700 mt-1">{st.detail}</div>
                    {st.data?.rows?.length > 0 && (
                      <div className="overflow-x-auto mt-2"><table className="text-xs w-full"><thead><tr className="text-slate-500"><th className="text-left p-1">icode</th><th className="text-left p-1">ชื่อ</th><th className="text-left p-1">หน่วย</th><th className="text-right p-1">qty</th><th className="text-left p-1">rxdate</th><th className="text-left p-1">an</th></tr></thead>
                        <tbody>{st.data.rows.map((r, j) => <tr key={j} className="border-t"><td className="p-1 font-mono">{r.icode}</td><td className="p-1">{r.name}</td><td className="p-1">{r.units}</td><td className="p-1 text-right">{r.qty}</td><td className="p-1">{r.rxdate}</td><td className="p-1">{r.an || '-'}</td></tr>)}</tbody></table></div>
                    )}
                  </div>
                ))}
                <div className={`text-sm font-bold ${diag.all_pass ? 'text-emerald-700' : 'text-red-700'}`}>{diag.all_pass ? 'ผ่านทุกขั้น — ถ้ายังได้ 0 รายการ ให้ตรวจว่า hosxp_code ของยาใน INVS ตรงกับ icode (กด Sync รหัส HOSxP)' : 'ขั้นที่เป็นสีแดงคือจุดที่ต้องแก้'}</div>
              </div>
            )}
          </Modal>

          <Modal isOpen={showSql} onClose={() => setShowSql(false)} title="SQL สำหรับ export ยอดใช้จาก HOSxP (Navicat)" maxWidth="max-w-3xl">
            <p className="text-sm text-slate-500 mb-3">ใช้เมื่อเครื่องนี้เรียก Bridge ไม่ได้: รัน SQL นี้ใน Navicat → Export เป็น CSV/Excel → กด "นำเข้าไฟล์" (ต้องมีคอลัมน์ icode และ opd_qty/ipd_qty หรือ qty)</p>
            <pre className="bg-slate-900 text-emerald-200 text-xs p-4 rounded-xl overflow-x-auto">{hosxpExportSql(from, to)}</pre>
            <div className="text-right mt-3">
              <button onClick={() => { navigator.clipboard?.writeText(hosxpExportSql(from, to)).then(() => ctx.showToast('คัดลอก SQL แล้ว')).catch(() => ctx.showToast('คัดลอกไม่ได้ ให้เลือกข้อความเอง', 'error')); }} className="px-4 py-2 rounded-xl bg-slate-800 text-white font-bold"><i className="fa-regular fa-copy mr-2"></i>คัดลอก</button>
            </div>
          </Modal>
        </div>
      );
    };

    // v6.5.2 ลบใบรอส่ง = เปลี่ยนเป็น Cancelled (draft_deleted) — ไม่ใช้ delete จริง เพื่อให้แคช/ซิงก์เห็นการเปลี่ยนแปลง
    const cancelDraftReq = async (ctx, id) => {
      const ref = db.collection('internal_requisitions').doc(id);
      await db.runTransaction(async (tx) => {
        const snap = await tx.get(ref);
        const cur = snap.data() || {};
        if (cur.status !== 'Draft') throw new Error('ใบนี้ไม่ใช่สถานะรอส่งแล้ว ลบไม่ได้');
        tx.update(ref, { status: 'Cancelled', draft_deleted: true, cancelled_at: firebase.firestore.FieldValue.serverTimestamp(), cancelled_by_uid: ctx.currentUser.uid, cancelled_by_name: safeText(ctx.currentUser.name), updated_at: firebase.firestore.FieldValue.serverTimestamp() });
      });
      await writeAuditLog(ctx.currentUser, 'INTERNAL_REQ_DRAFT_DELETE', 'internal_requisitions', id, {});
    };

    // ===== ใบเบิกของฉัน =====
    const ReqDetailModal = ({ ctx, req, onClose, onEdit, onPrint }) => {
      if (!req) return null;
      const canEdit = ['Draft', 'Pending', 'Rejected'].includes(req.status) && !req.invs_sub_po_no;
      const items = req.items || [];
      const cancelReq = () => ctx.setConfirmDialog({
        title: 'ยกเลิกใบเบิกนี้?', message: `ใบ ${req.doc_no || req.id} จะถูกนำออกจากคิวของห้องยา`,
        icon: 'fa-ban', iconColor: 'text-red-500', confirmBtnClass: 'bg-red-500 hover:bg-red-600', confirmText: 'ยกเลิกใบเบิก',
        onConfirm: async () => {
          try {
            const ref = db.collection('internal_requisitions').doc(req.id);
            await db.runTransaction(async (tx) => {
              const snap = await tx.get(ref);
              const cur = snap.data() || {};
              if (!['Draft', 'Pending', 'Rejected'].includes(cur.status) || cur.invs_sub_po_no) throw new Error('สถานะใบเปลี่ยนแล้ว ยกเลิกไม่ได้');
              tx.update(ref, { status: 'Cancelled', cancelled_at: firebase.firestore.FieldValue.serverTimestamp(), cancelled_by_uid: ctx.currentUser.uid, cancelled_by_name: safeText(ctx.currentUser.name), updated_at: firebase.firestore.FieldValue.serverTimestamp() });
            });
            await writeAuditLog(ctx.currentUser, 'INTERNAL_REQ_CANCEL', 'internal_requisitions', req.id, { dept_id: req.deptId });
            ctx.showToast('ยกเลิกใบเบิกแล้ว'); await ctx.reload(); onClose();
          } catch (e) { ctx.showToast(e.message, 'error'); }
        }
      });
      return (
        <Modal isOpen onClose={onClose} title={`ใบเบิก ${req.doc_no || req.id}`} maxWidth="max-w-5xl">
          <div className="flex flex-wrap gap-x-6 gap-y-2 text-sm mb-4 items-center">
            <StatusPill status={req.status} />
            <span className="text-slate-500">ส่งเมื่อ {formatAppDateTime(req.submitted_at || req.created_at)} โดย {req.created_by_name}</span>
            {req.kind === 'pharmacy' && <span className="text-slate-500">ยอดใช้ {formatThaiDate(req.period_from)}–{formatThaiDate(req.period_to)} · สำรอง {req.cover_days} วัน</span>}
            {req.invs_sub_po_no && <span className="font-bold text-indigo-700">INVS {req.invs_sub_po_no}</span>}
            {req.urgent && <span className="font-bold text-red-600">ด่วน</span>}
          </div>
          {req.status === 'Rejected' && <div className="mb-4 bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-sm"><b>เหตุผลที่ส่งกลับ:</b> {req.reject_reason || '-'}</div>}
          {req.admin_note && <div className="mb-4 bg-indigo-50 border border-indigo-200 text-indigo-800 rounded-xl p-3 text-sm"><b>หมายเหตุจากห้องยา:</b> {req.admin_note}</div>}
          <div className="overflow-x-auto border rounded-xl">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 text-xs text-slate-500"><tr>
                <th className="p-2 text-left">#</th><th className="p-2 text-left">รายการ</th>
                {req.kind === 'pharmacy' && <th className="p-2 text-right">ใช้</th>}{req.kind === 'pharmacy' && <th className="p-2 text-right">คงเหลือ</th>}{req.kind === 'pharmacy' && <th className="p-2 text-right">แนะนำ</th>}
                <th className="p-2 text-right">ขอเบิก</th>{req.status === 'Completed' && <th className="p-2 text-right">อนุมัติจ่าย</th>}<th className="p-2 text-right">มูลค่า</th><th className="p-2 text-left">หมายเหตุ</th>
              </tr></thead>
              <tbody>
                {items.map((it, i) => (
                  <tr key={it.drugId} className="border-t">
                    <td className="p-2 text-slate-400">{i + 1}</td>
                    <td className="p-2"><div className="font-semibold">{it.name}</div><div className="text-[11px] text-slate-400 font-mono">{it.drugId} · {it.unit}</div></td>
                    {req.kind === 'pharmacy' && <td className="p-2 text-right tnum">{fmtNum(it.usage)}</td>}
                    {req.kind === 'pharmacy' && <td className="p-2 text-right tnum">{fmtNum(it.onHand)}</td>}
                    {req.kind === 'pharmacy' && <td className="p-2 text-right tnum text-teal-700">{fmtNum(it.suggestedQty)}</td>}
                    <td className="p-2 text-right"><QtyWithPack qty={it.requestQty ?? it.dispenseQty} packSize={it.packSize} /></td>
                    {req.status === 'Completed' && <td className="p-2 text-right font-bold text-emerald-700"><QtyWithPack qty={it.dispenseQty} packSize={it.packSize} /></td>}
                    <td className="p-2 text-right tnum">{fmtMoney(internalItemValue(it))}</td>
                    <td className="p-2 text-slate-500">{it.note || (it.adminNote ? `ห้องยา: ${it.adminNote}` : '')}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {req.note && <div className="mt-3 text-sm text-slate-600"><b>หมายเหตุ:</b> {req.note}</div>}
          <div className="flex flex-wrap justify-end gap-2 mt-5">
            {canEdit && req.status === 'Draft' && <button id="req-draft-del" onClick={() => ctx.setConfirmDialog({ title: 'ลบใบรอส่งนี้?', message: 'ลบแล้วเลือกรอบเบิกและดึงยอดใช้ใหม่ได้', icon: 'fa-trash-can', iconColor: 'text-red-500', confirmBtnClass: 'bg-red-500 hover:bg-red-600', confirmText: 'ลบใบรอส่ง', onConfirm: async () => { try { await cancelDraftReq(ctx, req.id); ctx.showToast('ลบใบรอส่งแล้ว'); await ctx.reload(); onClose(); } catch (e) { ctx.showToast(e.message, 'error'); } } })} className="px-4 py-2 rounded-xl border border-red-200 text-red-600 font-bold hover:bg-red-50"><i className="fa-solid fa-trash-can mr-2"></i>ลบใบรอส่ง / เริ่มใหม่</button>}
            {canEdit && req.status !== 'Draft' && <button onClick={cancelReq} className="px-4 py-2 rounded-xl border border-red-200 text-red-600 font-bold hover:bg-red-50"><i className="fa-solid fa-ban mr-2"></i>ยกเลิกใบ</button>}
            <button onClick={() => onPrint(req)} className="px-4 py-2 rounded-xl bg-slate-800 text-white font-bold"><i className="fa-solid fa-print mr-2"></i>พิมพ์</button>
            {canEdit && <button onClick={() => onEdit(req)} className="px-5 py-2 rounded-xl bg-teal-600 text-white font-bold"><i className="fa-solid fa-pen mr-2"></i>{req.status === 'Rejected' ? 'แก้ไขและส่งใหม่' : 'แก้ไขใบเบิก'}</button>}
          </div>
        </Modal>
      );
    };

    const HistoryView = ({ ctx, onEdit, onPrint, onNew }) => {
      const [open, setOpen] = useState(null);
      const [statusFilter, setStatusFilter] = useState('active');
      const rows = useMemo(() => {
        let r = [...ctx.reqs].sort((a, b) => tsToMillis(b.submitted_at || b.created_at) - tsToMillis(a.submitted_at || a.created_at));
        if (statusFilter === 'active') r = r.filter(x => ['Pending', 'Approving', 'Rejected', 'ApprovalFailed'].includes(x.status));
        else if (statusFilter !== 'all') r = r.filter(x => x.status === statusFilter);
        return r;
      }, [ctx.reqs, statusFilter]);
      const openReq = open ? ctx.reqs.find(r => r.id === open) : null;
      return (
        <div className="space-y-5 animate-fade-in">
          <div className="flex flex-wrap items-end justify-between gap-3">
            <div>
              <h2 className="text-2xl font-extrabold text-slate-800">ใบเบิกของฉัน</h2>
              <div className="text-sm text-slate-500">{ctx.dept?.dept_name}</div>
            </div>
            <button onClick={onNew} className="px-5 py-3 rounded-xl bg-gradient-main text-white font-bold shadow-lg"><i className="fa-solid fa-plus mr-2"></i>สร้างใบเบิก</button>
          </div>
          <div className="flex flex-wrap gap-2">
            {[['active', 'กำลังดำเนินการ'], ['Completed', 'อนุมัติแล้ว'], ['Cancelled', 'ยกเลิก'], ['all', 'ทั้งหมด']].map(([k, l]) => (
              <button key={k} onClick={() => setStatusFilter(k)} aria-pressed={statusFilter === k} className={`px-4 py-2 rounded-xl text-sm font-bold ${statusFilter === k ? 'bg-slate-800 text-white' : 'bg-white border text-slate-600'}`}>{l}</button>
            ))}
          </div>
          <div className="bg-white rounded-2xl border shadow-sm overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 text-xs text-slate-500"><tr>
                <th className="p-3 text-left">เลขที่</th><th className="p-3 text-left">ส่งเมื่อ</th>{ctx.dept?.kind === 'pharmacy' && <th className="p-3 text-left">ช่วงยอดใช้</th>}
                <th className="p-3 text-right">รายการ</th><th className="p-3 text-right">มูลค่า</th><th className="p-3 text-left">สถานะ</th><th className="p-3 text-left">INVS</th><th className="p-3"></th>
              </tr></thead>
              <tbody>
                {rows.length === 0 && <tr><td colSpan="8" className="p-10 text-center text-slate-400">ไม่มีใบเบิก</td></tr>}
                {rows.map(r => (
                  <tr key={r.id} className="border-t hover:bg-slate-50 cursor-pointer" onClick={() => setOpen(r.id)}>
                    <td className="p-3 font-mono text-xs">{r.doc_no || r.id}{r.urgent && <span className="ml-2 text-red-600 font-bold font-sans">ด่วน</span>}</td>
                    <td className="p-3 text-slate-600">{formatAppDateTime(r.submitted_at || r.created_at)}</td>
                    {ctx.dept?.kind === 'pharmacy' && <td className="p-3 text-slate-600">{formatThaiDate(r.period_from)}–{formatThaiDate(r.period_to)}</td>}
                    <td className="p-3 text-right tnum">{fmtNum(r.item_count ?? (r.items || []).length)}</td>
                    <td className="p-3 text-right tnum">{fmtMoney(r.total_value)}</td>
                    <td className="p-3"><StatusPill status={r.status} /></td>
                    <td className="p-3 font-mono text-xs text-indigo-700">{r.invs_sub_po_no || '-'}</td>
                    <td className="p-3 text-right text-slate-300"><i className="fa-solid fa-chevron-right"></i></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {openReq && <ReqDetailModal ctx={ctx} req={openReq} onClose={() => setOpen(null)} onEdit={(r) => { setOpen(null); onEdit(r); }} onPrint={onPrint} />}
        </div>
      );
    };

    // ===== สต็อกห้องยา (นับเริ่มต้น / ปรับยอด) =====
    // ===== v6.3 ประมาณการใช้ยา (ห้องยา): ดึงยอดใช้ HOSxP โดยไม่สร้างใบเบิก แล้วแปลงเป็นหน่วยใหญ่ + พิมพ์ได้ =====
    // v6.3.1: แก้ตัวเลขรายแถวได้ · จับคู่ icode ที่ไม่ match ทีละตัว · ส่งออก PDF / Excel / CSV
    const UsageEstimateView = ({ ctx }) => {
      const today = toYmd(new Date());
      const yesterday = addDaysYmd(today, -1);
      const upcoming = useMemo(() => (ctx.rounds || []).filter(r => String(r.round_date) >= today).sort((a, b) => String(a.round_date).localeCompare(String(b.round_date))), [ctx.rounds]);
      const defaultProject = useMemo(() => {
        if (upcoming.length >= 2) { const d = daysBetweenInclusive(upcoming[0].round_date, upcoming[1].round_date) - 1; if (d > 0) return d; }
        return toNonNegativeInt(ctx.dept?.round_days, 0) || 14;
      }, [upcoming]);
      const [from, setFrom] = useState(addDaysYmd(yesterday, -29));
      const [to, setTo] = useState(yesterday);
      const [projectDays, setProjectDays] = useState(defaultProject);
      const [bufferPct, setBufferPct] = useState(0);
      const [raw, setRaw] = useState(null);
      const [meta, setMeta] = useState(null);
      const [busy, setBusy] = useState('');
      const [search, setSearch] = useState('');
      const [showUnmatched, setShowUnmatched] = useState(false);
      const [edits, setEdits] = useState({});        // drugId → { usage?, packs? } ตัวเลขที่ผู้ใช้แก้
      const [extraMap, setExtraMap] = useState({});  // icode → drugId จับคู่เพิ่มเฉพาะตัวที่เลือก (ใช้ในหน้านี้)
      const [saveMap, setSaveMap] = useState(true);  // แอดมิน: บันทึกการจับคู่ลง master ด้วย
      const fileRef = useRef(null);
      const days = from && to && to >= from ? daysBetweenInclusive(from, to) : 0;
      const resetWork = () => { setEdits({}); setExtraMap({}); };

      const fetchHosxp = async () => {
        if (!days) return ctx.showToast('ช่วงวันที่ไม่ถูกต้อง', 'error');
        setBusy('bridge');
        try {
          const data = await callInvsBridge('hosxp_usage', '', { date_from: from, date_to: to });
          setRaw(data.rows || []); setMeta({ source: 'HOSxP', from, to, days: data.days || days }); resetWork();
          ctx.showToast(data.count ? `ดึงยอดใช้ ${fmtNum(data.count)} รายการแล้ว` : 'HOSxP คืนข้อมูล 0 รายการ — ตรวจช่วงวันที่', data.count ? 'success' : 'warn');
        } catch (e) { ctx.showToast((e?.message || String(e)) + ' — ถ้าเครื่องนี้ไม่มี Bridge ใช้ "นำเข้าไฟล์" แทน', 'error'); }
        finally { setBusy(''); }
      };
      const importFile = (file) => {
        if (!file) return;
        if (!days) return ctx.showToast('เลือกช่วงวันที่ให้ตรงกับไฟล์ก่อน', 'error');
        setBusy('file');
        parseTabularFile(file, (rows) => {
          try { const parsed = parseUsageFileRows(rows); setRaw(parsed.rows); setMeta({ source: 'ไฟล์ ' + file.name, from, to, days }); resetWork(); ctx.showToast(`อ่านไฟล์ ${fmtNum(parsed.rows.length)} รายการ`); }
          catch (e) { ctx.showToast(e.message, 'error'); }
          finally { setBusy(''); if (fileRef.current) fileRef.current.value = ''; }
        }, (e) => { setBusy(''); ctx.showToast('อ่านไฟล์ไม่สำเร็จ: ' + (e?.message || e), 'error'); }, { header: true });
      };

      // จับคู่ตาม master + จับคู่เพิ่มที่ผู้ใช้เลือก (เฉพาะ icode ที่เลือก)
      const matched = useMemo(() => {
        if (!raw) return null;
        const base = matchUsage(raw, ctx.drugs);
        const byDrug = new Map(base.byDrug);
        const unmatched = [];
        base.unmatched.forEach(u => {
          const target = extraMap[u.icode];
          if (!target) { unmatched.push(u); return; }
          const cur = byDrug.get(target) || { opd: 0, ipd: 0, icodes: [], hosxpNames: [], hosxpUnits: '' };
          const rawRow = raw.find(r => String(r.icode) === String(u.icode)) || {};
          byDrug.set(target, { ...cur, opd: cur.opd + toNonNegativeNumber(rawRow.opd_qty), ipd: cur.ipd + toNonNegativeNumber(rawRow.ipd_qty),
            icodes: [...cur.icodes, String(u.icode)], manualIcodes: [...(cur.manualIcodes || []), String(u.icode)] });
        });
        return { byDrug, unmatched };
      }, [raw, ctx.drugs, extraMap]);

      const rows = useMemo(() => {
        if (!matched || !meta) return [];
        const out = [];
        matched.byDrug.forEach((u, id) => {
          const drug = ctx.drugById.get(id); if (!drug) return;
          const autoUsage = Math.round((u.opd + u.ipd) * getHosxpMultiplier(drug) * 1000) / 1000;
          const ed = edits[id] || {};
          const usage = ed.usage ?? autoUsage;
          if (usage <= 0 && ed.packs === undefined) return;
          const pack = safePackSize(drug.pack_size);
          const dailyAvg = usage / Math.max(1, meta.days);
          const projected = Math.ceil(dailyAvg * Math.max(0, toNonNegativeNumber(projectDays)) * (1 + toNonNegativeNumber(bufferPct) / 100) - 1e-9);
          const autoPacks = Math.ceil(projected / pack - 1e-9);
          out.push({ drugId: id, name: safeText(drug.drug_name), unit: ctx.unitName(drug), packSize: pack, price: toNonNegativeNumber(drug.price), type: String(drug.type || '1'),
            location: safeText(drug.invs_location), usage, autoUsage, dailyAvg, projected, autoPacks, packs: ed.packs ?? autoPacks,
            usageEdited: ed.usage !== undefined, packsEdited: ed.packs !== undefined, discontinued: isDrugDiscontinuedAll(drug), icodes: u.icodes, manualIcodes: u.manualIcodes || [] });
        });
        return out.sort((a, b) => compareByLocation(a.location, a.name, b.location, b.name));
      }, [matched, meta, projectDays, bufferPct, ctx.drugById, edits]);
      const shown = useMemo(() => { const k = normalizeForMatch(search); return k ? rows.filter(r => normalizeForMatch(r.name + ' ' + r.drugId).includes(k)) : rows; }, [rows, search]);
      const total = rows.reduce((s, r) => s + r.packs * r.price, 0);
      const editedCount = Object.keys(edits).length;

      const setEdit = (id, key, v) => setEdits(prev => {
        const cur = { ...(prev[id] || {}) };
        if (v === null || v === undefined) delete cur[key]; else cur[key] = v;
        const next = { ...prev };
        if (Object.keys(cur).length) next[id] = cur; else delete next[id];
        return next;
      });
      // แก้ยอดใช้ → คำนวณจำนวนเบิกใหม่ (ยกเลิกจำนวนเบิกที่แก้มือของแถวนั้น)
      const editUsage = (id, v) => setEdits(prev => { const cur = { ...(prev[id] || {}) }; delete cur.packs; if (v === null) delete cur.usage; else cur.usage = v; const next = { ...prev }; if (Object.keys(cur).length) next[id] = cur; else delete next[id]; return next; });

      const mapUnmatched = async (u, drug) => {
        setExtraMap(m => ({ ...m, [u.icode]: String(drug.drug_id) }));
        if (ctx.isAdmin && saveMap) {
          try {
            const codes = String(drug.hosxp_code || '').split(/[,;\s]+/).filter(Boolean);
            if (!codes.includes(String(u.icode))) codes.push(String(u.icode));
            await db.collection('master_drugs').doc(String(drug.drug_id)).update({ hosxp_code: codes.join(','), hosxp_mapped_at: firebase.firestore.FieldValue.serverTimestamp(), hosxp_mapped_by: safeText(ctx.currentUser.name) });
            await writeAuditLog(ctx.currentUser, 'HOSXP_CODE_MAP', 'master_drugs', drug.drug_id, { icode: u.icode, from: 'usage_estimate' });
            ctx.showToast(`จับคู่ ${u.icode} → ${drug.drug_name} และบันทึกลง master แล้ว`);
            return;
          } catch (e) { ctx.showToast('จับคู่ในหน้านี้แล้ว แต่บันทึกลง master ไม่สำเร็จ: ' + e.message, 'warn'); return; }
        }
        ctx.showToast(`จับคู่ ${u.icode} → ${drug.drug_name} (ใช้ในหน้านี้)`);
      };
      const unmapIcode = (icode) => setExtraMap(m => { const n = { ...m }; delete n[icode]; return n; });

      // ----- ส่งออก -----
      const exportHeader = ['ที่', 'รหัส INVS', 'รายการ', 'หมวด', 'ตำแหน่ง', 'หน่วยย่อย', 'ขนาดบรรจุ', 'ใช้จริง (หน่วยย่อย)', 'ใช้จริง (หน่วยใหญ่)', 'เฉลี่ย/วัน', `ประมาณการ ${projectDays} วัน (หน่วยย่อย)`, 'ต้องเบิก (หน่วยใหญ่)', 'ราคา/หน่วยใหญ่', 'มูลค่า (บาท)', 'แก้ไขเอง', 'icode HOSxP'];
      const exportRows = () => shown.map((r, i) => [i + 1, r.drugId, r.name, (ctx.drugTypes || DEFAULT_DRUG_TYPES)[r.type] || r.type, r.location, r.unit, r.packSize,
        r.usage, Math.round(r.usage / r.packSize * 100) / 100, Math.round(r.dailyAvg * 10) / 10, r.projected, r.packs, r.price, Math.round(r.packs * r.price * 100) / 100,
        [r.usageEdited ? 'ยอดใช้' : '', r.packsEdited ? 'จำนวนเบิก' : ''].filter(Boolean).join(', '), (r.icodes || []).join(',')]);
      const fileBase = () => `ประมาณการใช้ยา_${safeText(ctx.dept?.dept_name || 'ห้องยา').replace(/[\\/:*?"<>|\s]+/g, '_')}_${meta.from}_${meta.to}`;
      const titleLines = () => [[`ประมาณการใช้ยา — ${ctx.dept?.dept_name || ''}`], [`ยอดใช้ ${thaiDateLong(meta.from)} ถึง ${thaiDateLong(meta.to)} (${meta.days} วัน) · ประมาณการ ${projectDays} วัน${bufferPct ? ` + เผื่อ ${bufferPct}%` : ''} · ไม่ใช่ใบเบิก`], []];
      const exportXlsx = () => {
        if (typeof XLSX === 'undefined' || !XLSX.utils) return ctx.showToast('โหลดตัวสร้าง Excel ไม่สำเร็จ — ใช้ CSV แทน', 'error');
        const aoa = [...titleLines(), exportHeader, ...exportRows(), [], ['', '', `รวม ${shown.length} รายการ`, '', '', '', '', '', '', '', '', '', '', Math.round(shown.reduce((s, r) => s + r.packs * r.price, 0) * 100) / 100]];
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        ws['!cols'] = [4, 10, 34, 14, 9, 9, 8, 12, 11, 9, 14, 12, 11, 12, 12, 14].map(w => ({ wch: w }));
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'ประมาณการ');
        if (matched?.unmatched?.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['icode', 'ชื่อใน HOSxP', 'หน่วย', 'จำนวน'], ...matched.unmatched.map(u => [u.icode, u.name, u.units, u.qty])]), 'จับคู่ไม่ได้');
        XLSX.writeFile(wb, fileBase() + '.xlsx');
      };
      const exportCsv = () => {
        const esc = v => { const t = String(v ?? ''); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
        const blob = new Blob(['﻿' + [...titleLines(), exportHeader, ...exportRows()].map(r => r.map(esc).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileBase() + '.csv'; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      };
      const print = () => printHtmlDocument(buildUsageEstimateHtml({
        rows: shown, deptName: ctx.dept?.dept_name || '', from: meta.from, to: meta.to, days: meta.days, projectDays, bufferPct,
        drugTypes: ctx.drugTypes, unmatched: matched?.unmatched?.length || 0
      }));

      return (
        <div className="space-y-5 animate-fade-in">
          <div>
            <h2 className="text-2xl font-extrabold text-slate-800">ประมาณการใช้ยา</h2>
            <p className="text-sm text-slate-500">ดึงยอดใช้จริงจาก HOSxP มาคำนวณปริมาณที่ต้องใช้ล่วงหน้า แปลงเป็นหน่วยใหญ่ (÷ ขนาดบรรจุ) แก้ตัวเลขได้ และส่งออกได้ — <b>ไม่สร้าง/ไม่ส่งใบเบิก</b> และไม่แก้สต็อก</p>
          </div>
          <div className="bg-white rounded-2xl border p-4 flex flex-wrap items-end gap-3">
            <label className="text-sm"><span className="block text-xs font-bold text-slate-500 mb-1">ยอดใช้ตั้งแต่</span><input id="est-from" type="date" value={from} max={to} onChange={e => setFrom(e.target.value)} className="p-2.5 border rounded-xl" /></label>
            <label className="text-sm"><span className="block text-xs font-bold text-slate-500 mb-1">ถึง</span><input id="est-to" type="date" value={to} max={today} onChange={e => setTo(e.target.value)} className="p-2.5 border rounded-xl" /></label>
            <span className="text-sm text-slate-500 pb-3">{days ? `${days} วัน` : '—'}</span>
            <button id="est-fetch" onClick={fetchHosxp} disabled={!!busy} className="px-4 py-2.5 rounded-xl bg-teal-600 text-white font-bold disabled:opacity-50"><i className={`fa-solid ${busy === 'bridge' ? 'fa-spinner fa-spin' : 'fa-database'} mr-2`}></i>ดึงยอดใช้จาก HOSxP</button>
            <button onClick={() => fileRef.current?.click()} disabled={!!busy} className="px-4 py-2.5 rounded-xl bg-white border font-bold text-slate-700"><i className="fa-solid fa-file-import mr-2"></i>นำเข้าไฟล์</button>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={e => importFile(e.target.files?.[0])} />
            <div className="w-px h-10 bg-slate-200 mx-1 hidden sm:block"></div>
            <label className="text-sm"><span className="block text-xs font-bold text-slate-500 mb-1">ประมาณการสำหรับ (วัน)</span><input id="est-days" type="number" min="1" max="365" value={projectDays} onChange={e => setProjectDays(toNonNegativeInt(e.target.value))} className="w-24 p-2.5 border rounded-xl" /></label>
            <label className="text-sm"><span className="block text-xs font-bold text-slate-500 mb-1">เผื่อ (%)</span><input id="est-buffer" type="number" min="0" max="200" value={bufferPct} onChange={e => setBufferPct(toNonNegativeNumber(e.target.value))} className="w-20 p-2.5 border rounded-xl" /></label>
            {upcoming.length >= 2 && <span className="text-xs text-slate-400 pb-3">ค่าเริ่มต้น = ช่วงระหว่างรอบเบิก {thaiDateShort(upcoming[0].round_date)} → {thaiDateShort(upcoming[1].round_date)}</span>}
          </div>
          {!meta ? (
            <div className="bg-white rounded-2xl border p-10 text-center text-slate-400">เลือกช่วงวันที่แล้วกด "ดึงยอดใช้จาก HOSxP"</div>
          ) : (
            <div className="bg-white rounded-2xl border overflow-hidden">
              <div className="p-4 flex flex-wrap items-center gap-2 border-b">
                <div className="text-sm text-slate-600 mr-2">ยอดใช้ {thaiDateShort(meta.from)} – {thaiDateShort(meta.to)} ({meta.days} วัน, {meta.source}) · <b>{rows.length}</b> รายการ · มูลค่าประมาณ <b>{fmtMoney(total)}</b> บาท</div>
                {matched?.unmatched?.length > 0 && <button id="est-unmatched" onClick={() => setShowUnmatched(v => !v)} className="text-xs font-bold text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-1.5"><i className="fa-solid fa-link mr-1"></i>จับคู่ไม่ได้ {matched.unmatched.length} รายการ</button>}
                {editedCount > 0 && <button onClick={() => setEdits({})} className="text-xs font-bold text-slate-600 bg-slate-100 rounded-lg px-2.5 py-1.5"><i className="fa-solid fa-rotate-left mr-1"></i>คืนค่าที่แก้ ({editedCount})</button>}
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="กรอง: ชื่อยา / รหัส" aria-label="กรองรายการประมาณการ" className="ml-auto p-2 border rounded-xl text-sm w-52" />
                <div className="flex gap-1.5" role="group" aria-label="ส่งออก">
                  <button id="est-print" onClick={print} disabled={!shown.length} title="พิมพ์ หรือเลือก 'บันทึกเป็น PDF' ในหน้าต่างพิมพ์" className="px-3 py-2 rounded-xl bg-slate-800 text-white font-bold text-sm disabled:opacity-40"><i className="fa-solid fa-file-pdf mr-1.5"></i>พิมพ์ / PDF</button>
                  <button id="est-xlsx" onClick={exportXlsx} disabled={!shown.length} className="px-3 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm disabled:opacity-40"><i className="fa-solid fa-file-excel mr-1.5"></i>Excel</button>
                  <button id="est-csv" onClick={exportCsv} disabled={!shown.length} className="px-3 py-2 rounded-xl bg-white border font-bold text-sm text-slate-700 disabled:opacity-40"><i className="fa-solid fa-file-csv mr-1.5"></i>CSV</button>
                </div>
              </div>
              {showUnmatched && matched?.unmatched?.length > 0 && (
                <div className="px-4 py-3 bg-amber-50/60 border-b space-y-2">
                  <div className="flex flex-wrap items-center gap-3 text-xs text-amber-900">
                    <span><b>ยา HOSxP ที่ยังไม่มีรหัส INVS</b> — เลือกยาให้เฉพาะตัวที่ต้องการ ยอดใช้จะถูกรวมเข้าตารางทันที</span>
                    {ctx.isAdmin && <label className="inline-flex items-center gap-1.5 font-bold"><input type="checkbox" checked={saveMap} onChange={e => setSaveMap(e.target.checked)} /> บันทึกการจับคู่ลง master ด้วย (ครั้งหน้าจับคู่อัตโนมัติ)</label>}
                    {!ctx.isAdmin && <span className="text-amber-700">การจับคู่ใช้ในหน้านี้เท่านั้น — ถ้าต้องการให้จำถาวร แจ้งแอดมิน</span>}
                  </div>
                  <div className="max-h-72 overflow-auto rounded-xl border border-amber-200 bg-white divide-y">
                    {matched.unmatched.map(u => (
                      <div key={u.icode} className="flex flex-wrap items-center gap-3 px-3 py-2 text-sm">
                        <div className="min-w-[14rem] flex-1"><div className="font-semibold">{u.name || '-'}</div><div className="text-[11px] text-slate-400 font-mono">icode {u.icode} · {fmtNum(u.qty)} {u.units}</div></div>
                        <div className="w-80 max-w-full" data-icode={u.icode}><DrugSearchBox ctx={ctx} placeholder="ค้นหายา INVS เพื่อจับคู่..." onPick={d => mapUnmatched(u, d)} /></div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {Object.keys(extraMap).length > 0 && (
                <div className="px-4 py-2 border-b text-xs text-slate-600 flex flex-wrap gap-2 items-center">
                  <span className="font-bold">จับคู่เพิ่มในหน้านี้:</span>
                  {Object.entries(extraMap).map(([ic, id]) => (
                    <span key={ic} className="inline-flex items-center gap-1 bg-indigo-50 text-indigo-800 rounded-full pl-2 pr-1 py-0.5">{ic} → {ctx.drugById.get(id)?.drug_name || id}
                      <button onClick={() => unmapIcode(ic)} aria-label={`ยกเลิกการจับคู่ ${ic}`} className="w-5 h-5 rounded-full hover:bg-indigo-200">×</button></span>
                  ))}
                </div>
              )}
              <div className="overflow-x-auto">
                <table id="est-table" className="w-full text-sm">
                  <thead className="bg-slate-50 text-xs text-slate-500"><tr>
                    <th className="p-2 text-left">รายการ</th><th className="p-2 text-left">หน่วย / บรรจุ</th>
                    <th className="p-2 text-right">ใช้จริง (หน่วยย่อย) <i className="fa-solid fa-pen text-[9px]"></i></th><th className="p-2 text-right">ใช้จริง (หน่วยใหญ่)</th><th className="p-2 text-right">เฉลี่ย/วัน</th>
                    <th className="p-2 text-right">ประมาณการ {projectDays} วัน</th><th className="p-2 text-right bg-teal-50 text-teal-800">ต้องเบิก (หน่วยใหญ่) <i className="fa-solid fa-pen text-[9px]"></i></th><th className="p-2 text-right">มูลค่า</th>
                  </tr></thead>
                  <tbody>
                    {!shown.length && <tr><td colSpan="8" className="p-8 text-center text-slate-400">ไม่มีรายการ</td></tr>}
                    {shown.map(r => (
                      <tr key={r.drugId} className={`border-t ${r.discontinued ? 'text-slate-400' : ''}`}>
                        <td className="p-2"><div className="font-semibold">{r.name}</div><div className="text-[11px] text-slate-400 font-mono">{r.drugId}{r.location ? ` · ${r.location}` : ''}{r.discontinued ? ' · ยกเลิกใช้' : ''}{r.manualIcodes.length ? <span className="ml-1 text-indigo-600 font-sans font-bold">+จับคู่ {r.manualIcodes.join(',')}</span> : null}</div></td>
                        <td className="p-2 text-xs">{r.unit}{r.packSize > 1 ? ` · บรรจุ ${fmtNum(r.packSize)}` : ''}</td>
                        <td className="p-2 text-right"><NumCell value={r.usage} touched={r.usageEdited} ariaLabel={`ยอดใช้ ${r.name}`} onCommit={v => editUsage(r.drugId, v === null ? null : v)} />
                          {r.usageEdited && <div className="text-[10px] text-slate-400">เดิม {fmtNum(r.autoUsage)}</div>}</td>
                        <td className="p-2 text-right tabular-nums">{(r.usage / r.packSize).toLocaleString('th-TH', { maximumFractionDigits: 2 })}</td>
                        <td className="p-2 text-right tabular-nums">{r.dailyAvg.toLocaleString('th-TH', { maximumFractionDigits: 1 })}</td>
                        <td className="p-2 text-right tabular-nums">{fmtNum(r.projected)}</td>
                        <td className="p-2 text-right bg-teal-50/60"><NumCell value={r.packs} touched={r.packsEdited} ariaLabel={`ต้องเบิก ${r.name}`} className="font-extrabold" onCommit={v => setEdit(r.drugId, 'packs', v === null ? null : Math.round(v * 100) / 100)} />
                          {r.packsEdited && <div className="text-[10px] text-slate-400">คำนวณ {fmtNum(r.autoPacks)}</div>}</td>
                        <td className="p-2 text-right tabular-nums">{fmtMoney(r.packs * r.price)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="px-4 py-2 text-[11px] text-slate-400 border-t">ช่องที่มีรูปดินสอแก้ได้ (Enter เพื่อยืนยัน · ลบให้ว่างเพื่อกลับเป็นค่าที่คำนวณ) · ตัวเลขที่แก้ใช้เฉพาะหน้านี้และในไฟล์ที่ส่งออก ไม่บันทึกลงระบบ</div>
            </div>
          )}
        </div>
      );
    };

    const StockView = ({ ctx }) => {
      const [search, setSearch] = useState('');
      const [edits, setEdits] = useState(new Map());
      const [saving, setSaving] = useState(false);
      const [showAll, setShowAll] = useState(false);
      const stockMap = useMemo(() => new Map(ctx.stock.map(s => [String(s.drug_id), s])), [ctx.stock]);
      const ids = useMemo(() => {
        const s = new Set(ctx.stock.map(x => String(x.drug_id)));
        ctx.reqs.forEach(r => (r.items || []).forEach(it => s.add(String(it.drugId))));
        if (showAll) ctx.drugs.filter(d => !isDrugDiscontinuedAll(d) && String(d.type) !== '6').forEach(d => s.add(String(d.drug_id)));
        edits.forEach((_, k) => s.add(k));
        return [...s];
      }, [ctx.stock, ctx.reqs, ctx.drugs, showAll, edits]);
      const rows = useMemo(() => {
        const n = normalizeForMatch(search), q = search.trim().toLowerCase();
        return ids.map(id => ({ id, drug: ctx.drugById.get(id), st: stockMap.get(id) }))
          .filter(x => x.drug)
          .filter(x => !search.trim() || normalizeForMatch(x.drug.drug_name).includes(n) || x.id.toLowerCase().includes(q))
          .sort((a, b) => a.drug.drug_name.localeCompare(b.drug.drug_name, 'th'));
      }, [ids, ctx.drugById, stockMap, search]);
      const totalValue = rows.reduce((s, x) => s + toNonNegativeNumber(x.st?.balance) / safePackSize(x.drug.pack_size) * toNonNegativeNumber(x.drug.price), 0);

      const saveCounts = async () => {
        if (!edits.size) return;
        setSaving(true);
        try {
          const ops = [...edits.entries()].map(([id, bal]) => ({
            type: 'set', ref: db.collection('internal_stock').doc(internalStockDocId(ctx.dept.dept_id, id)),
            data: { dept_id: String(ctx.dept.dept_id), drug_id: id, balance: toNonNegativeNumber(bal), last_source: 'MANUAL_COUNT', counted_at: firebase.firestore.FieldValue.serverTimestamp(), updated_at: firebase.firestore.FieldValue.serverTimestamp(), updated_by_uid: ctx.currentUser.uid, updated_by_name: safeText(ctx.currentUser.name) },
            options: { merge: true }
          }));
          await executeBatchChunks(ops);
          await writeAuditLog(ctx.currentUser, 'INTERNAL_STOCK_COUNT', 'internal_stock', ctx.dept.dept_id, { count: ops.length });
          setEdits(new Map()); ctx.showToast(`บันทึกยอดนับ ${ops.length} รายการ`); await ctx.reload();
        } catch (e) { ctx.showToast('บันทึกไม่สำเร็จ: ' + e.message, 'error'); } finally { setSaving(false); }
      };

      return (
        <div className="space-y-5 animate-fade-in">
          <div className="flex flex-wrap items-end justify-between gap-3">
            <div>
              <h2 className="text-2xl font-extrabold text-slate-800">สต็อกห้องยา (โดยประมาณ)</h2>
              <div className="text-sm text-slate-500 max-w-2xl">ยอดนี้ใช้คำนวณการแนะนำเบิก: <b>ส่งใบเบิก</b> = ตั้งเป็นคงเหลือหลังหักยอดใช้ · <b>แอดมินอนุมัติ</b> = บวกจำนวนที่จ่าย · ยาที่ยังไม่เคยนับถือว่าเป็น 0</div>
            </div>
            <div className="text-right">
              <div className="text-xs text-slate-500">มูลค่าคงเหลือ (รายการที่แสดง)</div>
              <div className="text-2xl font-extrabold tnum">{fmtMoney(totalValue)} <span className="text-sm font-medium text-slate-400">บาท</span></div>
            </div>
          </div>
          <div className="bg-white rounded-2xl border shadow-sm">
            <div className="p-4 border-b flex flex-wrap gap-3 items-center">
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="ค้นหายา" aria-label="ค้นหายาในสต็อก" className="px-4 py-2.5 border border-slate-300 rounded-xl flex-1 min-w-[12rem]" />
              <label className="inline-flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={showAll} onChange={e => setShowAll(e.target.checked)} className="w-4 h-4 accent-teal-600" /> แสดงยาทุกตัวใน master (สำหรับนับครั้งแรก)</label>
              <button onClick={saveCounts} disabled={!edits.size || saving} className="px-5 py-2.5 rounded-xl bg-teal-600 text-white font-bold disabled:opacity-40">{saving ? 'กำลังบันทึก...' : `บันทึกยอดนับ (${edits.size})`}</button>
            </div>
            <div className="overflow-auto max-h-[70vh]">
              <table className="w-full text-sm sticky-head">
                <thead className="text-xs text-slate-500"><tr className="bg-slate-100">
                  <th className="p-2 text-left bg-slate-100">รายการ</th><th className="p-2 text-left bg-slate-100">หน่วย</th><th className="p-2 text-right bg-slate-100">คงเหลือในระบบ</th><th className="p-2 text-right bg-slate-100">นับได้</th><th className="p-2 text-left bg-slate-100">ปรับล่าสุด</th>
                </tr></thead>
                <tbody>
                  {rows.length === 0 && <tr><td colSpan="5" className="p-10 text-center text-slate-400">ยังไม่มีรายการ — ติ๊ก "แสดงยาทุกตัวใน master" เพื่อนับครั้งแรก หรือเริ่มที่ 0 แล้วสร้างใบเบิกได้เลย</td></tr>}
                  {rows.slice(0, 1000).map(({ id, drug, st }) => (
                    <tr key={id} className="border-t">
                      <td className="p-2"><div className="font-semibold">{drug.drug_name}</div><div className="text-[11px] text-slate-400 font-mono">{id}</div></td>
                      <td className="p-2 text-slate-500">{ctx.unitName(drug)}{safePackSize(drug.pack_size) > 1 ? ` ×${safePackSize(drug.pack_size)}` : ''}</td>
                      <td className="p-2 text-right"><QtyWithPack qty={st?.balance} packSize={drug.pack_size} /></td>
                      <td className="p-2 text-right"><NumCell value={edits.has(id) ? edits.get(id) : null} touched={edits.has(id)} ariaLabel={`นับได้ ${drug.drug_name}`}
                        onCommit={v => setEdits(prev => { const m = new Map(prev); if (v === null) m.delete(id); else m.set(id, v); return m; })} /></td>
                      <td className="p-2 text-xs text-slate-400">{st ? `${st.last_source === 'MANUAL_COUNT' ? 'นับ' : st.last_source === 'REQ_APPROVED' ? 'รับยา' : 'หักยอดใช้'} · ${formatAppDateTime(st.updated_at)}` : 'ยังไม่เคยนับ (0)'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // ===== App =====
    const App = () => {
      const [toast, setToast] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState(null);
      const [currentUser, setCurrentUser] = useState(null);
      const [booting, setBooting] = useState(true);
      const [masters, setMasters] = useState({ drugs: [], units: [], depts: [], rounds: [] });
      const [newRound, setNewRound] = useState(undefined); // undefined = ยังไม่ได้เลือกรอบ, null = ไม่มีรอบให้เลือก
      const [deptId, setDeptId] = useState('');
      const [reqs, setReqs] = useState([]);
      const [stock, setStock] = useState([]);
      const [view, setView] = useState('history');
      const [editReq, setEditReq] = useState(null);
      const [printReq, setPrintReq] = useState(null);
      const [drugTypes, setDrugTypes] = useState(null);
      const [loadingDept, setLoadingDept] = useState(false);

      const showToast = useCallback((message, type = 'success') => setToast({ message, type }), []);
      const isAdmin = normalizeUserRole(currentUser?.role) === 'admin';

      // v6.2 ข้อมูลหลักใช้แคชในเครื่อง + ดึงเฉพาะที่เปลี่ยน (ไม่อ่านยาทั้งหมดทุกครั้งที่เปิดหน้า)
      const reloadMasters = async (uidArg) => {
        const uid = uidArg || currentUser?.uid || auth.currentUser?.uid || 'anon';
        await rxLoadMeta(true);
        const tombs = await rxSyncTombs(uid);
        const sync = (col) => rxSync({ uid, col, tombs, query: db.collection(col) });
        const [d, u, dp, rr] = await Promise.all([sync('master_drugs'), sync('master_unit'), sync('master_depts'), sync('req_rounds').catch(() => [])]);
        const next = { drugs: d.map(x => ({ ...x, drug_id: x.drug_id || x.id })), units: u, depts: dp.map(x => ({ ...x, dept_id: x.dept_id || x.id })), rounds: rr || [] };
        setMasters(next);
        return next;
      };

      const reload = async (forDept) => {
        const id = forDept || deptId;
        if (!id) return;
        setLoadingDept(true);
        try {
          const uid = currentUser?.uid || auth.currentUser?.uid || 'anon';
          const tombs = await rxSyncTombs(uid);
          const [r, s] = await Promise.all([
            db.collection('internal_requisitions').where('deptId', '==', String(id)).get(),
            // สต็อกห้องยามีหลายร้อยรายการ → แคช + ดึงเฉพาะที่เปลี่ยน (ต้องมี index dept_id + updated_at)
            rxSync({ uid, col: 'internal_stock', scope: String(id), tombs, query: db.collection('internal_stock').where('dept_id', '==', String(id)) }).catch(() => null)
          ]);
          rxCountReads('internal_requisitions[dept]', r.size || 1);
          setReqs(r.docs.map(x => ({ id: x.id, ...x.data() })));
          setStock(s || []);
        } catch (e) { showToast('โหลดใบเบิกไม่สำเร็จ: ' + e.message, 'error'); }
        finally { setLoadingDept(false); }
      };

      useEffect(() => {
        const unsub = auth.onAuthStateChanged(async (user) => {
          if (!user) { window.location.href = 'index.html'; return; }
          try {
            const snap = await db.collection('users').doc(user.uid).get();
            if (!snap.exists || snap.data().active === false) { await auth.signOut(); window.location.href = 'index.html'; return; }
            const data = snap.data();
            const role = normalizeUserRole(data.role);
            if (role === 'hospital') { window.location.href = 'app.html'; return; }
            if (role !== 'admin' && !isInternalRole(role)) { showToast('สิทธิ์ผู้ใช้ไม่ถูกต้อง', 'error'); await auth.signOut(); window.location.href = 'index.html'; return; }
            const u = { uid: user.uid, ...data, role };
            setCurrentUser(u);
            const m = await reloadMasters(user.uid);
            let initial = role === 'admin' ? '' : String(data.dept_id || '');
            if (role === 'admin') {
              let saved = '';
              try { saved = localStorage.getItem('rxfill_internal_dept') || ''; } catch (e) { /* storage blocked */ }
              initial = m.depts.some(d => d.dept_id === saved) ? saved : (m.depts.find(d => d.kind === 'pharmacy')?.dept_id || m.depts[0]?.dept_id || '');
            }
            if (role !== 'admin' && !initial) showToast('บัญชีนี้ยังไม่ได้ผูกหน่วยงาน กรุณาแจ้งแอดมิน', 'error');
            setDeptId(initial);
          } catch (e) { showToast('ตรวจสอบสิทธิ์ไม่สำเร็จ: ' + e.message, 'error'); }
          finally { setBooting(false); }
        });
        return () => unsub();
      }, []);

      useEffect(() => { if (deptId) { reload(deptId); setView('history'); setEditReq(null); setNewRound(undefined); } }, [deptId]);
      useEffect(() => { if (view !== 'new') setNewRound(undefined); }, [view]);

      useEffect(() => { db.collection('config').doc('drug_types').get().then(sn => setDrugTypes(sn.exists ? sn.data() : null)).catch(() => {}); }, []);

      const drugById = useMemo(() => new Map(masters.drugs.map(d => [String(d.drug_id), d])), [masters.drugs]);
      const unitById = useMemo(() => new Map(masters.units.map(u => [String(u.unit_id || u.id), u])), [masters.units]);
      const dept = masters.depts.find(d => d.dept_id === deptId) || null;
      const kind = dept?.kind === 'pharmacy' ? 'pharmacy' : 'dept';

      if (booting) return <FullScreenSpinner />;
      if (!currentUser) return null;

      const ctx = {
        currentUser, isAdmin, dept, reqs, stock,
        drugs: masters.drugs, drugById, unitName: (d) => d ? (unitById.get(String(d.unit_id))?.unit_name || d.unit_id || '') : '',
        showToast, setConfirmDialog, reload: () => reload(), reloadMasters, drugTypes,
        rounds: roundsFor(masters.rounds, 'internal')
      };

      const pendingCount = reqs.filter(r => r.status === 'Pending' || r.status === 'Draft').length;
      const rejectedCount = reqs.filter(r => r.status === 'Rejected').length;
      const NavBtn = ({ id, icon, label, badge }) => (
        <button onClick={() => { setView(id); if (id !== 'new') setEditReq(null); }} aria-current={view === id ? 'page' : undefined}
          className={`shrink-0 text-left px-4 py-3 rounded-xl font-bold transition flex items-center gap-3 ${view === id ? 'bg-teal-600 text-white shadow-lg shadow-teal-900/40' : 'text-slate-300 hover:bg-slate-800'}`}>
          <i className={`fa-solid ${icon} w-5 text-center`}></i><span>{label}</span>
          {badge ? <span className="ml-auto text-[11px] bg-amber-400 text-slate-900 rounded-full px-2 py-0.5">{badge}</span> : null}
        </button>
      );

      return (
        <>
          <div className="no-print flex flex-col md:flex-row min-h-screen">
            <aside className="md:w-64 bg-slate-900 text-white md:h-screen md:sticky md:top-0 flex md:flex-col shrink-0">
              <div className="p-4 md:p-6 flex items-center gap-3 md:border-b border-slate-800 shrink-0">
                <div className="bg-gradient-main w-9 h-9 rounded-lg flex items-center justify-center"><i className={`fa-solid ${kind === 'pharmacy' ? 'fa-prescription-bottle-medical' : 'fa-building-user'}`}></i></div>
                <div className="hidden md:block">
                  <div className="font-extrabold tracking-wide text-teal-300">Sawee Rxfill</div>
                  <div className="text-[10px] text-slate-500 font-mono">เบิกยาภายใน รพ. · v{APP_VERSION}</div>
                </div>
              </div>
              <nav className="flex md:flex-col gap-1 p-2 md:p-4 overflow-x-auto md:overflow-visible flex-1">
                {isAdmin && (
                  <div className="hidden md:block mb-3">
                    <label htmlFor="dept-pick" className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">ทำรายการแทนหน่วย</label>
                    <select id="dept-pick" value={deptId} onChange={e => { setDeptId(e.target.value); try { localStorage.setItem('rxfill_internal_dept', e.target.value); } catch (err) { /* ignore */ } }}
                      className="mt-1 w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm">
                      {masters.depts.length === 0 && <option value="">— ยังไม่มีหน่วยงาน —</option>}
                      {masters.depts.map(d => <option key={d.dept_id} value={d.dept_id}>{d.kind === 'pharmacy' ? '💊 ' : ''}{d.dept_name}</option>)}
                    </select>
                  </div>
                )}
                <NavBtn id="new" icon="fa-file-circle-plus" label={editReq ? 'แก้ไขใบเบิก' : 'สร้างใบเบิก'} />
                <NavBtn id="history" icon="fa-list-check" label="ใบเบิกของฉัน" badge={pendingCount + rejectedCount || null} />
                {kind === 'pharmacy' && <NavBtn id="stock" icon="fa-boxes-stacked" label="สต็อกห้องยา" />}
                {kind === 'pharmacy' && <NavBtn id="estimate" icon="fa-chart-column" label="ประมาณการใช้ยา" />}
                {isAdmin && <a href="app.html" className="shrink-0 px-4 py-3 rounded-xl font-bold text-slate-300 hover:bg-slate-800 flex items-center gap-3"><i className="fa-solid fa-arrow-left w-5 text-center"></i><span>กลับหน้าแอดมิน</span></a>}
              </nav>
              <div className="hidden md:block p-4 border-t border-slate-800">
                <div className="text-sm text-slate-300 bg-slate-800 p-3 rounded-xl mb-3">
                  <div className="truncate font-bold">{currentUser.name}</div>
                  <div className="text-[11px] text-slate-500 truncate">{ROLE_LABELS[currentUser.role] || currentUser.role} · {dept?.dept_name || '-'}</div>
                </div>
                <button onClick={() => auth.signOut()} className="w-full p-2.5 rounded-xl text-red-400 hover:bg-red-500/10 font-bold border border-red-500/30"><i className="fa-solid fa-power-off mr-2"></i>ออกจากระบบ</button>
              </div>
              <button onClick={() => auth.signOut()} aria-label="ออกจากระบบ" className="md:hidden px-4 text-red-400"><i className="fa-solid fa-power-off"></i></button>
            </aside>

            <main className="flex-1 p-4 lg:p-8 min-w-0">
              <div className="max-w-[1500px] mx-auto">
                {isAdmin && (
                  <div className="md:hidden mb-4">
                    <select value={deptId} onChange={e => setDeptId(e.target.value)} aria-label="เลือกหน่วยงาน" className="w-full p-3 border rounded-xl">
                      {masters.depts.map(d => <option key={d.dept_id} value={d.dept_id}>{d.dept_name}</option>)}
                    </select>
                  </div>
                )}
                {!dept ? (
                  <div className="bg-white rounded-2xl border p-10 text-center text-slate-500">
                    {isAdmin ? 'ยังไม่มีหน่วยงาน/ห้องยา — เพิ่มได้ที่หน้าแอดมิน › จัดการฐานข้อมูล › หน่วยงาน/ห้องยา' : 'บัญชีนี้ยังไม่ได้ผูกหน่วยงาน กรุณาแจ้งแอดมิน'}
                  </div>
                ) : loadingDept && !reqs.length && view !== 'new' ? (
                  <div className="p-10 flex justify-center"><div className="loader"></div></div>
                ) : (
                  <>
                    {view === 'new' && !editReq && newRound === undefined && <RoundPickStep ctx={ctx} onPick={setNewRound} onOpenReq={(r) => { setEditReq(r); }} />}
                    {view === 'new' && (editReq || newRound !== undefined) && kind === 'dept' && <DeptReqView key={editReq?.id || 'new-' + deptId + (newRound?.id || '')} ctx={ctx} editReq={editReq} round={editReq ? null : newRound} onDone={() => { setEditReq(null); setView('history'); }} />}
                    {view === 'new' && (editReq || newRound !== undefined) && kind === 'pharmacy' && <PharmacyReqView key={editReq?.id || 'new-' + deptId + (newRound?.id || '')} ctx={ctx} editReq={editReq} round={editReq ? null : newRound} onDone={() => { setEditReq(null); setView('history'); }} />}
                    {view === 'history' && <HistoryView ctx={ctx} onNew={() => { setEditReq(null); setView('new'); }} onEdit={(r) => { setEditReq(r); setView('new'); }} onPrint={setPrintReq} />}
                    {view === 'stock' && kind === 'pharmacy' && <StockView ctx={ctx} />}
                    {view === 'estimate' && kind === 'pharmacy' && <UsageEstimateView ctx={ctx} />}
                  </>
                )}
              </div>
              <footer className="no-print max-w-[1500px] mx-auto mt-12 pt-5 border-t border-slate-200 text-center text-sm text-slate-500">
                <i className="fa-solid fa-envelope mr-2 text-teal-600"></i>พบปัญหาการใช้งาน แจ้งแอดมินทาง e-mail{' '}
                <a href={`mailto:sawee.appsheet@gmail.com?subject=${encodeURIComponent('แจ้งปัญหา Sawee Rxfill (เบิกยาภายใน) v' + APP_VERSION)}`} className="font-bold text-teal-700 hover:underline">sawee.appsheet@gmail.com</a>
              </footer>
            </main>
          </div>
          {printReq && <FormPrintModal ctx={ctx} req={printReq} onClose={() => setPrintReq(null)} />}
          <RxFeedbackWidget user={currentUser} unitId={dept?.dept_id || ''} unitName={dept?.dept_name || ''} page="internal" />
          <UniversalConfirmModal confirmDialog={confirmDialog} setConfirmDialog={setConfirmDialog} />
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
